  - { name: closed, type: bool, default: false, meaning: True when the polyline is closed (bit 1 of group 70)., source_ref: "group code 70, bit 1 (LwPolylineFlags.Closed)" }
  - { name: constant_width, type: length, nullable: true, meaning: Constant width of all segments; null when widths are per vertex., source_ref: group code 43 }
  - { name: thickness, type: length, default: 0, meaning: Specifies the distance a 2D object is extruded above or below its elevation., source_ref: group code 39 }
  - { name: normal, type: vector3, default: [ 0, 0, 1 ], meaning: Normal., source_ref: "group codes 210, 220, 230" }
