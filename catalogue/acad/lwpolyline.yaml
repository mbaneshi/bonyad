code: acad.lwpolyline
name: LWPOLYLINE
kind: entity
base: acad.graphic_entity
fidelity: faithful
source: { document: "ACadSharp (DxfCodeValue attributes), cross-checked with ezdxf", section: LwPolyline, url: https://github.com/DomCR/ACadSharp/blob/29137f3adaf75ddebd532179eda1e811525ca574/src/ACadSharp/Entities/LwPolyLine.cs#L20, version: DXF R2018 (AC1032), accessed_on: 2026-10-23, licence: "MIT (ACadSharp, ezdxf)" }
meaning: A lightweight 2D polyline in a plane at one elevation; vertices may carry a bulge for arc segments (DXF LWPOLYLINE).
notes: Hand-curated to equal the pilot table. The Plinegen flag (bit 128 of group 70) is not carried; see GAPS.md.
fields:
