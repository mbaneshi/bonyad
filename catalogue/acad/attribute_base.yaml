code: acad.attribute_base
name: AttributeBase
kind: abstract
base: acad.graphic_entity
fidelity: faithful
source: { document: "ACadSharp (DxfCodeValue attributes), cross-checked with ezdxf", section: AttributeBase, url: https://github.com/DomCR/ACadSharp/blob/29137f3adaf75ddebd532179eda1e811525ca574/src/ACadSharp/Entities/AttributeBase.cs#L10, version: DXF R2018 (AC1032), accessed_on: 2026-10-23, licence: "MIT (ACadSharp, ezdxf)" }
meaning: Common base class for AttributeEntity and AttributeDefinition.
notes: Fields of acad.text are copied in (the DXF entity repeats those group codes) instead of deriving from it, so the migrated table acad.text keeps exactly its fields.
fields:
  - { name: insert, type: point3, meaning: First alignment point (OCS)., source_ref: "group codes 10, 20, 30" }
  - { name: height, type: length, check: positive, meaning: Text height., source_ref: group code 40 }
  - { name: value, type: text, meaning: The text string., source_ref: group code 1 }
  - { name: rotation, type: angle, default: 0, meaning: Rotation in radians (DXF group 50 stores degrees)., source_ref: group code 50 }
  - { name: width_factor, type: ratio, default: 1, check: positive, meaning: Relative X scale factor (width)., source_ref: group code 41 }
  - { name: oblique_angle, type: angle, default: 0, meaning: Oblique angle in radians (DXF group 51 stores degrees)., source_ref: group code 51 }
  - { name: style_name, type: text, nullable: true, meaning: Name of the text style; null means the default style., source_ref: group code 7 }
  - { name: horizontal_alignment, type: int, default: 0, meaning: "Horizontal justification code: 0 left, 1 center, 2 right, 3 aligned, 4 middle, 5 fit.", source_ref: group code 72 }
  - { name: attribute_type, type: enum, default: SingleLine, values: [ { value: SingleLine, meaning: DXF value 1 }, { value: MultiLine, meaning: DXF value 2 }, { value: ConstantMultiLine, meaning: DXF value 4 } ], meaning: Attribute type., source_ref: group code 71 }
  - { name: flags, type: int, meaning: "Attribute flags. Bit-coded: 1 Hidden, 2 Constant, 4 Verify, 8 Preset.", source_ref: group code 70 }
  - { name: tag, type: text, nullable: true, meaning: Specifies the tag string of the object, source_ref: group code 2 }
  - { name: version, type: int, meaning: Version., source_ref: group code 280; no description in the sources }
  - { name: vertical_alignment, type: enum, default: Baseline, values: [ { value: Baseline, meaning: "DXF value 0: Text aligned to baseline." }, { value: Bottom, meaning: "DXF value 1: Bottom" }, { value: Middle, meaning: "DXF value 2: Middle" }, { value: Top, meaning: "DXF value 3: Top" } ], meaning: Vertical text justification type., source_ref: group code 74 }
