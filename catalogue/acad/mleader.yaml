code: acad.mleader
name: MULTILEADER
kind: entity
base: acad.graphic_entity
fidelity: faithful
source: { document: "ACadSharp (DxfCodeValue attributes), cross-checked with ezdxf", section: MultiLeader, url: https://github.com/DomCR/ACadSharp/blob/29137f3adaf75ddebd532179eda1e811525ca574/src/ACadSharp/Entities/MultiLeader.cs#L20, version: DXF R2018 (AC1032), accessed_on: 2026-10-23, licence: "MIT (ACadSharp, ezdxf)" }
meaning: The MULTILEADER entity represents one or more leaders, made up of one or more vertices (or spline fit points) and an arrowhead.
notes: DXF subclass marker AcDbMLeader.
fields:
  - { name: arrowhead_id, type: ref, nullable: true, ref_to: acad.block_record, meaning: Gets or sets a BlockRecord representing the arrowhead (see Arrowhead) to be displayed with every leader line. This property overrides the value from MultiLeaderStyle when the Arrowhead flag is set in the PropertyOverrideFlags property. Reference; DXF stores the handle., source_ref: group code 342 (stored as a handle) }
  - { name: arrowhead_size, type: float, meaning: Gets or sets the arrowhead size (see Arrowhead) for every leader line when the ArrowheadSize flag is set in the PropertyOverrideFlags property., source_ref: group code 42 }
  - { name: block_content_id, type: ref, nullable: true, ref_to: acad.block_record, meaning: Gets a BlockRecord containing elements to be drawn as content for the multileader. This property overrides the value from MultiLeaderStyle when the BlockContent flag is set (see PropertyOverrideFlags property). Reference; DXF stores the handle., source_ref: group code 344 (stored as a handle) }
  - { name: block_content_color, type: int, nullable: true, meaning: "Gets or sets the block-content color. This property overrides the value from MultiLeaderStyle when the BlockContentColor flag is set (see PropertyOverrideFlags property). as an AutoCAD Color Index (0 ByBlock, 256 ByLayer, 1 to 255 index, negative = off).", source_ref: group code 93 }
  - { name: block_content_connection, type: enum, values: [ { value: BlockExtents, meaning: "DXF value 0: MultiLeader connects to the block extents." }, { value: BasePoint, meaning: "DXF value 1: MultiLeader connects to the block base point." } ], meaning: Gets or sets a value indicating whether the multileader connects to the content-block extents or to the content-block base point when the BlockContentConnection flag is set in the PropertyOverrideFlags property., source_ref: group code 176 }
  - { name: block_content_rotation, type: angle, meaning: Gets or sets the rotation of the block content of the multileader. Radians here; DXF stores degrees., source_ref: group code 43 }
  - { name: block_content_scale, type: point3, meaning: Gets or sets the scale factor for block content. This property overrides the value from MultiLeaderStyle when the BlockContentScale flag is set (see PropertyOverrideFlags property)., source_ref: "group codes 10, 20, 30" }
  - { name: content_type, type: enum, default: None, values: [ { value: None, meaning: "DXF value 0: None" }, { value: Block, meaning: "DXF value 1: Leader content is provided by a block" }, { value: MText, meaning: "DXF value 2: Leader content is provided by a MTEXT entity" }, { value: Tolerance, meaning: "DXF value 3: Leader content is provided by a TOLERANCE entity" } ], meaning: "Gets or sets a value indicating whether the content of this MultiLeader is a text label, a content block, or a tolerance.", source_ref: group code 172 }
  - { name: enable_annotation_scale, type: bool, meaning: Enable Annotation Scale, source_ref: group code 293 }
  - { name: enable_dogleg, type: bool, meaning: Gets or sets a value indicating that leader lines of this MultiLeader are to be drawn with a dogleg (see EnableDogleg). This property overrides the value from MultiLeaderStyle when the EnableDogleg flag is set in the PropertyOverrideFlags property., source_ref: group code 291 }
  - { name: enable_landing, type: bool, meaning: Gets or sets a value indicating whether landing is enabled. This property overrides the value from MultiLeaderStyle when the EnableLanding flag is set in the PropertyOverrideFlags property., source_ref: group code 290 }
  - { name: extended_to_text, type: bool, meaning: Leader extended to text, source_ref: group code 295; first in const (ezdxf) }
  - { name: landing_distance, type: length, meaning: "Gets or sets the landing distance, i.e. the length of the dogleg, for this MultiLeader. This property overrides the value from MultiLeaderStyle when the LandingDistance flag is set in the PropertyOverrideFlags property.", source_ref: group code 41 }
  - { name: leader_line_type_id, type: ref, nullable: true, ref_to: acad.linetype, meaning: Gets or sets LineType of the leader lines of this MultiLeader (see LeaderLineType). This property overrides the value from MultiLeaderStyle when the LeaderLineType flag is set in the PropertyOverrideFlags property. Reference; DXF stores the handle., source_ref: group code 341 (stored as a handle) }
  - { name: leader_line_weight, type: enum, default: ByLayer, values: [ { value: ByDIPs, meaning: DXF value -4 }, { value: Default, meaning: "DXF value -3: Default line weight." }, { value: ByBlock, meaning: "DXF value -2: Line weight defined by block." }, { value: ByLayer, meaning: "DXF value -1: Line weight defined by layer." }, { value: W0, meaning: "DXF value 0: Line weight value 0.00 mm (hairline)." }, { value: W5, meaning: "DXF value 5: Line weight value 0.05 mm." }, { value: W9, meaning: "DXF value 9: Line weight value 0.09 mm." }, { value: W13, meaning: "DXF value 13: Line weight value 0.13 mm." }, { value: W15, meaning: "DXF value 15: Line weight value 0.15 mm." }, { value: W18, meaning: "DXF value 18: Line weight value 0.18 mm." }, { value: W20, meaning: "DXF value 20: Line weight value 0.20 mm." }, { value: W25, meaning: "DXF value 25: Line weight value 0.25 mm." }, { value: W30, meaning: "DXF value 30: Line weight value 0.30 mm." }, { value: W35, meaning: "DXF value 35: Line weight value 0.35 mm." }, { value: W40, meaning: "DXF value 40: Line weight value 0.40 mm." }, { value: W50, meaning: "DXF value 50: Line weight value 0.50 mm." }, { value: W53, meaning: "DXF value 53: Line weight value 0.53 mm." }, { value: W60, meaning: "DXF value 60: Line weight value 0.60 mm." }, { value: W70, meaning: "DXF value 70: Line weight value 0.70 mm." }, { value: W80, meaning: "DXF value 80: Line weight value 0.80 mm." }, { value: W90, meaning: "DXF value 90: Line weight value 0.90 mm." }, { value: W100, meaning: "DXF value 100: Line weight value 1.00 mm." }, { value: W106, meaning: "DXF value 106: Line weight value 1.06 mm." }, { value: W120, meaning: "DXF value 120: Line weight value 1.20 mm." }, { value: W140, meaning: "DXF value 140: Line weight value 1.40 mm." }, { value: W158, meaning: "DXF value 158: Line weight value 1.58 mm." }, { value: W200, meaning: "DXF value 200: Line weight value 2.00 mm." }, { value: W211, meaning: "DXF value 211: Line weight value 2.11 mm." } ], meaning: Gets or sets a value specifying the line weight to be applied to all leader lines of this MultiLeader (see LeaderLineWeight). This property overrides the value from MultiLeaderStyle when the LeaderLineWeight flag is set in the PropertyOverrideFlags property., source_ref: group code 171 }
  - { name: line_color, type: int, nullable: true, meaning: "Gets or sets color of the leader lines of this MultiLeader (see LineColor). This property overrides the value from MultiLeaderStyle when the LineColor flag is set in the PropertyOverrideFlags property. as an AutoCAD Color Index (0 ByBlock, 256 ByLayer, 1 to 255 index, negative = off).", source_ref: group code 91 }
  - { name: path_type, type: enum, values: [ { value: Invisible, meaning: "DXF value 0: Invisible leader" }, { value: StraightLineSegments, meaning: "DXF value 1: Draws the leader line as a set of straight line segments" }, { value: Spline, meaning: "DXF value 2: Draws the leader line as a spline" } ], meaning: Gets or sets a value indicating the path type of this MultiLeader (see PathType). This property overrides the value from MultiLeaderStyle when the PathType flag is set in the PropertyOverrideFlags property., source_ref: group code 170 }
  - { name: property_override_flags, type: int, meaning: "Gets or sets a value containing a list of flags indicating which multileader properties specified by the associated MultiLeaderStyle are to be overridden by properties specified by this MultiLeader or the attached MultiLeaderObjectContextData. Bit-coded: 1 PathType, 2 LineColor, 4 LeaderLineType, 8 LeaderLineWeight, 16 EnableLanding, 32 LandingGap, 64 EnableDogleg, 128 LandingDistance, 256 Arrowhead, 512 ArrowheadSize, 1024 ContentType, 2048 TextStyle, 4096 TextLeftAttachment, 8192 TextAngle, 16384 TextAlignment, 32768 TextColor, 65536 TextHeight, 131072 TextFrame, 262144 EnableUseDefaultMText, 524288 BlockContent, 1048576 BlockContentColor, 2097152 BlockContentScale, 4194304 BlockContentRotation, 8388608 BlockContentConnection, 16777216 ScaleFactor, 33554432 TextRightAttachment, 67108864 TextSwitchAlignmentType, 134217728 TextAttachmentDirection, 268435456 TextTopAttachment, 536870912 TextBottomAttachment.", source_ref: group code 90 }
  - { name: scale_factor, type: ratio, default: 1, meaning: Gets or sets a scale factor (see ScaleFactor). This property overrides the value from MultiLeaderStyle when the ScaleFactor flag is set (see PropertyOverrideFlags property). The scale factor is applied by AutoCAD., source_ref: group code 45; first in const (ezdxf) }
  - { name: style_id, type: ref, nullable: true, ref_to: acad.mleaderstyle, meaning: Gets a MultiLeaderStyle providing reusable style information for this MultiLeader. Reference; DXF stores the handle., source_ref: group code 340 (stored as a handle) }
  - { name: text_alignin_ipe, type: int, meaning: Text Align in IPE (meaning unknown), source_ref: group code 178; first in const (ezdxf) }
  - { name: text_alignment, type: enum, default: Left, values: [ { value: Left, meaning: DXF value 0 }, { value: Center, meaning: DXF value 1 }, { value: Right, meaning: DXF value 2 } ], meaning: Gets or sets the text alignement type., source_ref: group code 175 }
  - { name: text_angle, type: enum, default: Horizontal, values: [ { value: ParllelToLastLeaderLine, meaning: "DXF value 0: Text angle is equal to last leader line segment angle" }, { value: Horizontal, meaning: "DXF value 1: Text is horizontal" }, { value: Optimized, meaning: "DXF value 2: Text angle is equal to last leader line segment angle, but potentially rotated by 180 degrees so the right side is up for readability." } ], meaning: Gets or sets a value indicating the text angle. This property overrides the value from MultiLeaderStyle when the TextAngle flag is set (see PropertyOverrideFlags property)., source_ref: group code 174 }
  - { name: text_attachment_direction, type: enum, values: [ { value: Horizontal, meaning: DXF value 0 }, { value: Vertical, meaning: DXF value 1 } ], meaning: Gets or sets the Text attachment direction for text or block contents. This property overrides the value from MultiLeaderStyle when the TextAttachmentDirection flag is set in the PropertyOverrideFlags property., source_ref: group code 271; first in const (ezdxf) }
  - { name: text_attachment_point, type: enum, values: [ { value: Left, meaning: DXF value 1 }, { value: Center, meaning: DXF value 2 }, { value: Right, meaning: DXF value 3 } ], meaning: Gets or sets a value indicating the text attachment point., source_ref: group code 179; first in const (ezdxf) }
  - { name: text_bottom_attachment, type: enum, values: [ { value: TopOfTopLine, meaning: "DXF value 0: Top of top text line." }, { value: MiddleOfTopLine, meaning: "DXF value 1: Middle of top text line." }, { value: MiddleOfText, meaning: "DXF value 2: Middle of text." }, { value: MiddleOfBottomLine, meaning: "DXF value 3: Middle of bottom text line." }, { value: BottomOfBottomLine, meaning: "DXF value 4: Bottom of bottom text line." }, { value: BottomLine, meaning: "DXF value 5: Bottom text line." }, { value: BottomOfTopLineUnderlineBottomLine, meaning: "DXF value 6: Bottom of top text line. Underline bottom line." }, { value: BottomOfTopLineUnderlineTopLine, meaning: "DXF value 7: Bottom of top text line. Underline top line." }, { value: BottomofTopLineUnderlineAll, meaning: "DXF value 8: Bottom of top text line. Underline all content." }, { value: CenterOfText, meaning: "DXF value 9: Center of text (y-coordinate only)." }, { value: CenterOfTextOverline, meaning: "DXF value 10: Center of text (y-coordinate only), and overline top/underline bottom content." } ], meaning: Gets or sets the text bottom attachment type (see TextBottomAttachment). This property override the value from MultiLeaderStyle when the TextBottomAttachment flag is set (see PropertyOverrideFlags property)., source_ref: group code 272; first in const (ezdxf) }
  - { name: text_color, type: int, nullable: true, meaning: "Gets or sets the color for the display of the text label. This property overrides the value from MultiLeaderStyle when the TextColor flag is set (see PropertyOverrideFlags property). as an AutoCAD Color Index (0 ByBlock, 256 ByLayer, 1 to 255 index, negative = off).", source_ref: group code 92 }
  - { name: text_direction_negative, type: bool, meaning: Text Direction Negative, source_ref: group code 294; first in const (ezdxf) }
  - { name: text_frame, type: bool, meaning: Gets or sets a value indicating that the text label is to be drawn with a frame. This property overrides the value from MultiLeaderStyle when the TextFrame flag is set (see PropertyOverrideFlags property)., source_ref: group code 292 }
  - { name: text_left_attachment, type: enum, values: [ { value: TopOfTopLine, meaning: "DXF value 0: Top of top text line." }, { value: MiddleOfTopLine, meaning: "DXF value 1: Middle of top text line." }, { value: MiddleOfText, meaning: "DXF value 2: Middle of text." }, { value: MiddleOfBottomLine, meaning: "DXF value 3: Middle of bottom text line." }, { value: BottomOfBottomLine, meaning: "DXF value 4: Bottom of bottom text line." }, { value: BottomLine, meaning: "DXF value 5: Bottom text line." }, { value: BottomOfTopLineUnderlineBottomLine, meaning: "DXF value 6: Bottom of top text line. Underline bottom line." }, { value: BottomOfTopLineUnderlineTopLine, meaning: "DXF value 7: Bottom of top text line. Underline top line." }, { value: BottomofTopLineUnderlineAll, meaning: "DXF value 8: Bottom of top text line. Underline all content." }, { value: CenterOfText, meaning: "DXF value 9: Center of text (y-coordinate only)." }, { value: CenterOfTextOverline, meaning: "DXF value 10: Center of text (y-coordinate only), and overline top/underline bottom content." } ], meaning: Gets or sets the text left attachment type (see TextLeftAttachment). This property overrides the value from MultiLeaderStyle when the TextLeftAttachment flag is set (see PropertyOverrideFlags property)., source_ref: group code 173 }
  - { name: text_right_attachment, type: enum, values: [ { value: TopOfTopLine, meaning: "DXF value 0: Top of top text line." }, { value: MiddleOfTopLine, meaning: "DXF value 1: Middle of top text line." }, { value: MiddleOfText, meaning: "DXF value 2: Middle of text." }, { value: MiddleOfBottomLine, meaning: "DXF value 3: Middle of bottom text line." }, { value: BottomOfBottomLine, meaning: "DXF value 4: Bottom of bottom text line." }, { value: BottomLine, meaning: "DXF value 5: Bottom text line." }, { value: BottomOfTopLineUnderlineBottomLine, meaning: "DXF value 6: Bottom of top text line. Underline bottom line." }, { value: BottomOfTopLineUnderlineTopLine, meaning: "DXF value 7: Bottom of top text line. Underline top line." }, { value: BottomofTopLineUnderlineAll, meaning: "DXF value 8: Bottom of top text line. Underline all content." }, { value: CenterOfText, meaning: "DXF value 9: Center of text (y-coordinate only)." }, { value: CenterOfTextOverline, meaning: "DXF value 10: Center of text (y-coordinate only), and overline top/underline bottom content." } ], meaning: Gets or sets the text right attachment type (see TextRightAttachment). This property overrides the value from MultiLeaderStyle when the TextRightAttachment flag is set (see PropertyOverrideFlags property)., source_ref: group code 95 }
  - { name: text_style_id, type: ref, nullable: true, ref_to: acad.style, meaning: Gets or sets the TextStyle to be used to display the text label of this MultiLeader. This property overrides the value from MultiLeaderStyle when the TextStyle flag is set in the PropertyOverrideFlags property. Reference; DXF stores the handle., source_ref: group code 343 (stored as a handle) }
  - { name: text_top_attachment, type: enum, values: [ { value: TopOfTopLine, meaning: "DXF value 0: Top of top text line." }, { value: MiddleOfTopLine, meaning: "DXF value 1: Middle of top text line." }, { value: MiddleOfText, meaning: "DXF value 2: Middle of text." }, { value: MiddleOfBottomLine, meaning: "DXF value 3: Middle of bottom text line." }, { value: BottomOfBottomLine, meaning: "DXF value 4: Bottom of bottom text line." }, { value: BottomLine, meaning: "DXF value 5: Bottom text line." }, { value: BottomOfTopLineUnderlineBottomLine, meaning: "DXF value 6: Bottom of top text line. Underline bottom line." }, { value: BottomOfTopLineUnderlineTopLine, meaning: "DXF value 7: Bottom of top text line. Underline top line." }, { value: BottomofTopLineUnderlineAll, meaning: "DXF value 8: Bottom of top text line. Underline all content." }, { value: CenterOfText, meaning: "DXF value 9: Center of text (y-coordinate only)." }, { value: CenterOfTextOverline, meaning: "DXF value 10: Center of text (y-coordinate only), and overline top/underline bottom content." } ], meaning: Gets or sets the text top attachment type (see TextTopAttachment). This property override the value from MultiLeaderStyle when the TextTopAttachment flag is set (see PropertyOverrideFlags property)., source_ref: group code 273; first in const (ezdxf) }
