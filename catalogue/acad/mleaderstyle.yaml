mm." } ], meaning: Gets or sets a value specifying the lineweight to be applied to all leader lines of the multileader., source_ref: group code 92 }
  - { name: line_color, type: int, nullable: true, meaning: "Gets or sets color to be applied all leader lines of the multileader. as an AutoCAD Color Index (0 ByBlock, 256 ByLayer, 1 to 255 index, negative = off).", source_ref: group code 91 }
  - { name: max_leader_segments_points, type: int, default: 2, meaning: Gets or sets the max number of segments when a new leader is being created for a multileader., source_ref: group code 90 }
  - { name: multi_leader_draw_order, type: enum, values: [ { value: ContentFirst, meaning: "DXF value 0: 0 = draw content first," }, { value: LeaderFirst, meaning: "DXF value 1: 1 = draw leader first" } ], meaning: DrawMLeaderOrder Type, source_ref: group code 171 }
  - { name: overwrite_property_value, type: bool, meaning: Overwrite Property Value, source_ref: group code 295 }
  - { name: path_type, type: enum, values: [ { value: Invisible, meaning: "DXF value 0: Invisible leader" }, { value: StraightLineSegments, meaning: "DXF value 1: Draws the leader line as a set of straight line segments" }, { value: Spline, meaning: "DXF value 2: Draws the leader line as a spline" } ], meaning: "Gets or sets a value indicating whether leaders are to be displayed as polyline, a spline curve or invisible. This setting applies for all leader lines of the multileader.", source_ref: group code 173 }
  - { name: scale_factor, type: ratio, default: 1, meaning: "Gets or sets the scale factor for the ArrowheadSize, LandingDistance, LandingGap, TextHeight, and the elements of BlockContentScale.", source_ref: group code 142 }
  - { name: second_segment_angle_constraint, type: float, meaning: Gets or sets a snap angle value for the second leader segment when a leader line is being created for the mutileader., source_ref: group code 41 }
  - { name: text_align_always_left, type: bool, meaning: Text Align Always Left, source_ref: group code 297 }
  - { name: text_alignment, type: enum, values: [ { value: Left, meaning: DXF value 0 }, { value: Center, meaning: DXF value 1 }, { value: Right, meaning: DXF value 2 } ], meaning: "Gets or sets the text alignment, i.e. the alignment of text lines if the a multiline text label, relative to the TextLocation.", source_ref: group code 176 }
  - { name: text_angle, type: enum, default: Horizontal, values: [ { value: ParllelToLastLeaderLine, meaning: "DXF value 0: Text angle is equal to last leader line segment angle" }, { value: Horizontal, meaning: "DXF value 1: Text is horizontal" }, { value: Optimized, meaning: "DXF value 2: Text angle is equal to last leader line segment angle, but potentially rotated by 180 degrees so the right side is up for readability." } ], meaning: Gets or sets a value indicating the text angle., source_ref: group code 175 }
  - { name: text_attachment_direction, type: enum, values: [ { value: Horizontal, meaning: DXF value 0 }, { value: Vertical, meaning: DXF value 1 } ], meaning: "Gets or sets the Text attachment direction for text or block contents, rename? This property defines whether the leaders attach to the left/right of the content block/text, or attach to the top/bottom.", source_ref: group code 271 }
  - { name: text_bottom_attachment, type: enum, values: [ { value: TopOfTopLine, meaning: "DXF value 0: Top of top text line." }, { value: MiddleOfTopLine, meaning: "DXF value 1: Middle of top text line." }, { value: MiddleOfText, meaning: "DXF value 2: Middle of text." }, { value: MiddleOfBottomLine, meaning: "DXF value 3: Middle of bottom text line." }, { value: BottomOfBottomLine, meaning: "DXF value 4: Bottom of bottom text line." }, { value: BottomLine, meaning: "DXF value 5: Bottom text line." }, { value: BottomOfTopLineUnderlineBottomLine, meaning: "DXF value 6: Bottom of top text line. Underline bottom line." }, { value: BottomOfTopLineUnderlineTopLine, meaning: "DXF value 7: Bottom of top text line. Underline top line." }, { value: BottomofTopLineUnderlineAll, meaning: "DXF value 8: Bottom of top text line. Underline all content." }, { value: CenterOfText, meaning: "DXF value 9: Center of text (y-coordinate only)." }, { value: CenterOfTextOverline, meaning: "DXF value 10: Center of text (y-coordinate only), and overline top/underline bottom content." } ], meaning: Gets or sets the text bottom attachment type. This value controls the position of the connection point of the leader attached to the bottom of the text label., source_ref: group code 272 }
  - { name: text_color, type: int, nullable: true, meaning: "Gest or sets the color for the text label of the multileader. as an AutoCAD Color Index (0 ByBlock, 256 ByLayer, 1 to 255 index, negative = off).", source_ref: group code 93 }
  - { name: text_frame, type: bool, meaning: Gets or sets a value indicating that the text label is to be drawn with a frame., source_ref: group code 292 }
  - { name: text_height, type: length, default: 0.18, meaning: Gets or sets the text height for the text label of the multileader., source_ref: group code 45 }
  - { name: text_left_attachment, type: enum, values: [ { value: TopOfTopLine, meaning: "DXF value 0: Top of top text line." }, { value: MiddleOfTopLine, meaning: "DXF value 1: Middle of top text line." }, { value: MiddleOfText, meaning: "DXF value 2: Middle of text." }, { value: MiddleOfBottomLine, meaning: "DXF value 3: Middle of bottom text line." }, { value: BottomOfBottomLine, meaning: "DXF value 4: Bottom of bottom text line." }, { value: BottomLine, meaning: "DXF value 5: Bottom text line." }, { value: BottomOfTopLineUnderlineBottomLine, meaning: "DXF value 6: Bottom of top text line. Underline bottom line." }, { value: BottomOfTopLineUnderlineTopLine, meaning: "DXF value 7: Bottom of top text line. Underline top line." }, { value: BottomofTopLineUnderlineAll, meaning: "DXF value 8: Bottom of top text line. Underline all content." }, { value: CenterOfText, meaning: "DXF value 9: Center of text (y-coordinate only)." }, { value: CenterOfTextOverline, meaning: "DXF value 10: Center of text (y-coordinate only), and overline top/underline bottom content." } ], meaning: Gets or sets the Text Left Attachment Type. This value controls the position of the connection point of the leader attached to the left side of the text label., source_ref: group code 174 }
  - { name: text_right_attachment, type: enum, values: [ { value: TopOfTopLine, meaning: "DXF value 0: Top of top text line." }, { value: MiddleOfTopLine, meaning: "DXF value 1: Middle of top text line." }, { value: MiddleOfText, meaning: "DXF value 2: Middle of text." }, { value: MiddleOfBottomLine, meaning: "DXF value 3: Middle of bottom text line." }, { value: BottomOfBottomLine, meaning: "DXF value 4: Bottom of bottom text line." }, { value: BottomLine, meaning: "DXF value 5: Bottom text line." }, { value: BottomOfTopLineUnderlineBottomLine, meaning: "DXF value 6: Bottom of top text line. Underline bottom line." }, { value: BottomOfTopLineUnderlineTopLine, meaning: "DXF value 7: Bottom of top text line. Underline top line." }, { value: BottomofTopLineUnderlineAll, meaning: "DXF value 8: Bottom of top text line. Underline all content." }, { value: CenterOfText, meaning: "DXF value 9: Center of text (y-coordinate only)." }, { value: CenterOfTextOverline, meaning: "DXF value 10: Center of text (y-coordinate only), and overline top/underline bottom content." } ], meaning: Gets or sets the Text Right Attachment Type. This value controls the position of the connection point of the leader attached to the right side of the text label., source_ref: group code 178 }
  - { name: text_style_id, type: ref, nullable: true, ref_to: acad.style, meaning: Gets or sets the TextStyle to be used to display the text label of the multileader. Reference; DXF stores the handle., source_ref: group code 342 (stored as a handle) }
  - { name: text_top_attachment, type: enum, values: [ { value: TopOfTopLine, meaning: "DXF value 0: Top of top text line." }, { value: MiddleOfTopLine, meaning: "DXF value 1: Middle of top text line." }, { value: MiddleOfText, meaning: "DXF value 2: Middle of text." }, { value: MiddleOfBottomLine, meaning: "DXF value 3: Middle of bottom text line." }, { value: BottomOfBottomLine, meaning: "DXF value 4: Bottom of bottom text line." }, { value: BottomLine, meaning: "DXF value 5: Bottom text line." }, { value: BottomOfTopLineUnderlineBottomLine, meaning: "DXF value 6: Bottom of top text line. Underline bottom line." }, { value: BottomOfTopLineUnderlineTopLine, meaning: "DXF value 7: Bottom of top text line. Underline top line." }, { value: BottomofTopLineUnderlineAll, meaning: "DXF value 8: Bottom of top text line. Underline all content." }, { value: CenterOfText, meaning: "DXF value 9: Center of text (y-coordinate only)." }, { value: CenterOfTextOverline, meaning: "DXF value 10: Center of text (y-coordinate only), and overline top/underline bottom content." } ], meaning: Gets or sets the text top attachment type. This value controls the position of the connection point of the leader attached to the top of the text label., source_ref: group code 273 }
