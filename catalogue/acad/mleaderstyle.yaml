code: acad.mleaderstyle
name: MLEADERSTYLE
kind: object
fidelity: faithful
source: { document: "ACadSharp (DxfCodeValue attributes), cross-checked with ezdxf", section: MultiLeaderStyle, url: https://github.com/DomCR/ACadSharp/blob/29137f3adaf75ddebd532179eda1e811525ca574/src/ACadSharp/Objects/MultiLeaderStyle.cs#L19, version: DXF R2018 (AC1032), accessed_on: 2026-10-23, licence: "MIT (ACadSharp, ezdxf)" }
meaning: The MLEADERSTYLE entity stores all attributes required to create new MultiLeader entities.
notes: DXF subclass marker AcDbMLeaderStyle.
fields:
  - { name: align_space, type: float, default: 0, meaning: Align Space, source_ref: group code 46 }
  - { name: arrowhead_id, type: ref, nullable: true, ref_to: acad.block_record, meaning: Gets or sets a BlockRecord representing the arrowhead to be displayed with every leader line. Reference; DXF stores the handle., source_ref: group code 341 (stored as a handle) }
  - { name: arrowhead_size, type: float, default: 0.18, meaning: Gests or sets the arrowhead size., source_ref: group code 44 }
  - { name: block_content_id, type: ref, nullable: true, ref_to: acad.block_record, meaning: Gets a BlockRecord containing elements to be drawn as content for the multileader. Reference; DXF stores the handle., source_ref: group code 343 (stored as a handle) }
  - { name: block_content_color, type: int, nullable: true, meaning: "Gets or sets the block-content color. as an AutoCAD Color Index (0 ByBlock, 256 ByLayer, 1 to 255 index, negative = off).", source_ref: group code 94 }
  - { name: block_content_connection, type: enum, values: [ { value: BlockExtents, meaning: "DXF value 0: MultiLeader connects to the block extents." }, { value: BasePoint, meaning: "DXF value 1: MultiLeader connects to the block base point." } ], meaning: Gets or sets a value indicating whether the multileader connects to the content-block extents or to the content-block base point., source_ref: group code 177 }
  - { name: block_content_rotation, type: angle, default: 0, meaning: Gets or sets the block content rotation. Radians here; DXF stores degrees., source_ref: group code 141 }
  - { name: block_content_scale_x, type: ratio, meaning: Gets or sets the scale factor along the X-axis for the block content., source_ref: group code 47 }
  - { name: block_content_scale_y, type: ratio, meaning: Gets or sets the scale factor applied to the Y-axis of the block content., source_ref: group code 49 }
  - { name: block_content_scale_z, type: ratio, meaning: Gets or sets the scale factor along the Z-axis for the block content., source_ref: group code 140 }
  - { name: break_gap_size, type: float, default: 0.125, meaning: Break Gap Size, source_ref: group code 143 }
  - { name: content_type, type: enum, default: MText, values: [ { value: None, meaning: "DXF value 0: None" }, { value: Block, meaning: "DXF value 1: Leader content is provided by a block" }, { value: MText, meaning: "DXF value 2: Leader content is provided by a MTEXT entity" }, { value: Tolerance, meaning: "DXF value 3: Leader content is provided by a TOLERANCE entity" } ], meaning: Gets or sets a value indicating the content type for the multileader., source_ref: group code 170 }
  - { name: default_text_contents, type: text, default: "", meaning: Gests or sets a default text that is to be set when a mutileader is being created with this MultiLeaderStyle., source_ref: group code 300 }
  - { name: description, type: text, default: "", meaning: Gets or sets a text containing the description of this MultiLeaderStyle., source_ref: group code 3 }
  - { name: enable_block_content_rotation, type: bool, meaning: Gets or sets a value indicating whether rotation of the block content is enabled., source_ref: group code 294 }
  - { name: enable_block_content_scale, type: bool, meaning: Gets or sets a value indicating whether scaling of the block content is enabled., source_ref: group code 293 }
  - { name: enable_dogleg, type: bool, default: true, meaning: Gets or sets a value indicating that leader lines are to be drawn with a dogleg., source_ref: group code 291 }
  - { name: enable_landing, type: bool, default: true, meaning: Gets or sets a value indicating whether landing is enabled., source_ref: group code 290 }
  - { name: first_segment_angle_constraint, type: float, meaning: Gets or sets a snap angle value for the first leader segment when a leader line is being created for the mutileader., source_ref: group code 40 }
  - { name: is_annotative, type: bool, meaning: Is Annotative, source_ref: group code 296 }
  - { name: landing_distance, type: length, default: 0.36, meaning: "Gets or sets the landing distance, i.e. the length of the dogleg.", source_ref: group code 43 }
  - { name: landing_gap, type: float, default: 0.09, meaning: "Gets or sets the landing gap. This is the distance between the leader end point or, if present, the end of the dogleg and the text label or the content block.", source_ref: group code 42 }
  - { name: leader_draw_order, type: enum, values: [ { value: LeaderHeadFirst, meaning: "DXF value 0: 0 = draw leader head first" }, { value: LeaderTailFirst, meaning: "DXF value 1: 1 = draw leader tail first" } ], meaning: DrawLeaderOrder Type, source_ref: group code 172 }
  - { name: leader_line_type_id, type: ref, nullable: true, ref_to: acad.linetype, meaning: Gets or sets a LineType object specifying line-type properties for the musltileader. This setting applies for all leader lines of the multileader. Reference; DXF stores the handle., source_ref: group code 340 (stored as a handle) }
