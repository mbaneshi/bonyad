  - { name: arrow_size, type: float, meaning: Controls the size of dimension line and leader line arrowheads. Also controls the size of hook lines (see DIMASZ System Variable)., source_ref: group code 41 }
  - { name: center_mark_size, type: float, default: 0.09, meaning: "Controls drawing of circle or arc center marks and centerlines by the DIMCENTER, DIMDIAMETER, and DIMRADIUS commands (see DIMCEN System Variable).", source_ref: group code 141 }
  - { name: cursor_update, type: bool, default: false, meaning: Controls options for user-positioned text (see DIMUPT System Variable)., source_ref: group code 288; first in R2000 (ezdxf) }
