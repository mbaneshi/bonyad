  - { name: angular_unit, type: enum, default: DecimalDegrees, values: [ { value: DecimalDegrees, meaning: "DXF value 0: Decimal degrees" }, { value: DegreesMinutesSeconds, meaning: "DXF value 1: Degrees/minutes/seconds" }, { value: Gradians, meaning: "DXF value 2: Gradians" }, { value: Radians, meaning: "DXF value 3: Radians" }, { value: SurveyorsUnits, meaning: "DXF value 4: Surveyors units" } ], meaning: Gets or sets the units format for angular dimensions (see DIMAUNIT System Variable)., source_ref: group code 275; first in R2000 (ezdxf) }
  - { name: angular_zero_handling, type: enum, default: DisplayAll, values: [ { value: DisplayAll, meaning: "DXF value 0: Displays all leading and trailing zeros." }, { value: SuppressLeadingZeroes, meaning: "DXF value 1: Suppresses leading zeros in decimal dimensions." }, { value: SupressTrailingZeroes, meaning: "DXF value 2: Suppresses trailing zeros in decimal dimensions." }, { value: SupressAll, meaning: "DXF value 3: Suppresses leading and trailing zeros." } ], meaning: Suppresses zeros for angular dimensions (see DIMAZIN System Variable)., source_ref: group code 79; first in R2000 (ezdxf) }
