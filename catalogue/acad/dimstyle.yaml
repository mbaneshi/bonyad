source: { document: "ACadSharp (DxfCodeValue attributes), cross-checked with ezdxf", section: DimensionStyle, url: https://github.com/DomCR/ACadSharp/blob/29137f3adaf75ddebd532179eda1e811525ca574/src/ACadSharp/Tables/DimensionStyle.cs#L17, version: DXF R2018 (AC1032), accessed_on: 2026-10-23, licence: "MIT (ACadSharp, ezdxf)" }
meaning: Represents a DimensionStyle table entry.
notes: DXF subclass marker AcDbDimStyleTableRecord.
fields:
  - { name: flags, type: int, meaning: "Standard flags. Bit-coded: 16 XrefDependent, 32 XrefResolved, 64 Referenced.", source_ref: group code 70 }
  - { name: name, type: text, meaning: Specifies the name of the object, source_ref: group code 2 }
  - { name: alternate_dimensioning_suffix, type: text, default: "", meaning: Specifies a text prefix or suffix (or both) to the alternate dimension measurement for all types of dimensions except angular (see DIMAPOST System Variable)., source_ref: group code 4 }
  - { name: alternate_unit_decimal_places, type: int, default: 3, meaning: Controls the number of decimal places in alternate units (see DIMALTD System Variable)., source_ref: group code 171 }
  - { name: alternate_unit_dimensioning, type: bool, default: false, meaning: Controls the display of alternate units in dimensions (see DIMALT System Variable)., source_ref: group code 170 }
