11 mm." } ], meaning: Assigns line weight to dimension lines (see DIMLWD System Variable)., source_ref: group code 371; first in R2000 (ezdxf) }
  - { name: dimension_text_arrow_fit, type: enum, default: BestFit, values: [ { value: Both, meaning: "DXF value 0: Places both text and arrows outside extension lines" }, { value: ArrowsFirst, meaning: "DXF value 1: Moves arrows first, then text" }, { value: TextFirst, meaning: "DXF value 2: Moves text first, then arrows" }, { value: BestFit, meaning: "DXF value 3: Moves either text or arrows, whichever fits best" } ], meaning: Determines how dimension text and arrows are arranged when space is not sufficient to place both within the extension lines. (see DIMATFIT System Variable)., source_ref: group code 289; first in R2000 (ezdxf) }
  - { name: dimension_unit, type: int, default: 2, meaning: "DIMUNIT (obsolete, now use DIMLUNIT AND DIMFRAC)", source_ref: group code 270 }
  - { name: extension_line_color, type: int, nullable: true, meaning: "Gets or sets colors to extension lines, center marks, and centerlines (see DIMCLRE System Variable). as an AutoCAD Color Index (0 ByBlock, 256 ByLayer, 1 to 255 index, negative = off).", source_ref: group code 177 }
