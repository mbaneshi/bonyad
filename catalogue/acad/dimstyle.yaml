  - { name: dim_arrow2_id, type: ref, nullable: true, ref_to: acad.block_record, meaning: Gets or sets the arrowhead for the first end of the dimension line when SeparateArrowBlocks is on (true) (see DIMBLK2 System Variable). Reference; DXF stores the handle., source_ref: group code 344 (stored as a handle); first in R2000 (ezdxf) }
  - { name: dimension_fit, type: int, meaning: Determines how dimension text and arrows are arranged when space is not sufficient to place both within the extension lines. (see DIMFIT System Variable)., source_ref: group code 287 }
