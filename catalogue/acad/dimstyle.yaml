11 mm." } ], meaning: Assigns line weight to extension lines (see DIMLWE System Variable)., source_ref: group code 372; first in R2000 (ezdxf) }
  - { name: fixed_extension_line_length, type: length, default: 1, meaning: Sets the total length of the extension lines starting from the dimension line toward the dimension origin (see DIMFXL System Variable)., source_ref: group code 49; first in R2007 (ezdxf) }
  - { name: fraction_format, type: enum, default: Horizontal, values: [ { value: Horizontal, meaning: "DXF value 0: Horizontal stacking." }, { value: Diagonal, meaning: "DXF value 1: Diagonal stacking." }, { value: None, meaning: "DXF value 2: Not stacked." } ], meaning: Gets or sets the fraction format when LinearUnitFormat is set to 4 (Architectural) or 5 (Fractional). (see DIMFRAC System Variable)., source_ref: group code 276; first in R2000 (ezdxf) }
  - { name: generate_tolerances, type: bool, default: false, meaning: Appends tolerances to dimension text (see DIMTOL System Variable)., source_ref: group code 71 }
  - { name: is_extension_line_length_fixed, type: bool, default: false, meaning: Controls whether extension lines are set to a fixed length (see DIMFXLON System Variable)., source_ref: group code 290; first in R2007 (ezdxf) }
