  - { name: linear_unit_format, type: enum, default: Decimal, values: [ { value: None, meaning: "DXF value 0: None" }, { value: Scientific, meaning: "DXF value 1: Scientific" }, { value: Decimal, meaning: "DXF value 2: Decimal" }, { value: Engineering, meaning: "DXF value 3: Engineering" }, { value: Architectural, meaning: "DXF value 4: Architectural" }, { value: Fractional, meaning: "DXF value 5: Fractional" }, { value: WindowsDesktop, meaning: "DXF value 6: Windows desktop" } ], meaning: Gets or sets units for all dimension types except Angular (see DIMLUNIT System Variable)., source_ref: group code 277; first in R2000 (ezdxf) }
  - { name: line_type_id, type: ref, nullable: true, ref_to: acad.linetype, meaning: Line type for the main line of the dimension. Reference; DXF stores the handle., source_ref: group code 345 (stored as a handle); first in R2007 (ezdxf) }
  - { name: line_type_ext1_id, type: ref, nullable: true, ref_to: acad.linetype, meaning: Line type for the extension line 1. Reference; DXF stores the handle., source_ref: group code 346 (stored as a handle); first in R2007 (ezdxf) }
  - { name: line_type_ext2_id, type: ref, nullable: true, ref_to: acad.linetype, meaning: Line type for the extension line 2. Reference; DXF stores the handle., source_ref: group code 347 (stored as a handle); first in R2007 (ezdxf) }
  - { name: minus_tolerance, type: float, default: 0, meaning: Gets or sets the minimum (or lower) tolerance limit for dimension text when GenerateTolerances or LimitsGeneration is on (true). (see DIMTM System Variable)., source_ref: group code 48 }
  - { name: plus_tolerance, type: float, default: 0, meaning: Gets or sets the maximum (or upper) tolerance limit for dimension text when GenerateTolerances or LimitsGeneration is on (true) (see DIMTP System Variable)., source_ref: group code 47 }
  - { name: post_fix, type: text, default: "", meaning: Specifies a text prefix or suffix (or both) to the dimension measurement (see DIMPOST System Variable)., source_ref: group code 3 }
  - { name: rounding, type: float, default: 0, meaning: Rounds all dimensioning distances to the specified value (see DIMRND System Variable)., source_ref: group code 45 }
  - { name: scale_factor, type: ratio, meaning: "Gets or sets the overall scale factor applied to dimensioning variables that specify sizes, distances, or offsets (see DIMSCALE System Variable).", source_ref: group code 40 }
  - { name: separate_arrow_blocks, type: bool, meaning: Controls the display of dimension line arrowhead blocks (see DIMSAH System Variable)., source_ref: group code 173 }
  - { name: style_id, type: ref, nullable: true, ref_to: acad.style, meaning: Specifies the text style of the dimension (see DIMTXSTY System Variable). Reference; DXF stores the handle., source_ref: group code 340 (stored as a handle); first in R2000 (ezdxf) }
  - { name: suppress_first_dimension_line, type: bool, default: false, meaning: Controls suppression of the first dimension line and arrowhead (see DIMSD1 System Variable)., source_ref: group code 281; first in R2000 (ezdxf) }
  - { name: suppress_first_extension_line, type: bool, default: false, meaning: Suppresses display of the first extension line (see DIMSE1 System Variable)., source_ref: group code 75 }
  - { name: suppress_outside_extensions, type: bool, default: false, meaning: Suppresses arrowheads if not enough space is available inside the extension lines (see DIMSOXD System Variable)., source_ref: group code 175 }
  - { name: suppress_second_dimension_line, type: bool, default: false, meaning: Controls suppression of the second dimension line and arrowhead (see DIMSD2 System Variable)., source_ref: group code 282; first in R2000 (ezdxf) }
  - { name: suppress_second_extension_line, type: bool, default: false, meaning: Suppresses display of the second extension line (see DIMSE2 System Variable)., source_ref: group code 76 }
  - { name: text_background_fill_mode, type: enum, default: NoBackground, values: [ { value: NoBackground, meaning: "DXF value 0: No background color is used." }, { value: DrawingBackgroundColor, meaning: "DXF value 1: In this mode the drawing background color is used." }, { value: DimensionTextBackgroundColor, meaning: "DXF value 2: This mode is used as the dimension text background." } ], meaning: Controls the background of dimension text (see DIMTFILL System Variable)., source_ref: group code 69; first in R2007 (ezdxf) }
  - { name: text_color, type: int, nullable: true, meaning: "Assigns colors to dimension text (see DIMCLRT System Variable). as an AutoCAD Color Index (0 ByBlock, 256 ByLayer, 1 to 255 index, negative = off).", source_ref: group code 178 }
  - { name: text_direction, type: enum, default: LeftToRight, values: [ { value: LeftToRight, meaning: "DXF value 0: Display text left-to-right." }, { value: RightToLeft, meaning: "DXF value 1: Display text right-to-left." } ], meaning: Specifies the reading direction of the dimension text (see DIMTXTDIRECTION System Variable)., source_ref: group code 295 }
  - { name: text_height, type: length, meaning: "Specifies the height of dimension text, unless the current text style has a fixed height (see DIMTXT System Variable).", source_ref: group code 140 }
  - { name: text_horizontal_alignment, type: enum, default: Centered, values: [ { value: Centered, meaning: "DXF value 0: Centers the dimension text along the dimension line between the extension lines." }, { value: Left, meaning: "DXF value 1: Left-justifies the text with the first extension line along the dimension line." }, { value: Right, meaning: "DXF value 2: Right-justifies the text with the second extension line along the dimension line." }, { value: OverFirstExtLine, meaning: "DXF value 3: Positions the text over or along the first extension line." }, { value: OverSecondExtLine, meaning: "DXF value 4: Positions the text over or along the second extension line." } ], meaning: Controls the horizontal positioning of dimension text (see DIMJUST System Variable)., source_ref: group code 280; first in R2000 (ezdxf) }
  - { name: text_inside_extensions, type: bool, default: false, meaning: Draws text between extension lines (see DIMTIX System Variable)., source_ref: group code 174 }
  - { name: text_inside_horizontal, type: bool, default: false, meaning: Controls the position of dimension text inside the extension lines for all dimension types except Ordinate. (see DIMTIH System Variable)., source_ref: group code 73 }
  - { name: text_movement, type: enum, default: MoveLineWithText, values: [ { value: MoveLineWithText, meaning: "DXF value 0: Moves the dimension line with dimension text." }, { value: AddLeaderWhenTextMoved, meaning: "DXF value 1: Adds a leader when dimension text is moved." }, { value: FreeTextPosition, meaning: "DXF value 2: Allows text to be moved freely without a leader." } ], meaning: Sets dimension text movement rules (see DIMTMOVE System Variable)., source_ref: group code 279; first in R2000 (ezdxf) }
  - { name: text_outside_extensions, type: bool, meaning: Controls whether a dimension line is drawn between the extension lines even when the text is placed outside. (see DIMTOFL System Variable)., source_ref: group code 172 }
  - { name: text_outside_horizontal, type: bool, default: false, meaning: Controls the position of dimension text outside the extension lines (see DIMTOH System Variable)., source_ref: group code 74 }
  - { name: text_vertical_alignment, type: enum, default: Above, values: [ { value: Centered, meaning: "DXF value 0: Centers the dimension text between the two parts of the dimension line." }, { value: Above, meaning: "DXF value 1: Places the dimension text above the dimension line except when the dimension line is not horizontal and text inside the extension lines is forced horizontal (TextInsideHorizontal = true). The distance from the dimension line to the baseline of the lowest line of text is the current DimensionLineGap value." }, { value: Outside, meaning: "DXF value 2: Places the dimension text on the side of the dimension line farthest away from the first defining point." }, { value: JIS, meaning: "DXF value 3: Places the dimension text to conform to a Japanese Industrial Standards (JIS) representation." }, { value: Below, meaning: "DXF value 4: Places the dimension text under the dimension line." } ], meaning: Controls the vertical position of text in relation to the dimension line (see DIMTAD System Variable)., source_ref: group code 77 }
  - { name: text_vertical_position, type: float, default: 0, meaning: Controls the vertical position of dimension text above or below the dimension line (see DIMTVP System Variable)., source_ref: group code 145 }
  - { name: tick_size, type: float, default: 0, meaning: "Specifies the size of oblique strokes drawn instead of arrowheads for linear, radius, and diameter dimensioning (see DIMTSZ System Variable).", source_ref: group code 142 }
  - { name: tolerance_alignment, type: enum, default: Bottom, values: [ { value: Bottom, meaning: "DXF value 0: Aligns the tolerance text with the bottom of the main dimension text." }, { value: Middle, meaning: "DXF value 1: Aligns the tolerance text with the middle of the main dimension text." }, { value: Top, meaning: "DXF value 2: Aligns the tolerance text with the top of the main dimension text." } ], meaning: Gets or sets the vertical justification for tolerance values relative to the nominal dimension text. (see DIMTOLJ System Variable)., source_ref: group code 283; first in R2000 (ezdxf) }
