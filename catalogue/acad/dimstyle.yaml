  - { name: leader_arrow_id, type: ref, nullable: true, ref_to: acad.block_record, meaning: Specifies the arrow type for leaders (see DIMLDRBLK System Variable). Reference; DXF stores the handle., source_ref: group code 341 (stored as a handle); first in R2000 (ezdxf) }
