  - { name: alternate_unit_rounding, type: float, default: 0, meaning: Rounds off the alternate dimension units (see DIMALTRND System Variable)., source_ref: group code 148; first in R2000 (ezdxf) }
  - { name: alternate_unit_scale_factor, type: ratio, default: 25.4, meaning: Controls the multiplier for alternate units (see DIMALTF System Variable)., source_ref: group code 143 }
