code: acad.dimension
name: DIMENSION
kind: entity
base: acad.graphic_entity
fidelity: faithful
source: { document: "ACadSharp (DxfCodeValue attributes), cross-checked with ezdxf", section: Dimension, url: https://github.com/DomCR/ACadSharp/blob/29137f3adaf75ddebd532179eda1e811525ca574/src/ACadSharp/Entities/Dimension.cs#L24, version: DXF R2018 (AC1032), accessed_on: 2026-10-23, licence: "MIT (ACadSharp, ezdxf)" }
meaning: The DIMENSION entity represents several types of dimensions in many orientations and alignments.
notes: DXF subclass marker AcDbDimension.
fields:
  - { name: attachment_point, type: enum, values: [ { value: TopLeft, meaning: "DXF value 1: Top left." }, { value: TopCenter, meaning: "DXF value 2: Top center." }, { value: TopRight, meaning: "DXF value 3: Top right." }, { value: MiddleLeft, meaning: "DXF value 4: Middle left." }, { value: MiddleCenter, meaning: "DXF value 5: Middle center." }, { value: MiddleRight, meaning: "DXF value 6: Middle right." }, { value: BottomLeft, meaning: "DXF value 7: Bottom left." }, { value: BottomCenter, meaning: "DXF value 8: Bottom center." }, { value: BottomRight, meaning: "DXF value 9: Bottom right." } ], meaning: Attachment point., source_ref: group code 71; first in R2000 (ezdxf) }
  - { name: block_id, type: ref, nullable: true, ref_to: acad.block_record, meaning: Block that contains the entities that make up the dimension picture. Reference; DXF stores the name., source_ref: group code 2 (stored as a name) }
  - { name: definition_point, type: point3, meaning: Definition point for the dimension line (in WCS)., source_ref: "group codes 10, 20, 30" }
  - { name: flags, type: enum, values: [ { value: Linear, meaning: "DXF value 0: Rotated, horizontal, or vertical." }, { value: Aligned, meaning: "DXF value 1: Aligned." }, { value: Angular, meaning: "DXF value 2: Angular 2 lines." }, { value: Diameter, meaning: "DXF value 3: Diameter." }, { value: Radius, meaning: "DXF value 4: Radius." }, { value: Angular3Point, meaning: "DXF value 5: Angular 3 points." }, { value: Ordinate, meaning: "DXF value 6: Ordinate." }, { value: BlockReference, meaning: "DXF value 32: Indicates that the block reference(group code 2) is referenced by this dimension only." }, { value: OrdinateTypeX, meaning: "DXF value 64: Ordinate type. If set, ordinate is X-type; if not set, ordinate is Y-type." }, { value: TextUserDefinedLocation, meaning: "DXF value 128: Indicates if the dimension text has been positioned at a user-defined location rather than at the default location." } ], meaning: Dimension type., source_ref: group code 70 }
  - { name: flip_arrow1, type: bool, meaning: Gets or sets a value indicating whether the first arrow. is to be flipped., source_ref: group code 74; first in R2000 (ezdxf) }
  - { name: flip_arrow2, type: bool, meaning: Gets or sets a value indicating whether the second arrow to be flipped., source_ref: group code 75; first in R2000 (ezdxf) }
  - { name: horizontal_direction, type: angle, nullable: true, meaning: "All dimension types have an optional 51 group code, which indicates the horizontal direction for the dimension entity.The dimension entity determines the orientation of dimension text and lines for horizontal, vertical, and rotated linear dimensions This group value is the negative of the angle between the OCS X axis and the UCS X axis. It is always in the XY plane of the OCS. Radians here; DXF stores degrees.", source_ref: group code 51 }
  - { name: insertion_point, type: point3, meaning: Insertion point for clones of a dimension-Baseline and Continue(in OCS)., source_ref: "group codes 12, 22, 32" }
  - { name: line_spacing_factor, type: length, nullable: true, meaning: Dimension text-line spacing factor., source_ref: group code 41; first in R2000 (ezdxf) }
  - { name: line_spacing_style, type: enum, nullable: true, values: [ { value: None, meaning: "DXF value 0: None." }, { value: AtLeast, meaning: "DXF value 1: Taller characters will override." }, { value: Exact, meaning: "DXF value 2: Taller characters will not override." } ], meaning: Dimension text line-spacing style., source_ref: group code 72; first in R2000 (ezdxf) }
  - { name: measurement, type: float, nullable: true, meaning: Actual measurement., source_ref: group code 42; first in R2000 (ezdxf) }
  - { name: normal, type: vector3, default: [ 0, 0, 1 ], meaning: Normal., source_ref: "group codes 210, 220, 230; no description in the sources" }
  - { name: style_id, type: ref, nullable: true, ref_to: acad.dimstyle, meaning: Dimension style. Reference; DXF stores the name., source_ref: group code 3 (stored as a name) }
  - { name: text, type: text, nullable: true, meaning: Gets or sets an explicit dimension text to be displayed instead of the standard dimension text created from the measurement in the format specified by the dimension-style properties., source_ref: group code 1 }
  - { name: text_middle_point, type: point3, meaning: Middle point of dimension text(in OCS)., source_ref: "group codes 11, 21, 31" }
  - { name: text_rotation, type: angle, nullable: true, meaning: Rotation angle of the dimension text away from its default orientation (the direction of the dimension line). Radians here; DXF stores degrees., source_ref: group code 53 }
  - { name: version, type: int, meaning: Version number., source_ref: group code 280; first in R2010 (ezdxf) }
