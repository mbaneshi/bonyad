  - { name: view_center, type: point2, meaning: View center point(in DCS)., source_ref: "group codes 12, 22" }
  - { name: view_direction, type: vector3, default: [ 0, 0, 1 ], meaning: View direction vector(in WCS), source_ref: "group codes 16, 26, 36" }
  - { name: view_height, type: length, meaning: View height(in model space units)., source_ref: group code 45 }
  - { name: view_target, type: point3, meaning: View target point(in WCS), source_ref: "group codes 17, 27, 37" }
