code: acad.mleader_context_data
name: ACDB_MLEADEROBJECTCONTEXTDATA_CLASS
kind: object
base: acad.object_context_data
fidelity: faithful
source: { document: "ACadSharp (DxfCodeValue attributes), cross-checked with ezdxf", section: MultiLeaderObjectContextData, url: https://github.com/DomCR/ACadSharp/blob/29137f3adaf75ddebd532179eda1e811525ca574/src/ACadSharp/Objects/MultiLeaderObjectContextData.cs#L17, version: DXF R2018 (AC1032), accessed_on: 2026-10-23, licence: "MIT (ACadSharp, ezdxf)" }
meaning: This class represents a subset ob the properties of the MLeaderAnnotContext object, that are embedded into the MultiLeader entity.
notes: DXF subclass marker AcDbMLeaderObjectContextData.
fields:
  - { name: arrowhead_size, type: float, default: 0.18, meaning: Gets or sets the arrowhead size (see Arrowhead) for every leader line. This property overrides the value from MultiLeaderStyle when the ArrowheadSize flag is set in the PropertyOverrideFlags property., source_ref: group code 140 }
  - { name: background_fill_color, type: int, nullable: true, meaning: "Background fill color as an AutoCAD Color Index (0 ByBlock, 256 ByLayer, 1 to 255 index, negative = off).", source_ref: group code 91 }
  - { name: background_fill_enabled, type: bool, meaning: Is background fill enabled, source_ref: group code 291 }
  - { name: background_mask_fill_on, type: bool, meaning: Is background mask fill on, source_ref: group code 292 }
  - { name: background_scale_factor, type: ratio, meaning: Background scale factor, source_ref: group code 141 }
  - { name: background_transparency, type: int, meaning: Background transparency, source_ref: group code 92 }
  - { name: base_direction, type: vector3, default: [ 1, 0, 0 ], meaning: Base direction, source_ref: "group codes 111, 121, 131" }
  - { name: base_point, type: point3, meaning: Base point, source_ref: "group codes 110, 120, 130" }
  - { name: base_vertical, type: point3, default: [ 0, 1, 0 ], meaning: Base vertical, source_ref: "group codes 112, 122, 132" }
  - { name: block_content_id, type: ref, nullable: true, ref_to: acad.block_record, meaning: Gets a BlockRecord containing elements to be drawn as content for the multileader. Reference; DXF stores the handle., source_ref: group code 341 (stored as a handle) }
  - { name: block_content_connection, type: enum, values: [ { value: BlockExtents, meaning: "DXF value 0: MultiLeader connects to the block extents." }, { value: BasePoint, meaning: "DXF value 1: MultiLeader connects to the block base point." } ], meaning: Gets or sets a value indicating whether the multileader connects to the content-block extents or to the content-block base point. This property overrides the value from MultiLeaderStyle when the BlockContentConnection flag is set in the PropertyOverrideFlags property., source_ref: group code 177 }
  - { name: block_content_location, type: point3, meaning: Gets or sets the location of the block content of the multileader., source_ref: "group codes 15, 25, 35" }
  - { name: block_content_normal, type: vector3, meaning: Gets or sets the normal vector for the block content of the multileader., source_ref: "group codes 14, 24, 34" }
  - { name: block_content_rotation, type: angle, meaning: Gets or sets the rotation of the block content of the multileader. Radians here; DXF stores degrees., source_ref: group code 46 }
  - { name: block_content_scale, type: point3, meaning: Gets or sets the scale factor for block content. This property overrides the value from MultiLeaderStyle when the BlockContentScale flag is set (see PropertyOverrideFlags property)., source_ref: "group codes 16, 26, 36" }
  - { name: boundary_height, type: length, meaning: "Boundary height (DXF Reference: TextHeight) Value seems to be always zero.", source_ref: group code 44 }
  - { name: boundary_width, type: length, meaning: "Boundary width (DXF Reference: TextWidth) Value seems to be always zero.", source_ref: group code 43 }
  - { name: column_flow_reversed, type: bool, meaning: Column flow reversed, source_ref: group code 294 }
  - { name: column_gutter, type: float, meaning: Column gutter, source_ref: group code 143 }
  - { name: column_sizes, type: array, of: float, meaning: Get a list of column sizes, source_ref: count in group code 144 }
  - { name: column_type, type: int, meaning: Column type (ODA writes 0), source_ref: group code 173 }
  - { name: column_width, type: length, meaning: Column width, source_ref: group code 142 }
  - { name: content_base_point, type: point3, meaning: Gets or sets the content base point. This point is identical with the landing end point of the first leader., source_ref: "group codes 10, 20, 30" }
  - { name: direction, type: vector3, meaning: Direction, source_ref: "group codes 13, 23, 33" }
  - { name: flow_direction, type: enum, values: [ { value: Horizontal, meaning: DXF value 1 }, { value: Vertical, meaning: DXF value 3 }, { value: ByStyle, meaning: DXF value 5 }, { value: ByStyleBadDoc, meaning: DXF value 6 } ], meaning: Gets or sets a value indicating the flow direction., source_ref: group code 172 }
  - { name: has_contents_block, type: bool, meaning: Gets or sets a value indicating that the multileader has a content block., source_ref: group code 296 }
  - { name: has_text_contents, type: bool, meaning: Gets or sets a value indicating that the mutileader has a text label., source_ref: group code 290 }
  - { name: landing_gap, type: float, meaning: Gets or sets the landing gap (see LandingGap). This property overrides the value from MultiLeaderStyle when the LandingGap flag is set (see PropertyOverrideFlags property)., source_ref: group code 145 }
  - { name: line_spacing, type: enum, values: [ { value: AtLeast, meaning: DXF value 1 }, { value: Exactly, meaning: DXF value 2 } ], meaning: Gets or sets the line spacing style for the display of the text label., source_ref: group code 170 }
  - { name: line_spacing_factor, type: length, meaning: Gets or sets the line-spacing factor for the display of the text label., source_ref: group code 45 }
  - { name: normal_reversed, type: bool, meaning: Is normal reversed?, source_ref: group code 297 }
  - { name: scale_factor, type: ratio, meaning: Gets or sets a scale factor (see ScaleFactor). This property overrides the value from MultiLeaderStyle when the ScaleFactor flag is set (see PropertyOverrideFlags property). The scale factor is applied by AutoCAD., source_ref: group code 40 }
  - { name: text_alignment, type: enum, values: [ { value: Left, meaning: DXF value 0 }, { value: Center, meaning: DXF value 1 }, { value: Right, meaning: DXF value 2 } ], meaning: "Gets or sets the text alignment, i.e. the alignment of text lines if the a multiline text label, relative to the TextLocation. This property overrides the value from MultiLeaderStyle when the TextAlignment flag is set in the PropertyOverrideFlags property.", source_ref: group code 176 }
  - { name: text_attachment_point, type: enum, values: [ { value: Left, meaning: DXF value 1 }, { value: Center, meaning: DXF value 2 }, { value: Right, meaning: DXF value 3 } ], meaning: Gets or sets a value indicating the text attachment point., source_ref: group code 171 }
  - { name: text_bottom_attachment, type: enum, values: [ { value: TopOfTopLine, meaning: "DXF value 0: Top of top text line." }, { value: MiddleOfTopLine, meaning: "DXF value 1: Middle of top text line." }, { value: MiddleOfText, meaning: "DXF value 2: Middle of text." }, { value: MiddleOfBottomLine, meaning: "DXF value 3: Middle of bottom text line." }, { value: BottomOfBottomLine, meaning: "DXF value 4: Bottom of bottom text line." }, { value: BottomLine, meaning: "DXF value 5: Bottom text line." }, { value: BottomOfTopLineUnderlineBottomLine, meaning: "DXF value 6: Bottom of top text line. Underline bottom line." }, { value: BottomOfTopLineUnderlineTopLine, meaning: "DXF value 7: Bottom of top text line. Underline top line." }, { value: BottomofTopLineUnderlineAll, meaning: "DXF value 8: Bottom of top text line. Underline all content." }, { value: CenterOfText, meaning: "DXF value 9: Center of text (y-coordinate only)." }, { value: CenterOfTextOverline, meaning: "DXF value 10: Center of text (y-coordinate only), and overline top/underline bottom content." } ], meaning: Gets or sets the text bottom attachment type (see TextBottomAttachment). This property override the value from MultiLeaderStyle when the TextBottomAttachment flag is set (see PropertyOverrideFlags property)., source_ref: group code 272 }
  - { name: text_color, type: int, nullable: true, meaning: "Gets or sets the color for the display of the text label as an AutoCAD Color Index (0 ByBlock, 256 ByLayer, 1 to 255 index, negative = off).", source_ref: group code 90 }
  - { name: text_height, type: length, meaning: Get or sets the text height for the lext label of the multileader (see TextHeight). This property overrides the value from MultiLeaderStyle when the TextHeight flag is set in the PropertyOverrideFlags property., source_ref: group code 41 }
  - { name: text_height_automatic, type: bool, meaning: Is text height automatic?, source_ref: group code 293 }
  - { name: text_label, type: text, nullable: true, meaning: Gets or sets a string containg the text tat is to be dispayed a s text label of the multileader., source_ref: group code 304 }
  - { name: text_left_attachment, type: enum, values: [ { value: TopOfTopLine, meaning: "DXF value 0: Top of top text line." }, { value: MiddleOfTopLine, meaning: "DXF value 1: Middle of top text line." }, { value: MiddleOfText, meaning: "DXF value 2: Middle of text." }, { value: MiddleOfBottomLine, meaning: "DXF value 3: Middle of bottom text line." }, { value: BottomOfBottomLine, meaning: "DXF value 4: Bottom of bottom text line." }, { value: BottomLine, meaning: "DXF value 5: Bottom text line." }, { value: BottomOfTopLineUnderlineBottomLine, meaning: "DXF value 6: Bottom of top text line. Underline bottom line." }, { value: BottomOfTopLineUnderlineTopLine, meaning: "DXF value 7: Bottom of top text line. Underline top line." }, { value: BottomofTopLineUnderlineAll, meaning: "DXF value 8: Bottom of top text line. Underline all content." }, { value: CenterOfText, meaning: "DXF value 9: Center of text (y-coordinate only)." }, { value: CenterOfTextOverline, meaning: "DXF value 10: Center of text (y-coordinate only), and overline top/underline bottom content." } ], meaning: Gets or sets the text top attachment type (see TextLeftAttachment). This property overrides the value from MultiLeaderStyle when the TextLeftAttachment flag is set (see PropertyOverrideFlags property)., source_ref: group code 174 }
  - { name: text_location, type: point3, meaning: Gets or sets the location of the text label of the multileader., source_ref: "group codes 12, 22, 32" }
  - { name: text_normal, type: vector3, meaning: Gets or sets the normal vector for the text label of the multileader., source_ref: "group codes 11, 21, 31" }
  - { name: text_right_attachment, type: enum, values: [ { value: TopOfTopLine, meaning: "DXF value 0: Top of top text line." }, { value: MiddleOfTopLine, meaning: "DXF value 1: Middle of top text line." }, { value: MiddleOfText, meaning: "DXF value 2: Middle of text." }, { value: MiddleOfBottomLine, meaning: "DXF value 3: Middle of bottom text line." }, { value: BottomOfBottomLine, meaning: "DXF value 4: Bottom of bottom text line." }, { value: BottomLine, meaning: "DXF value 5: Bottom text line." }, { value: BottomOfTopLineUnderlineBottomLine, meaning: "DXF value 6: Bottom of top text line. Underline bottom line." }, { value: BottomOfTopLineUnderlineTopLine, meaning: "DXF value 7: Bottom of top text line. Underline top line." }, { value: BottomofTopLineUnderlineAll, meaning: "DXF value 8: Bottom of top text line. Underline all content." }, { value: CenterOfText, meaning: "DXF value 9: Center of text (y-coordinate only)." }, { value: CenterOfTextOverline, meaning: "DXF value 10: Center of text (y-coordinate only), and overline top/underline bottom content." } ], meaning: Gets or sets the text top attachment type (see TextRightAttachment). This property overrides the value from MultiLeaderStyle when the TextRightAttachment flag is set (see PropertyOverrideFlags property)., source_ref: group code 175 }
  - { name: text_rotation, type: angle, meaning: Gets or sets the rotation of the text label of the multileader. Radians here; DXF stores degrees., source_ref: group code 42 }
  - { name: text_style_id, type: ref, nullable: true, ref_to: acad.style, meaning: Gets or sets the TextStyle to be used to display the text label of the multileader. This property overrides the value from MultiLeaderStyle when the TextStyle flag is set in the PropertyOverrideFlags property. Reference; DXF stores the handle., source_ref: group code 340 (stored as a handle) }
  - { name: text_top_attachment, type: enum, values: [ { value: TopOfTopLine, meaning: "DXF value 0: Top of top text line." }, { value: MiddleOfTopLine, meaning: "DXF value 1: Middle of top text line." }, { value: MiddleOfText, meaning: "DXF value 2: Middle of text." }, { value: MiddleOfBottomLine, meaning: "DXF value 3: Middle of bottom text line." }, { value: BottomOfBottomLine, meaning: "DXF value 4: Bottom of bottom text line." }, { value: BottomLine, meaning: "DXF value 5: Bottom text line." }, { value: BottomOfTopLineUnderlineBottomLine, meaning: "DXF value 6: Bottom of top text line. Underline bottom line." }, { value: BottomOfTopLineUnderlineTopLine, meaning: "DXF value 7: Bottom of top text line. Underline top line." }, { value: BottomofTopLineUnderlineAll, meaning: "DXF value 8: Bottom of top text line. Underline all content." }, { value: CenterOfText, meaning: "DXF value 9: Center of text (y-coordinate only)." }, { value: CenterOfTextOverline, meaning: "DXF value 10: Center of text (y-coordinate only), and overline top/underline bottom content." } ], meaning: Gets or sets the text top attachment type (see TextTopAttachment). This property override the value from MultiLeaderStyle when the TextTopAttachment flag is set (see PropertyOverrideFlags property)., source_ref: group code 273 }
  - { name: word_break, type: bool, meaning: Word break, source_ref: group code 295 }
