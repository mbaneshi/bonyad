  - { name: background_color_book, type: text, nullable: true, meaning: "Background fill color: name of the colour-book colour, when one is used.", source_ref: group code 430 }
  - { name: background_fill_flags, type: int, default: 0, meaning: "Background fill setting. Bit-coded: 1 UseBackgroundFillColor, 2 UseDrawingWindowColor, 16 TextFrame.", source_ref: group code 90 }
