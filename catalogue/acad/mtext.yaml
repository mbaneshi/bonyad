  - { name: drawing_direction, type: enum, default: LeftToRight, values: [ { value: LeftToRight, meaning: "DXF value 1: Left to right." }, { value: RightToLeft, meaning: "DXF value 2: Right to left." }, { value: TopToBottom, meaning: "DXF value 3: Top to bottom." }, { value: BottomToTop, meaning: "DXF value 4: Bottom to top." }, { value: ByStyle, meaning: "DXF value 5: By Style." } ], meaning: Drawing direction, source_ref: group code 72 }
