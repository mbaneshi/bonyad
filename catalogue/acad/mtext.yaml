  - { name: attachment_point, type: enum, default: TopLeft, values: [ { value: TopLeft, meaning: "DXF value 1: Top left." }, { value: TopCenter, meaning: "DXF value 2: Top center." }, { value: TopRight, meaning: "DXF value 3: Top right." }, { value: MiddleLeft, meaning: "DXF value 4: Middle left." }, { value: MiddleCenter, meaning: "DXF value 5: Middle center." }, { value: MiddleRight, meaning: "DXF value 6: Middle right." }, { value: BottomLeft, meaning: "DXF value 7: Bottom left." }, { value: BottomCenter, meaning: "DXF value 8: Bottom center." }, { value: BottomRight, meaning: "DXF value 9: Bottom right." } ], meaning: Attachment point, source_ref: group code 71 }
  - { name: background_color, type: int, nullable: true, meaning: "Background fill color as an AutoCAD Color Index (0 ByBlock, 256 ByLayer, 1 to 255 index, negative = off).", source_ref: group code 63 }
