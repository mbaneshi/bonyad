meaning: 'The PhysicsLimitAPI can be applied to a PhysicsJoint and will restrict the movement along an axis. PhysicsLimitAPI is a multipleApply schema: The PhysicsJoint can be restricted along "transX", "transY", "transZ", "rotX", "rotY", "rotZ", "distance".'
fields:
  - name: physics_low
    type: float
    nullable: true
    meaning: "Lower limit. Varying: may carry time samples (animatable). Fallback value is -inf."
    source_ref: float limit:<instanceName>:physics:low
  - name: physics_high
    type: float
    nullable: true
    meaning: "Upper limit. Varying: may carry time samples (animatable). Fallback value is inf."
    source_ref: float limit:<instanceName>:physics:high
notes: 'Defined in pxr/usd/usdPhysics/schema.usda (module usdPhysics). API schema (multipleApply): it adds properties to an existing prim and is not a prim type of its own. Properties live under the "limit:" namespace, followed by an instance name.'
