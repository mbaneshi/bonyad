code: usd.light_api
name: LightAPI
kind: object
base: usd.api_schema_base
fidelity: proxy
source:
  document: OpenUSD pxr/usd/usdLux/schema.usda
  section: class LightAPI
  url: https://github.com/PixarAnimationStudios/OpenUSD/blob/bc32a655a41770f8ded78ef43789b044be1ba5ea/pxr/usd/usdLux/schema.usda
  version: OpenUSD development tree at commit bc32a65 (cmake/defaults/Version.cmake reads 0.27.2)
  accessed_on: 2026-10-23
  licence: Tomorrow Open Source Technology License 1.0 (Apache License 2.0 with a different Section 6, Trademarks); see LICENSE.txt at the pinned commit
meaning: API schema that imparts the quality of being a light onto a prim. A light is any prim that has this schema applied to it.
fields:
  - name: collection_light_link_include_root
    type: bool
    default: true
    meaning: "Property collection:lightLink:includeRoot (no description in schema.usda). Uniform: one value, not time-sampled."
    source_ref: uniform bool collection:lightLink:includeRoot
  - name: collection_shadow_link_include_root
    type: bool
    default: true
    meaning: "Property collection:shadowLink:includeRoot (no description in schema.usda). Uniform: one value, not time-sampled."
    source_ref: uniform bool collection:shadowLink:includeRoot
  - name: light_shader_id
    type: text
    default: ""
    meaning: "Default ID for the light's shader. Uniform: one value, not time-sampled."
    source_ref: uniform token light:shaderId
  - name: light_material_sync_mode
    type: enum
    default: noMaterialResponse
    meaning: "For a LightAPI applied to geometry that has a bound Material, which is entirely or partly emissive, this specifies the relationship of the Material response to the lighting response. Uniform: one value, not time-sampled."
    source_ref: uniform token light:materialSyncMode
    values:
      - value: materialGlowTintsLight
        meaning: All primary and secondary rays see the emissive/glow response as dictated by the bound Material while the base color seen by light rays (which is then modulated by all of the other LightAPI controls) is the ...
      - value: independent
        meaning: All primary and secondary rays see the emissive/glow response as dictated by the bound Material, while the base color seen by light rays is determined solely by *inputs:color*.
      - value: noMaterialResponse
        meaning: The geometry behaves as if there is no Material bound at all, i.e. there is no diffuse, specular, or transmissive response.
  - name: inputs_intensity
    type: float
    default: 1
    meaning: "Scales the brightness of the light linearly. Varying: may carry time samples (animatable)."
    source_ref: float inputs:intensity
  - name: inputs_exposure
    type: float
    default: 0
    meaning: "Scales the brightness of the light exponentially as a power of 2 (similar to an F-stop control over exposure). Varying: may carry time samples (animatable)."
    source_ref: float inputs:exposure
  - name: inputs_diffuse
    type: float
    default: 1
    meaning: "A multiplier for the effect of this light on the diffuse response of materials. Varying: may carry time samples (animatable)."
    source_ref: float inputs:diffuse
  - name: inputs_specular
    type: float
    default: 1
    meaning: "A multiplier for the effect of this light on the specular response of materials. Varying: may carry time samples (animatable)."
    source_ref: float inputs:specular
  - name: inputs_normalize
    type: bool
    default: false
    meaning: "Normalizes the emission such that the power of the light remains constant while altering the size of the light, by dividing the luminance by the world-space surface area of the light. Varying: may carry time samples (animatable)."
    source_ref: bool inputs:normalize
  - name: inputs_color
    type: vector3
    default:
      - 1
      - 1
      - 1
    meaning: "The color of emitted light, in the rendering color space. (RGB colour stored as x=r, y=g, z=b) Varying: may carry time samples (animatable)."
    source_ref: color3f inputs:color
  - name: inputs_enable_color_temperature
    type: bool
    default: false
    meaning: "Enables using colorTemperature. Varying: may carry time samples (animatable)."
    source_ref: bool inputs:enableColorTemperature
  - name: inputs_color_temperature
    type: float
    default: 6500
    meaning: "Color temperature, in degrees Kelvin, representing the white point. Varying: may carry time samples (animatable)."
    source_ref: float inputs:colorTemperature
  - name: light_filters
    type: ref
    nullable: true
    meaning: "Relationship to the light filters that apply to this light. Relationship: targets are prim or property paths and USD allows several."
    source_ref: rel light:filters
    ref_to: any
needs_review: true
notes: "Defined in pxr/usd/usdLux/schema.usda (module usdLux). API schema (apiSchemaType not stated): it adds properties to an existing prim and is not a prim type of its own. Applies built-in API schemas: CollectionAPI:lightLink, CollectionAPI:shadowLink. Review: property collection:lightLink:includeRoot has no doc; property collection:shadowLink:includeRoot has no doc."
