meaning: UsdShadeNodeDefAPI is an API schema that provides attributes for a prim to select a corresponding Shader Node Definition ("Sdr Node"), as well as to look up a runtime entry for that shader node in the form of an SdrShaderNode. UsdShadeNodeDefAPI is intended to be a pre-applied API schema for any prim type that wants to refer to the SdrRegistry for further implementation ...
fields:
  - name: info_implementation_source
    type: enum
    default: id
    meaning: "Specifies the attribute that should be consulted to get the shader's implementation or its source code. Uniform: one value, not time-sampled."
    source_ref: uniform token info:implementationSource
    values:
      - value: id
        meaning: The token "id" (the schema gives no per-value description).
      - value: sourceAsset
        meaning: The token "sourceAsset" (the schema gives no per-value description).
      - value: sourceCode
        meaning: The token "sourceCode" (the schema gives no per-value description).
  - name: info_id
    type: text
    nullable: true
    meaning: "The id is an identifier for the type or purpose of the shader. Uniform: one value, not time-sampled."
    source_ref: uniform token info:id
notes: "Defined in pxr/usd/usdShade/schema.usda (module usdShade). API schema (singleApply): it adds properties to an existing prim and is not a prim type of its own."
