meaning: AssetPreviewsAPI is the interface for authoring and accessing precomputed, lightweight previews of assets. It is an applied schema, which means that an arbitrary number of prims on a stage can have the schema applied and therefore can contain previews; however, to access a stage's "default" previews, one consults the stage's defaultPrim.
