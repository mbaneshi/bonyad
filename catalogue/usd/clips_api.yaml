meaning: UsdClipsAPI is an API schema that provides an interface to a prim's clip metadata. Clips are a "value resolution" feature that allows one to specify a sequence of usd files (clips) to be consulted, over time, as a source of varying overrides for the prims at and beneath this prim in namespace.
