meaning: Defines a collision group for coarse filtering. When a collision occurs between two objects that have a PhysicsCollisionGroup assigned, they will collide with each other unless this PhysicsCollisionGroup pair is filtered.
fields:
  - name: physics_filtered_groups
    type: ref
    nullable: true
    meaning: "References a list of PhysicsCollisionGroups with which collisions should be ignored. Relationship: targets are prim or property paths and USD allows several."
    source_ref: rel physics:filteredGroups
    ref_to: any
  - name: physics_merge_group
    type: text
    nullable: true
    meaning: "If non-empty, any collision groups in a stage with a matching mergeGroup should be considered to refer to the same collection. Varying: may carry time samples (animatable)."
    source_ref: string physics:mergeGroup
  - name: physics_invert_filtered_groups
    type: bool
    nullable: true
    meaning: "Normally, the filter will disable collisions against the selected filter groups. Varying: may carry time samples (animatable)."
    source_ref: bool physics:invertFilteredGroups
notes: "Defined in pxr/usd/usdPhysics/schema.usda (module usdPhysics). Applies built-in API schemas: CollectionAPI:colliders."
