meaning: Represents an abstract generative procedural prim which delivers its input parameters via properties (including relationships) within the "primvars:" namespace. It does not itself have any awareness or participation in the execution of the procedural but rather serves as a means of delivering a procedural's definition and input parameters.
fields:
