meaning: 04079). It inherits from the ParticleField base prim, and has a set of applied schema automatically applied to provide the required attributes to define the necessary data from the original 3DGS paper.
fields:
  - name: projection_mode_hint
    type: enum
    default: perspective
    meaning: "A hint for the renderer on how to project the gaussian to achieve a perspective correct view. Uniform: one value, not time-sampled."
    source_ref: uniform token projectionModeHint
    values:
      - value: perspective
        meaning: The token "perspective" (the schema gives no per-value description).
      - value: tangential
        meaning: The token "tangential" (the schema gives no per-value description).
  - name: sorting_mode_hint
    type: enum
    default: zDepth
    meaning: "A hint for the renderer on how to sort the gaussians while drawing. Uniform: one value, not time-sampled."
    source_ref: uniform token sortingModeHint
    values:
      - value: zDepth
        meaning: The token "zDepth" (the schema gives no per-value description).
      - value: cameraDistance
        meaning: The token "cameraDistance" (the schema gives no per-value description).
      - value: rayHitDistance
        meaning: The token "rayHitDistance" (the schema gives no per-value description).
