code: usd.render_pass
name: RenderPass
kind: entity
base: usd.typed
fidelity: proxy
source:
  document: OpenUSD pxr/usd/usdRender/schema.usda
  section: class RenderPass
  url: https://github.com/PixarAnimationStudios/OpenUSD/blob/bc32a655a41770f8ded78ef43789b044be1ba5ea/pxr/usd/usdRender/schema.usda
  version: OpenUSD development tree at commit bc32a65 (cmake/defaults/Version.cmake reads 0.27.2)
  accessed_on: 2026-10-23
  licence: Tomorrow Open Source Technology License 1.0 (Apache License 2.0 with a different Section 6, Trademarks); see LICENSE.txt at the pinned commit
meaning: A RenderPass prim encapsulates necessary information to generate multi-pass renders. In a multi-pass render, multiple invocations ("passes") of the rendering process are used to generate products using potentially distinct configurations of the stage and renderer.
fields:
  - name: pass_type
    type: text
    nullable: true
    meaning: "A string used to categorize differently structured or executed types of passes within a customized pipeline. Uniform: one value, not time-sampled."
    source_ref: uniform token passType
  - name: command
    type: array
    nullable: true
    meaning: "The command to run in order to generate renders for this pass. Uniform: one value, not time-sampled."
    source_ref: uniform string[] command
    of: text
  - name: render_source
    type: ref
    nullable: true
    meaning: "The source prim to render from. Relationship: targets are prim or property paths and USD allows several."
    source_ref: rel renderSource
    ref_to: any
  - name: input_passes
    type: ref
    nullable: true
    meaning: "The set of other Passes that this Pass depends on in order to be constructed properly. Relationship: targets are prim or property paths and USD allows several."
    source_ref: rel inputPasses
    ref_to: any
  - name: file_name
    type: text
    nullable: true
    meaning: "The asset that contains the rendering prims or other information needed to render this pass. Uniform: one value, not time-sampled. Holds an asset path."
    source_ref: uniform asset fileName
  - name: collection_render_visibility_include_root
    type: bool
    default: true
    meaning: "Property collection:renderVisibility:includeRoot (no description in schema.usda). Uniform: one value, not time-sampled."
    source_ref: uniform bool collection:renderVisibility:includeRoot
  - name: collection_camera_visibility_include_root
    type: bool
    default: true
    meaning: "Property collection:cameraVisibility:includeRoot (no description in schema.usda). Uniform: one value, not time-sampled."
    source_ref: uniform bool collection:cameraVisibility:includeRoot
needs_review: true
notes: "Defined in pxr/usd/usdRender/schema.usda (module usdRender). Applies built-in API schemas: CollectionAPI:renderVisibility, CollectionAPI:cameraVisibility, CollectionAPI:prune, CollectionAPI:matte. Review: property collection:renderVisibility:includeRoot has no doc; property collection:cameraVisibility:includeRoot has no doc."
