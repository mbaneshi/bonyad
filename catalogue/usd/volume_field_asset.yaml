meaning: Base class for volume field primitives defined by an external file.
fields:
  - name: file_path
    type: text
    nullable: true
    meaning: "An asset path attribute that points to a file on disk. Varying: may carry time samples (animatable). Holds an asset path."
    source_ref: asset filePath
  - name: field_name
    type: text
    nullable: true
    meaning: "Name of an individual field within the file specified by the filePath attribute. Varying: may carry time samples (animatable)."
    source_ref: token fieldName
  - name: field_index
    type: int
    nullable: true
    meaning: "A file can contain multiple fields with the same name. Varying: may carry time samples (animatable)."
    source_ref: int fieldIndex
  - name: field_data_type
    type: text
    nullable: true
    meaning: "Token which is used to indicate the data type of an individual field. Varying: may carry time samples (animatable)."
    source_ref: token fieldDataType
  - name: vector_data_role_hint
    type: enum
    default: None
    meaning: "Optional token which is used to indicate the role of a vector valued field. Varying: may carry time samples (animatable)."
    source_ref: token vectorDataRoleHint
    values:
      - value: None
        meaning: The token "None" (the schema gives no per-value description).
      - value: Point
        meaning: The token "Point" (the schema gives no per-value description).
      - value: Normal
        meaning: The token "Normal" (the schema gives no per-value description).
      - value: Vector
        meaning: The token "Vector" (the schema gives no per-value description).
      - value: Color
        meaning: The token "Color" (the schema gives no per-value description).
notes: Defined in pxr/usd/usdVol/schema.usda (module usdVol).
