meaning: Defines a primitive capsule, i.e. a cylinder capped by two half spheres, with potentially different radii, centered at the origin, and whose spine is along the specified axis. The spherical cap heights (sagitta) of the two endcaps are a function of the relative radii of the endcaps, such that cylinder tangent and sphere tangent are coincident and maintain C1 continuity.
fields:
  - name: height
    type: float
    default: 1
    meaning: "The length of the capsule's spine along the specified axis excluding the size of the two half spheres, i.e. the length of the cylinder portion of the capsule. Varying: may carry time samples (animatable)."
    source_ref: double height
  - name: radius_top
    type: float
    default: 0.5
    meaning: "The radius of the capping sphere at the top of the capsule - i.e. the sphere in the direction of the positive axis. Varying: may carry time samples (animatable)."
    source_ref: double radiusTop
  - name: radius_bottom
    type: float
    default: 0.5
    meaning: "The radius of the capping sphere at the bottom of the capsule - i.e. the sphere located in the direction of the negative axis. Varying: may carry time samples (animatable)."
    source_ref: double radiusBottom
  - name: axis
    type: enum
    default: Z
    meaning: "The axis along which the spine of the capsule is aligned Uniform: one value, not time-sampled."
    source_ref: uniform token axis
    values:
      - value: X
        meaning: The token "X" (the schema gives no per-value description).
      - value: Y
        meaning: The token "Y" (the schema gives no per-value description).
      - value: Z
        meaning: The token "Z" (the schema gives no per-value description).
needs_review: true
