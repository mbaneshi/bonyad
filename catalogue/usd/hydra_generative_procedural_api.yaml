fields:
  - name: primvars_hd_gp_procedural_type
    type: text
    nullable: true
    meaning: "The registered name of a HdGpGenerativeProceduralPlugin to be executed. Varying: may carry time samples (animatable)."
    source_ref: token primvars:hdGp:proceduralType
  - name: procedural_system
    type: text
    default: hydraGenerativeProcedural
    meaning: "This value should correspond to a configured instance of HdGpGenerativeProceduralResolvingSceneIndex which will evaluate the procedural. Varying: may carry time samples (animatable)."
    source_ref: token proceduralSystem
notes: "Defined in pxr/usd/usdHydra/schema.usda (module usdHydra). API schema (apiSchemaType not stated): it adds properties to an existing prim and is not a prim type of its own. Can only be applied to: GenerativeProcedural."
