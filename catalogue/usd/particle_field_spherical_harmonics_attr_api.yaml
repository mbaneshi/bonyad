meaning: A ParticleField related applied schema that provides spherical harmonics attributes to define the radiance of the particles. The spherical harmonics degree is constant across all the particles in the ParticleField.
fields:
  - name: radiance_spherical_harmonics_degree
    type: int
    default: 3
    meaning: "The highest degree of the spherical harmonics. Uniform: one value, not time-sampled."
    source_ref: uniform int radiance:sphericalHarmonicsDegree
notes: "Defined in pxr/usd/usdVol/schema.usda (module usdVol). API schema (singleApply): it adds properties to an existing prim and is not a prim type of its own. Can only be applied to: ParticleField. Applies built-in API schemas: ParticleFieldRadianceBaseAPI."
