  - name: light_material_sync_mode
    type: text
    default: materialGlowTintsLight
    meaning: "Property light:materialSyncMode (no description in schema.usda). Uniform: one value, not time-sampled."
    source_ref: uniform token light:materialSyncMode
needs_review: true
notes: "Defined in pxr/usd/usdLux/schema.usda (module usdLux). API schema (apiSchemaType not stated): it adds properties to an existing prim and is not a prim type of its own. Applies built-in API schemas: LightAPI. Review: property light:shaderId has no doc; property light:materialSyncMode has no doc."
