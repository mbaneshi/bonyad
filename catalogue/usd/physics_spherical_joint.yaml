    type: float
    default: -1
    meaning: "Cone limit from the primary joint axis in the local0 frame toward the next axis. Varying: may carry time samples (animatable)."
    source_ref: float physics:coneAngle0Limit
  - name: physics_cone_angle1limit
    type: float
    default: -1
    meaning: "Cone limit from the primary joint axis in the local0 frame toward the second to next axis. Varying: may carry time samples (animatable)."
