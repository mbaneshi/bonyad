code: usd.lod_screen_size_heuristic
name: LODScreenSizeHeuristic
kind: entity
base: usd.lod_heuristic
fidelity: proxy
source:
  document: OpenUSD pxr/usd/usdLod/schema.usda
  section: class LODScreenSizeHeuristic
  url: https://github.com/PixarAnimationStudios/OpenUSD/blob/bc32a655a41770f8ded78ef43789b044be1ba5ea/pxr/usd/usdLod/schema.usda
  version: OpenUSD development tree at commit bc32a65 (cmake/defaults/Version.cmake reads 0.27.2)
  accessed_on: 2026-10-23
  licence: Tomorrow Open Source Technology License 1.0 (Apache License 2.0 with a different Section 6, Trademarks); see LICENSE.txt at the pinned commit
meaning: This LOD heuristic selects LOD children on the basis of the fraction of the viewplane would be covered by the extent. The LOD child selected is determined by the comparing the computed screen size with the values in thresholds and blendThresholds.
fields:
  - name: bounding_volume
    type: ref
    nullable: true
    meaning: "Optional relationship to a Boundable prim that defines the bounding volume for this LOD Root, used for size calculation if the referenced prim has a valid extent. Relationship: targets are prim or property paths and USD allows several."
    source_ref: rel boundingVolume
    ref_to: any
  - name: projection_method
    type: enum
    default: projectedSphere
    meaning: "Defines how screen size is calculated. Uniform: one value, not time-sampled."
    source_ref: uniform token projectionMethod
    values:
      - value: projectedExtent
        meaning: The token "projectedExtent" (the schema gives no per-value description).
      - value: projectedSphere
        meaning: The token "projectedSphere" (the schema gives no per-value description).
  - name: thresholds
    type: array
    default: []
    meaning: "The screen size thresholds for LOD transitions in descending order as a fraction of the viewport size. Uniform: one value, not time-sampled."
    source_ref: uniform float[] thresholds
    of: float
  - name: blend_thresholds
    type: array
    default: []
    meaning: "This defines screen size thresholds for LOD transitions in descending order. Uniform: one value, not time-sampled."
    source_ref: uniform float[] blendThresholds
    of: float
notes: Defined in pxr/usd/usdLod/schema.usda (module usdLod).
