code: usd.capsule
name: Capsule
kind: entity
base: usd.gprim
fidelity: proxy
source:
  document: OpenUSD pxr/usd/usdGeom/schema.usda
  section: class Capsule
  url: https://github.com/PixarAnimationStudios/OpenUSD/blob/bc32a655a41770f8ded78ef43789b044be1ba5ea/pxr/usd/usdGeom/schema.usda
  version: OpenUSD development tree at commit bc32a65 (cmake/defaults/Version.cmake reads 0.27.2)
  accessed_on: 2026-10-23
  licence: Tomorrow Open Source Technology License 1.0 (Apache License 2.0 with a different Section 6, Trademarks); see LICENSE.txt at the pinned commit
meaning: Defines a primitive capsule, i.e. a cylinder capped by two half spheres, centered at the origin, whose spine is along the specified axis. The spherical cap heights (sagitta) of the two endcaps are a function of the relative radii of the endcaps, such that cylinder tangent and sphere tangent are coincident and maintain C1 continuity.
fields:
  - name: height
    type: float
    default: 1
    meaning: "The length of the capsule's spine along the specified axis excluding the size of the two half spheres, i.e. the length of the cylinder portion of the capsule. Varying: may carry time samples (animatable)."
    source_ref: double height
  - name: radius
    type: float
    default: 0.5
    meaning: "The radius of the capsule. Varying: may carry time samples (animatable)."
    source_ref: double radius
  - name: axis
    type: enum
    default: Z
    meaning: "The axis along which the spine of the capsule is aligned Uniform: one value, not time-sampled."
    source_ref: uniform token axis
    values:
      - value: X
        meaning: The token "X" (the schema gives no per-value description).
      - value: Y
        meaning: The token "Y" (the schema gives no per-value description).
      - value: Z
        meaning: The token "Z" (the schema gives no per-value description).
notes: Defined in pxr/usd/usdGeom/schema.usda (module usdGeom).
