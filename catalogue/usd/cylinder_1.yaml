meaning: Defines a primitive cylinder with closed ends, centered at the origin, whose spine is along the specified axis, with a pair of radii describing the size of the end points. The fallback values for Cube, Sphere, Cone, and Cylinder are set so that they all pack into the same volume/bounds.
fields:
  - name: height
    type: float
    default: 2
    meaning: "The length of the cylinder's spine along the specified axis. Varying: may carry time samples (animatable)."
    source_ref: double height
  - name: radius_top
    type: float
    default: 1
    meaning: "The radius of the top of the cylinder - i.e. the face located along the positive axis. Varying: may carry time samples (animatable)."
    source_ref: double radiusTop
  - name: radius_bottom
    type: float
    default: 1
    meaning: "The radius of the bottom of the cylinder - i.e. the face point located along the negative axis. Varying: may carry time samples (animatable)."
    source_ref: double radiusBottom
  - name: axis
    type: enum
    default: Z
    meaning: "The axis along which the spine of the cylinder is aligned Uniform: one value, not time-sampled."
    source_ref: uniform token axis
    values:
      - value: X
        meaning: The token "X" (the schema gives no per-value description).
      - value: Y
        meaning: The token "Y" (the schema gives no per-value description).
      - value: Z
        meaning: The token "Z" (the schema gives no per-value description).
