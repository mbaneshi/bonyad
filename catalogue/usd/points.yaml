code: usd.points
name: Points
kind: entity
base: usd.point_based
fidelity: proxy
source:
  document: OpenUSD pxr/usd/usdGeom/schema.usda
  section: class Points
  url: https://github.com/PixarAnimationStudios/OpenUSD/blob/bc32a655a41770f8ded78ef43789b044be1ba5ea/pxr/usd/usdGeom/schema.usda
  version: OpenUSD development tree at commit bc32a65 (cmake/defaults/Version.cmake reads 0.27.2)
  accessed_on: 2026-10-23
  licence: Tomorrow Open Source Technology License 1.0 (Apache License 2.0 with a different Section 6, Trademarks); see LICENSE.txt at the pinned commit
meaning: Points are analogous to the RiPoints spec . Points can be an efficient means of storing and rendering particle effects comprised of thousands or millions of small particles.
fields:
  - name: widths
    type: array
    nullable: true
    meaning: "Widths are defined as the diameter of the points, in object space. Varying: may carry time samples (animatable)."
    source_ref: float[] widths
    of: float
  - name: ids
    type: array
    nullable: true
    meaning: "Ids are optional; if authored, the ids array should be the same length as the points array, specifying (at each timesample if point identities are changing) the id of each point. Varying: may carry time samples (animatable)."
    source_ref: int64[] ids
    of: bigint
notes: Defined in pxr/usd/usdGeom/schema.usda (module usdGeom).
