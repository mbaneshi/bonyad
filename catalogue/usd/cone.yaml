meaning: Defines a primitive cone, centered at the origin, whose spine is along the specified axis, with the apex of the cone pointing in the direction of the positive axis. The fallback values for Cube, Sphere, Cone, and Cylinder are set so that they all pack into the same volume/bounds.
fields:
  - name: height
    type: float
    default: 2
    meaning: "The length of the cone's spine along the specified axis. Varying: may carry time samples (animatable)."
    source_ref: double height
  - name: radius
    type: float
    default: 1
    meaning: "The radius of the cone. Varying: may carry time samples (animatable)."
    source_ref: double radius
  - name: axis
    type: enum
    default: Z
    meaning: "The axis along which the spine of the cone is aligned Uniform: one value, not time-sampled."
    source_ref: uniform token axis
    values:
      - value: X
        meaning: The token "X" (the schema gives no per-value description).
      - value: Y
        meaning: The token "Y" (the schema gives no per-value description).
      - value: Z
        meaning: The token "Z" (the schema gives no per-value description).
notes: Defined in pxr/usd/usdGeom/schema.usda (module usdGeom).
