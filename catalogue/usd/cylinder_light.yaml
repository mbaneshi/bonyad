meaning: Light emitted outward from a cylinder. The cylinder is centered at the origin and has its major axis on the X axis.
fields:
  - name: light_shader_id
    type: text
    default: CylinderLight
    meaning: "Property light:shaderId (no description in schema.usda). Uniform: one value, not time-sampled."
    source_ref: uniform token light:shaderId
  - name: inputs_length
    type: float
    default: 1
    meaning: "Length of the cylinder, in the local X axis. Varying: may carry time samples (animatable)."
    source_ref: float inputs:length
  - name: inputs_radius
    type: float
    default: 0.5
    meaning: "Radius of the cylinder. Varying: may carry time samples (animatable)."
    source_ref: float inputs:radius
  - name: treat_as_line
    type: bool
    default: false
    meaning: "A hint that this light can be treated as a 'line' light (effectively, a zero-radius cylinder) by renderers that benefit from non-area lighting. Varying: may carry time samples (animatable)."
    source_ref: bool treatAsLine
