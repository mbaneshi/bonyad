meaning: Describes a skel animation, where joint animation is stored in a vectorized form. See the extended Skel Animation documentation for more information.
fields:
  - name: joints
    type: array
    nullable: true
    meaning: "Array of tokens identifying which joints this animation's data applies to. Uniform: one value, not time-sampled."
    source_ref: uniform token[] joints
    of: text
  - name: blend_shapes
    type: array
    nullable: true
    meaning: "Array of tokens identifying which blend shapes this animation's data applies to. Uniform: one value, not time-sampled."
    source_ref: uniform token[] blendShapes
    of: text
  - name: blend_shape_weights
    type: array
    nullable: true
    meaning: "Array of weight values for each blend shape. Varying: may carry time samples (animatable)."
    source_ref: float[] blendShapeWeights
    of: float
