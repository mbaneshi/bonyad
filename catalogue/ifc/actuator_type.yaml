    values:
      - value: ELECTRICACTUATOR
        meaning: A device that electrically actuates a control element.
      - value: HANDOPERATEDACTUATOR
        meaning: A device that manually actuates a control element.
      - value: HYDRAULICACTUATOR
        meaning: A device that hydraulically actuates a control element.
      - value: PNEUMATICACTUATOR
