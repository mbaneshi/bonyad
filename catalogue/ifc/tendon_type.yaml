meaning: The reinforcing element type IfcTendonType defines commonly shared information for occurrences of tendons.
fields:
  - name: predefined_type
    type: enum
    meaning: Subtype of tendon.
    source_ref: "IfcTendonType attribute 1: IfcTendonTypeEnum; enumeration IfcTendonTypeEnum"
    values:
      - value: BAR
        meaning: The tendon is configured as a bar.
      - value: COATED
        meaning: The tendon is coated.
      - value: STRAND
        meaning: The tendon is a strand.
      - value: WIRE
        meaning: The tendon is a wire.
      - value: USERDEFINED
        meaning: The type of tendon is user defined.
      - value: NOTDEFINED
        meaning: The type of tendon is not defined.
  - name: nominal_diameter
    type: length
    nullable: true
    meaning: The nominal diameter defining the cross-section size of the prestressed part of the tendon.
    source_ref: "IfcTendonType attribute 2: OPTIONAL IfcPositiveLengthMeasure"
    check: positive
  - name: cross_section_area
    type: area
    nullable: true
    meaning: The effective cross-section area of the prestressed part of the tendon.
    source_ref: "IfcTendonType attribute 3: OPTIONAL IfcAreaMeasure"
  - name: sheath_diameter
    type: length
    nullable: true
    meaning: Diameter of the sheeth (duct) around the tendon, if there is one with this type of tendon.
    source_ref: "IfcTendonType attribute 4: OPTIONAL IfcPositiveLengthMeasure"
    check: positive
