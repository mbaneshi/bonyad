meaning: The flow terminal type IfcElectricApplianceType defines commonly shared information for occurrences of electric appliances.
fields:
  - name: predefined_type
    type: enum
    meaning: Identifies the predefined types of electrical appliance from which the type required may be set.
    source_ref: "IfcElectricApplianceType attribute 1: IfcElectricApplianceTypeEnum; enumeration IfcElectricApplianceTypeEnum"
    values:
      - value: DISHWASHER
        meaning: An appliance that has the primary function of washing dishes.
      - value: ELECTRICCOOKER
        meaning: An electrical appliance that has the primary function of cooking food (including oven, hob, grill).
      - value: FREESTANDINGELECTRICHEATER
        meaning: An electrical appliance that is used occasionally to provide heat.
      - value: FREESTANDINGFAN
        meaning: An electrical appliance that is used occasionally to provide ventilation.
      - value: FREESTANDINGWATERHEATER
        meaning: A small, local electrical appliance for heating water.
      - value: FREESTANDINGWATERCOOLER
        meaning: A small, local electrical appliance for cooling water.
      - value: FREEZER
        meaning: An electrical appliance that has the primary function of storing food at temperatures below the freezing point of water.
      - value: FRIDGE_FREEZER
        meaning: An electrical appliance that combines the functions of a freezer and a refrigerator through the provision of separate compartments.
      - value: HANDDRYER
        meaning: An electrical appliance that has the primary function of drying hands.
      - value: KITCHENMACHINE
        meaning: A specialized appliance used in commercial kitchens such as a mixer.
      - value: MICROWAVE
        meaning: An electrical appliance that has the primary function of cooking food using microwaves.
      - value: PHOTOCOPIER
        meaning: A machine that has the primary function of reproduction of printed matter.
      - value: REFRIGERATOR
        meaning: An electrical appliance that has the primary function of storing food at low temperature but above the freezing point of water.
      - value: TUMBLEDRYER
        meaning: An electrical appliance that has the primary function of drying clothes.
      - value: VENDINGMACHINE
        meaning: An appliance that stores and vends goods including food, drink, tickets, and goods of various types.
      - value: WASHINGMACHINE
        meaning: An appliance that has the primary function of washing clothes.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
