fields:
  - name: axis_tag
    type: text
    nullable: true
    meaning: The tag or name for this grid axis.
    source_ref: "IfcGridAxis attribute 1: OPTIONAL IfcLabel"
  - name: axis_curve
    type: ref
    meaning: Underlying curve which provides the geometry for this grid axis.
    source_ref: "IfcGridAxis attribute 2: IfcCurve"
    ref_to: ifc.curve
  - name: same_sense
    type: bool
    meaning: Defines whether the original sense of curve is used or whether it is reversed in the context of the grid axis.
    source_ref: "IfcGridAxis attribute 3: IfcBoolean"
