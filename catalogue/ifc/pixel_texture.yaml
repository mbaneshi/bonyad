code: ifc.pixel_texture
name: IfcPixelTexture
kind: object
base: ifc.surface_texture
fidelity: proxy
source:
  document: buildingSMART IFC4.3 EXPRESS schema (IFC4X3_RC4) with IFC4.3.x-development documentation
  section: IfcPixelTexture
  url: https://github.com/buildingSMART/IFC4.3.x-development/blob/2b8baa0a14d5ed1a9f99ef9443bdcb63a0cb0ab1/docs/schemas/resource/IfcPresentationAppearanceResource/Entities/IfcPixelTexture.md
  version: IFC4X3_RC4 (EXPRESS issue date 2021-07-22); repo commit 2b8baa0a14d5; exp sha256 9b7d0c3e187f
  accessed_on: 2026-10-23
  licence: "buildingSMART: CC BY-ND 4.0 (repo LICENSE.md); EXPRESS header allows translation with full attribution, consent needed for changes. See SOURCES.md"
meaning: An IfcPixelTexture provides a 2D image-based texture map as an explicit array of pixel values (list of Pixel binary attributes). In contrary to the IfcImageTexture the IfcPixelTexture holds a 2 dimensional list of pixel color (and opacity) directly, instead of referencing to an URL.
fields:
  - name: width
    type: int
    meaning: The number of pixels in width (S) direction.
    source_ref: "IfcPixelTexture attribute 1: IfcInteger"
  - name: height
    type: int
    meaning: The number of pixels in height (T) direction.
    source_ref: "IfcPixelTexture attribute 2: IfcInteger"
  - name: colour_components
    type: int
    meaning: Indication whether the pixel values contain a 1, 2, 3, or 4 colour component.
    source_ref: "IfcPixelTexture attribute 3: IfcInteger"
