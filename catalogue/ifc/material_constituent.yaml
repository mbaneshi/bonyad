code: ifc.material_constituent
name: IfcMaterialConstituent
kind: symbol
base: ifc.material_definition
fidelity: proxy
source:
  document: buildingSMART IFC4.3 EXPRESS schema (IFC4X3_RC4) with IFC4.3.x-development documentation
  section: IfcMaterialConstituent
  url: https://github.com/buildingSMART/IFC4.3.x-development/blob/2b8baa0a14d5ed1a9f99ef9443bdcb63a0cb0ab1/docs/schemas/resource/IfcMaterialResource/Entities/IfcMaterialConstituent.md
  version: IFC4X3_RC4 (EXPRESS issue date 2021-07-22); repo commit 2b8baa0a14d5; exp sha256 9b7d0c3e187f
  accessed_on: 2026-10-23
  licence: "buildingSMART: CC BY-ND 4.0 (repo LICENSE.md); EXPRESS header allows translation with full attribution, consent needed for changes. See SOURCES.md"
meaning: IfcMaterialConstituent is a single and identifiable part of an element which is constructed of a number of part (one or more) each having an individual material. The association of the material constituent to the part is provided by a keyword as value of the Name attribute.
fields:
  - name: name
    type: text
    nullable: true
    meaning: The name by which the material constituent is known.
    source_ref: "IfcMaterialConstituent attribute 1: OPTIONAL IfcLabel"
  - name: description
    type: text
    nullable: true
    meaning: Definition of the material constituent in descriptive terms.
    source_ref: "IfcMaterialConstituent attribute 2: OPTIONAL IfcText"
  - name: material
    type: ref
    meaning: Reference to the material from which the constituent is constructed.
    source_ref: "IfcMaterialConstituent attribute 3: IfcMaterial"
    ref_to: ifc.material
  - name: fraction
    type: ratio
    nullable: true
    meaning: Optional provision of a fraction of the total amount (volume or weight) that applies to the IfcMaterialConstituentSet that is contributed by this IfcMaterialConstituent.
    source_ref: "IfcMaterialConstituent attribute 4: OPTIONAL IfcNormalisedRatioMeasure"
    check: unit_interval
  - name: category
    type: text
    nullable: true
    meaning: Category of the material constituent, e.g. the role it has in the constituent set it belongs to.
    source_ref: "IfcMaterialConstituent attribute 5: OPTIONAL IfcLabel"
notes: "Inverse attributes not stored: ToMaterialConstituentSet."
