    values:
      - value: ADMINISTRATION
        meaning: Coordination of work.
      - value: CARPENTRY
        meaning: Rough carpentry including framing.
      - value: CLEANING
        meaning: Removal of dust and debris.
      - value: CONCRETE
        meaning: Concrete.
      - value: DRYWALL
        meaning: Gypsum wallboard placement and taping.
      - value: ELECTRIC
        meaning: Electrical fixtures, equipment, and cables.
      - value: FINISHING
        meaning: Finish carpentry including custom cabinetry.
      - value: FLOORING
        meaning: Flooring.
      - value: GENERAL
        meaning: General labour not requiring specific skill.
      - value: HVAC
        meaning: Heating and ventilation fixtures, equipment, and ducts.
      - value: LANDSCAPING
        meaning: Grass, plants, trees, or irrigation.
      - value: MASONRY
        meaning: Laying bricks or blocks with mortar.
      - value: PAINTING
        meaning: Applying decorative coatings or coverings.
      - value: PAVING
        meaning: Asphalt or concrete roads and walkways.
      - value: PLUMBING
        meaning: Plumbing fixtures, equipment, and pipes.
      - value: ROOFING
        meaning: Membranes, shingles, tile, or other roofing.
      - value: SITEGRADING
        meaning: Excavating, filling, or contouring earth.
      - value: STEELWORK
        meaning: Erecting and attaching steel elements.
      - value: SURVEYING
        meaning: Determining positions, distances, and angles.
      - value: USERDEFINED
        meaning: User-defined resource.
      - value: NOTDEFINED
        meaning: Undefined resource.
