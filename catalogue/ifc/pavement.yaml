    type: enum
    nullable: true
    meaning: Identifies the predefined type of a pavement element.
    source_ref: "IfcPavement attribute 1: OPTIONAL IfcPavementTypeEnum; enumeration IfcPavementTypeEnum"
    values:
      - value: FLEXIBLE
        meaning: Pavement with a bituminous surfacing and with a base layer with or without a hydrocarbon binder.
      - value: RIGID
