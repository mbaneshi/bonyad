meaning: The IfcBooleanResult is the result of applying a Boolean operation to two operands being solids.
fields:
  - name: operator
    type: enum
    meaning: The Boolean operator used in the operation to create the result.
    source_ref: "IfcBooleanResult attribute 1: IfcBooleanOperator; enumeration IfcBooleanOperator"
    values:
      - value: UNION
        meaning: The operation of constructing the regularized set theoretic union of the volumes defined by two solids.
      - value: INTERSECTION
        meaning: The operation of constructing the regularised set theoretic intersection of the volumes defined by two solids.
      - value: DIFFERENCE
        meaning: The regularised set theoretic difference between the volumes defined by two solids.
  - name: first_operand
    type: ref
    meaning: The first operand to be operated upon by the Boolean operation.
    source_ref: "IfcBooleanResult attribute 2: IfcBooleanOperand; via select IfcBooleanOperand"
    ref_to: ifc.geometric_representation_item
  - name: second_operand
    type: ref
    meaning: The second operand specified for the operation.
    source_ref: "IfcBooleanResult attribute 3: IfcBooleanOperand; via select IfcBooleanOperand"
    ref_to: ifc.geometric_representation_item
