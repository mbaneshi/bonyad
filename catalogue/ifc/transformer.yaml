meaning: A transformer is an inductive stationary device that transfers electrical energy from one circuit to another.
fields:
  - name: predefined_type
    type: enum
    nullable: true
    meaning: PredefinedType attribute of IfcTransformer (not described in the source documentation).
    source_ref: "IfcTransformer attribute 1: OPTIONAL IfcTransformerTypeEnum; enumeration IfcTransformerTypeEnum"
    values:
      - value: CURRENT
        meaning: A transformer that changes the current between circuits.
      - value: FREQUENCY
        meaning: A transformer that changes the frequency between circuits.
      - value: INVERTER
        meaning: A transformer that converts from direct current (DC) to alternating current (AC).
      - value: RECTIFIER
        meaning: A transformer that converts from alternating current (AC) to direct current (DC).
      - value: VOLTAGE
        meaning: A transformer that changes the voltage between circuits.
      - value: CHOPPER
        meaning: A chopper is an electronic power DC convertor without an intermediate AC link giving a variable output voltage by varying the periods of conduction and non-conduction in an adjustable ratio.
      - value: COMBINED
        meaning: A transformer that changes different quantities between circuits.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
