meaning: A door panel is normally a door leaf that opens to allow people or goods to pass.
fields:
  - name: panel_depth
    type: length
    nullable: true
    meaning: Depth of the door panel, measured perpendicular to the plane of the door leaf.
    source_ref: "IfcDoorPanelProperties attribute 1: OPTIONAL IfcPositiveLengthMeasure"
    check: positive
  - name: panel_operation
    type: enum
    meaning: The PanelOperation defines the way of operation of that panel.
    source_ref: "IfcDoorPanelProperties attribute 2: IfcDoorPanelOperationEnum; enumeration IfcDoorPanelOperationEnum"
    values:
      - value: SWINGING
        meaning: "Swinging: !."
      - value: DOUBLE_ACTING
        meaning: "Double acting: !."
      - value: SLIDING
        meaning: "Sliding: !."
      - value: FOLDING
        meaning: "Folding: !."
      - value: REVOLVING
        meaning: "Revolving: !."
      - value: ROLLINGUP
        meaning: "Rolling up: !."
      - value: FIXEDPANEL
        meaning: "Fixed panel: !."
      - value: USERDEFINED
        meaning: User defined.
      - value: NOTDEFINED
        meaning: Not defined.
  - name: panel_width
    type: ratio
    nullable: true
    meaning: Width of this panel, given as ratio relative to the total clear opening width of the door.
    source_ref: "IfcDoorPanelProperties attribute 3: OPTIONAL IfcNormalisedRatioMeasure"
    check: unit_interval
  - name: panel_position
    type: enum
    meaning: Position of this panel within the door.
    source_ref: "IfcDoorPanelProperties attribute 4: IfcDoorPanelPositionEnum; enumeration IfcDoorPanelPositionEnum"
    values:
      - value: LEFT
        meaning: Left.
      - value: MIDDLE
        meaning: Middle.
      - value: RIGHT
        meaning: Right.
      - value: NOTDEFINED
        meaning: Not defined.
  - name: shape_aspect_style
    type: ref
    nullable: true
    meaning: Pointer to the shape aspect, if given.
    source_ref: "IfcDoorPanelProperties attribute 5: OPTIONAL IfcShapeAspect"
    ref_to: ifc.shape_aspect
