code: ifc.map_conversion
name: IfcMapConversion
kind: object
base: ifc.coordinate_operation
fidelity: proxy
source:
  document: buildingSMART IFC4.3 EXPRESS schema (IFC4X3_RC4) with IFC4.3.x-development documentation
  section: IfcMapConversion
  url: https://github.com/buildingSMART/IFC4.3.x-development/blob/2b8baa0a14d5ed1a9f99ef9443bdcb63a0cb0ab1/docs/schemas/resource/IfcRepresentationResource/Entities/IfcMapConversion.md
  version: IFC4X3_RC4 (EXPRESS issue date 2021-07-22); repo commit 2b8baa0a14d5; exp sha256 9b7d0c3e187f
  accessed_on: 2026-10-23
  licence: "buildingSMART: CC BY-ND 4.0 (repo LICENSE.md); EXPRESS header allows translation with full attribution, consent needed for changes. See SOURCES.md"
meaning: The map conversion deals with transforming the local engineering coordinate system, often called world coordinate system, into the coordinate reference system of the underlying map.
fields:
  - name: eastings
    type: length
    meaning: Specifies the location along the easting of the coordinate system of the target map coordinate reference system.
    source_ref: "IfcMapConversion attribute 1: IfcLengthMeasure"
  - name: northings
    type: length
    meaning: Specifies the location along the northing of the coordinate system of the target map coordinate reference system.
    source_ref: "IfcMapConversion attribute 2: IfcLengthMeasure"
  - name: orthogonal_height
    type: length
    meaning: Orthogonal height relative to the vertical datum specified.
    source_ref: "IfcMapConversion attribute 3: IfcLengthMeasure"
  - name: x_axis_abscissa
    type: float
    nullable: true
    meaning: Specifies the value along the easting axis of the end point of a vector indicating the position of the local x axis of the engineering coordinate reference system.
    source_ref: "IfcMapConversion attribute 4: OPTIONAL IfcReal"
  - name: x_axis_ordinate
    type: float
    nullable: true
    meaning: Specifies the value along the northing axis of the end point of a vector indicating the position of the local x axis of the engineering coordinate reference system.
    source_ref: "IfcMapConversion attribute 5: OPTIONAL IfcReal"
  - name: scale
    type: float
    nullable: true
    meaning: Scale to be used, when the units of the CRS are not identical to the units of the engineering coordinate system.
    source_ref: "IfcMapConversion attribute 6: OPTIONAL IfcReal"
  - name: scale_y
    type: float
    nullable: true
    meaning: ScaleY attribute of IfcMapConversion (not described in the source documentation).
    source_ref: "IfcMapConversion attribute 7: OPTIONAL IfcReal"
  - name: scale_z
    type: float
    nullable: true
    meaning: ScaleZ attribute of IfcMapConversion (not described in the source documentation).
    source_ref: "IfcMapConversion attribute 8: OPTIONAL IfcReal"
