meaning: This abstract entity represents various kinds of postal and telecom addresses.
fields:
  - name: purpose
    type: enum
    nullable: true
    meaning: Identifies the logical location of the address.
    source_ref: "IfcAddress attribute 1: OPTIONAL IfcAddressTypeEnum; enumeration IfcAddressTypeEnum"
    values:
      - value: OFFICE
        meaning: An office address.
      - value: SITE
        meaning: A site address.
      - value: HOME
        meaning: A home address.
      - value: DISTRIBUTIONPOINT
        meaning: A postal distribution point address.
      - value: USERDEFINED
        meaning: A user defined address type to be provided.
  - name: description
    type: text
    nullable: true
    meaning: Text that relates the nature of the address.
    source_ref: "IfcAddress attribute 2: OPTIONAL IfcText"
  - name: user_defined_purpose
    type: text
    nullable: true
    meaning: Allows for specification of user specific purpose of the address beyond the enumeration values provided by Purpose attribute of type IfcAddressTypeEnum.
    source_ref: "IfcAddress attribute 3: OPTIONAL IfcLabel"
notes: "Inverse attributes not stored: OfPerson, OfOrganization. SUPERTYPE OF ONEOF ( IfcPostalAddress , IfcTelecomAddress )."
