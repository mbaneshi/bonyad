    meaning: Identifies the predefined types of a ramp flight element from which the type required may be set.
    source_ref: "IfcRampFlightType attribute 1: IfcRampFlightTypeEnum; enumeration IfcRampFlightTypeEnum"
    values:
      - value: STRAIGHT
        meaning: A ramp flight with a straight walking line.
      - value: SPIRAL
        meaning: A ramp flight with a circular or elliptic walking line.
      - value: USERDEFINED
        meaning: User-defined ramp flight.
      - value: NOTDEFINED
        meaning: Undefined ramp flight.
