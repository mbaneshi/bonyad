fields:
  - name: predefined_type
    type: enum
    meaning: Identifies the predefined types of fire suppression terminal from which the type required may be set.
    source_ref: "IfcFireSuppressionTerminalType attribute 1: IfcFireSuppressionTerminalTypeEnum; enumeration IfcFireSuppressionTerminalTypeEnum"
    values:
      - value: BREECHINGINLET
        meaning: Symmetrical pipe fitting that unites two or more inlets into a single pipe.
      - value: FIREHYDRANT
        meaning: Device, fitted to a pipe, through which a temporary supply of water may be provided.
      - value: HOSEREEL
        meaning: A supporting framework on which a hose may be wound.
      - value: SPRINKLER
        meaning: Device for sprinkling water from a pipe under pressure over an area.
      - value: SPRINKLERDEFLECTOR
        meaning: Device attached to a sprinkler to deflect the water flow into a spread pattern to cover the required area.
      - value: FIREMONITOR
        meaning: Fire monitor.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
