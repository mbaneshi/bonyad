meaning: "The element type IfcTrackElementType defines commonly shared information for occurrences of track elements. The set of shared information may include: * common properties within shared property sets * common material information * common profile definitions * common shape representations."
fields:
  - name: predefined_type
    type: enum
    meaning: PredefinedType attribute of IfcTrackElementType (not described in the source documentation).
    source_ref: "IfcTrackElementType attribute 1: IfcTrackElementTypeEnum; enumeration IfcTrackElementTypeEnum"
    values:
      - value: TRACKENDOFALIGNMENT
        meaning: A track end of alignment is a special functional installation such as axle-gauge changeover point or transporter wagon loading point.
      - value: BLOCKINGDEVICE
        meaning: A device composed of pneumatic, mechanic or electric components causing the braking of a train in case of emergency.
      - value: VEHICLESTOP
        meaning: A fixed installation at the end of the track which stops any vehicle movement (e.g., buffer stop, sand hump, etc.).
      - value: SLEEPER
        meaning: A sleeper is a track element that supports running rails, guard rails and check rails usually at right angles to its axis.
      - value: HALF_SET_OF_BLADES
        meaning: A half set of blades consists of one stock rail and its switch rail complete with small fittings.
      - value: SPEEDREGULATOR
        meaning: A device composed of pneumatic, mechanic or electric components causing the breaking of a train in case of emergency.
      - value: DERAILER
        meaning: A fixed device which, when placed on the rail, derails the wheels of a vehicle, and serves to protect a converging line.
      - value: FROG
        meaning: A frog is an arrangement ensuring the intersection of two opposite running edges of turnouts or diamond crossings and having one crossing vee and two wing rails.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
