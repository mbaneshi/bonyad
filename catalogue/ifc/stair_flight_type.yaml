meaning: The building element type IfcStairFlightType defines commonly shared information for occurrences of stair flights.
fields:
  - name: predefined_type
    type: enum
    meaning: Identifies the predefined types of a stair flight element from which the type required may be set.
    source_ref: "IfcStairFlightType attribute 1: IfcStairFlightTypeEnum; enumeration IfcStairFlightTypeEnum"
    values:
      - value: STRAIGHT
        meaning: A stair flight with a straight walking line.
      - value: WINDER
        meaning: A stair flight with a walking line including straight and curved sections.
      - value: SPIRAL
        meaning: A stair flight with a circular or elliptic walking line.
      - value: CURVED
        meaning: A stair flight with a curved walking line.
      - value: FREEFORM
        meaning: A stair flight with a free form walking line (and outer boundaries).
      - value: USERDEFINED
        meaning: User-defined stair flight.
      - value: NOTDEFINED
        meaning: Undefined stair flight.
