meaning: A spatial structure element is the generalization of all spatial elements that might be used to define a spatial structure. The spatial structure can be used to provide a spatial organization of a project.
fields:
  - name: composition_type
    type: enum
    nullable: true
    meaning: Denotes, whether the predefined spatial structure element represents itself, or an aggregate (complex) or a part (part).
    source_ref: "IfcSpatialStructureElement attribute 1: OPTIONAL IfcElementCompositionEnum; enumeration IfcElementCompositionEnum"
    values:
      - value: COMPLEX
        meaning: A group or aggregation of similar elements.
      - value: ELEMENT
        meaning: An (undivided) element itself.
      - value: PARTIAL
        meaning: A subelement or part.
notes: SUPERTYPE OF ONEOF ( IfcBuildingStorey , IfcFacility , IfcFacilityPart , IfcSite , IfcSpace ).
