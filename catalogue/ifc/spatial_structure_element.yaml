code: ifc.spatial_structure_element
name: IfcSpatialStructureElement
kind: abstract
base: ifc.spatial_element
fidelity: proxy
source:
  document: buildingSMART IFC4.3 EXPRESS schema (IFC4X3_RC4) with IFC4.3.x-development documentation
