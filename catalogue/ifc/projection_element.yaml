meaning: The projection element is a specialization of the general feature element to represent projections applied to building elements. It represents a solid attached to any element that has physical manifestation.
fields:
  - name: predefined_type
    type: enum
    nullable: true
    meaning: Predefined generic type for a projection element that is specified in an enumeration.
    source_ref: "IfcProjectionElement attribute 1: OPTIONAL IfcProjectionElementTypeEnum; enumeration IfcProjectionElementTypeEnum"
    values:
      - value: BLISTER
        meaning: Part of concrete where the anchor for pre-stressing tendon can be embedded.
      - value: DEVIATOR
        meaning: Part of concrete where re-direction of an external pre-stressed tendon can be embedded.
      - value: USERDEFINED
        meaning: User-defined projection element.
      - value: NOTDEFINED
        meaning: Undefined projection element.
