meaning: A request is the act or instance of asking for something, such as a request for information, bid submission, or performance of work.
fields:
  - name: predefined_type
    type: enum
    nullable: true
    meaning: Identifies the predefined type of sources through which a request can be made.
    source_ref: "IfcActionRequest attribute 1: OPTIONAL IfcActionRequestTypeEnum; enumeration IfcActionRequestTypeEnum"
    values:
      - value: EMAIL
        meaning: Request was made through email.
      - value: FAX
        meaning: Request was made through facsimile.
      - value: PHONE
        meaning: Request was made verbally over a telephone.
      - value: POST
        meaning: Request was made through postal mail.
      - value: VERBAL
        meaning: Request was made verbally in person.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
  - name: status
    type: text
    nullable: true
    meaning: The status currently assigned to the request.
    source_ref: "IfcActionRequest attribute 2: OPTIONAL IfcLabel"
  - name: long_description
    type: text
    nullable: true
    meaning: Detailed description of the permit.
    source_ref: "IfcActionRequest attribute 3: OPTIONAL IfcText"
