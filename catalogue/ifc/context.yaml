meaning: IfcContext is the generalization of a project context in which objects, type objects, property sets, and properties are defined. The IfcProject as subtype of IfcContext provides the context for all information on a construction project, it may include one or several _IfcProjectLibrary_'s as subtype of IfcContext to register the included libraries for the …
