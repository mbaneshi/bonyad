    type: length
    meaning: Flange length, see illustration above (= b).
    source_ref: "IfcZShapeProfileDef attribute 2: IfcPositiveLengthMeasure"
    check: positive
  - name: web_thickness
    type: length
    meaning: Constant wall thickness of web, see illustration above (= ts).
    source_ref: "IfcZShapeProfileDef attribute 3: IfcPositiveLengthMeasure"
    check: positive
  - name: flange_thickness
