meaning: A mechanical fasteners connecting building elements or parts mechanically. A single instance of this class may represent one or many of actual mechanical fasteners, for example an array of bolts or a row of nails.
fields:
  - name: nominal_diameter
    type: length
    nullable: true
    meaning: The nominal diameter describing the cross-section size of the fastener type.
    source_ref: "IfcMechanicalFastener attribute 1: OPTIONAL IfcPositiveLengthMeasure"
    check: positive
  - name: nominal_length
    type: length
    nullable: true
    meaning: The nominal length describing the longitudinal dimensions of the fastener type.
    source_ref: "IfcMechanicalFastener attribute 2: OPTIONAL IfcPositiveLengthMeasure"
    check: positive
  - name: predefined_type
    type: enum
    nullable: true
    meaning: Subtype of mechanical fastener.
    source_ref: "IfcMechanicalFastener attribute 3: OPTIONAL IfcMechanicalFastenerTypeEnum; enumeration IfcMechanicalFastenerTypeEnum"
    values:
      - value: ANCHORBOLT
        meaning: A special bolt which is anchored into concrete, stone, or brickwork.
      - value: BOLT
        meaning: A threaded cylindrical rod that engages with a similarly threaded hole in a nut or any other part to form a fastener.
      - value: DOWEL
        meaning: A cylindrical rod that is driven into holes of the connected pieces.
      - value: NAIL
        meaning: A thin pointed piece of metal that is hammered into materials as a fastener.
      - value: NAILPLATE
        meaning: A piece of sheet metal with punched points that overlaps the connected pieces and is pressed into their material.
      - value: RIVET
        meaning: A fastening part having a head at one end and the other end being hammered flat after being passed through holes in the pieces that are fastened together.
      - value: SCREW
        meaning: A fastener with a tapered threaded shank and a slotted head.
      - value: SHEARCONNECTOR
        meaning: A ring connector that is accepted by ring keyways in the connected pieces; or a toothed circular or square connector that is pressed into the connected pieces.
      - value: STAPLE
        meaning: A doubly pointed piece of metal that is hammered into materials as a fastener.
      - value: STUDSHEARCONNECTOR
        meaning: Stud shear connectors are cylindrical fastening parts with a head on one side.
      - value: COUPLER
        meaning: A part connecting two rod or bars, such as reinforcement bars.
      - value: RAILJOINT
        meaning: A mechanical assembly with e.g. fishplates to join two rail ends with optional functions (insulation or expansion capacity).
      - value: RAILFASTENING
        meaning: An assembly of components which secures a rail to the supporting structure and retains it in the required position whilst permitting any necessary vertical, lateral and longitudinal movement.
      - value: CHAIN
        meaning: A series of linked metal rings used for fastening or securing something, or for pulling loads.
      - value: ROPE
        meaning: A length of thick strong cord made by twisting together strands of hemp, sisal, nylon, or similar material. used primarily for mooring vessels.
      - value: USERDEFINED
        meaning: User-defined mechanical fastener.
      - value: NOTDEFINED
        meaning: Undefined mechanical fastener.
