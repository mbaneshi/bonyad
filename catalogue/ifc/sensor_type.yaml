code: ifc.sensor_type
name: IfcSensorType
kind: symbol
base: ifc.distribution_control_element_type
fidelity: proxy
source:
  document: buildingSMART IFC4.3 EXPRESS schema (IFC4X3_RC4) with IFC4.3.x-development documentation
