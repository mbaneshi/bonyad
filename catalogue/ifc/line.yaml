meaning: The IfcLine is an unbounded line parameterized by an IfcCartesianPoint and an IfcVector. The magnitude of the IfcVector affects the parameterization of the line, but it does not bound the line.
fields:
  - name: pnt
    type: ref
    meaning: The location of the IfcLine.
    source_ref: "IfcLine attribute 1: IfcCartesianPoint"
    ref_to: ifc.cartesian_point
  - name: dir
    type: ref
    meaning: The direction of the IfcLine, the magnitude and units of Dir affect the parameterization of the line.
    source_ref: "IfcLine attribute 2: IfcVector"
    ref_to: ifc.vector
