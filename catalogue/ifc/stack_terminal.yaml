meaning: A stack terminal is placed at the top of a ventilating stack (such as to prevent ingress by birds or rainwater) or rainwater pipe (to act as a collector or hopper for discharge from guttering).
fields:
  - name: predefined_type
    type: enum
    nullable: true
    meaning: PredefinedType attribute of IfcStackTerminal (not described in the source documentation).
    source_ref: "IfcStackTerminal attribute 1: OPTIONAL IfcStackTerminalTypeEnum; enumeration IfcStackTerminalTypeEnum"
    values:
      - value: BIRDCAGE
        meaning: Guard cage, typically wire mesh, at the top of the stack preventing access by birds.
      - value: COWL
        meaning: A cowling placed at the top of a stack to eliminate downdraft.
      - value: RAINWATERHOPPER
        meaning: A box placed at the top of a rainwater downpipe to catch rainwater from guttering.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
