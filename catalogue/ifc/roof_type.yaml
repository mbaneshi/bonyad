meaning: The building element type IfcRoofType defines commonly shared information for occurrences of roofs.
fields:
  - name: predefined_type
    type: enum
    meaning: Identifies the predefined types of a roof element from which the type required may be set.
    source_ref: "IfcRoofType attribute 1: IfcRoofTypeEnum; enumeration IfcRoofTypeEnum"
    values:
      - value: FLAT_ROOF
        meaning: A roof having no slope, or one with only a slight pitch so as to drain rainwater.
      - value: SHED_ROOF
        meaning: A roof having a single slope.
      - value: GABLE_ROOF
        meaning: A roof sloping downward in two parts from a central ridge, so as to form a gable at each end.
      - value: HIP_ROOF
        meaning: A roof having sloping ends and sides meeting at an inclined projecting angle.
      - value: HIPPED_GABLE_ROOF
        meaning: A roof having a hipped end truncating a gable.
      - value: GAMBREL_ROOF
        meaning: A roof sloping downward in two parts from a central ridge, so as to form a gable at each end.
      - value: MANSARD_ROOF
        meaning: A roof having on each side a steeper lower part and a shallower upper part.
      - value: BARREL_ROOF
        meaning: A roof or ceiling having a semicylindrical form.
      - value: RAINBOW_ROOF
        meaning: A gable roof in the form of a broad Gothic arch, with gently sloping convex surfaces.
      - value: BUTTERFLY_ROOF
        meaning: A roof having two slopes, each descending inward from the eaves.
      - value: PAVILION_ROOF
        meaning: A pyramidal hip roof.
      - value: DOME_ROOF
        meaning: A hemispherical hip roof.
      - value: FREEFORM
        meaning: Free form roof.
      - value: USERDEFINED
        meaning: No specification given.
      - value: NOTDEFINED
        meaning: No specification given.
