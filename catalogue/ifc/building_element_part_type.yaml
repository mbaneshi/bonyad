meaning: The building element part type defines lists of commonly shared property set definitions and representation maps of parts of a building element.
fields:
  - name: predefined_type
    type: enum
    meaning: Subtype of building element part.
    source_ref: "IfcBuildingElementPartType attribute 1: IfcBuildingElementPartTypeEnum; enumeration IfcBuildingElementPartTypeEnum"
    values:
      - value: INSULATION
        meaning: The part provides thermal insulation, for example as insulation layer between wall panels in sandwich walls or as infill in stud walls.
      - value: PRECASTPANEL
        meaning: The part is a precast panel, usually as an internal or external layer in a sandwich wall panel.
      - value: APRON
        meaning: A form of scour protection consisting of timber, concrete, riprap, paving, or other construction placed adjacent to abutments and piers to prevent undermining.
      - value: ARMOURUNIT
        meaning: A large quarry stone or concrete shaped unit used as erosion prevention on slopes such as revetments and breakwaters.
      - value: SAFETYCAGE
        meaning: Safety cages are an assembly of circular and vertical bars that are fastened to the stiles of fixed ladders and are arranged to enclose the path of a worker when climbing the ladder.
      - value: USERDEFINED
        meaning: User-defined accessory.
      - value: NOTDEFINED
        meaning: Undefined accessory.
