meaning: The flow controller type IfcAirTerminalBoxType defines commonly shared information for occurrences of air terminal boxes.
fields:
  - name: predefined_type
    type: enum
    meaning: The air terminal box type.
    source_ref: "IfcAirTerminalBoxType attribute 1: IfcAirTerminalBoxTypeEnum; enumeration IfcAirTerminalBoxTypeEnum"
    values:
      - value: CONSTANTFLOW
        meaning: Terminal box does not include a means to reset the volume automatically to an outside signal such as thermostat.
      - value: VARIABLEFLOWPRESSUREDEPENDANT
        meaning: "Terminal box includes a means to reset the volume automatically to a different control point in response to an outside signal such as thermostat: air-flow rate depends on supply pressure."
      - value: VARIABLEFLOWPRESSUREINDEPENDANT
        meaning: "Terminal box includes a means to reset the volume automatically to a different control point in response to an outside signal such as thermostat: air-flow rate is independent of supply pressure."
      - value: USERDEFINED
        meaning: User-defined terminal box.
      - value: NOTDEFINED
        meaning: Undefined terminal box.
