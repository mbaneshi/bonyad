meaning: The objectified relationship IfcRelAssignsToGroupByFactor is a specialization of the general grouping mechanism. It allows to add a factor to define the ratio that applies to the assignment of object definitions (individual object occurrences as subtypes of IfcObject and object types as subtypes of IfcTypeObject) to a group (subtypes of IfcGroup).
fields:
  - name: factor
    type: ratio
    meaning: Factor provided as a ratio measure that identifies the fraction or weighted factor that applies to the group assignment.
    source_ref: "IfcRelAssignsToGroupByFactor attribute 1: IfcRatioMeasure"
