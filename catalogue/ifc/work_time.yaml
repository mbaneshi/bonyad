meaning: IfcWorkTime defines time periods that are used by IfcWorkCalendar for either describing working times or non-working exception times. Besides start and finish dates, a set of time periods can be given by various types of recurrence patterns.
fields:
  - name: recurrence_pattern
    type: ref
    nullable: true
    meaning: Recurrence pattern that defines a time period, which, if given, is valid within the time period defined by _IfcWorkTime.Start_ and _IfcWorkTime.Finish_.
    source_ref: "IfcWorkTime attribute 1: OPTIONAL IfcRecurrencePattern"
    ref_to: ifc.recurrence_pattern
  - name: start
    type: date
    nullable: true
    meaning: Start date of the work time (0:00), that might be further restricted by a recurrence pattern.
    source_ref: "IfcWorkTime attribute 2: OPTIONAL IfcDate"
  - name: finish
    type: date
    nullable: true
    meaning: End date of the work time (24:00), that might be further restricted by a recurrence pattern.
    source_ref: "IfcWorkTime attribute 3: OPTIONAL IfcDate"
