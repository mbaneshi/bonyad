meaning: IfcConstructionEquipmentResource is usage of construction equipment to assist in the performance of construction. Construction Equipment resources are wholly or partially consumed or occupied in the performance of construction.
fields:
  - name: predefined_type
    type: enum
    nullable: true
    meaning: Defines types of construction equipment resources.
    source_ref: "IfcConstructionEquipmentResource attribute 1: OPTIONAL IfcConstructionEquipmentResourceTypeEnum; enumeration IfcConstructionEquipmentResourceTypeEnum"
    values:
      - value: DEMOLISHING
        meaning: Removal or destruction of building elements.
      - value: EARTHMOVING
        meaning: Excavating, filling, or contouring earth.
      - value: ERECTING
        meaning: Lifting, positioning, and placing elements.
      - value: HEATING
        meaning: Temporary heat to support construction.
      - value: LIGHTING
        meaning: Temporary lighting to support construction.
      - value: PAVING
        meaning: Roads or walkways such as asphalt or concrete.
      - value: PUMPING
        meaning: Installing materials through pumps.
      - value: TRANSPORTING
        meaning: Transporting products or materials.
      - value: USERDEFINED
        meaning: User-defined resource.
      - value: NOTDEFINED
        meaning: Undefined resource.
