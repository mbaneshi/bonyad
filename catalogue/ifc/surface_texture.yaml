code: ifc.surface_texture
name: IfcSurfaceTexture
kind: abstract
base: ifc.presentation_item
fidelity: proxy
source:
  document: buildingSMART IFC4.3 EXPRESS schema (IFC4X3_RC4) with IFC4.3.x-development documentation
  section: IfcSurfaceTexture
  url: https://github.com/buildingSMART/IFC4.3.x-development/blob/2b8baa0a14d5ed1a9f99ef9443bdcb63a0cb0ab1/docs/schemas/resource/IfcPresentationAppearanceResource/Entities/IfcSurfaceTexture.md
  version: IFC4X3_RC4 (EXPRESS issue date 2021-07-22); repo commit 2b8baa0a14d5; exp sha256 9b7d0c3e187f
  accessed_on: 2026-10-23
  licence: "buildingSMART: CC BY-ND 4.0 (repo LICENSE.md); EXPRESS header allows translation with full attribution, consent needed for changes. See SOURCES.md"
meaning: An IfcSurfaceTexture provides a 2-dimensional image-based texture map. It can either be given by referencing an external image file through an URL reference (IfcImageTexture), including the image file as a blob (long binary) into the data set (IfcBlobTexture), or by explicitly including an array of pixels (IfcPixelTexture).
fields:
  - name: repeat_s
    type: bool
    meaning: The RepeatS field specifies how the texture wraps in the S direction.
    source_ref: "IfcSurfaceTexture attribute 1: IfcBoolean"
  - name: repeat_t
    type: bool
    meaning: The RepeatT field specifies how the texture wraps in the T direction.
    source_ref: "IfcSurfaceTexture attribute 2: IfcBoolean"
  - name: mode
    type: text
    nullable: true
    meaning: "Mode shall hold the type of map this corresponds to, chosen from the following list: AMBIENT, NORMAL, EMISSIVE, METALLICROUGHNESS, OCCLUSION, SHININESS, SPECULAR, DIFFUSE."
    source_ref: "IfcSurfaceTexture attribute 3: OPTIONAL IfcIdentifier"
  - name: texture_transform
    type: ref
    nullable: true
    meaning: The TextureTransform defines a 2D transformation that is applied to the texture coordinates.
    source_ref: "IfcSurfaceTexture attribute 4: OPTIONAL IfcCartesianTransformationOperator2D"
    ref_to: ifc.cartesian_transformation_operator2d
  - name: parameter
    type: array
    nullable: true
    meaning: Parameter attribute of IfcSurfaceTexture (not described in the source documentation).
    source_ref: "IfcSurfaceTexture attribute 5: OPTIONAL LIST [1:?] OF IfcIdentifier"
    of: text
notes: "Inverse attributes not stored: IsMappedBy, UsedInStyles. SUPERTYPE OF ONEOF ( IfcBlobTexture , IfcImageTexture , IfcPixelTexture )."
