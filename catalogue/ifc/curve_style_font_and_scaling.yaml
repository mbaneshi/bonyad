meaning: The IfcCurveStyleFontAndScaling allows for the reuse of the same curve style definition in several sizes. The definition of the CurveFontScale is the scaling of a base curve style pattern to be used as a new or derived curve style pattern.
fields:
  - name: name
    type: text
    nullable: true
    meaning: Name that may be assigned with the scaling of a curve font.
    source_ref: "IfcCurveStyleFontAndScaling attribute 1: OPTIONAL IfcLabel"
  - name: curve_font
    type: ref
    meaning: The curve font to be scaled.
    source_ref: "IfcCurveStyleFontAndScaling attribute 2: IfcCurveStyleFontSelect; via select IfcCurveStyleFontSelect"
    ref_to: ifc.presentation_item
  - name: curve_font_scaling
    type: ratio
    meaning: The scale factor.
    source_ref: "IfcCurveStyleFontAndScaling attribute 3: IfcPositiveRatioMeasure"
    check: positive
