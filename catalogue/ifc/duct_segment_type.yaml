    source_ref: "IfcDuctSegmentType attribute 1: IfcDuctSegmentTypeEnum; enumeration IfcDuctSegmentTypeEnum"
    values:
      - value: RIGIDSEGMENT
        meaning: A rigid segment is a continuous linear segment of duct that cannot be deformed.
      - value: FLEXIBLESEGMENT
