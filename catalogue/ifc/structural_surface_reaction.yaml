meaning: This entity defines a reaction which occurs distributed over a surface. A surface reaction may be connected with a surface member or surface connection.
fields:
  - name: predefined_type
    type: enum
    meaning: Type of reaction according to its distribution of load values.
    source_ref: "IfcStructuralSurfaceReaction attribute 1: IfcStructuralSurfaceActivityTypeEnum; enumeration IfcStructuralSurfaceActivityTypeEnum"
    values:
      - value: CONST
        meaning: The load has a constant value over its entire extent.
      - value: BILINEAR
        meaning: The load value is bilinearly distributed over the load's extent.
      - value: DISCRETE
        meaning: The load is specified as a series of discrete load points.
      - value: ISOCONTOUR
        meaning: The load is specified by a series of iso-curves (level sets), i.e. curves at which the load value is constant.
      - value: USERDEFINED
        meaning: The load distribution is user-defined.
      - value: NOTDEFINED
        meaning: The load distribution is undefined.
