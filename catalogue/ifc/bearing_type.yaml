meaning: Types of building elements that are usually used to transmit loads from superstructure to substructure, and usually allowing movement (displacement or rotation) in one or more degrees of freedom.
fields:
  - name: predefined_type
    type: enum
    meaning: Identifies the predefined types of a bearing element from which the type required may be set.
    source_ref: "IfcBearingType attribute 1: IfcBearingTypeEnum; enumeration IfcBearingTypeEnum"
    values:
      - value: CYLINDRICAL
        meaning: The bearing functionality is provided by cylinder in a concave cylinder.
      - value: SPHERICAL
        meaning: The bearing functionality is provided by convex dome in a concave basin.
      - value: ELASTOMERIC
        meaning: A pad bearing which carries vertical load by contact stresses between a sheet of sliding material and a mating surface that permits movements by sliding and accommodates rotation by deformation of the elastomer.
      - value: POT
        meaning: A bearing which carries vertical load by compression of an (elastomeric) disc confined in a (steel) cylinder and which accommodates rotations by deformations of the disc.
      - value: GUIDE
        meaning: A bearing that ensures that the structure maintains the correct location or expansion/contraction path and takes no vertical load.
      - value: ROCKER
        meaning: The bearing functionality is provided by a rocker construction.
      - value: ROLLER
        meaning: The bearing functionality is provided by one or more rollers that are placed between two plates.
      - value: DISK
        meaning: A disk bearing consist of an elastomeric disc between two metal plates.
      - value: USERDEFINED
        meaning: User-defined bearing element.
      - value: NOTDEFINED
        meaning: Undefined bearing element.
