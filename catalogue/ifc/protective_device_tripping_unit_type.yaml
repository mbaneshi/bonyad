meaning: The distribution control element type IfcProtectiveDeviceTrippingUnitType defines commonly shared information for occurrences of protective device tripping units.
fields:
  - name: predefined_type
    type: enum
    meaning: Identifies the predefined types of protective device tripping unit types from which the type required may be set.
    source_ref: "IfcProtectiveDeviceTrippingUnitType attribute 1: IfcProtectiveDeviceTrippingUnitTypeEnum; enumeration IfcProtectiveDeviceTrippingUnitTypeEnum"
    values:
      - value: ELECTRONIC
        meaning: A tripping unit activated by electronic action.
      - value: ELECTROMAGNETIC
        meaning: A tripping unit activated by electromagnetic action.
      - value: RESIDUALCURRENT
        meaning: A tripping unit activated by residual current detection.
      - value: THERMAL
        meaning: A tripping unit activated by thermal action.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
