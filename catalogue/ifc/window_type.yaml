meaning: The element type IfcWindowType defines commonly shared information for occurrences of windows.
fields:
  - name: predefined_type
    type: enum
    meaning: Identifies the predefined types of a window element from which the type required may be set.
    source_ref: "IfcWindowType attribute 1: IfcWindowTypeEnum; enumeration IfcWindowTypeEnum"
    values:
      - value: WINDOW
        meaning: A standard window usually within a wall opening, as a window panel in a curtain wall, or as a "free standing" window.
      - value: SKYLIGHT
        meaning: A window within a sloped building element, usually a roof slab.
      - value: LIGHTDOME
        meaning: A special window that lies horizontally in a roof slab opening.
      - value: USERDEFINED
        meaning: User-defined window element.
      - value: NOTDEFINED
        meaning: Undefined window element.
  - name: partitioning_type
    type: enum
    meaning: Type defining the general layout of the window type in terms of the partitioning of panels.
    source_ref: "IfcWindowType attribute 2: IfcWindowTypePartitioningEnum; enumeration IfcWindowTypePartitioningEnum"
    values:
      - value: SINGLE_PANEL
        meaning: Window with one panel.
      - value: DOUBLE_PANEL_VERTICAL
        meaning: Window with two panels.
      - value: DOUBLE_PANEL_HORIZONTAL
        meaning: Window with two panels.
      - value: TRIPLE_PANEL_VERTICAL
        meaning: Window with three panels.
      - value: TRIPLE_PANEL_BOTTOM
        meaning: Window with three panels.
      - value: TRIPLE_PANEL_TOP
        meaning: Window with three panels.
      - value: TRIPLE_PANEL_LEFT
        meaning: Window with three panels.
      - value: TRIPLE_PANEL_RIGHT
        meaning: Window with three panels.
      - value: TRIPLE_PANEL_HORIZONTAL
        meaning: Window with three panels.
      - value: USERDEFINED
        meaning: User defined operation type.
      - value: NOTDEFINED
        meaning: NOTDEFINED (no description for this literal in the source documentation)
  - name: parameter_takes_precedence
    type: bool
    nullable: true
    meaning: The Boolean value reflects, whether the parameter given in the attached lining and panel properties exactly define the geometry (TRUE), or whether the attached style shape take precedence (FALSE).
    source_ref: "IfcWindowType attribute 3: OPTIONAL IfcBoolean"
  - name: user_defined_partitioning_type
    type: text
    nullable: true
    meaning: Designator for the user defined partitioning type, shall only be provided, if the value of PartitioningType is set to USERDEFINED.
    source_ref: "IfcWindowType attribute 4: OPTIONAL IfcLabel"
