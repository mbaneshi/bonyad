meaning: The energy conversion device type IfcElectricMotorType defines commonly shared information for occurrences of electric motors.
fields:
  - name: predefined_type
    type: enum
    meaning: Identifies the predefined types of electric motor from which the type required may be set.
    source_ref: "IfcElectricMotorType attribute 1: IfcElectricMotorTypeEnum; enumeration IfcElectricMotorTypeEnum"
    values:
      - value: DC
        meaning: A motor using either generated or rectified Direct Current (DC) power.
      - value: INDUCTION
        meaning: An alternating current motor in which the primary winding on one member (usually the stator) is connected to the power source and a secondary winding or a squirrel-cage secondary winding on the other member (usually the …
      - value: POLYPHASE
        meaning: A two or three-phase induction motor in which the windings, one for each phase, are evenly divided by the same number of electrical degrees.
      - value: RELUCTANCESYNCHRONOUS
        meaning: A synchronous motor with a special rotor design which directly lines the rotor up with the rotating magnetic field of the stator, allowing for no slip under load.
      - value: SYNCHRONOUS
        meaning: A motor that operates at a constant speed up to full load.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
