meaning: The distribution flow element type IfcDistributionChamberElementType defines commonly shared information for occurrences of distribution chamber elements.
fields:
  - name: predefined_type
    type: enum
    meaning: Predefined types of distribution chambers.
    source_ref: "IfcDistributionChamberElementType attribute 1: IfcDistributionChamberElementTypeEnum; enumeration IfcDistributionChamberElementTypeEnum"
    values:
      - value: FORMEDDUCT
        meaning: Space formed in the ground for the passage of pipes, cables, ducts.
      - value: INSPECTIONCHAMBER
        meaning: Chamber constructed on a drain, sewer or pipeline with a removable cover that permits visible inspection.
      - value: INSPECTIONPIT
        meaning: Recess or chamber formed to permit access for inspection of substructure and services.
      - value: MANHOLE
        meaning: Chamber constructed on a drain, sewer or pipeline with a removable cover that permits the entry of a person.
      - value: METERCHAMBER
        meaning: Chamber that houses a meter(s).
      - value: SUMP
        meaning: Recessed or small chamber into which liquid is drained to facilitate its collection for removal.
      - value: TRENCH
        meaning: Excavated chamber, the length of which typically exceeds the width.
      - value: VALVECHAMBER
        meaning: Chamber that houses a valve(s).
      - value: USERDEFINED
        meaning: User-defined chamber type.
      - value: NOTDEFINED
        meaning: Undefined chamber type.
