meaning: The energy conversion device type IfcCondenserType defines commonly shared information for occurrences of condensers.
fields:
  - name: predefined_type
    type: enum
    meaning: Defines the type of condenser.
    source_ref: "IfcCondenserType attribute 1: IfcCondenserTypeEnum; enumeration IfcCondenserTypeEnum"
    values:
      - value: AIRCOOLED
        meaning: A condenser in which heat is transferred to an air-stream.
      - value: EVAPORATIVECOOLED
        meaning: A condenser that is cooled evaporatively.
      - value: WATERCOOLED
        meaning: Water-cooled condenser with unspecified operation.
      - value: WATERCOOLEDBRAZEDPLATE
        meaning: Water-cooled condenser with plates brazed together to form an assembly of separate channels.
      - value: WATERCOOLEDSHELLCOIL
        meaning: Water-cooled condenser with cooling water circulated through one or more continuous or assembled coils contained within the shell.
      - value: WATERCOOLEDSHELLTUBE
        meaning: Water-cooled condenser with cooling water circulated through one or more tubes contained within the shell.
      - value: WATERCOOLEDTUBEINTUBE
        meaning: Water-cooled condenser consisting of one or more assemblies of two tubes, one within the other.
      - value: USERDEFINED
        meaning: User-defined condenser type.
      - value: NOTDEFINED
        meaning: Undefined condenser type.
