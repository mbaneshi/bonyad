meaning: An IfcSweptSurface is a surface defined by sweeping a curve. The swept surface is defined by a open or closed curve, represented by a subtype if IfcProfileDef, that is provided as a two-dimensional curve on an implicit plane, and by the sweeping operation.
fields:
  - name: swept_curve
    type: ref
    meaning: The curve to be swept in defining the surface.
    source_ref: "IfcSweptSurface attribute 1: IfcProfileDef"
    ref_to: ifc.profile_def
  - name: position
    type: ref
    nullable: true
    meaning: Position coordinate system for the swept surface, provided by a profile definition within the XY plane of the Position coordinates.
    source_ref: "IfcSweptSurface attribute 2: OPTIONAL IfcAxis2Placement3D"
    ref_to: ifc.axis2_placement3d
notes: SUPERTYPE OF ONEOF ( IfcSurfaceOfLinearExtrusion , IfcSurfaceOfRevolution ).
