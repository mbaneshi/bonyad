meaning: IfcSurfaceStyle is an assignment of one or many surface style elements to a surface, defined by subtypes of IfcSurface, IfcFaceBasedSurfaceModel, IfcShellBasedSurfaceModel, or by subtypes of IfcSolidModel. The positive direction of the surface normal relates to the positive side.
fields:
  - name: side
    type: enum
    meaning: An indication of which side of the surface to apply the style.
    source_ref: "IfcSurfaceStyle attribute 1: IfcSurfaceSide; enumeration IfcSurfaceSide"
    values:
      - value: POSITIVE
        meaning: The side of a surface which is in the same direction as the surface normal derived from the mathematical definition.
      - value: NEGATIVE
        meaning: The side of a surface which is in the opposite direction than the surface normal derived from the mathematical definition.
      - value: BOTH
        meaning: Both, positive and negative side.
