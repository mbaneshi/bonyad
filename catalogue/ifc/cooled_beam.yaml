meaning: A cooled beam (or chilled beam) is a device typically used to cool air by circulating a fluid such as chilled water through exposed finned tubes above a space. Typically mounted overhead near or within a ceiling, the cooled beam uses convection to cool the space below it by acting as a heat sink for the naturally rising warm air of the space.
fields:
  - name: predefined_type
    type: enum
    nullable: true
    meaning: PredefinedType attribute of IfcCooledBeam (not described in the source documentation).
    source_ref: "IfcCooledBeam attribute 1: OPTIONAL IfcCooledBeamTypeEnum; enumeration IfcCooledBeamTypeEnum"
    values:
      - value: ACTIVE
        meaning: An active or ventilated cooled beam provides cooling (and heating) but can also function as an air terminal in a ventilation system.
      - value: PASSIVE
        meaning: A passive or static cooled beam provides cooling (and heating) to a room or zone.
      - value: USERDEFINED
        meaning: User-defined cooled beam type.
      - value: NOTDEFINED
        meaning: Undefined cooled beam type.
