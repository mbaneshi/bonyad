meaning: An IfcBeam is typically a horizontal, or nearly horizontal, structural member that is capable of withstanding load primarily by resisting bending. It may also represent such a member from an architectural point of view.
fields:
  - name: predefined_type
    type: enum
    nullable: true
    meaning: Predefined generic type for a beam that is specified in an enumeration.
    source_ref: "IfcBeam attribute 1: OPTIONAL IfcBeamTypeEnum; enumeration IfcBeamTypeEnum"
    values:
      - value: BEAM
        meaning: A standard beam usually used horizontally.
      - value: JOIST
        meaning: A beam used to support a floor or ceiling.
      - value: HOLLOWCORE
        meaning: A wide often prestressed beam with a hollow-core profile that usually serves as a slab component.
      - value: LINTEL
        meaning: A beam or horizontal piece of material over an opening (e.g. door, window).
      - value: SPANDREL
        meaning: A tall beam placed on the facade of a building.
      - value: T_BEAM
        meaning: A beam that forms part of a slab construction and acts together with the slab which it carries.
      - value: GIRDER_SEGMENT
        meaning: A segment of a girder (e.g. each span of a continuous girder).
      - value: DIAPHRAGM
        meaning: End portion of a girder transmitting loads to supports and providing moment resistance to adjoining segment.
      - value: PIERCAP
        meaning: A transversal beam on top of a pier (on a single column or extending from one column of a pier to another column of the same pier).
      - value: HATSTONE
        meaning: A beam on top of a retaining wall or a wing wall, preventing earth movement.
      - value: CORNICE
        meaning: A non-loadbearing beam on the longitudinal edge of bridge slab, usually encasing installations.
      - value: EDGEBEAM
        meaning: A beam on the longitudinal edge of bridge slab, usually concrete, providing additional stiffening and protection from the elements.
      - value: USERDEFINED
        meaning: User-defined linear beam element.
      - value: NOTDEFINED
        meaning: Undefined linear beam element.
notes: SUPERTYPE OF ONEOF ( IfcBeamStandardCase ).
