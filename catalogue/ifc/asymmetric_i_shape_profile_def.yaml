meaning: IfcAsymmetricIShapeProfileDef defines a section profile that provides the defining parameters of a singly symmetric I-shaped section. Its parameters and orientation relative to the position coordinate system are according to the following illustration.
fields:
  - name: bottom_flange_width
    type: length
    meaning: Extent of the bottom flange, defined parallel to the x axis of the position coordinate system.
    source_ref: "IfcAsymmetricIShapeProfileDef attribute 1: IfcPositiveLengthMeasure"
    check: positive
  - name: overall_depth
    type: length
    meaning: Total extent of the depth, defined parallel to the y axis of the position coordinate system.
    source_ref: "IfcAsymmetricIShapeProfileDef attribute 2: IfcPositiveLengthMeasure"
    check: positive
  - name: web_thickness
    type: length
    meaning: Thickness of the web of the I-shape.
    source_ref: "IfcAsymmetricIShapeProfileDef attribute 3: IfcPositiveLengthMeasure"
    check: positive
  - name: bottom_flange_thickness
    type: length
    meaning: Flange thickness of the bottom flange.
    source_ref: "IfcAsymmetricIShapeProfileDef attribute 4: IfcPositiveLengthMeasure"
    check: positive
  - name: bottom_flange_fillet_radius
    type: length
    nullable: true
    meaning: The fillet between the web and the bottom flange. 0 if sharp-edged, omitted if unknown.
    source_ref: "IfcAsymmetricIShapeProfileDef attribute 5: OPTIONAL IfcNonNegativeLengthMeasure"
    check: non_negative
  - name: top_flange_width
    type: length
    meaning: Extent of the top flange, defined parallel to the x axis of the position coordinate system.
    source_ref: "IfcAsymmetricIShapeProfileDef attribute 6: IfcPositiveLengthMeasure"
    check: positive
  - name: top_flange_thickness
    type: length
    nullable: true
    meaning: Flange thickness of the top flange.
    source_ref: "IfcAsymmetricIShapeProfileDef attribute 7: OPTIONAL IfcPositiveLengthMeasure"
    check: positive
  - name: top_flange_fillet_radius
    type: length
    nullable: true
    meaning: The fillet between the web and the top flange. 0 if sharp-edged, omitted if unknown.
    source_ref: "IfcAsymmetricIShapeProfileDef attribute 8: OPTIONAL IfcNonNegativeLengthMeasure"
    check: non_negative
  - name: bottom_flange_edge_radius
    type: length
    nullable: true
    meaning: Radius of the upper edges of the bottom flange. 0 if sharp-edged, omitted if unknown.
    source_ref: "IfcAsymmetricIShapeProfileDef attribute 9: OPTIONAL IfcNonNegativeLengthMeasure"
    check: non_negative
  - name: bottom_flange_slope
    type: angle
    nullable: true
    meaning: Slope of the upper faces of the bottom flange. Radians; converted from the project plane-angle unit at the source boundary.
    source_ref: "IfcAsymmetricIShapeProfileDef attribute 10: OPTIONAL IfcPlaneAngleMeasure"
  - name: top_flange_edge_radius
    type: length
    nullable: true
    meaning: Radius of the lower edges of the top flange. 0 if sharp-edged, omitted if unknown.
    source_ref: "IfcAsymmetricIShapeProfileDef attribute 11: OPTIONAL IfcNonNegativeLengthMeasure"
    check: non_negative
  - name: top_flange_slope
    type: angle
    nullable: true
    meaning: Slope of the lower faces of the top flange. Radians; converted from the project plane-angle unit at the source boundary.
    source_ref: "IfcAsymmetricIShapeProfileDef attribute 12: OPTIONAL IfcPlaneAngleMeasure"
