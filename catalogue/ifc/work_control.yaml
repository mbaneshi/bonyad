    source_ref: "IfcWorkControl attribute 1: IfcDateTime"
  - name: purpose
    type: text
    nullable: true
    meaning: A description of the purpose of the work schedule.
    source_ref: "IfcWorkControl attribute 3: OPTIONAL IfcLabel"
  - name: duration
    type: text
    nullable: true
    meaning: The total duration of the entire work schedule.
    source_ref: "IfcWorkControl attribute 4: OPTIONAL IfcDuration"
  - name: total_float
    type: text
    nullable: true
    meaning: The total time float of the entire work schedule.
    source_ref: "IfcWorkControl attribute 5: OPTIONAL IfcDuration"
  - name: start_time
    type: timestamp
    meaning: The start time of the schedule.
    source_ref: "IfcWorkControl attribute 6: IfcDateTime"
  - name: finish_time
    type: timestamp
    nullable: true
    meaning: The finish time of the schedule.
    source_ref: "IfcWorkControl attribute 7: OPTIONAL IfcDateTime"
notes: SUPERTYPE OF ONEOF ( IfcWorkPlan , IfcWorkSchedule ).
