meaning: The reinforcing element type IfcReinforcingBarType defines commonly shared information for occurrences of reinforcing bars.
fields:
  - name: predefined_type
    type: enum
    meaning: Subtype of reinforcing bar.
    source_ref: "IfcReinforcingBarType attribute 1: IfcReinforcingBarTypeEnum; enumeration IfcReinforcingBarTypeEnum"
    values:
      - value: ANCHORING
        meaning: Anchoring reinforcement.
      - value: EDGE
        meaning: Edge reinforcement.
      - value: LIGATURE
        meaning: The reinforcing bar is a ligature (link, stirrup).
      - value: MAIN
        meaning: The reinforcing bar is a main bar.
      - value: PUNCHING
        meaning: Punching reinforcement.
      - value: RING
        meaning: Ring reinforcement.
      - value: SHEAR
        meaning: The reinforcing bar is a shear bar.
      - value: STUD
        meaning: The reinforcing bar is a stud.
      - value: SPACEBAR
        meaning: A stirrup in pre-stressing system to position TendonConduit.
      - value: USERDEFINED
        meaning: The type of reinforcement is user defined.
      - value: NOTDEFINED
        meaning: The type of reinforcement is not defined.
  - name: nominal_diameter
    type: length
    nullable: true
    meaning: The nominal diameter defining the cross-section size of the reinforcing bar.
    source_ref: "IfcReinforcingBarType attribute 2: OPTIONAL IfcPositiveLengthMeasure"
    check: positive
  - name: cross_section_area
    type: area
    nullable: true
    meaning: The effective cross-section area of the reinforcing bar.
    source_ref: "IfcReinforcingBarType attribute 3: OPTIONAL IfcAreaMeasure"
  - name: bar_length
    type: length
    nullable: true
    meaning: The total length of the reinforcing bar.
    source_ref: "IfcReinforcingBarType attribute 4: OPTIONAL IfcPositiveLengthMeasure"
    check: positive
  - name: bar_surface
    type: enum
    nullable: true
    meaning: Indicator for whether the bar surface is plain or textured.
    source_ref: "IfcReinforcingBarType attribute 5: OPTIONAL IfcReinforcingBarSurfaceEnum; enumeration IfcReinforcingBarSurfaceEnum"
    values:
      - value: PLAIN
        meaning: The reinforcing bar surface is plain.
      - value: TEXTURED
        meaning: The reinforcing bar surface is textured (ribbed).
  - name: bending_shape_code
    type: text
    nullable: true
    meaning: Shape code per a standard like ACI 315, ISO 3766, or a similar standard.
    source_ref: "IfcReinforcingBarType attribute 6: OPTIONAL IfcLabel"
  - name: bending_parameters
    type: array
    nullable: true
    meaning: Bending shape parameters.
    source_ref: "IfcReinforcingBarType attribute 7: OPTIONAL LIST [1:?] OF IfcBendingParameterSelect; elements are SELECT IfcBendingParameterSelect of value types, stored as text (the member type tag is not kept)"
    of: text
