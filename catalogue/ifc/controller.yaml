meaning: A controller is a device that monitors inputs and controls outputs within a building automation system.
fields:
  - name: predefined_type
    type: enum
    nullable: true
    meaning: PredefinedType attribute of IfcController (not described in the source documentation).
    source_ref: "IfcController attribute 1: OPTIONAL IfcControllerTypeEnum; enumeration IfcControllerTypeEnum"
    values:
      - value: FLOATING
        meaning: Output increases or decreases at a constant or accelerating rate.
      - value: PROGRAMMABLE
        meaning: Output is programmable such as Discrete Digital Control (DDC).
      - value: PROPORTIONAL
        meaning: Output is proportional to the control error and optionally time integral and derivative.
      - value: MULTIPOSITION
        meaning: Output is discrete value, can be one of three or more values.
      - value: TWOPOSITION
        meaning: Output can be either on or off.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
