code: ifc.window_panel_properties
name: IfcWindowPanelProperties
kind: symbol
base: ifc.pre_defined_property_set
fidelity: proxy
source:
  document: buildingSMART IFC4.3 EXPRESS schema (IFC4X3_RC4) with IFC4.3.x-development documentation
  section: IfcWindowPanelProperties
  url: https://github.com/buildingSMART/IFC4.3.x-development/blob/2b8baa0a14d5ed1a9f99ef9443bdcb63a0cb0ab1/docs/schemas/domain/IfcArchitectureDomain/Entities/IfcWindowPanelProperties.md
  version: IFC4X3_RC4 (EXPRESS issue date 2021-07-22); repo commit 2b8baa0a14d5; exp sha256 9b7d0c3e187f
  accessed_on: 2026-10-23
  licence: "buildingSMART: CC BY-ND 4.0 (repo LICENSE.md); EXPRESS header allows translation with full attribution, consent needed for changes. See SOURCES.md"
meaning: A window panel is a casement, that is, a component, fixed or opening, consisting essentially of a frame and the infilling. The infilling of a window panel is normally glazing.
fields:
  - name: operation_type
    type: enum
    meaning: Types of window panel operations.
    source_ref: "IfcWindowPanelProperties attribute 1: IfcWindowPanelOperationEnum; enumeration IfcWindowPanelOperationEnum"
    values:
      - value: SIDEHUNGRIGHTHAND
        meaning: Panel that opens to the right when viewed from the outside.
      - value: SIDEHUNGLEFTHAND
        meaning: Panel that opens to the left when viewed from the outside.
      - value: TILTANDTURNRIGHTHAND
        meaning: Panel that opens to the right and is bottom hung.
      - value: TILTANDTURNLEFTHAND
        meaning: Panel that opens to the left and is bottom hung.
      - value: TOPHUNG
        meaning: Panel is top hung.
      - value: BOTTOMHUNG
        meaning: Panel is bottom hung.
      - value: PIVOTHORIZONTAL
        meaning: Panel is swinging horizontally (hinges are in the middle).
      - value: PIVOTVERTICAL
        meaning: Panel is swinging vertically (hinges are in the middle).
      - value: SLIDINGHORIZONTAL
        meaning: Panel is sliding horizontally.
      - value: SLIDINGVERTICAL
        meaning: Panel is sliding vertically.
      - value: REMOVABLECASEMENT
        meaning: Panel is removable.
      - value: FIXEDCASEMENT
        meaning: Panel is fixed.
      - value: OTHEROPERATION
        meaning: Other.
      - value: NOTDEFINED
        meaning: Undefined.
  - name: panel_position
    type: enum
    meaning: Position of this panel within the overall window style.
    source_ref: "IfcWindowPanelProperties attribute 2: IfcWindowPanelPositionEnum; enumeration IfcWindowPanelPositionEnum"
    values:
      - value: LEFT
        meaning: Left.
      - value: MIDDLE
        meaning: Middle.
      - value: RIGHT
        meaning: Right.
      - value: BOTTOM
        meaning: Bottom.
      - value: TOP
        meaning: Top.
      - value: NOTDEFINED
        meaning: Undefined.
  - name: frame_depth
    type: length
    nullable: true
    meaning: Depth of panel frame, measured from front face to back face horizontally (i.e. perpendicular to the window (elevation) plane.
    source_ref: "IfcWindowPanelProperties attribute 3: OPTIONAL IfcPositiveLengthMeasure"
    check: positive
  - name: frame_thickness
    type: length
    nullable: true
    meaning: Width of panel frame, measured from inside of panel (at glazing) to outside of panel (at lining), i.e. parallel to the window (elevation) plane.
    source_ref: "IfcWindowPanelProperties attribute 4: OPTIONAL IfcPositiveLengthMeasure"
    check: positive
  - name: shape_aspect_style
    type: ref
    nullable: true
    meaning: Optional link to a shape aspect definition, which points to the part of the geometric representation of the window style, which is used to represent the panel.
    source_ref: "IfcWindowPanelProperties attribute 5: OPTIONAL IfcShapeAspect"
    ref_to: ifc.shape_aspect
