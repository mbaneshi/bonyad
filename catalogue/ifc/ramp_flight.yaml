meaning: A ramp comprises a single inclined segment, or several inclined segments that are connected by a horizontal segment, referred to as a landing. A ramp flight is the single inclined segment and part of the ramp construction.
fields:
  - name: predefined_type
    type: enum
    nullable: true
    meaning: Predefined generic type for a ramp flight that is specified in an enumeration.
    source_ref: "IfcRampFlight attribute 1: OPTIONAL IfcRampFlightTypeEnum; enumeration IfcRampFlightTypeEnum"
    values:
      - value: STRAIGHT
        meaning: A ramp flight with a straight walking line.
      - value: SPIRAL
        meaning: A ramp flight with a circular or elliptic walking line.
      - value: USERDEFINED
        meaning: User-defined ramp flight.
      - value: NOTDEFINED
        meaning: Undefined ramp flight.
