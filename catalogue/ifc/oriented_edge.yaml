meaning: The IfcOrientedEdge represents an IfcEdge with an Orientation flag applied. It allows to reuse the same IfcEdge when traversed exactly twice, once forwards and once backwards.
fields:
  - name: edge_element
    type: ref
    meaning: Edge entity used to construct this oriented edge.
    source_ref: "IfcOrientedEdge attribute 1: IfcEdge"
    ref_to: ifc.edge
  - name: orientation
    type: bool
    meaning: BOOLEAN, If TRUE the topological orientation as used coincides with the orientation from start vertex to end vertex of the edge element.
    source_ref: "IfcOrientedEdge attribute 2: IfcBoolean"
notes: "Inherited attributes redeclared as derived here (always computed, never stored for this type): EdgeStart, EdgeEnd."
