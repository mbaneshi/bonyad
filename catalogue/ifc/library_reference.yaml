meaning: An IfcLibraryReference is a reference into a library of information by Location (provided as a URI). It also provides an optional inherited Identification key to allow more specific references to library sections or tables.
fields:
  - name: description
    type: text
    nullable: true
    meaning: Additional description provided for the library reference.
    source_ref: "IfcLibraryReference attribute 1: OPTIONAL IfcText"
  - name: language
    type: text
    nullable: true
    meaning: The language in which a library reference is expressed.
    source_ref: "IfcLibraryReference attribute 2: OPTIONAL IfcLanguageId"
  - name: referenced_library
    type: ref
    nullable: true
    meaning: The library information that is being referenced.
    source_ref: "IfcLibraryReference attribute 3: OPTIONAL IfcLibraryInformation"
    ref_to: ifc.library_information
notes: "Inverse attributes not stored: LibraryRefForObjects."
