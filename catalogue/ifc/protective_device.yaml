    values:
      - value: CIRCUITBREAKER
        meaning: A mechanical switching device capable of making, carrying, and breaking currents under normal circuit conditions and also making, carrying for a specified time and breaking, current under specified abnormal circuit …
      - value: EARTHLEAKAGECIRCUITBREAKER
        meaning: A device that opens, closes, or isolates a circuit and has short circuit protection but no overload protection.
      - value: EARTHINGSWITCH
        meaning: A safety device used to open or close a circuit when there is no current.
      - value: FUSEDISCONNECTOR
        meaning: A device that will electrically open the circuit after a period of prolonged, abnormal current flow.
      - value: RESIDUALCURRENTCIRCUITBREAKER
