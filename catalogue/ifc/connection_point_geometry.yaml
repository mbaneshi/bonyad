    type: ref
    meaning: Point at which the connected object is aligned at the relating element, given in the LCS of the relating element.
    source_ref: "IfcConnectionPointGeometry attribute 1: IfcPointOrVertexPoint; via select IfcPointOrVertexPoint"
    ref_to: ifc.representation_item
  - name: point_on_related_element
    type: ref
    nullable: true
    meaning: Point at which connected objects are aligned at the related element, given in the LCS of the related element.
    source_ref: "IfcConnectionPointGeometry attribute 2: OPTIONAL IfcPointOrVertexPoint; via select IfcPointOrVertexPoint"
    ref_to: ifc.representation_item
notes: SUPERTYPE OF ONEOF ( IfcConnectionPointEccentricity ).
