meaning: A type of segment positioned along a curve cutting a segment from the parent curve. If the segment is placed through IfcAxis2PlacementLinear, the positioning curve (Placement.Location.BasisCurve) does not necessarily correspond with the ParentCurve.
fields:
  - name: placement
    type: ref
    meaning: Placement in the context of the curve using this segment.
    source_ref: "IfcCurveSegment attribute 1: IfcPlacement"
    ref_to: ifc.placement
  - name: segment_start
    type: text
    meaning: First trimming point of the curve segment on the ParentCurve.
    source_ref: "IfcCurveSegment attribute 2: IfcCurveMeasureSelect; SELECT IfcCurveMeasureSelect of value types, stored as text (the member type tag is not kept)"
  - name: segment_length
    type: text
    meaning: Length of segment measured as length or parameter value from SegmentStart.
    source_ref: "IfcCurveSegment attribute 3: IfcCurveMeasureSelect; SELECT IfcCurveMeasureSelect of value types, stored as text (the member type tag is not kept)"
  - name: parent_curve
    type: ref
    meaning: Curve to be used as base for the segment definition.
    source_ref: "IfcCurveSegment attribute 4: IfcCurve"
    ref_to: ifc.curve
notes: "Derived attributes not stored: Dim."
