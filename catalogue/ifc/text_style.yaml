meaning: The IfcTextStyle is a presentation style for annotations that place a text in model space. The IfcTextStyle provides the text style for presentation information assigned to _IfcTextLiteral_'s.
fields:
  - name: text_character_appearance
    type: ref
    nullable: true
    meaning: A character style to be used for presented text.
    source_ref: "IfcTextStyle attribute 1: OPTIONAL IfcTextStyleForDefinedFont"
    ref_to: ifc.text_style_for_defined_font
  - name: text_style
    type: ref
    nullable: true
    meaning: The style applied to the text block for its visual appearance.
    source_ref: "IfcTextStyle attribute 2: OPTIONAL IfcTextStyleTextModel"
    ref_to: ifc.text_style_text_model
  - name: text_font_style
    type: ref
    meaning: The style applied to the text font for its visual appearance.
    source_ref: "IfcTextStyle attribute 3: IfcTextFontSelect; via select IfcTextFontSelect"
    ref_to: any
  - name: model_or_draughting
    type: bool
    nullable: true
    meaning: Indication whether the length measures provided for the presentation style are model based, or draughting based.
    source_ref: "IfcTextStyle attribute 4: OPTIONAL IfcBoolean"
