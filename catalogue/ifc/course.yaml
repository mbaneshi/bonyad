meaning: A built element whose length greatly exceeds its thickness and often also its width, usually of a single material laid on site on top of another horizontal or nearly horizontal built element. A course is distinctive from a earthworks element in that a course is a graded granular (which can be bound or unbound) material that is generally processed in some …
fields:
  - name: predefined_type
    type: enum
    nullable: true
    meaning: Identifies the predefined type of a course element.
    source_ref: "IfcCourse attribute 1: OPTIONAL IfcCourseTypeEnum; enumeration IfcCourseTypeEnum"
    values:
      - value: ARMOUR
        meaning: An Aggregate layer whose primary function is to protect against erosion of the underlying material by water e.g. riprap.
      - value: FILTER
        meaning: An Intermediate layer whose primary function is to prevent the washing through of fine materials.
      - value: BALLASTBED
        meaning: Layer composed of broken stones under the sleepers.
      - value: CORE
        meaning: A core course is the bulk internal structure of aggregate structures.
      - value: PAVEMENT
        meaning: A layer within a pavement structure that forms a paved area or road.
      - value: PROTECTION
        meaning: Layer with the primary task to provide protection against erosion and scour.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
