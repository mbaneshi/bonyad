meaning: An alarm is a device that signals the existence of a condition or situation that is outside the boundaries of normal expectation or that activates such a device.
fields:
  - name: predefined_type
    type: enum
    nullable: true
    meaning: PredefinedType attribute of IfcAlarm (not described in the source documentation).
    source_ref: "IfcAlarm attribute 1: OPTIONAL IfcAlarmTypeEnum; enumeration IfcAlarmTypeEnum"
    values:
      - value: BELL
        meaning: An audible alarm.
      - value: BREAKGLASSBUTTON
        meaning: An alarm activation mechanism in which a protective glass has to be broken to enable a button to be pressed.
      - value: LIGHT
        meaning: A visual alarm.
      - value: MANUALPULLBOX
        meaning: An alarm activation mechanism in which activation is achieved by a pulling action.
      - value: SIREN
        meaning: An audible alarm.
      - value: WHISTLE
        meaning: An audible alarm.
      - value: RAILWAYCROCODILE
        meaning: An electrical contact placed between the rails (in the four-foot way) to provide warnings in the locomotive cab.
      - value: RAILWAYDETONATOR
        meaning: A coin-sized device that is used as a loud warning signal to train drivers.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
