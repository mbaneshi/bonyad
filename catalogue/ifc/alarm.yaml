code: ifc.alarm
name: IfcAlarm
kind: entity
base: ifc.distribution_control_element
fidelity: proxy
source:
  document: buildingSMART IFC4.3 EXPRESS schema (IFC4X3_RC4) with IFC4.3.x-development documentation
  section: IfcAlarm
  url: https://github.com/buildingSMART/IFC4.3.x-development/blob/2b8baa0a14d5ed1a9f99ef9443bdcb63a0cb0ab1/docs/schemas/domain/IfcBuildingControlsDomain/Entities/IfcAlarm.md
