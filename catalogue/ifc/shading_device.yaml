meaning: Shading devices are purpose built devices to protect from the sunlight, from natural light, or screening them from view. Shading devices can form part of the facade or can be mounted inside the building, they can be fixed or operable.
fields:
  - name: predefined_type
    type: enum
    nullable: true
    meaning: Predefined generic type for a shading device that is specified in an enumeration.
    source_ref: "IfcShadingDevice attribute 1: OPTIONAL IfcShadingDeviceTypeEnum; enumeration IfcShadingDeviceTypeEnum"
    values:
      - value: JALOUSIE
        meaning: A blind with adjustable horizontal slats for admitting light and air while excluding direct sun and rain.
      - value: SHUTTER
        meaning: A mechanical device that limits the passage of light.
      - value: AWNING
        meaning: A rooflike shelter of canvas or other material extending over a doorway, from the top of a window, over a deck, or similar, in order to provide protection, as from the sun.
      - value: USERDEFINED
        meaning: USERDEFINED (no description for this literal in the source documentation)
      - value: NOTDEFINED
        meaning: NOTDEFINED (no description for this literal in the source documentation)
