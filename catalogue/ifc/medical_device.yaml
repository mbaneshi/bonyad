code: ifc.medical_device
name: IfcMedicalDevice
kind: entity
base: ifc.flow_terminal
fidelity: proxy
source:
  document: buildingSMART IFC4.3 EXPRESS schema (IFC4X3_RC4) with IFC4.3.x-development documentation
  section: IfcMedicalDevice
  url: https://github.com/buildingSMART/IFC4.3.x-development/blob/2b8baa0a14d5ed1a9f99ef9443bdcb63a0cb0ab1/docs/schemas/domain/IfcHvacDomain/Entities/IfcMedicalDevice.md
  version: IFC4X3_RC4 (EXPRESS issue date 2021-07-22); repo commit 2b8baa0a14d5; exp sha256 9b7d0c3e187f
  accessed_on: 2026-10-23
  licence: "buildingSMART: CC BY-ND 4.0 (repo LICENSE.md); EXPRESS header allows translation with full attribution, consent needed for changes. See SOURCES.md"
meaning: A medical device is attached to a medical piping system and operates upon medical gases to perform a specific function. Medical gases include medical air, medical vacuum, oxygen, carbon dioxide, nitrogen, and nitrous oxide.
fields:
  - name: predefined_type
    type: enum
    nullable: true
    meaning: PredefinedType attribute of IfcMedicalDevice (not described in the source documentation).
    source_ref: "IfcMedicalDevice attribute 1: OPTIONAL IfcMedicalDeviceTypeEnum; enumeration IfcMedicalDeviceTypeEnum"
    values:
      - value: AIRSTATION
        meaning: Device that provides purified medical air, composed of an air compressor and air treatment line.
      - value: FEEDAIRUNIT
        meaning: Device that feeds air to an oxygen generator, composed of an air compressor, air treatment line, and an air receiver.
      - value: OXYGENGENERATOR
        meaning: Device that generates oxygen from air.
      - value: OXYGENPLANT
        meaning: Device that combines a feed air unit, oxygen generator, and backup oxygen cylinders.
      - value: VACUUMSTATION
        meaning: Device that provides suction, composed of a vacuum pump and bacterial filtration line.
      - value: USERDEFINED
        meaning: User-defined medical device type.
      - value: NOTDEFINED
        meaning: Undefined medical device type.
