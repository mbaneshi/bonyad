    source_ref: "IfcFilterType attribute 1: IfcFilterTypeEnum; enumeration IfcFilterTypeEnum"
    values:
      - value: AIRPARTICLEFILTER
        meaning: A filter used to remove particulates from air.
      - value: COMPRESSEDAIRFILTER
