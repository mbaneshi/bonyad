      - value: ODORFILTER
        meaning: A filter used to remove odors from air.
      - value: OILFILTER
        meaning: A filter used to remove particulates from oil.
      - value: STRAINER
        meaning: A filter used to remove particulates from a fluid.
      - value: WATERFILTER
        meaning: A filter used to remove particulates from water.
      - value: USERDEFINED
        meaning: User-defined filter type.
      - value: NOTDEFINED
        meaning: Undefined filter type.
