meaning: IfcMaterialProfileSetUsage determines the usage of IfcMaterialProfileSet in terms of its location relative to the associated element geometry. The location of a material profile set shall be compatible with the building element geometry (that is, material profiles shall fit inside the element geometry).
fields:
  - name: for_profile_set
    type: ref
    meaning: The IfcMaterialProfileSet set to which the usage is applied.
    source_ref: "IfcMaterialProfileSetUsage attribute 1: IfcMaterialProfileSet"
    ref_to: ifc.material_profile_set
  - name: cardinal_point
    type: int
    nullable: true
    meaning: Index reference to a significant point in the section profile.
    source_ref: "IfcMaterialProfileSetUsage attribute 2: OPTIONAL IfcCardinalPointReference"
  - name: reference_extent
    type: length
    nullable: true
    meaning: Extent of the extrusion of the elements body shape representation to which the IfcMaterialProfileSetUsage applies.
    source_ref: "IfcMaterialProfileSetUsage attribute 3: OPTIONAL IfcPositiveLengthMeasure"
    check: positive
notes: SUPERTYPE OF ONEOF ( IfcMaterialProfileSetUsageTapering ).
