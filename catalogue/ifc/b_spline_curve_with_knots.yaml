    of: int
  - name: knots
    type: array
    meaning: The list of distinct knots used to define the B-spline basis functions.
    source_ref: "IfcBSplineCurveWithKnots attribute 2: LIST [2:?] OF IfcParameterValue"
    of: float
  - name: knot_spec
    type: enum
    meaning: The description of the knot type.
    source_ref: "IfcBSplineCurveWithKnots attribute 3: IfcKnotType; enumeration IfcKnotType"
    values:
      - value: UNIFORM_KNOTS
        meaning: The form of knots appropriate for a uniform B-spline curve.
      - value: QUASI_UNIFORM_KNOTS
        meaning: The form of knots appropriate for a quasi-uniform B-spline curve.
      - value: PIECEWISE_BEZIER_KNOTS
        meaning: The form of knots appropriate for a piecewise Bezier curve.
      - value: UNSPECIFIED
        meaning: The type of knots is not specified.
