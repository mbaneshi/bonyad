meaning: IfcConnectionPointEccentricity is used to describe the geometric constraints that facilitate the physical connection of two objects at a point or vertex point with associated point coordinates. There is a physical distance, or eccentricity, etween the connection points of both object.
fields:
  - name: eccentricity_in_x
    type: length
    nullable: true
    meaning: Distance in x direction between the two points (or vertex points) engaged in the point connection.
    source_ref: "IfcConnectionPointEccentricity attribute 1: OPTIONAL IfcLengthMeasure"
  - name: eccentricity_in_y
    type: length
    nullable: true
    meaning: Distance in y direction between the two points (or vertex points) engaged in the point connection.
    source_ref: "IfcConnectionPointEccentricity attribute 2: OPTIONAL IfcLengthMeasure"
  - name: eccentricity_in_z
    type: length
    nullable: true
    meaning: Distance in z direction between the two points (or vertex points) engaged in the point connection.
    source_ref: "IfcConnectionPointEccentricity attribute 3: OPTIONAL IfcLengthMeasure"
