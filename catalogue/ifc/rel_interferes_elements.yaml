code: ifc.rel_interferes_elements
name: IfcRelInterferesElements
kind: object
base: ifc.rel_connects
fidelity: proxy
source:
  document: buildingSMART IFC4.3 EXPRESS schema (IFC4X3_RC4) with IFC4.3.x-development documentation
  section: IfcRelInterferesElements
  url: https://github.com/buildingSMART/IFC4.3.x-development/blob/2b8baa0a14d5ed1a9f99ef9443bdcb63a0cb0ab1/docs/schemas/core/IfcProductExtension/Entities/IfcRelInterferesElements.md
  version: IFC4X3_RC4 (EXPRESS issue date 2021-07-22); repo commit 2b8baa0a14d5; exp sha256 9b7d0c3e187f
  accessed_on: 2026-10-23
  licence: "buildingSMART: CC BY-ND 4.0 (repo LICENSE.md); EXPRESS header allows translation with full attribution, consent needed for changes. See SOURCES.md"
meaning: The IfcRelInterferesElements objectified relationship indicates that two elements interfere.
fields:
  - name: relating_element
    type: ref
    meaning: Reference to a subtype of IfcElement or IfcSpatialElement that is the RelatingElement in the interference relationship.
    source_ref: "IfcRelInterferesElements attribute 1: IfcInterferenceSelect; via select IfcInterferenceSelect"
    ref_to: ifc.product
  - name: related_element
    type: ref
    meaning: Reference to a subtype of IfcElement or IfcSpatialElement that is the RelatedElement in the interference relationship.
    source_ref: "IfcRelInterferesElements attribute 2: IfcInterferenceSelect; via select IfcInterferenceSelect"
    ref_to: ifc.product
  - name: interference_geometry
    type: ref
    nullable: true
    meaning: The geometric shape representation of the interference geometry that is provided in the object coordinate system of the RelatingElement (mandatory) and in the object coordinate system of the RelatedElement (optionally).
    source_ref: "IfcRelInterferesElements attribute 3: OPTIONAL IfcConnectionGeometry"
    ref_to: ifc.connection_geometry
  - name: interference_space
    type: ref
    nullable: true
    meaning: Optional attribute that expresses the interfering space for IfcSpatialElement occurrences.
    source_ref: "IfcRelInterferesElements attribute 4: OPTIONAL IfcSpatialZone"
    ref_to: ifc.spatial_zone
  - name: interference_type
    type: text
    nullable: true
    meaning: Optional identifier that describes the nature of the interference.
    source_ref: "IfcRelInterferesElements attribute 5: OPTIONAL IfcIdentifier"
  - name: implied_order
    type: bool
    nullable: true
    meaning: Logical value indicating if the RelatingElement is considered a source and the RelatedElement a target (giving a formal orientation to the relation).
    source_ref: "IfcRelInterferesElements attribute 6: IfcLogical; LOGICAL (TRUE, FALSE, UNKNOWN): UNKNOWN is stored as NULL"
