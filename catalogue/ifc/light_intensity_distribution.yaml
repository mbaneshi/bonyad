meaning: IfcLightIntensityDistribution defines the the luminous intensity of a light source that changes according to the direction of the ray. It is based on some standardized light distribution curves, which are defined by the LightDistributionCurve attribute.
fields:
  - name: light_distribution_curve
    type: enum
    meaning: Standardized light distribution curve used to define the luminous intensity of the light in all directions.
    source_ref: "IfcLightIntensityDistribution attribute 1: IfcLightDistributionCurveEnum; enumeration IfcLightDistributionCurveEnum"
    values:
      - value: TYPE_A
        meaning: Type A is basically not used.
      - value: TYPE_B
        meaning: Type B is sometimes used for floodlights.
      - value: TYPE_C
        meaning: Type C is the recommended standard system.
      - value: NOTDEFINED
        meaning: Not defined.
