meaning: The flow terminal type IfcStackTerminalType defines commonly shared information for occurrences of stack terminals.
fields:
  - name: predefined_type
    type: enum
    meaning: Identifies the predefined types of stack terminal from which the type required may be set.
    source_ref: "IfcStackTerminalType attribute 1: IfcStackTerminalTypeEnum; enumeration IfcStackTerminalTypeEnum"
    values:
      - value: BIRDCAGE
        meaning: Guard cage, typically wire mesh, at the top of the stack preventing access by birds.
      - value: COWL
        meaning: A cowling placed at the top of a stack to eliminate downdraft.
      - value: RAINWATERHOPPER
        meaning: A box placed at the top of a rainwater downpipe to catch rainwater from guttering.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
