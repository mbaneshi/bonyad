meaning: IfcTrapeziumProfileDef defines a trapezium as the profile definition used by the swept surface geometry or the swept area solid. It is given by its Top X and Bottom X extent and its Y extent as well as by the offset of the Top X extend, and placed within the 2D position coordinate system, established by the Position attribute.
fields:
  - name: bottom_x_dim
    type: length
    meaning: The extent of the bottom line measured along the implicit x-axis.
    source_ref: "IfcTrapeziumProfileDef attribute 1: IfcPositiveLengthMeasure"
    check: positive
  - name: top_x_dim
    type: length
    meaning: The extent of the top line measured along the implicit x-axis.
    source_ref: "IfcTrapeziumProfileDef attribute 2: IfcPositiveLengthMeasure"
    check: positive
  - name: y_dim
    type: length
    meaning: The extent of the distance between the parallel bottom and top lines measured along the implicit y-axis.
    source_ref: "IfcTrapeziumProfileDef attribute 3: IfcPositiveLengthMeasure"
    check: positive
  - name: top_x_offset
    type: length
    meaning: Offset from the beginning of the top line to the bottom line, measured along the implicit x-axis.
    source_ref: "IfcTrapeziumProfileDef attribute 4: IfcLengthMeasure"
