meaning: The distribution control element type IfcControllerType defines commonly shared information for occurrences of controllers.
fields:
  - name: predefined_type
    type: enum
    meaning: Identifies the predefined types of controller from which the type required may be set.
    source_ref: "IfcControllerType attribute 1: IfcControllerTypeEnum; enumeration IfcControllerTypeEnum"
    values:
      - value: FLOATING
        meaning: Output increases or decreases at a constant or accelerating rate.
      - value: PROGRAMMABLE
        meaning: Output is programmable such as Discrete Digital Control (DDC).
      - value: PROPORTIONAL
        meaning: Output is proportional to the control error and optionally time integral and derivative.
      - value: MULTIPOSITION
        meaning: Output is discrete value, can be one of three or more values.
      - value: TWOPOSITION
        meaning: Output can be either on or off.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
