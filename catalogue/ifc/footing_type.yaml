meaning: The building element type IfcFootingType defines commonly shared information for occurrences of footings.
fields:
  - name: predefined_type
    type: enum
    meaning: Subtype of footing.
    source_ref: "IfcFootingType attribute 1: IfcFootingTypeEnum; enumeration IfcFootingTypeEnum"
    values:
      - value: CAISSON_FOUNDATION
        meaning: A foundation construction type used in underwater construction.
      - value: FOOTING_BEAM
        meaning: Footing elements that are in bending and are supported clear of the ground.
      - value: PAD_FOOTING
        meaning: An element that transfers the load of a single column (possibly two) to the ground.
      - value: PILE_CAP
        meaning: An element that transfers the load from a column or group of columns to a pier or pile or group of piers or piles.
      - value: STRIP_FOOTING
        meaning: A linear element that transfers loads into the ground from either a continuous element, such as a wall, or from a series of elements, such as columns.
      - value: USERDEFINED
        meaning: Special types of footings which meet specific local requirements.
      - value: NOTDEFINED
        meaning: The type of footing is not defined.
