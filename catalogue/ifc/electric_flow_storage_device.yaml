    values:
      - value: BATTERY
        meaning: A device for storing energy in chemical form so that it can be released as electrical energy.
      - value: CAPACITORBANK
        meaning: A device that stores electrical energy when an external power supply is present using the electrical property of capacitance.
      - value: HARMONICFILTER
        meaning: A device that constantly injects currents that precisely correspond to the harmonic components drawn by the load.
      - value: INDUCTORBANK
        meaning: A device that stores electrical energy in a magnetic field using electrical property of inductance.
      - value: UPS
        meaning: A device that provides a time limited alternative source of power supply in the event of failure of the main supply.
      - value: CAPACITOR
        meaning: A device that stores electric charge when an external power supply is present using the electrical property of capacitance.
      - value: COMPENSATOR
        meaning: A device that is used to fix or adjust the parameter of electric energy, such as voltage loss, power factor and so on.
      - value: INDUCTOR
        meaning: A device used in circuits or power systems due to their inductance, acting as a component of electric storage device.
      - value: RECHARGER
        meaning: A recharger or battery charger is a device used to put energy into a secondary cell or rechargeable battery by forcing an electric current through it.
