code: ifc.built_system
name: IfcBuiltSystem
kind: object
base: ifc.system
fidelity: proxy
source:
  document: buildingSMART IFC4.3 EXPRESS schema (IFC4X3_RC4) with IFC4.3.x-development documentation
  section: IfcBuiltSystem
  url: https://github.com/buildingSMART/IFC4.3.x-development/blob/2b8baa0a14d5ed1a9f99ef9443bdcb63a0cb0ab1/docs/schemas/core/IfcProductExtension/Entities/IfcBuiltSystem.md
  version: IFC4X3_RC4 (EXPRESS issue date 2021-07-22); repo commit 2b8baa0a14d5; exp sha256 9b7d0c3e187f
  accessed_on: 2026-10-23
  licence: "buildingSMART: CC BY-ND 4.0 (repo LICENSE.md); EXPRESS header allows translation with full attribution, consent needed for changes. See SOURCES.md"
meaning: A built system is a group by which built elements are grouped according to a common function within the facility.
fields:
  - name: predefined_type
    type: enum
    nullable: true
    meaning: Identifies the predefined type of the system.
    source_ref: "IfcBuiltSystem attribute 1: OPTIONAL IfcBuiltSystemTypeEnum; enumeration IfcBuiltSystemTypeEnum"
    values:
      - value: REINFORCING
        meaning: System of elements providing reinforcing to the structure.
      - value: MOORING
        meaning: System of components and elements responsible for keeping or holding an element (a vessel, platform or set of catenary lines) in a desired position.
      - value: OUTERSHELL
        meaning: System of built elements that provide the outer skin to protect the construction (such as the facade).
      - value: TRACKCIRCUIT
        meaning: A track circuit is an electric circuit of which the rails of a track section form a part, with usually a source of current connected at one end and a detection device at the other end for detecting whether this track …
      - value: EROSIONPREVENTION
        meaning: A grouping of elements into a built system for preventing unwanted relocation of material particles in earthworks slopes or rock faces.
      - value: FOUNDATION
        meaning: System of shallow and deep foundation elements that transmit forces to the supporting ground.
      - value: LOADBEARING
        meaning: System of built elements that transmit forces and stiffen the construction.
      - value: SHADING
        meaning: System of shading elements (external or internal) that permits the limitation or control of impact of natural sun light.
      - value: FENESTRATION
        meaning: System of doors, windows, and other fillings in openings in a built envelope that are designed to permit the passage of air or light.
      - value: TRANSPORT
        meaning: System of all transport elements in a facility that enable the transport of people or goods.
      - value: PRESTRESSING
        meaning: System of elements providing pre-stressing to the structure, including typically manufactured products such as tendons, anchorages (active, dead, coupling), ducts, vents and deviators, and in-situ concrete segments, …
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
  - name: long_name
    type: text
    nullable: true
    meaning: Long name for a built system, used for informal purposes.
    source_ref: "IfcBuiltSystem attribute 2: OPTIONAL IfcLabel"
