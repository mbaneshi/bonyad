meaning: The element type IfcPlateType defines commonly shared information for occurrences of plates.
fields:
  - name: predefined_type
    type: enum
    meaning: Identifies the predefined types of a planar member element from which the type required may be set.
    source_ref: "IfcPlateType attribute 1: IfcPlateTypeEnum; enumeration IfcPlateTypeEnum"
    values:
      - value: CURTAIN_PANEL
        meaning: A planar element within a curtain wall, often consisting of a frame with fixed glazing.
      - value: SHEET
        meaning: A planar, flat and thin element, comes usually as metal sheet, and is often used as an additional part within an assembly.
      - value: FLANGE_PLATE
        meaning: A flange plate in linear members having box or I-profile (e.g. top or bottom flange plate in box-girder).
      - value: WEB_PLATE
        meaning: A plate connecting flange plates in linear members having box or I-profile.
      - value: STIFFENER_PLATE
        meaning: A transversal plate added to a flange or a web plate for local stiffening.
      - value: GUSSET_PLATE
        meaning: a plate or bracket for strengthening an angle in framework (as in a building or bridge).
      - value: COVER_PLATE
        meaning: A plate (underneath or above) a flange to provide additional load capacity.
      - value: SPLICE_PLATE
        meaning: A plate connecting two members joined at ends.
      - value: BASE_PLATE
        meaning: A plate used to spread load over a surface, such as underneath a bearing or column.
      - value: USERDEFINED
        meaning: User-defined linear element.
      - value: NOTDEFINED
        meaning: Undefined linear element.
