meaning: The IfcComplexPropertyTemplate defines the template for all complex properties, either the _IfcComplexProperty_'s, or the _IfcPhysicalComplexQuantity_'s. The individual complex property templates are interpreted according to their Name attribute and and optional UsageName attribute.
fields:
  - name: usage_name
    type: text
    nullable: true
    meaning: Usage description of the IfcComplexPropertyTemplate.
    source_ref: "IfcComplexPropertyTemplate attribute 1: OPTIONAL IfcLabel"
  - name: template_type
    type: enum
    nullable: true
    meaning: Property type defining whether the property template defines a property as a IfcComplexProperty or IfcPhysicalComplexQuantity.
    source_ref: "IfcComplexPropertyTemplate attribute 2: OPTIONAL IfcComplexPropertyTemplateTypeEnum; enumeration IfcComplexPropertyTemplateTypeEnum"
    values:
      - value: P_COMPLEX
        meaning: The properties defined by this IfcComplexPropertyTemplate are of type IfcComplexProperty.
      - value: Q_COMPLEX
        meaning: The quantities defined by this IfcComplexPropertyTemplate are of type IfcPhysicalComplexQuantity.
