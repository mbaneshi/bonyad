meaning: The energy conversion device type IfcCoolingTowerType defines commonly shared information for occurrences of cooling towers.
fields:
  - name: predefined_type
    type: enum
    meaning: Defines the typical types of cooling towers (e.g., OpenTower, ClosedTower, CrossFlow, etc.).
    source_ref: "IfcCoolingTowerType attribute 1: IfcCoolingTowerTypeEnum; enumeration IfcCoolingTowerTypeEnum"
    values:
      - value: NATURALDRAFT
        meaning: Air flow is produced naturally.
      - value: MECHANICALINDUCEDDRAFT
        meaning: Air flow is produced by a mechanical device, typically one or more fans, located on the air outlet side of the cooling tower.
      - value: MECHANICALFORCEDDRAFT
        meaning: Air flow is produced by a mechanical device, typically one or more fans, located on the inlet air side of the cooling tower.
      - value: USERDEFINED
        meaning: User-defined cooling tower type.
      - value: NOTDEFINED
        meaning: Undefined cooling tower type.
