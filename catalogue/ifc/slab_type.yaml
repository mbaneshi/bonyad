meaning: The element type IfcSlabType defines commonly shared information for occurrences of slabs.
fields:
  - name: predefined_type
    type: enum
    meaning: Identifies the predefined types of a slab element from which the type required may be set.
    source_ref: "IfcSlabType attribute 1: IfcSlabTypeEnum; enumeration IfcSlabTypeEnum"
    values:
      - value: FLOOR
        meaning: The slab is used to represent a floor slab or a bridge deck.
      - value: ROOF
        meaning: The slab is used to represent a roof slab (either flat or sloped).
      - value: LANDING
        meaning: The slab is used to represent a landing within a stair or ramp.
      - value: BASESLAB
        meaning: The slab is used to represent a floor slab against the ground (and thereby being a part of the foundation).
      - value: APPROACH_SLAB
        meaning: A slab used to provide a transition from embankment to the bridge.
      - value: PAVING
        meaning: Rigid pavement course of a road or other paved area, usually concrete.
      - value: WEARING
        meaning: The slab is used to represent a wearing surface.
      - value: SIDEWALK
        meaning: The slab is used to represent a sidewalk.
      - value: TRACKSLAB
        meaning: A track slab is a reinforced concrete slab or prestressed reinforced concrete slab, which is a main element of slab track.
      - value: USERDEFINED
        meaning: USERDEFINED (no description for this literal in the source documentation)
      - value: NOTDEFINED
        meaning: NOTDEFINED (no description for this literal in the source documentation)
