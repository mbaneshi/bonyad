code: ifc.i_shape_profile_def
name: IfcIShapeProfileDef
kind: symbol
base: ifc.parameterized_profile_def
fidelity: proxy
source:
  document: buildingSMART IFC4.3 EXPRESS schema (IFC4X3_RC4) with IFC4.3.x-development documentation
  section: IfcIShapeProfileDef
  url: https://github.com/buildingSMART/IFC4.3.x-development/blob/2b8baa0a14d5ed1a9f99ef9443bdcb63a0cb0ab1/docs/schemas/resource/IfcProfileResource/Entities/IfcIShapeProfileDef.md
