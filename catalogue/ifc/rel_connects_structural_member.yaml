  licence: "buildingSMART: CC BY-ND 4.0 (repo LICENSE.md); EXPRESS header allows translation with full attribution, consent needed for changes. See SOURCES.md"
meaning: The entity IfcRelConnectsStructuralMember defines all needed properties describing the connection between structural members and structural connection objects (nodes or supports).
fields:
  - name: relating_structural_member
    type: ref
    meaning: Reference to an instance of IfcStructuralMember (or its subclasses) which is connected to the specified structural connection.
    source_ref: "IfcRelConnectsStructuralMember attribute 1: IfcStructuralMember"
    ref_to: ifc.structural_member
  - name: related_structural_connection
    type: ref
    meaning: Reference to an instance of IfcStructuralConnection (or its subclasses) which is connected to the specified structural member.
    source_ref: "IfcRelConnectsStructuralMember attribute 2: IfcStructuralConnection"
    ref_to: ifc.structural_connection
  - name: applied_condition
    type: ref
    nullable: true
    meaning: Conditions which define the connections properties.
    source_ref: "IfcRelConnectsStructuralMember attribute 3: OPTIONAL IfcBoundaryCondition"
    ref_to: ifc.boundary_condition
  - name: additional_conditions
    type: ref
    nullable: true
    meaning: Describes additional connection properties.
    source_ref: "IfcRelConnectsStructuralMember attribute 4: OPTIONAL IfcStructuralConnectionCondition"
    ref_to: ifc.structural_connection_condition
  - name: supported_length
    type: length
    nullable: true
    meaning: Defines the 'supported length' of this structural connection.
    source_ref: "IfcRelConnectsStructuralMember attribute 5: OPTIONAL IfcLengthMeasure"
  - name: condition_coordinate_system
    type: ref
    nullable: true
    meaning: Defines a coordinate system used for the description of the connection properties in ConnectionCondition relative to the local coordinate system of RelatingStructuralMember.
    source_ref: "IfcRelConnectsStructuralMember attribute 6: OPTIONAL IfcAxis2Placement3D"
    ref_to: ifc.axis2_placement3d
notes: SUPERTYPE OF ONEOF ( IfcRelConnectsWithEccentricity ).
