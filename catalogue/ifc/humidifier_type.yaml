meaning: The energy conversion device type IfcHumidifierType defines commonly shared information for occurrences of humidifiers.
fields:
  - name: predefined_type
    type: enum
    meaning: Defines the type of humidifier.
    source_ref: "IfcHumidifierType attribute 1: IfcHumidifierTypeEnum; enumeration IfcHumidifierTypeEnum"
    values:
      - value: STEAMINJECTION
        meaning: Water vapor is added into the airstream through direct steam injection.
      - value: ADIABATICAIRWASHER
        meaning: Water vapor is added into the airstream through adiabatic evaporation using an air washing element.
      - value: ADIABATICPAN
        meaning: Water vapor is added into the airstream through adiabatic evaporation using a pan.
      - value: ADIABATICWETTEDELEMENT
        meaning: Water vapor is added into the airstream through adiabatic evaporation using a wetted element.
      - value: ADIABATICATOMIZING
        meaning: Water vapor is added into the airstream through adiabatic evaporation using an atomizing element.
      - value: ADIABATICULTRASONIC
        meaning: Water vapor is added into the airstream through adiabatic evaporation using an ultrasonic element.
      - value: ADIABATICRIGIDMEDIA
        meaning: Water vapor is added into the airstream through adiabatic evaporation using a rigid media.
      - value: ADIABATICCOMPRESSEDAIRNOZZLE
        meaning: Water vapor is added into the airstream through adiabatic evaporation using a compressed air nozzle.
      - value: ASSISTEDELECTRIC
        meaning: Water vapor is added into the airstream through water heated evaporation using an electric heater.
      - value: ASSISTEDNATURALGAS
        meaning: Water vapor is added into the airstream through water heated evaporation using a natural gas heater.
      - value: ASSISTEDPROPANE
        meaning: Water vapor is added into the airstream through water heated evaporation using a propane heater.
      - value: ASSISTEDBUTANE
        meaning: Water vapor is added into the airstream through water heated evaporation using a butane heater.
      - value: ASSISTEDSTEAM
        meaning: Water vapor is added into the airstream through water heated evaporation using a steam heater.
      - value: USERDEFINED
        meaning: User-defined humidifier type.
      - value: NOTDEFINED
        meaning: Undefined humidifier type.
