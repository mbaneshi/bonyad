meaning: Type of Tendon Conduit.
fields:
  - name: predefined_type
    type: enum
    meaning: Subtype of tendon conduit.
    source_ref: "IfcTendonConduitType attribute 1: IfcTendonConduitTypeEnum; enumeration IfcTendonConduitTypeEnum"
    values:
      - value: DUCT
        meaning: A Sleeve or duct is related to the thickness of the conduit depending on the conduit, either cast into the concrete structure or placed adjacent to it.
      - value: COUPLER
        meaning: A part to connect the conduits located in two different deck segments and related to the same tendon.
      - value: GROUTING_DUCT
        meaning: An additional small conduit connected to the main conduit to allow grouting in case of bonded post-tensioning, such as Grout inlet, Grout outlet and Grout vent.
      - value: TRUMPET
        meaning: A specific part of conduit which has to be widened when reaching the tendon anchor because the strands are connected individually on the anchor.
      - value: DIABOLO
        meaning: A part of tendon conduit associated to deviator.
      - value: USERDEFINED
        meaning: The type of tendon conduit is user defined.
      - value: NOTDEFINED
        meaning: The type of tendon conduit is not defined.
