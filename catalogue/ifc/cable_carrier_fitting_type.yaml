meaning: The flow fitting type IfcCableCarrierFittingType defines commonly shared information for occurrences of cable carrier fittings.
fields:
  - name: predefined_type
    type: enum
    meaning: Identifies the predefined types of cable carrier fitting from which the type required may be set.
    source_ref: "IfcCableCarrierFittingType attribute 1: IfcCableCarrierFittingTypeEnum; enumeration IfcCableCarrierFittingTypeEnum"
    values:
      - value: BEND
        meaning: A fitting that changes the route of the cable carrier.
      - value: CROSS
        meaning: A fitting at which two branches are taken from the main route of the cable carrier simultaneously.
      - value: REDUCER
        meaning: A fitting that changes the physical size of the main route of the cable carrier.
      - value: TEE
        meaning: A fitting at which a branch is taken from the main route of the cable carrier.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
