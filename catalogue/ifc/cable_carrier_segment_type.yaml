meaning: The flow segment type IfcCableCarrierSegmentType defines commonly shared information for occurrences of cable carrier segments.
fields:
  - name: predefined_type
    type: enum
    meaning: Identifies the predefined types of cable carrier segment from which the type required may be set.
    source_ref: "IfcCableCarrierSegmentType attribute 1: IfcCableCarrierSegmentTypeEnum; enumeration IfcCableCarrierSegmentTypeEnum"
    values:
      - value: CABLELADDERSEGMENT
        meaning: An open carrier segment on which cables are carried on a ladder structure.
      - value: CABLETRAYSEGMENT
        meaning: A (typically) open carrier segment onto which cables are laid.
      - value: CABLETRUNKINGSEGMENT
        meaning: An enclosed carrier segment with one or more compartments into which cables are placed.
      - value: CONDUITSEGMENT
        meaning: An enclosed tubular carrier segment through which cables are pulled.
      - value: CABLEBRACKET
        meaning: A cable bracket is a horizontal cable support fixed at one end only, spaced at intervals, on which cables rest.
      - value: CATENARYWIRE
        meaning: A catenary wire is a longitudinal wire supporting the grooved contact wires either directly or indirectly.
      - value: DROPPER
        meaning: A dropper is a cable carrier used to suspend cable from another cable.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
