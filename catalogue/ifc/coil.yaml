meaning: A coil is a device used to provide heat transfer between non-mixing media. A common example is a cooling coil, which utilizes a finned coil in which circulates chilled water, antifreeze, or refrigerant that is used to remove heat from air moving across the surface of the coil.
fields:
  - name: predefined_type
    type: enum
    nullable: true
    meaning: PredefinedType attribute of IfcCoil (not described in the source documentation).
    source_ref: "IfcCoil attribute 1: OPTIONAL IfcCoilTypeEnum; enumeration IfcCoilTypeEnum"
    values:
      - value: DXCOOLINGCOIL
        meaning: Cooling coil using a refrigerant to cool the air stream directly.
      - value: ELECTRICHEATINGCOIL
        meaning: Heating coil using electricity as a heating source.
      - value: GASHEATINGCOIL
        meaning: Heating coil using gas as a heating source.
      - value: HYDRONICCOIL
        meaning: Cooling or Heating coil that uses a hydronic fluid as a cooling or heating source.
      - value: STEAMHEATINGCOIL
        meaning: Heating coil using steam as heating source.
      - value: WATERCOOLINGCOIL
        meaning: Cooling coil using chilled water.
      - value: WATERHEATINGCOIL
        meaning: Heating coil using hot water as a heating source.
      - value: USERDEFINED
        meaning: User-defined coil type.
      - value: NOTDEFINED
        meaning: Undefined coil type.
