meaning: The energy conversion device type IfcElectricGeneratorType defines commonly shared information for occurrences of electric generators.
fields:
  - name: predefined_type
    type: enum
    meaning: Identifies the predefined types of electric generators from which the type required may be set.
    source_ref: "IfcElectricGeneratorType attribute 1: IfcElectricGeneratorTypeEnum; enumeration IfcElectricGeneratorTypeEnum"
    values:
      - value: CHP
        meaning: Combined heat and power supply, used not only as a source of electric energy but also as a heating source for the building.
      - value: ENGINEGENERATOR
        meaning: Electrical generator with a fuel-driven engine, for example a diesel-driven emergency power supply.
      - value: STANDALONE
        meaning: Electrical generator which does not include its source of kinetic energy, that is, a motor, engine, or turbine are all modeled separately.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
