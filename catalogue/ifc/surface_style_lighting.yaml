meaning: IfcSurfaceStyleLighting is a container class for properties for calculation of physically exact illuminance related to a particular surface style.
fields:
  - name: diffuse_transmission_colour
    type: ref
    meaning: The degree of diffusion of the transmitted light.
    source_ref: "IfcSurfaceStyleLighting attribute 1: IfcColourRgb"
    ref_to: ifc.colour_rgb
  - name: diffuse_reflection_colour
    type: ref
    meaning: The degree of diffusion of the reflected light.
    source_ref: "IfcSurfaceStyleLighting attribute 2: IfcColourRgb"
    ref_to: ifc.colour_rgb
  - name: transmission_colour
    type: ref
    meaning: Describes how the light falling on a body is totally or partially transmitted.
    source_ref: "IfcSurfaceStyleLighting attribute 3: IfcColourRgb"
    ref_to: ifc.colour_rgb
  - name: reflectance_colour
    type: ref
    meaning: A coefficient that determines the extent that the light falling onto a surface is fully or partially reflected.
    source_ref: "IfcSurfaceStyleLighting attribute 4: IfcColourRgb"
    ref_to: ifc.colour_rgb
