meaning: IfcRelationship is the abstract generalization of all objectified relationships in IFC. Objectified relationships are the preferred way to handle relationships among objects. This allows keeping relationship-specific properties directly at the relationship and opens the possibility to later handle relationship-specific behaviour.
fields: []
notes: SUPERTYPE OF ONEOF ( IfcRelAssigns , IfcRelAssociates , IfcRelConnects , IfcRelDeclares , IfcRelDecomposes , IfcRelDefines ).
