meaning: A half space solid divides the domain into two by a base surface. Normally, the base surface is a plane and divides the infinitive space into two and indicates the side of the half-space by agreeing or disagreeing to the normal of the plane.
fields:
  - name: base_surface
    type: ref
    meaning: Surface defining side of half space.
    source_ref: "IfcHalfSpaceSolid attribute 1: IfcSurface"
    ref_to: ifc.surface
  - name: agreement_flag
    type: bool
    meaning: The agreement flag is TRUE if the normal to the BaseSurface points away from the material of the IfcHalfSpaceSolid.
    source_ref: "IfcHalfSpaceSolid attribute 2: IfcBoolean"
