meaning: An IfcConversionBasedUnit is used to define a unit that has a conversion rate to a base unit. To identify some commonly used conversion based units, the standard designations (case insensitive) for the Name attribute are indicated in Table 1.
fields:
  - name: name
    type: text
    meaning: The word, or group of words, by which the conversion based unit is referred to.
    source_ref: "IfcConversionBasedUnit attribute 1: IfcLabel"
  - name: conversion_factor
    type: ref
    meaning: The physical quantity from which the converted unit is derived.
    source_ref: "IfcConversionBasedUnit attribute 2: IfcMeasureWithUnit"
    ref_to: ifc.measure_with_unit
