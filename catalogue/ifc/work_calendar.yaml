    type: enum
    nullable: true
    meaning: Identifies the predefined types of a work calendar from which the type required may be set.
    source_ref: "IfcWorkCalendar attribute 3: OPTIONAL IfcWorkCalendarTypeEnum; enumeration IfcWorkCalendarTypeEnum"
    values:
