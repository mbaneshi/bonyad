meaning: The building element type IfcShadingDeviceType defines commonly shared information for occurrences of shading devices.
fields:
  - name: predefined_type
    type: enum
    meaning: Identifies the predefined types of a shading device element from which the type required may be set.
    source_ref: "IfcShadingDeviceType attribute 1: IfcShadingDeviceTypeEnum; enumeration IfcShadingDeviceTypeEnum"
    values:
      - value: JALOUSIE
        meaning: A blind with adjustable horizontal slats for admitting light and air while excluding direct sun and rain.
      - value: SHUTTER
        meaning: A mechanical device that limits the passage of light.
      - value: AWNING
        meaning: A rooflike shelter of canvas or other material extending over a doorway, from the top of a window, over a deck, or similar, in order to provide protection, as from the sun.
      - value: USERDEFINED
        meaning: USERDEFINED (no description for this literal in the source documentation)
      - value: NOTDEFINED
        meaning: NOTDEFINED (no description for this literal in the source documentation)
