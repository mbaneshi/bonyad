    source_ref: "IfcProduct attribute 1: OPTIONAL IfcObjectPlacement"
    ref_to: ifc.object_placement
  - name: representation
    type: ref
    nullable: true
    meaning: Reference to the representations of the product, being either a representation (IfcProductRepresentation) or as a special case of a shape representation (IfcProductDefinitionShape).
