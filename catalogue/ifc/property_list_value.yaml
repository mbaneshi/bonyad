meaning: An IfcPropertyListValue defines a property that has several (numeric or descriptive) values assigned, these values are given by an ordered list. It defines a property - list value combination for which the property Name, an optional Description, the optional ListValues with measure type and optionally an Unit is given.
fields:
  - name: list_values
    type: array
    nullable: true
    meaning: List of property values.
    source_ref: "IfcPropertyListValue attribute 1: OPTIONAL LIST [1:?] OF IfcValue; elements are SELECT IfcValue of value types, stored as text (the member type tag is not kept)"
    of: text
  - name: unit
    type: ref
    nullable: true
    meaning: Unit for the list values, if not given, the default value for the measure type (given by the TYPE of nominal value) is used as defined by the global unit assignment at IfcProject.
    source_ref: "IfcPropertyListValue attribute 2: OPTIONAL IfcUnit; via select IfcUnit"
    ref_to: any
