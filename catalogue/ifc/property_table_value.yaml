code: ifc.property_table_value
name: IfcPropertyTableValue
kind: object
base: ifc.simple_property
fidelity: proxy
source:
  document: buildingSMART IFC4.3 EXPRESS schema (IFC4X3_RC4) with IFC4.3.x-development documentation
  section: IfcPropertyTableValue
  url: https://github.com/buildingSMART/IFC4.3.x-development/blob/2b8baa0a14d5ed1a9f99ef9443bdcb63a0cb0ab1/docs/schemas/resource/IfcPropertyResource/Entities/IfcPropertyTableValue.md
  version: IFC4X3_RC4 (EXPRESS issue date 2021-07-22); repo commit 2b8baa0a14d5; exp sha256 9b7d0c3e187f
  accessed_on: 2026-10-23
  licence: "buildingSMART: CC BY-ND 4.0 (repo LICENSE.md); EXPRESS header allows translation with full attribution, consent needed for changes. See SOURCES.md"
meaning: IfcPropertyTableValue is a property with a value range defined by a property object which has two lists of (numeric or descriptive) values assigned. The values specify a table with two columns.
fields:
  - name: defining_values
    type: array
    nullable: true
    meaning: List of defining values, which determine the defined values.
    source_ref: "IfcPropertyTableValue attribute 1: OPTIONAL LIST [1:?] OF UNIQUE IfcValue; elements are SELECT IfcValue of value types, stored as text (the member type tag is not kept)"
    of: text
  - name: defined_values
    type: array
    nullable: true
    meaning: Defined values which are applicable for the scope as defined by the defining values.
    source_ref: "IfcPropertyTableValue attribute 2: OPTIONAL LIST [1:?] OF IfcValue; elements are SELECT IfcValue of value types, stored as text (the member type tag is not kept)"
    of: text
  - name: expression
    type: text
    nullable: true
    meaning: Expression for the derivation of defined values from the defining values, the expression is given for information only, i.e. no automatic processing can be expected from the expression.
    source_ref: "IfcPropertyTableValue attribute 3: OPTIONAL IfcText"
  - name: defining_unit
    type: ref
    nullable: true
    meaning: Unit for the defining values, if not given, the default value for the measure type (given by the TYPE of the defining values) is used as defined by the global unit assignment at IfcProject.
    source_ref: "IfcPropertyTableValue attribute 4: OPTIONAL IfcUnit; via select IfcUnit"
    ref_to: any
  - name: defined_unit
    type: ref
    nullable: true
    meaning: Unit for the defined values, if not given, the default value for the measure type (given by the TYPE of the defined values) is used as defined by the global unit assignment at IfcProject.
    source_ref: "IfcPropertyTableValue attribute 5: OPTIONAL IfcUnit; via select IfcUnit"
    ref_to: any
  - name: curve_interpolation
    type: enum
    nullable: true
    meaning: Interpolation of the curve between two defining and defined values that are provided. if not provided a linear interpolation is assumed.
    source_ref: "IfcPropertyTableValue attribute 6: OPTIONAL IfcCurveInterpolationEnum; enumeration IfcCurveInterpolationEnum"
    values:
      - value: LINEAR
        meaning: Indicates that values between the defined values are to be found by linear interpolation.
      - value: LOG_LINEAR
        meaning: Indicates that values between the defined values are to be found by linear interpolation of the natural logarithm (base e) of the values.
      - value: LOG_LOG
        meaning: Indicates that values between the defined values are to be found by linear interpolation of the Briggs' logarithm (base 10) of the values.
      - value: NOTDEFINED
        meaning: No interpolation information is provided.
