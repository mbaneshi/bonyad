meaning: IfcLightDistributionData defines the luminous intensity of a light source given at a particular main plane angle. It is based on some standardized light distribution curves; the MainPlaneAngle is either the.
fields:
  - name: main_plane_angle
    type: angle
    meaning: The main plane angle (A, B or C angles, according to the light distribution curve chosen). Radians; converted from the project plane-angle unit at the source boundary.
    source_ref: "IfcLightDistributionData attribute 1: IfcPlaneAngleMeasure"
  - name: secondary_plane_angle
    type: array
    meaning: The list of secondary plane angles (the α, β or γ angles) according to the light distribution curve chosen. Radians; converted from the project plane-angle unit at the source boundary.
    source_ref: "IfcLightDistributionData attribute 2: LIST [1:?] OF IfcPlaneAngleMeasure"
    of: angle
  - name: luminous_intensity
    type: array
    meaning: The luminous intensity distribution measure for this pair of main and secondary plane angles according to the light distribution curve chosen.
    source_ref: "IfcLightDistributionData attribute 3: LIST [1:?] OF IfcLuminousIntensityDistributionMeasure"
    of: float
