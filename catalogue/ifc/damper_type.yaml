meaning: The flow controller type IfcDamperType defines commonly shared information for occurrences of dampers.
fields:
  - name: predefined_type
    type: enum
    meaning: Type of damper.
    source_ref: "IfcDamperType attribute 1: IfcDamperTypeEnum; enumeration IfcDamperTypeEnum"
    values:
      - value: BACKDRAFTDAMPER
        meaning: Damper used for purposes of manually balancing pressure differences.
      - value: BALANCINGDAMPER
        meaning: Backdraft damper used to restrict the movement of air in one direction.
      - value: BLASTDAMPER
        meaning: Blast damper used to prevent protect occupants and equipment against overpressures resultant of an explosion.
      - value: CONTROLDAMPER
        meaning: Control damper used to modulate the flow of air by adjusting the position of the blades.
      - value: FIREDAMPER
        meaning: Fire damper used to prevent the spread of fire for a specified duration.
      - value: FIRESMOKEDAMPER
        meaning: Combination fire and smoke damper used to prevent the spread of fire and smoke.
      - value: FUMEHOODEXHAUST
        meaning: Fume hood exhaust damper.
      - value: GRAVITYDAMPER
        meaning: Gravity damper closes from the force of gravity.
      - value: GRAVITYRELIEFDAMPER
        meaning: Gravity-relief damper used to allow air to move upon a buildup of enough pressure to overcome the gravitational force exerted upon the damper blades.
      - value: RELIEFDAMPER
        meaning: Relief damper used to allow air to move upon a buildup of a specified pressure differential.
      - value: SMOKEDAMPER
        meaning: Smoke damper used to prevent the spread of smoke.
      - value: USERDEFINED
        meaning: User-defined damper.
      - value: NOTDEFINED
        meaning: Undefined damper.
