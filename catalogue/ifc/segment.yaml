meaning: Definition of a curve segment with a trimming mechanism built in with a StartPlacement (first point) and SegmentLength (second point).
fields:
  - name: transition
    type: enum
    meaning: The state of transition (i.e., geometric continuity from the last point of this segment to the first point of the next segment) in IfcCompositeCurve and subtypes.
    source_ref: "IfcSegment attribute 1: IfcTransitionCode; enumeration IfcTransitionCode"
    values:
      - value: DISCONTINUOUS
        meaning: The segments do not join.
      - value: CONTINUOUS
        meaning: The segments join but no condition on their tangents is implied.
      - value: CONTSAMEGRADIENT
        meaning: "The segments join and their tangent vectors or tangent planes are parallel and have the same direction at the joint: equality of derivatives is not required."
      - value: CONTSAMEGRADIENTSAMECURVATURE
        meaning: "For a curve, the segments join, their tangent vectors are parallel and in the same direction and their curvatures are equal at the joint: equality of derivatives is not required."
notes: "Inverse attributes not stored: UsingCurves. SUPERTYPE OF ONEOF ( IfcCompositeCurveSegment , IfcCurveSegment )."
