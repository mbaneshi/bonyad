meaning: An IfcCurveStyle provides the style table for presentation information assigned to geometric curves. The style is defined by a color, a font and a width.
fields:
  - name: curve_font
    type: ref
    nullable: true
    meaning: A curve style font which is used to present a curve.
    source_ref: "IfcCurveStyle attribute 1: OPTIONAL IfcCurveFontOrScaledCurveFontSelect; via select IfcCurveFontOrScaledCurveFontSelect"
    ref_to: ifc.presentation_item
  - name: curve_width
    type: text
    nullable: true
    meaning: A positive length measure in units of the presentation area for the width of a presented curve.
    source_ref: "IfcCurveStyle attribute 2: OPTIONAL IfcSizeSelect; SELECT IfcSizeSelect of value types, stored as text (the member type tag is not kept)"
  - name: curve_colour
    type: ref
    nullable: true
    meaning: The colour of the visible part of the curve.
    source_ref: "IfcCurveStyle attribute 3: OPTIONAL IfcColour; via select IfcColour"
    ref_to: ifc.presentation_item
  - name: model_or_draughting
    type: bool
    nullable: true
    meaning: Indication whether the length measures provided for the presentation style are model based, or draughting based.
    source_ref: "IfcCurveStyle attribute 4: OPTIONAL IfcBoolean"
