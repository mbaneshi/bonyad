meaning: The reinforcing element type IfcReinforcingMeshType defines commonly shared information for occurrences of reinforcing meshs.
fields:
  - name: predefined_type
    type: enum
    meaning: Subtype of reinforcing mesh.
    source_ref: "IfcReinforcingMeshType attribute 1: IfcReinforcingMeshTypeEnum; enumeration IfcReinforcingMeshTypeEnum"
    values:
      - value: USERDEFINED
        meaning: The type of mesh is user defined.
      - value: NOTDEFINED
        meaning: The type of mesh is not defined.
  - name: mesh_length
    type: length
    nullable: true
    meaning: The overall length of the mesh measured in its longitudinal direction.
    source_ref: "IfcReinforcingMeshType attribute 2: OPTIONAL IfcPositiveLengthMeasure"
    check: positive
  - name: mesh_width
    type: length
    nullable: true
    meaning: The overall width of the mesh measured in its transversal direction.
    source_ref: "IfcReinforcingMeshType attribute 3: OPTIONAL IfcPositiveLengthMeasure"
    check: positive
  - name: longitudinal_bar_nominal_diameter
    type: length
    nullable: true
    meaning: The nominal diameter denoting the cross-section size of the longitudinal bars.
    source_ref: "IfcReinforcingMeshType attribute 4: OPTIONAL IfcPositiveLengthMeasure"
    check: positive
  - name: transverse_bar_nominal_diameter
    type: length
    nullable: true
    meaning: The nominal diameter denoting the cross-section size of the transverse bars.
    source_ref: "IfcReinforcingMeshType attribute 5: OPTIONAL IfcPositiveLengthMeasure"
    check: positive
  - name: longitudinal_bar_cross_section_area
    type: area
    nullable: true
    meaning: The effective cross-section area of the longitudinal bars of the mesh.
    source_ref: "IfcReinforcingMeshType attribute 6: OPTIONAL IfcAreaMeasure"
  - name: transverse_bar_cross_section_area
    type: area
    nullable: true
    meaning: The effective cross-section area of the transverse bars of the mesh.
    source_ref: "IfcReinforcingMeshType attribute 7: OPTIONAL IfcAreaMeasure"
  - name: longitudinal_bar_spacing
    type: length
    nullable: true
    meaning: The spacing between the longitudinal bars.
    source_ref: "IfcReinforcingMeshType attribute 8: OPTIONAL IfcPositiveLengthMeasure"
    check: positive
  - name: transverse_bar_spacing
    type: length
    nullable: true
    meaning: The spacing between the transverse bars.
    source_ref: "IfcReinforcingMeshType attribute 9: OPTIONAL IfcPositiveLengthMeasure"
    check: positive
  - name: bending_shape_code
    type: text
    nullable: true
    meaning: If this mesh type is bent rather than planar, this attribute provides a shape code per a standard like ACI 315, ISO 3766, or a similar standard.
    source_ref: "IfcReinforcingMeshType attribute 10: OPTIONAL IfcLabel"
  - name: bending_parameters
    type: array
    nullable: true
    meaning: If this mesh type is bent rather than planar, this attribute provides bending shape parameters.
    source_ref: "IfcReinforcingMeshType attribute 11: OPTIONAL LIST [1:?] OF IfcBendingParameterSelect; elements are SELECT IfcBendingParameterSelect of value types, stored as text (the member type tag is not kept)"
    of: text
