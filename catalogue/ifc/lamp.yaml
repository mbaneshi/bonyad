meaning: A lamp is an artificial light source such as a light bulb or tube.
fields:
  - name: predefined_type
    type: enum
    nullable: true
    meaning: PredefinedType attribute of IfcLamp (not described in the source documentation).
    source_ref: "IfcLamp attribute 1: OPTIONAL IfcLampTypeEnum; enumeration IfcLampTypeEnum"
    values:
      - value: COMPACTFLUORESCENT
        meaning: A fluorescent lamp having a compact form factor produced by shaping the tube.
      - value: FLUORESCENT
        meaning: A typically tubular discharge lamp in which most of the light is emitted by one or several layers of phosphors excited by ultraviolet radiation from the discharge.
      - value: HALOGEN
        meaning: An incandescent lamp in which a tungsten filament is sealed into a compact transport envelope filled with an inert gas and a small amount of halogen such as iodine or bromine.
      - value: HIGHPRESSUREMERCURY
        meaning: A discharge lamp in which most of the light is emitted by exciting mercury at high pressure.
      - value: HIGHPRESSURESODIUM
        meaning: A discharge lamp in which most of the light is emitted by exciting sodium at high pressure.
      - value: LED
        meaning: A solid state lamp that uses light-emitting diodes as the source of light.
      - value: METALHALIDE
        meaning: A discharge lamp in which most of the light is emitted by exciting a metal halide.
      - value: OLED
        meaning: A solid state lamp that uses light-emitting diodes as the source of light whose emissive electroluminescent layer is composed of a film of organic compounds.
      - value: TUNGSTENFILAMENT
        meaning: A lamp that emits light by passing an electrical current through a tungsten wire filament in a near vacuum.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
