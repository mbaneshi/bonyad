meaning: An IfcProcedure is a logical set of actions to be taken in response to an event or to cause an event to occur.
fields:
  - name: predefined_type
    type: enum
    nullable: true
    meaning: Identifies the predefined types of a procedure from which the type required may be set.
    source_ref: "IfcProcedure attribute 1: OPTIONAL IfcProcedureTypeEnum; enumeration IfcProcedureTypeEnum"
    values:
      - value: ADVICE_CAUTION
        meaning: A caution that should be taken note of as a procedure or when carrying out a procedure.
      - value: ADVICE_NOTE
        meaning: Additional information or advice that should be taken note of as a procedure or when carrying out a procedure.
      - value: ADVICE_WARNING
        meaning: A warning of potential danger that should be taken note of as a procedure or when carrying out a procedure.
      - value: CALIBRATION
        meaning: A procedure undertaken to calibrate an artifact.
      - value: DIAGNOSTIC
        meaning: Diagnostic.
      - value: SHUTDOWN
        meaning: A procedure undertaken to shutdown the operation of an artifact.
      - value: STARTUP
        meaning: A procedure undertaken to start up the operation of an artifact.
      - value: USERDEFINED
        meaning: User defined.
      - value: NOTDEFINED
        meaning: Undefined.
