meaning: The flow terminal type IfcWasteTerminalType defines commonly shared information for occurrences of waste terminals.
fields:
  - name: predefined_type
    type: enum
    meaning: Identifies the predefined types of waste terminal from which the type required may be set.
    source_ref: "IfcWasteTerminalType attribute 1: IfcWasteTerminalTypeEnum; enumeration IfcWasteTerminalTypeEnum"
    values:
      - value: FLOORTRAP
        meaning: Pipe fitting, set into the floor, that retains liquid to prevent the passage of foul air.
      - value: FLOORWASTE
        meaning: Pipe fitting, set into the floor, that collects waste water and discharges it to a separate trap.
      - value: GULLYSUMP
        meaning: Pipe fitting or assembly of fittings to receive surface water or waste water, fitted with a grating or sealed cover.
      - value: GULLYTRAP
        meaning: Pipe fitting or assembly of fittings that receives surface water or waste water; fitted with a grating or sealed cover that discharges water through a trap.
      - value: ROOFDRAIN
        meaning: Pipe fitting, set into the roof, that collects rainwater for discharge into the rainwater system.
      - value: WASTEDISPOSALUNIT
        meaning: Electrically operated device that reduces kitchen or other waste into fragments small enough to be flushed into a drainage system.
      - value: WASTETRAP
        meaning: Pipe fitting, set adjacent to a sanitary terminal, that retains liquid to prevent the passage of foul air.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
