meaning: An IfcDocumentReference is a reference to the location of a document. The reference is given by a system interpretable Location attribute (a URL string) where the document can be found, and an optional inherited internal reference Identification, which refers to a system interpretable position within the document.
fields:
  - name: description
    type: text
    nullable: true
    meaning: Description of the document reference for informational purposes.
    source_ref: "IfcDocumentReference attribute 1: OPTIONAL IfcText"
  - name: referenced_document
    type: ref
    nullable: true
    meaning: The document that is referenced.
    source_ref: "IfcDocumentReference attribute 2: OPTIONAL IfcDocumentInformation"
    ref_to: ifc.document_information
notes: "Inverse attributes not stored: DocumentRefForObjects."
