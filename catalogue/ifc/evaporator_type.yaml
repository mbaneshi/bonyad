meaning: The energy conversion device type IfcEvaporatorType defines commonly shared information for occurrences of evaporators.
fields:
  - name: predefined_type
    type: enum
    meaning: Defines the type of evaporator.
    source_ref: "IfcEvaporatorType attribute 1: IfcEvaporatorTypeEnum; enumeration IfcEvaporatorTypeEnum"
    values:
      - value: DIRECTEXPANSION
        meaning: Direct-expansion evaporator.
      - value: DIRECTEXPANSIONSHELLANDTUBE
        meaning: Direct-expansion evaporator where a refrigerant evaporates inside a series of baffles that channel the fluid throughout the shell side.
      - value: DIRECTEXPANSIONTUBEINTUBE
        meaning: Direct-expansion evaporator where a refrigerant evaporates inside one or more pairs of coaxial tubes.
      - value: DIRECTEXPANSIONBRAZEDPLATE
        meaning: Direct-expansion evaporator where a refrigerant evaporates inside plates brazed or welded together to make up an assembly of separate channels.
      - value: FLOODEDSHELLANDTUBE
        meaning: Evaporator in which refrigerant evaporates outside tubes.
      - value: SHELLANDCOIL
        meaning: Evaporator in which refrigerant evaporates inside a simple coiled tube immersed in the fluid to be cooled.
      - value: USERDEFINED
        meaning: User-defined evaporator type.
      - value: NOTDEFINED
        meaning: Undefined evaporator type.
