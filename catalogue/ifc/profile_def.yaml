meaning: IfcProfileDef is the supertype of all definitions of standard and arbitrary profiles within IFC. It is used to define a standard set of commonly used section profiles by their parameters or by their explicit curve geometry.
fields:
  - name: profile_type
    type: enum
    meaning: Defines the type of geometry into which this profile definition shall be resolved, either a curve or a surface area.
    source_ref: "IfcProfileDef attribute 1: IfcProfileTypeEnum; enumeration IfcProfileTypeEnum"
    values:
      - value: CURVE
        meaning: The resulting geometric item is of type curve and closed (with the only exception of the curve created by the IfcArbitraryOpenProfileDef which resolves into an open curve).
      - value: AREA
        meaning: The resulting geometric item is of type surface.
  - name: profile_name
    type: text
    nullable: true
    meaning: Human-readable name of the profile, for example according to a standard profile table.
    source_ref: "IfcProfileDef attribute 2: OPTIONAL IfcLabel"
notes: "Inverse attributes not stored: HasExternalReference, HasProperties. SUPERTYPE OF ONEOF ( IfcArbitraryClosedProfileDef , IfcArbitraryOpenProfileDef , IfcCompositeProfileDef , IfcDerivedProfileDef , IfcOpenCrossProfileDef , IfcParameterizedProfileDef )."
