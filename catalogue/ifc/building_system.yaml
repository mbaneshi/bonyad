meaning: A building system is a group by which building elements are grouped according to a common function within the facility.
fields:
  - name: predefined_type
    type: enum
    nullable: true
    meaning: Predefined types of distribution systems.
    source_ref: "IfcBuildingSystem attribute 1: OPTIONAL IfcBuildingSystemTypeEnum; enumeration IfcBuildingSystemTypeEnum"
    values:
      - value: FENESTRATION
        meaning: System of doors, windows, and other fillings in openings in a built envelope that are designed to permit the passage of air or light.
      - value: FOUNDATION
        meaning: System of shallow and deep foundation elements that transmit forces to the supporting ground.
      - value: LOADBEARING
        meaning: System of built elements that transmit forces and stiffen the construction.
      - value: OUTERSHELL
        meaning: System of built elements that provide the outer skin to protect the construction (such as the facade).
      - value: SHADING
        meaning: System of shading elements (external or internal) that permits the limitation or control of impact of natural sun light.
      - value: TRANSPORT
        meaning: System of all transport elements in a building that enables the transport of people or goods.
      - value: REINFORCING
        meaning: REINFORCING (no description for this literal in the source documentation)
      - value: PRESTRESSING
        meaning: PRESTRESSING (no description for this literal in the source documentation)
      - value: EROSIONPREVENTION
        meaning: EROSIONPREVENTION (no description for this literal in the source documentation)
      - value: USERDEFINED
        meaning: USERDEFINED (no description for this literal in the source documentation)
      - value: NOTDEFINED
        meaning: NOTDEFINED (no description for this literal in the source documentation)
  - name: long_name
    type: text
    nullable: true
    meaning: Long name for a building system, used for informal purposes.
    source_ref: "IfcBuildingSystem attribute 2: OPTIONAL IfcLabel"
