meaning: IfcPropertySetTemplate defines the template for all dynamically extensible property sets represented by IfcPropertySet. The property set template is a container of property templates within a property tree.
fields:
  - name: template_type
    type: enum
    nullable: true
    meaning: Property set type defining whether the property set is applicable to a type (subtypes of IfcTypeObject), to an occurrence (subtypes of IfcObject), or as a special case to a performance history.
    source_ref: "IfcPropertySetTemplate attribute 1: OPTIONAL IfcPropertySetTemplateTypeEnum; enumeration IfcPropertySetTemplateTypeEnum"
    values:
      - value: PSET_TYPEDRIVENONLY
        meaning: The property sets defined by this IfcPropertySetTemplate can only be assigned to subtypes of IfcTypeObject.
      - value: PSET_TYPEDRIVENOVERRIDE
        meaning: The property sets defined by this IfcPropertySetTemplate can be assigned to subtypes of IfcTypeObject and can be overridden by a property set with same name at subtypes of IfcObject.
      - value: PSET_OCCURRENCEDRIVEN
        meaning: The property sets defined by this IfcPropertySetTemplate can only be assigned to subtypes of IfcObject.
      - value: PSET_PERFORMANCEDRIVEN
        meaning: The property sets defined by this IfcPropertySetTemplate can only be assigned to IfcPerformanceHistory, which is related to the applicable object by means of IfcRelAssignsToControl.
      - value: QTO_TYPEDRIVENONLY
        meaning: The element quantity defined by this IfcPropertySetTemplate can only be assigned to subtypes of IfcTypeObject.
      - value: QTO_TYPEDRIVENOVERRIDE
        meaning: The element quantity defined by this IfcPropertySetTemplate can be assigned to subtypes of IfcTypeObject and can be overridden by an element quantity with same name at subtypes of IfcObject.
      - value: QTO_OCCURRENCEDRIVEN
        meaning: The element quantity defined by this IfcPropertySetTemplate can only be assigned to subtypes of IfcObject.
      - value: NOTDEFINED
        meaning: No restriction provided, the property sets defined by this IfcPropertySetTemplate can be assigned to any entity, if not otherwise restricted by the ApplicableEntity attribute.
  - name: applicable_entity
    type: text
    nullable: true
    meaning: The attribute optionally defines the data type of the applicable type or occurrence object, to which the assigned property set template can relate.
    source_ref: "IfcPropertySetTemplate attribute 2: OPTIONAL IfcIdentifier"
notes: "Inverse attributes not stored: Defines."
