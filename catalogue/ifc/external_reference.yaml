meaning: An IfcExternalReference is the identification of information that is not explicitly represented in the current model or in the project database (as an implementation of the current model). Such information may be contained in classifications, documents or libraries.
fields:
  - name: location
    type: text
    nullable: true
    meaning: Location, where the external source (classification, document or library) can be accessed by electronic means.
    source_ref: "IfcExternalReference attribute 1: OPTIONAL IfcURIReference"
  - name: identification
    type: text
    nullable: true
    meaning: The Identification provides a unique identifier of the referenced item within the external source (classification, document or library).
    source_ref: "IfcExternalReference attribute 2: OPTIONAL IfcIdentifier"
  - name: name
    type: text
    nullable: true
    meaning: Optional name to further specify the reference.
    source_ref: "IfcExternalReference attribute 3: OPTIONAL IfcLabel"
notes: "Inverse attributes not stored: ExternalReferenceForResources. SUPERTYPE OF ONEOF ( IfcClassificationReference , IfcDocumentReference , IfcExternallyDefinedHatchStyle , IfcExternallyDefinedSurfaceStyle , IfcExternallyDefinedTextFont , IfcLibraryReference )."
