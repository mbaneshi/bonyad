meaning: A two-dimensional open profile defined by widths and slopes for the use within the swept surface geometry, in SectionedSurface in particular. The underlying coordinate system is defined by the swept surface that uses the profile definition; when used in SectionedSurface it is the XY plane of each list member of SectionedSurface.CrossSectionPositions where …
fields:
  - name: horizontal_widths
    type: bool
    meaning: Indicates if the widths shall be measured horizontally or along the slopes.
    source_ref: "IfcOpenCrossProfileDef attribute 1: IfcBoolean"
  - name: widths
    type: array
    meaning: The horizontal widths (when HorizontalWidths=.T.) or distances along the Slope (when HorizontalWidths=.F.) for the segments in the profile.
    source_ref: "IfcOpenCrossProfileDef attribute 2: LIST [1:?] OF IfcNonNegativeLengthMeasure"
    of: length
  - name: slopes
    type: array
    meaning: The slope measure. Radians; converted from the project plane-angle unit at the source boundary.
    source_ref: "IfcOpenCrossProfileDef attribute 3: LIST [1:?] OF IfcPlaneAngleMeasure"
    of: angle
  - name: tags
    type: array
    nullable: true
    meaning: When used with IfcSectionedSurface, the Tag attribute is used to define interpolation transition curves and branching longitudinal breaklines.
    source_ref: "IfcOpenCrossProfileDef attribute 4: OPTIONAL LIST [2:?] OF IfcLabel"
    of: text
