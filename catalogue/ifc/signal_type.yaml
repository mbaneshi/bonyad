meaning: The IfcSignalType provides the type information for IfcSignal occurrences.
fields:
  - name: predefined_type
    type: enum
    meaning: Identifies the predefined type of a signal.
    source_ref: "IfcSignalType attribute 1: IfcSignalTypeEnum; enumeration IfcSignalTypeEnum"
    values:
      - value: VISUAL
        meaning: A signal type formed of an active device conveying information in a visual manner such as a light, cluster of lights, or mechanical moving shapes.
      - value: AUDIO
        meaning: A signal type formed of an active device conveying information by emitting an audio signal such as a beep, ring, horn or explosive sound.
      - value: MIXED
        meaning: A signal type formed of an active device conveying information in both a visual and audio manner.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
