meaning: The opening element stands for opening, recess or chase, all reflecting voids. It represents a void within any element that has physical manifestation.
fields:
  - name: predefined_type
    type: enum
    nullable: true
    meaning: Predefined generic type for an opening that is specified in an enumeration.
    source_ref: "IfcOpeningElement attribute 1: OPTIONAL IfcOpeningElementTypeEnum; enumeration IfcOpeningElementTypeEnum"
    values:
      - value: OPENING
        meaning: An opening as subtraction feature that cuts through the element it voids.
      - value: RECESS
        meaning: An opening as subtraction feature that does not cut through the element it voids.
      - value: USERDEFINED
        meaning: User-defined opening element.
      - value: NOTDEFINED
        meaning: Undefined opening element.
