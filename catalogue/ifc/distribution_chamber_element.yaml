code: ifc.distribution_chamber_element
name: IfcDistributionChamberElement
kind: entity
base: ifc.distribution_flow_element
fidelity: proxy
source:
  document: buildingSMART IFC4.3 EXPRESS schema (IFC4X3_RC4) with IFC4.3.x-development documentation
  section: IfcDistributionChamberElement
