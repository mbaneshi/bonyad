fields:
  - name: predefined_type
    type: enum
    meaning: Identifies the predefined type of a navigational element.
    source_ref: "IfcNavigationElementType attribute 1: IfcNavigationElementTypeEnum; enumeration IfcNavigationElementTypeEnum"
    values:
      - value: BEACON
        meaning: a fixed vertical structure serving as a navigation mark, to show reefs or other hazards, or provide navigational directions.
      - value: BUOY
        meaning: an anchored floating structure serving as a navigation mark, to show reefs or other hazards, or provide navigational directions.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
