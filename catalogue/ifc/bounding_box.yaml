meaning: The IfcBoundingBox defines an orthogonal box oriented parallel to the axes of the object coordinate system in which it is defined. It is defined by a Corner being a three-dimensional Cartesian point and three length measures defining the X, Y and Z parameters of the box in the direction of the positive axes.
fields:
  - name: corner
    type: ref
    meaning: Location of the bottom left corner (having the minimum values).
    source_ref: "IfcBoundingBox attribute 1: IfcCartesianPoint"
    ref_to: ifc.cartesian_point
  - name: x_dim
    type: length
    meaning: Length attribute (measured along the edge parallel to the X Axis).
    source_ref: "IfcBoundingBox attribute 2: IfcPositiveLengthMeasure"
    check: positive
  - name: y_dim
    type: length
    meaning: Width attribute (measured along the edge parallel to the Y Axis).
    source_ref: "IfcBoundingBox attribute 3: IfcPositiveLengthMeasure"
    check: positive
  - name: z_dim
    type: length
    meaning: Height attribute (measured along the edge parallel to the Z Axis).
    source_ref: "IfcBoundingBox attribute 4: IfcPositiveLengthMeasure"
    check: positive
notes: "Derived attributes not stored: Dim."
