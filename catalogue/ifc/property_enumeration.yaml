meaning: IfcPropertyEnumeration is a collection of simple or measure values that define a prescribed set of alternatives from which 'enumeration values' are selected. This enables inclusion of enumeration values in property sets.
fields:
  - name: name
    type: text
    meaning: Name of this enumeration.
    source_ref: "IfcPropertyEnumeration attribute 1: IfcLabel"
  - name: enumeration_values
    type: array
    meaning: List of values that form the enumeration.
    source_ref: "IfcPropertyEnumeration attribute 2: LIST [1:?] OF UNIQUE IfcValue; elements are SELECT IfcValue of value types, stored as text (the member type tag is not kept)"
    of: text
  - name: unit
    type: ref
    nullable: true
    meaning: Unit for the enumerator values, if not given, the default value for the measure type (given by the TYPE of nominal value) is used as defined by the global unit assignment at IfcProject.
    source_ref: "IfcPropertyEnumeration attribute 3: OPTIONAL IfcUnit; via select IfcUnit"
    ref_to: any
