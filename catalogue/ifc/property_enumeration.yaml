code: ifc.property_enumeration
name: IfcPropertyEnumeration
kind: object
base: ifc.property_abstraction
fidelity: proxy
source:
  document: buildingSMART IFC4.3 EXPRESS schema (IFC4X3_RC4) with IFC4.3.x-development documentation
