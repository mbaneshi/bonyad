meaning: The property with a single value IfcPropertySingleValue defines a property object which has a single (numeric or descriptive) value assigned. It defines a property - single value combination for which the property Name, an optional Description, and an optional NominalValue with measure type is provided.
fields:
  - name: nominal_value
    type: text
    nullable: true
    meaning: Value and measure type of this property.
    source_ref: "IfcPropertySingleValue attribute 1: OPTIONAL IfcValue; SELECT IfcValue of value types, stored as text (the member type tag is not kept)"
  - name: unit
    type: ref
    nullable: true
    meaning: Unit for the nominal value, if not given, the default value for the measure type (given by the TYPE of nominal value) is used as defined by the global unit assignment at IfcProject.
    source_ref: "IfcPropertySingleValue attribute 2: OPTIONAL IfcUnit; via select IfcUnit"
    ref_to: any
