meaning: IfcProjectedCRS is a coordinate reference system (CRS) of the map to which the map translation of the local engineering coordinate system of the construction or facility engineering project relates. The projected coordinate reference system is assumed to be a 2D or 3D right-handed Cartesian coordinate system, the optional MapUnit attribute can be used to …
fields:
  - name: map_projection
    type: text
    nullable: true
    meaning: Name by which the map projection is identified.
    source_ref: "IfcProjectedCRS attribute 1: OPTIONAL IfcIdentifier"
  - name: map_zone
    type: text
    nullable: true
    meaning: Name by which the map zone, relating to the MapProjection, is identified.
    source_ref: "IfcProjectedCRS attribute 2: OPTIONAL IfcIdentifier"
  - name: map_unit
    type: ref
    nullable: true
    meaning: Unit of the coordinate axes composing the map coordinate system.
    source_ref: "IfcProjectedCRS attribute 3: OPTIONAL IfcNamedUnit"
    ref_to: ifc.named_unit
