meaning: IfcMaterialLayerWithOffsets is a specialization of IfcMaterialLayer enabling definition of offset values along edges (within the material layer set usage in parent layer set).
fields:
  - name: offset_direction
    type: enum
    meaning: Orientation of the offset; shall be perpendicular to the parent layer set direction.
    source_ref: "IfcMaterialLayerWithOffsets attribute 1: IfcLayerSetDirectionEnum; enumeration IfcLayerSetDirectionEnum"
    values:
      - value: AXIS1
        meaning: Usually x-axis.
      - value: AXIS2
        meaning: Usually y-axis.
      - value: AXIS3
        meaning: Usually z-axis.
  - name: offset_values
    type: array
    meaning: The numerical value of layer offset, in the direction of the axis assigned by the attribute OffsetDirection.
    source_ref: "IfcMaterialLayerWithOffsets attribute 2: ARRAY [1:2] OF IfcLengthMeasure"
    of: length
