meaning: IfcBuildingElementProxyType defines a list of commonly shared property set definitions of a building element proxy and an optional set of product representations. It is used to define an element specification (i.e. the specific product information, that is common to all occurrences of that product type).
fields:
  - name: predefined_type
    type: enum
    meaning: Predefined types to define the particular type of an building element proxy.
    source_ref: "IfcBuildingElementProxyType attribute 1: IfcBuildingElementProxyTypeEnum; enumeration IfcBuildingElementProxyTypeEnum"
    values:
      - value: COMPLEX
        meaning: Not used - kept for upward compatibility.
      - value: ELEMENT
        meaning: Not used - kept for upward compatibility.
      - value: PARTIAL
        meaning: Not used - kept for upward compatibility.
      - value: PROVISIONFORVOID
        meaning: The proxy denotes a provision for voids (a proposed opening not applied as void yet).
      - value: PROVISIONFORSPACE
        meaning: The proxy denotes a provision for space (e.g. the space allocated as a provision for mechanical equipment or furniture).
      - value: USERDEFINED
        meaning: User-defined building element proxy.
      - value: NOTDEFINED
        meaning: Undefined building element proxy.
