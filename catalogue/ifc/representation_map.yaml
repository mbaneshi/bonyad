meaning: An IfcRepresentationMap defines the base definition (also referred to as block, cell or macro) called MappedRepresentation within the MappingOrigin. The MappingOrigin defines the coordinate system in which the MappedRepresentation is defined.
fields:
  - name: mapping_origin
    type: ref
    meaning: An axis2 placement that defines the position about which the mapped representation is mapped.
    source_ref: "IfcRepresentationMap attribute 1: IfcAxis2Placement; via select IfcAxis2Placement"
    ref_to: ifc.placement
  - name: mapped_representation
    type: ref
    meaning: A representation that is mapped to at least one mapped item.
    source_ref: "IfcRepresentationMap attribute 2: IfcRepresentation"
    ref_to: ifc.representation
notes: "Inverse attributes not stored: HasShapeAspects, MapUsage."
