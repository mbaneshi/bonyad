meaning: IfcLinearPlacement provides a specialization of IfcObjectPlacement in which the placement and axis direction of the object coordinate system is defined by a reference to a curve. RelativePlacement is therefore restricted to IfcAxis2PlacementLinear.
fields:
  - name: relative_placement
    type: ref
    meaning: Placement that provides location and orientation confined to the context of a curve.
    source_ref: "IfcLinearPlacement attribute 1: IfcAxis2PlacementLinear"
    ref_to: ifc.axis2_placement_linear
  - name: cartesian_position
    type: ref
    nullable: true
    meaning: Optional fallback for the RelativePlacement attribute, which may be used by importing applications that do not support linear placement.
    source_ref: "IfcLinearPlacement attribute 2: OPTIONAL IfcAxis2Placement3D"
    ref_to: ifc.axis2_placement3d
