meaning: The IfcSurfaceStyleShading allows for colour information and transparency used for shading and simple rendering. The surface colour is used for colouring or simple shading of the assigned surfaces and the transparency for identifying translucency, where 0.0 is completely opaque, and 1.0 is completely transparent.
fields:
  - name: surface_colour
    type: ref
    meaning: The colour used to render the surface.
    source_ref: "IfcSurfaceStyleShading attribute 1: IfcColourRgb"
    ref_to: ifc.colour_rgb
  - name: transparency
    type: ratio
    nullable: true
    meaning: The transparency field specifies how "clear" an object is, with 1.0 being completely transparent, and 0.0 completely opaque.
    source_ref: "IfcSurfaceStyleShading attribute 2: OPTIONAL IfcNormalisedRatioMeasure"
    check: unit_interval
notes: SUPERTYPE OF ONEOF ( IfcSurfaceStyleRendering ).
