meaning: The furnishing element type IfcFurnitureType defines commonly shared information for occurrences of furnitures.
fields:
  - name: assembly_place
    type: enum
    meaning: A designation of where the assembly is intended to take place.
    source_ref: "IfcFurnitureType attribute 1: IfcAssemblyPlaceEnum; enumeration IfcAssemblyPlaceEnum"
    values:
      - value: SITE
        meaning: This assembly is assembled at site.
      - value: FACTORY
        meaning: This assembly is assembled in a factory.
      - value: NOTDEFINED
        meaning: NOTDEFINED (no description for this literal in the source documentation)
  - name: predefined_type
    type: enum
    nullable: true
    meaning: PredefinedType attribute of IfcFurnitureType (not described in the source documentation).
    source_ref: "IfcFurnitureType attribute 2: OPTIONAL IfcFurnitureTypeEnum; enumeration IfcFurnitureTypeEnum"
    values:
      - value: CHAIR
        meaning: Furniture for seating a single person.
      - value: TABLE
        meaning: Furniture with a countertop for multiple people.
      - value: DESK
        meaning: Furniture with a countertop and optional drawers for a single person.
      - value: BED
        meaning: Furniture for sleeping.
      - value: FILECABINET
        meaning: Furniture with sliding drawers for storing files.
      - value: SHELF
        meaning: Furniture for storing books or other items.
      - value: SOFA
        meaning: Furniture for seating multiple people.
      - value: TECHNICALCABINET
        meaning: A technical cabinet is a piece of furniture for holding, displaying and protecting technical appliances, usually organized in shelves, drawers or racks.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
