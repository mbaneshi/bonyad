meaning: IfcSectionProperties defines the cross section properties for a single longitudinal piece of a cross section. It is a special-purpose helper class for IfcSectionReinforcementProperties.
fields:
  - name: section_type
    type: enum
    meaning: An indicator whether a specific piece of a cross section is uniform or tapered in longitudinal direction.
    source_ref: "IfcSectionProperties attribute 1: IfcSectionTypeEnum; enumeration IfcSectionTypeEnum"
    values:
      - value: UNIFORM
        meaning: The section is uniform in longitudinal direction.
      - value: TAPERED
        meaning: The section is tapered in longitudinal direction.
  - name: start_profile
    type: ref
    meaning: The cross section profile at the start point of the longitudinal section.
    source_ref: "IfcSectionProperties attribute 2: IfcProfileDef"
    ref_to: ifc.profile_def
  - name: end_profile
    type: ref
    nullable: true
    meaning: The cross section profile at the end point of the longitudinal section.
    source_ref: "IfcSectionProperties attribute 3: OPTIONAL IfcProfileDef"
    ref_to: ifc.profile_def
