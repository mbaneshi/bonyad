meaning: The IfcElementAssemblyType defines a list of commonly shared property set definitions of an element and an optional set of product representations. It is used to define an element specification (i.e. the specific product information, that is common to all occurrences of that product type).
fields:
  - name: predefined_type
    type: enum
    meaning: Predefined types to define the particular type of the transport element.
    source_ref: "IfcElementAssemblyType attribute 1: IfcElementAssemblyTypeEnum; enumeration IfcElementAssemblyTypeEnum"
    values:
      - value: ACCESSORY_ASSEMBLY
        meaning: Assembled accessories or components.
      - value: ARCH
        meaning: A curved structure.
      - value: BEAM_GRID
        meaning: Interconnected beams, located in one (typically horizontal) plane.
      - value: BRACED_FRAME
        meaning: A rigid frame with additional bracing members.
      - value: GIRDER
        meaning: A beam-like superstructure, such as bridge main girder extending between abutments and piers built up of beams, braces (as Members) etc. - may also be an aggregation of girder segments.
      - value: REINFORCEMENT_UNIT
        meaning: Assembled reinforcement elements.
      - value: RIGID_FRAME
        meaning: A structure built up of beams, columns, etc. with moment-resisting joints, such as gantry.
      - value: SLAB_FIELD
        meaning: Slabs, laid out in one plane.
      - value: TRUSS
        meaning: A structure built up of members with (quasi) pinned joint.
      - value: ABUTMENT
        meaning: A bridge abutment built up of walls, beams, slabs etc.
      - value: PIER
        meaning: An intermediate support e.g. in a bridge, built up of walls, columns, beams etc.
      - value: PYLON
        meaning: A vertical structure supporting cables in suspended or stayed structure.
      - value: CROSS_BRACING
        meaning: A Structural linear member or assembly of members inside a box girder or between girders, typically on a pier, to resist lateral forces and transfer them to the support.
      - value: DECK
        meaning: A platform (such as floor or bridge deck) built up of beams, slabs.
      - value: MAST
        meaning: An assembly of plates, members, cables or fasteners that form a vertical structure for the support or mounting of other equipment such as lights, sonar or wireless transmitters.
      - value: SIGNALASSEMBLY
        meaning: An assembly to physically aggregate together one or more signal instances (and also sign instances) including any supporting structural elements such as a simple pole or a rigid frame gantry.
      - value: GRID
        meaning: A framework of spaced cables or bars that are parallel to or cross each other.
      - value: SHELTER
        meaning: A structure, fairly quick to setup, move or dismantle, used to give protection, especially from the weather or intrusion.
      - value: SUPPORTINGASSEMBLY
        meaning: An assembly intends to support Overhead Contact Line System.
      - value: SUSPENSIONASSEMBLY
        meaning: A complex assembly of components used to suspend elements or cable segments.
      - value: TRACTION_SWITCHING_ASSEMBLY
        meaning: A common assembly used to insure the switching function.
      - value: TRACKPANEL
        meaning: Trackwork ensuring the support and guidance of a vehicle along a route.
      - value: TURNOUTPANEL
        meaning: Trackwork ensuring the support and guidance of a vehicle along any given route among various diverging or intersecting tracks.
      - value: DILATATIONPANEL
        meaning: Device which permits longitudinal relative rail movement of two adjacent rails, while maintaining correct guidance and support.
      - value: RAIL_MECHANICAL_EQUIPMENT_ASSEMBLY
        meaning: A complex assembly made up of several components like blocking device, speed regulator, bias loaded inspector, track scale or controllable retarder.
      - value: ENTRANCEWORKS
        meaning: An assembly forming the support structure of a chamber (lock, dock) gate and associated elements, plus the containment of operational equipment.
      - value: SUMPBUSTER
        meaning: An obstacle (with oil catchment basin) installed typically in a bus lane to prevent other traffic with lower ground clearance from using it.
      - value: TRAFFIC_CALMING_DEVICE
        meaning: A structure on the carriageway to control the speed of vehicles.
      - value: USERDEFINED
        meaning: User-defined element assembly.
      - value: NOTDEFINED
        meaning: Undefined element assembly.
