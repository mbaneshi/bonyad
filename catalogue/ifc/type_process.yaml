    type: text
    nullable: true
    meaning: An identifying designation given to a process type.
    source_ref: "IfcTypeProcess attribute 1: OPTIONAL IfcIdentifier"
  - name: long_description
    type: text
    nullable: true
    meaning: A long description, or text, describing the activity in detail.
    source_ref: "IfcTypeProcess attribute 2: OPTIONAL IfcText"
  - name: process_type
    type: text
    nullable: true
    meaning: The type denotes a particular type that indicates the process further.
    source_ref: "IfcTypeProcess attribute 3: OPTIONAL IfcLabel"
