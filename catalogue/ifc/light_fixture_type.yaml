meaning: The flow terminal type IfcLightFixtureType defines commonly shared information for occurrences of light fixtures.
fields:
  - name: predefined_type
    type: enum
    meaning: Identifies the predefined types of light fixture from which the type required may be set.
    source_ref: "IfcLightFixtureType attribute 1: IfcLightFixtureTypeEnum; enumeration IfcLightFixtureTypeEnum"
    values:
      - value: POINTSOURCE
        meaning: A light fixture that is considered to have negligible area and that emit light with approximately equal intensity in all directions.
      - value: DIRECTIONSOURCE
        meaning: A light fixture that is considered to have a length or surface area from which it emits light in a direction.
      - value: SECURITYLIGHTING
        meaning: A light fixture having specific purpose of directing occupants in an emergency, such as an illuminated exit sign or emergency flood light.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
