meaning: The flow terminal type IfcAudioVisualApplianceType defines commonly shared information for occurrences of audio visual appliances.
fields:
  - name: predefined_type
    type: enum
    meaning: Identifies the predefined types of audio-visual appliance from which the type required may be set.
    source_ref: "IfcAudioVisualApplianceType attribute 1: IfcAudioVisualApplianceTypeEnum; enumeration IfcAudioVisualApplianceTypeEnum"
    values:
      - value: AMPLIFIER
        meaning: A device that receives an audio signal and amplifies it to play through speakers.
      - value: CAMERA
        meaning: A device that records images, either as a still photograph or as moving images known as videos or movies.
      - value: DISPLAY
        meaning: An electronic device that represents information in visual form such as a flat-panel display or television.
      - value: MICROPHONE
        meaning: An acoustic-to-electric transducer or sensor that converts sound into an electrical signal.
      - value: PLAYER
        meaning: A device that plays audio and/or video content directly or to another device, having fixed or removable storage media.
      - value: PROJECTOR
        meaning: An apparatus for projecting a picture on a screen.
      - value: RECEIVER
        meaning: A device that receives audio and/or video signals, switches sources, and amplifies signals to play through speakers.
      - value: SPEAKER
        meaning: A loudspeaker, speaker, or speaker system is an electroacoustical transducer that converts an electrical signal to sound.
      - value: SWITCHER
        meaning: A device that receives audio and/or video signals, switches sources, and transmits signals to downstream devices.
      - value: TELEPHONE
        meaning: A telecommunications device that is used to transmit and receive sound, and optionally video.
      - value: TUNER
        meaning: An electronic receiver that detects, demodulates, and amplifies transmitted signals.
      - value: COMMUNICATIONTERMINAL
        meaning: A communication terminal is an audio communication device that is usually installed along transportation infrastructure (railways, roads, tunnels etc.) in order to be used by the general public or operation agents for …
      - value: RECORDINGEQUIPMENT
        meaning: A recording equipment is a device that records telephone calls or other types of audio data.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
