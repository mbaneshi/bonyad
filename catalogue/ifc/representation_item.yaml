meaning: The IfcRepresentationItem is used within an IfcRepresentation (directly or indirectly through other _IfcRepresentationItem_'s) to represent an IfcProductRepresentation. Most commonly these _IfcRepresentationItem_'s are geometric or topological representation items, that can (but not need to) have presentation style information assigned.
