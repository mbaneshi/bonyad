fields:
  - name: predefined_type
    type: enum
    meaning: Identifies the predefined types of electrical time control from which the type required may be set.
    source_ref: "IfcElectricTimeControlType attribute 1: IfcElectricTimeControlTypeEnum; enumeration IfcElectricTimeControlTypeEnum"
    values:
      - value: TIMECLOCK
        meaning: A control that causes action to occur at set times.
      - value: TIMEDELAY
        meaning: A control that causes action to occur following a set duration.
      - value: RELAY
        meaning: Electromagnetically operated contactor for making or breaking a control circuit.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
