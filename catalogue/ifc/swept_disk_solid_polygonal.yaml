meaning: The IfcSweptDiskSolidPolygonal is a IfcSweptDiskSolid where the Directrix is restricted to be provided by an poly line only. An optional FilletRadius attribute can be asserted, it is then applied as a fillet to all transitions between the segments of the poly line.
fields:
  - name: fillet_radius
    type: length
    nullable: true
    meaning: The fillet that is equally applied to all transitions between the segments of the IfcPolyline, providing the geometric representation for _the Directrix_. If omitted, no fillet is applied to the segments.
    source_ref: "IfcSweptDiskSolidPolygonal attribute 1: OPTIONAL IfcPositiveLengthMeasure"
    check: positive
