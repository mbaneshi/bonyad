meaning: The IfcPolygonalFaceSet is a tessellated face set with all faces being bound by polygons. The planar faces are constructed by implicit polylines defined by three or more Cartesian points.
fields:
  - name: closed
    type: bool
    nullable: true
    meaning: Indication whether the face set is a closed shell (TRUE) or an open shell (FALSE).
    source_ref: "IfcPolygonalFaceSet attribute 1: OPTIONAL IfcBoolean"
  - name: pn_index
    type: array
    nullable: true
    meaning: The list of integers defining the locations in the IfcCartesianPointList3D to obtain the point coordinates for the indices at the indexed polygonal faces.
    source_ref: "IfcPolygonalFaceSet attribute 3: OPTIONAL LIST [1:?] OF IfcPositiveInteger"
