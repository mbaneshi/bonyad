    source_ref: "IfcFastenerType attribute 1: IfcFastenerTypeEnum; enumeration IfcFastenerTypeEnum"
    values:
      - value: GLUE
        meaning: A fastening connection where glue is used to join together elements.
      - value: MORTAR
        meaning: A composition of mineralic or other materials used to fill jointing gaps and possibly fulfilling a load carrying role.
      - value: WELD
        meaning: A weld seam between parts of metallic material or other suitable materials.
