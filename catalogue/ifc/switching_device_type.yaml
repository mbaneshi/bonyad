meaning: The flow controller type IfcSwitchingDeviceType defines commonly shared information for occurrences of switching devices.
fields:
  - name: predefined_type
    type: enum
    meaning: Identifies the predefined types of switch from which the type required may be set.
    source_ref: "IfcSwitchingDeviceType attribute 1: IfcSwitchingDeviceTypeEnum; enumeration IfcSwitchingDeviceTypeEnum"
    values:
      - value: CONTACTOR
        meaning: An electrical device used to control the flow of power in a circuit on or off.
      - value: DIMMERSWITCH
        meaning: A dimmer switch has variable positions, and may adjust electrical power or other setting (according to the switched port type).
      - value: EMERGENCYSTOP
        meaning: An emergency stop device acts to remove as quickly as possible any danger that may have arisen unexpectedly.
      - value: KEYPAD
        meaning: A set of buttons or switches, each potentially applicable to a different device.
      - value: MOMENTARYSWITCH
        meaning: A momentary switch has no position, and may trigger some action to occur.
      - value: SELECTORSWITCH
        meaning: A selector switch has multiple positions, and may change the source or level of power or other setting (according to the switched port type).
      - value: STARTER
        meaning: A starter is a switch which in the closed position controls the application of power to an electrical device.
      - value: SWITCHDISCONNECTOR
        meaning: A switch disconnector is a switch which in the open position satisfies the isolating requirements specified for a disconnector.
      - value: TOGGLESWITCH
        meaning: A toggle switch has two positions, and may enable or isolate electrical power or other setting (according to the switched port type).
      - value: RELAY
        meaning: A device designed to produce sudden predetermined changes in one or more electric output circuits, when certain conditions are fulfilled in the electric input circuits controlling the device.
      - value: START_AND_STOP_EQUIPMENT
        meaning: A switch for alternatively closing and opening one or more electric circuits.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
