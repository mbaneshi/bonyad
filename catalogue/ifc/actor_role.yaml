meaning: This entity indicates a role which is performed by an actor, either a person, an organization or a person related to an organization.
fields:
  - name: role
    type: enum
    meaning: The name of the role played by an actor.
    source_ref: "IfcActorRole attribute 1: IfcRoleEnum; enumeration IfcRoleEnum"
    values:
      - value: SUPPLIER
        meaning: Supplier.
      - value: MANUFACTURER
        meaning: Manufacturer.
      - value: CONTRACTOR
        meaning: Contractor.
      - value: SUBCONTRACTOR
        meaning: Sub-contractor.
      - value: ARCHITECT
        meaning: Architect.
      - value: STRUCTURALENGINEER
        meaning: Structural engineer.
      - value: COSTENGINEER
        meaning: Cost engineer.
      - value: CLIENT
        meaning: Client.
      - value: BUILDINGOWNER
        meaning: Facility owner.
      - value: BUILDINGOPERATOR
        meaning: Facility operator.
      - value: MECHANICALENGINEER
        meaning: Mechanical engineer.
      - value: ELECTRICALENGINEER
        meaning: Electrical engineer.
      - value: PROJECTMANAGER
        meaning: Project manager.
      - value: FACILITIESMANAGER
        meaning: Facilities manager.
      - value: CIVILENGINEER
        meaning: Civil engineer.
      - value: COMMISSIONINGENGINEER
        meaning: Commissioning engineer.
      - value: ENGINEER
        meaning: Engineer.
      - value: OWNER
        meaning: Owner.
      - value: CONSULTANT
        meaning: Consultant.
      - value: CONSTRUCTIONMANAGER
        meaning: Construction manager.
      - value: FIELDCONSTRUCTIONMANAGER
        meaning: Field construction manager.
      - value: RESELLER
        meaning: Reseller.
      - value: USERDEFINED
        meaning: User defined value to be provided.
  - name: user_defined_role
    type: text
    nullable: true
    meaning: Allows for specification of user defined roles beyond the enumeration values provided by Role attribute of type IfcRoleEnum.
    source_ref: "IfcActorRole attribute 2: OPTIONAL IfcLabel"
  - name: description
    type: text
    nullable: true
    meaning: A textual description relating the nature of the role played by an actor.
    source_ref: "IfcActorRole attribute 3: OPTIONAL IfcText"
notes: "Inverse attributes not stored: HasExternalReference."
