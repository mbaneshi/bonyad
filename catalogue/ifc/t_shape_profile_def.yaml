meaning: IfcTShapeProfileDef defines a section profile that provides the defining parameters of a T-shaped section to be used by the swept area solid. Its parameters and orientation relative to the position coordinate system are according to the following illustration.
fields:
  - name: depth
    type: length
    meaning: Web lengths, see illustration above (= h).
    source_ref: "IfcTShapeProfileDef attribute 1: IfcPositiveLengthMeasure"
    check: positive
  - name: flange_width
    type: length
    meaning: Flange lengths, see illustration above (= b).
    source_ref: "IfcTShapeProfileDef attribute 2: IfcPositiveLengthMeasure"
    check: positive
  - name: web_thickness
    type: length
    meaning: Constant wall thickness of web (= ts).
    source_ref: "IfcTShapeProfileDef attribute 3: IfcPositiveLengthMeasure"
    check: positive
  - name: flange_thickness
    type: length
    meaning: Constant wall thickness of flange (= tg).
    source_ref: "IfcTShapeProfileDef attribute 4: IfcPositiveLengthMeasure"
    check: positive
  - name: fillet_radius
    type: length
    nullable: true
    meaning: Fillet radius according the above illustration (= r1).
    source_ref: "IfcTShapeProfileDef attribute 5: OPTIONAL IfcNonNegativeLengthMeasure"
    check: non_negative
  - name: flange_edge_radius
    type: length
    nullable: true
    meaning: Edge radius according the above illustration (= r2).
    source_ref: "IfcTShapeProfileDef attribute 6: OPTIONAL IfcNonNegativeLengthMeasure"
    check: non_negative
  - name: web_edge_radius
    type: length
    nullable: true
    meaning: Edge radius according the above illustration (= r3).
    source_ref: "IfcTShapeProfileDef attribute 7: OPTIONAL IfcNonNegativeLengthMeasure"
    check: non_negative
  - name: web_slope
    type: angle
    nullable: true
    meaning: Slope of flange of the profile. Radians; converted from the project plane-angle unit at the source boundary.
    source_ref: "IfcTShapeProfileDef attribute 8: OPTIONAL IfcPlaneAngleMeasure"
  - name: flange_slope
    type: angle
    nullable: true
    meaning: Slope of web of the profile. Radians; converted from the project plane-angle unit at the source boundary.
    source_ref: "IfcTShapeProfileDef attribute 9: OPTIONAL IfcPlaneAngleMeasure"
