meaning: IfcReferent defines a position at a particular offset along an alignment curve.
fields:
  - name: predefined_type
    type: enum
    nullable: true
    meaning: Predefined types to define the particular type of the referent.
    source_ref: "IfcReferent attribute 1: OPTIONAL IfcReferentTypeEnum; enumeration IfcReferentTypeEnum"
    values:
      - value: KILOPOINT
        meaning: Kilo point.
      - value: MILEPOINT
        meaning: Mile point.
      - value: STATION
        meaning: A referent that defines the stationing (chainage) system along a linear element, either by establishing the station origin or by recording a station equation (gap or overlap discontinuity) where stationing is …
      - value: REFERENCEMARKER
        meaning: The reference marker is a notation referent, typically located in the right of way of the road, rail or other transportation system.
      - value: LANDMARK
        meaning: The referent is the location of a physical landmark visible in the field.
      - value: BOUNDARY
        meaning: The referent represents where an administrative or maintenance boundary crosses the linear element being measured.
      - value: INTERSECTION
        meaning: The referent is the location of an intersection specified by the referent name.
      - value: POSITION
        meaning: Used to fully describe a linearly referenced location given by the linear element being measured (the IfcAlignment into which the IfcReferent is nested), the method of measurement (Pset_LinearReferencingMethod) and a …
      - value: USERDEFINED
        meaning: User defined.
      - value: NOTDEFINED
        meaning: Undefined.
  - name: restart_distance
    type: length
    nullable: true
    meaning: Optional value in case of broken linear referencing required to keep stationing further down the alignment unchanged.
    source_ref: "IfcReferent attribute 2: OPTIONAL IfcLengthMeasure"
