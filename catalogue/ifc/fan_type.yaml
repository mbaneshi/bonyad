meaning: The flow moving device type IfcFanType defines commonly shared information for occurrences of fans.
fields:
  - name: predefined_type
    type: enum
    meaning: Defines the type of fan typically used in building services.
    source_ref: "IfcFanType attribute 1: IfcFanTypeEnum; enumeration IfcFanTypeEnum"
    values:
      - value: CENTRIFUGALFORWARDCURVED
        meaning: Air flows through the impeller radially using blades that are forward curved.
      - value: CENTRIFUGALRADIAL
        meaning: Air flows through the impeller radially using blades that are uncurved or slightly forward curved.
      - value: CENTRIFUGALBACKWARDINCLINEDCURVED
        meaning: Air flows through the impeller radially using blades that are backward curved.
      - value: CENTRIFUGALAIRFOIL
        meaning: Air flows through the impeller radially using blades that are airfoil shaped.
      - value: TUBEAXIAL
        meaning: Air flows through the impeller axially with reduced tip clearance and operating at higher tip speeds.
      - value: VANEAXIAL
        meaning: Air flows through the impeller axially with guide vanes and reduced running blade tip clearance.
      - value: PROPELLORAXIAL
        meaning: Air flows through the impeller axially and small hub-to-tip ratio impeller mounted in an orifice plate or inlet ring.
      - value: USERDEFINED
        meaning: User-defined fan type.
      - value: NOTDEFINED
        meaning: Undefined fan type.
