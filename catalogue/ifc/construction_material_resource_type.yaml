fields:
  - name: predefined_type
    type: enum
    meaning: Defines types of construction material resources.
    source_ref: "IfcConstructionMaterialResourceType attribute 1: IfcConstructionMaterialResourceTypeEnum; enumeration IfcConstructionMaterialResourceTypeEnum"
    values:
      - value: AGGREGATES
        meaning: Construction aggregate including sand, gravel, and crushed stone.
      - value: CONCRETE
        meaning: Cast-in-place concrete.
      - value: DRYWALL
        meaning: Wall board, including gypsum board.
      - value: FUEL
        meaning: Fuel for running equipment.
      - value: GYPSUM
        meaning: Any gypsum material.
      - value: MASONRY
        meaning: Masonry including brick, stone, concrete block, glass block, and tile.
      - value: METAL
        meaning: Any metallic material.
      - value: PLASTIC
        meaning: Any plastic material.
      - value: WOOD
        meaning: Any wood material.
      - value: NOTDEFINED
        meaning: Undefined resource.
      - value: USERDEFINED
        meaning: User-defined resource.
