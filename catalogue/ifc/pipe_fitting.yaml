code: ifc.pipe_fitting
name: IfcPipeFitting
kind: entity
base: ifc.flow_fitting
fidelity: proxy
source:
  document: buildingSMART IFC4.3 EXPRESS schema (IFC4X3_RC4) with IFC4.3.x-development documentation
  section: IfcPipeFitting
  url: https://github.com/buildingSMART/IFC4.3.x-development/blob/2b8baa0a14d5ed1a9f99ef9443bdcb63a0cb0ab1/docs/schemas/domain/IfcHvacDomain/Entities/IfcPipeFitting.md
  version: IFC4X3_RC4 (EXPRESS issue date 2021-07-22); repo commit 2b8baa0a14d5; exp sha256 9b7d0c3e187f
  accessed_on: 2026-10-23
  licence: "buildingSMART: CC BY-ND 4.0 (repo LICENSE.md); EXPRESS header allows translation with full attribution, consent needed for changes. See SOURCES.md"
meaning: A pipe fitting is a junction or transition in a piping flow distribution system used to connect pipe segments, resulting in changes in flow characteristics to the fluid such as direction or flow rate.
fields:
  - name: predefined_type
    type: enum
    nullable: true
    meaning: PredefinedType attribute of IfcPipeFitting (not described in the source documentation).
    source_ref: "IfcPipeFitting attribute 1: OPTIONAL IfcPipeFittingTypeEnum; enumeration IfcPipeFittingTypeEnum"
    values:
      - value: BEND
        meaning: A fitting with typically two ports used to change the direction of flow between connected elements.
      - value: CONNECTOR
        meaning: Connector fitting, typically used to join two ports together within a flow distribution system (e.g., a coupling used to join two pipe segments).
      - value: ENTRY
        meaning: Entry fitting, typically unconnected at one port and connected to a flow distribution system at the other (e.g., a breeching inlet).
      - value: EXIT
        meaning: Exit fitting, typically unconnected at one port and connected to a flow distribution system at the other (e.g., a hose bibb).
      - value: JUNCTION
        meaning: A fitting with typically more than two ports used to redistribute flow among the ports and/or to change the direction of flow between connected elements (e.g, tee, cross, wye, etc.).
      - value: OBSTRUCTION
        meaning: A fitting with typically two ports used to obstruct or restrict flow between the connected elements (e.g., screen, perforated plate, etc.).
      - value: TRANSITION
        meaning: A fitting with typically two ports having different shapes or sizes.
      - value: USERDEFINED
        meaning: User-defined fitting.
      - value: NOTDEFINED
        meaning: Undefined fitting.
