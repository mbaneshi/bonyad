meaning: The flow storage device type IfcTankType defines commonly shared information for occurrences of tanks.
fields:
  - name: predefined_type
    type: enum
    meaning: Defines the type of tank.
    source_ref: "IfcTankType attribute 1: IfcTankTypeEnum; enumeration IfcTankTypeEnum"
    values:
      - value: BASIN
        meaning: An arbitrary open tank type.
      - value: BREAKPRESSURE
        meaning: An open container that breaks the hydraulic pressure in a distribution system, typically located between the fluid reservoir and the fluid supply points.
      - value: EXPANSION
        meaning: A closed container used in a closed fluid distribution system to mitigate the effects of thermal expansion or water hammer.
      - value: FEEDANDEXPANSION
        meaning: An open tank that is used for both storage and thermal expansion.
      - value: PRESSUREVESSEL
        meaning: A closed container used for storing fluids or gases at a pressure different from the ambient pressure.
      - value: STORAGE
        meaning: An open or closed container used for storing a fluid at ambient pressure and from which it can be supplied to the fluid distribution system.
      - value: VESSEL
        meaning: An arbitrary closed tank type.
      - value: OILRETENTIONTRAY
        meaning: An open container for environmental protection and storage of chemical products.
      - value: USERDEFINED
        meaning: User-defined tank type.
      - value: NOTDEFINED
        meaning: Undefined tank type.
