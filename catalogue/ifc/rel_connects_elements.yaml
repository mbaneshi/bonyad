meaning: The IfcRelConnectsElements objectified relationship provides the generalization of the connectivity between elements. It is a 1 to 1 relationship.
fields:
  - name: connection_geometry
    type: ref
    nullable: true
    meaning: The geometric shape representation of the connection geometry that is provided in the object coordinate system of the RelatingElement (mandatory) and in the object coordinate system of the RelatedElement (optionally).
    source_ref: "IfcRelConnectsElements attribute 1: OPTIONAL IfcConnectionGeometry"
    ref_to: ifc.connection_geometry
  - name: relating_element
    type: ref
    meaning: Reference to a subtype of IfcElement that is connected by the connection relationship in the role of RelatingElement.
    source_ref: "IfcRelConnectsElements attribute 2: IfcElement"
    ref_to: ifc.element
  - name: related_element
    type: ref
    meaning: Reference to a subtype of IfcElement that is connected by the connection relationship in the role of RelatedElement.
    source_ref: "IfcRelConnectsElements attribute 3: IfcElement"
    ref_to: ifc.element
notes: SUPERTYPE OF ONEOF ( IfcRelConnectsPathElements , IfcRelConnectsWithRealizingElements ).
