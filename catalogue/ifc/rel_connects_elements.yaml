code: ifc.rel_connects_elements
name: IfcRelConnectsElements
kind: object
base: ifc.rel_connects
fidelity: proxy
source:
  document: buildingSMART IFC4.3 EXPRESS schema (IFC4X3_RC4) with IFC4.3.x-development documentation
  section: IfcRelConnectsElements
