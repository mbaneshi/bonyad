meaning: A tendon anchor is the end connection for tendons in prestressed or posttensioned concrete.
fields:
  - name: predefined_type
    type: enum
    nullable: true
    meaning: Kind of tendon anchor.
    source_ref: "IfcTendonAnchor attribute 1: OPTIONAL IfcTendonAnchorTypeEnum; enumeration IfcTendonAnchorTypeEnum"
    values:
      - value: COUPLER
        meaning: The anchor is an intermediate device which connects two tendons.
      - value: FIXED_END
        meaning: The anchor fixes the end of a tendon.
      - value: TENSIONING_END
        meaning: The anchor is used or can be used to prestress the tendon.
      - value: USERDEFINED
        meaning: The type of tendon anchor is user defined.
      - value: NOTDEFINED
        meaning: The type of tendon anchor is not defined.
