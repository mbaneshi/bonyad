meaning: Furniture defines complete furnishings such as a table, desk, chair, or cabinet, which may or may not be permanently attached to a building structure.
fields:
  - name: predefined_type
    type: enum
    nullable: true
    meaning: PredefinedType attribute of IfcFurniture (not described in the source documentation).
    source_ref: "IfcFurniture attribute 1: OPTIONAL IfcFurnitureTypeEnum; enumeration IfcFurnitureTypeEnum"
    values:
      - value: CHAIR
        meaning: Furniture for seating a single person.
      - value: TABLE
        meaning: Furniture with a countertop for multiple people.
      - value: DESK
        meaning: Furniture with a countertop and optional drawers for a single person.
      - value: BED
        meaning: Furniture for sleeping.
      - value: FILECABINET
        meaning: Furniture with sliding drawers for storing files.
      - value: SHELF
        meaning: Furniture for storing books or other items.
      - value: SOFA
        meaning: Furniture for seating multiple people.
      - value: TECHNICALCABINET
        meaning: A technical cabinet is a piece of furniture for holding, displaying and protecting technical appliances, usually organized in shelves, drawers or racks.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
