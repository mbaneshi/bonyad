meaning: The flow controller type IfcElectricDistributionBoardType defines commonly shared information for occurrences of electric distribution boards.
fields:
  - name: predefined_type
    type: enum
    meaning: Identifies the predefined types of electric distribution type from which the type required may be set.
    source_ref: "IfcElectricDistributionBoardType attribute 1: IfcElectricDistributionBoardTypeEnum; enumeration IfcElectricDistributionBoardTypeEnum"
    values:
      - value: CONSUMERUNIT
        meaning: A distribution point on the incoming electrical supply, typically in domestic premises, at which protective devices are located.
      - value: DISTRIBUTIONBOARD
        meaning: A distribution point at which connections are made for distribution of electrical circuits usually through protective devices.
      - value: MOTORCONTROLCENTRE
        meaning: A distribution point at which starting and control devices for major plant items are located.
      - value: SWITCHBOARD
        meaning: A distribution point at which switching devices are located.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
