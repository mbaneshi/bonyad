meaning: An IfcWorkSchedule represents a task schedule of a work plan, which in turn can contain a set of schedules for different purposes.
fields:
  - name: predefined_type
    type: enum
    nullable: true
    meaning: Identifies the predefined types of a work schedule from which the type required may be set.
    source_ref: "IfcWorkSchedule attribute 1: OPTIONAL IfcWorkScheduleTypeEnum; enumeration IfcWorkScheduleTypeEnum"
    values:
      - value: ACTUAL
        meaning: A process in which actual items undertaken are indicated.
      - value: BASELINE
        meaning: A process that is a baseline from which changes that are made later can be recognized.
      - value: PLANNED
        meaning: A process showing planned items.
      - value: USERDEFINED
        meaning: User defined.
      - value: NOTDEFINED
        meaning: Undefined.
