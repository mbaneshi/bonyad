meaning: The distribution control element type IfcFlowInstrumentType defines commonly shared information for occurrences of flow instruments.
fields:
  - name: predefined_type
    type: enum
    meaning: Identifies the predefined types of flow instrument from which the type required may be set.
    source_ref: "IfcFlowInstrumentType attribute 1: IfcFlowInstrumentTypeEnum; enumeration IfcFlowInstrumentTypeEnum"
    values:
      - value: PRESSUREGAUGE
        meaning: A device that reads and displays a pressure value at a point or the pressure difference between two points.
      - value: THERMOMETER
        meaning: A device that reads and displays a temperature value at a point.
      - value: AMMETER
        meaning: A device that reads and displays the current flow in a circuit.
      - value: FREQUENCYMETER
        meaning: A device that reads and displays the electrical frequency of an alternating current circuit.
      - value: POWERFACTORMETER
        meaning: A device that reads and displays the power factor of an electrical circuit.
      - value: PHASEANGLEMETER
        meaning: A device that reads and displays the phase angle of a phase in a polyphase electrical circuit.
      - value: VOLTMETER_PEAK
        meaning: A device that reads and displays the peak voltage in an electrical circuit.
      - value: VOLTMETER_RMS
        meaning: A device that reads and displays the RMS (mean) voltage in an electrical circuit.
      - value: COMBINED
        meaning: A device that reads and displays the value of multiple properties of a system at a point, or displays the difference in the value of a property between two points.
      - value: VOLTMETER
        meaning: A device that measures and displays the voltage in a circuit.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
