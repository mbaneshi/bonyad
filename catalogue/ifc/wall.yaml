code: ifc.wall
name: IfcWall
kind: entity
base: ifc.built_element
fidelity: proxy
source:
  document: buildingSMART IFC4.3 EXPRESS schema (IFC4X3_RC4) with IFC4.3.x-development documentation
  section: IfcWall
  url: https://github.com/buildingSMART/IFC4.3.x-development/blob/2b8baa0a14d5ed1a9f99ef9443bdcb63a0cb0ab1/docs/schemas/shared/IfcSharedBldgElements/Entities/IfcWall.md
  version: IFC4X3_RC4 (EXPRESS issue date 2021-07-22); repo commit 2b8baa0a14d5; exp sha256 9b7d0c3e187f
  accessed_on: 2026-10-23
  licence: "buildingSMART: CC BY-ND 4.0 (repo LICENSE.md); EXPRESS header allows translation with full attribution, consent needed for changes. See SOURCES.md"
meaning: The wall represents a vertical construction that may bound or subdivide spaces. Wall are usually vertical, or nearly vertical, planar elements, often designed to bear structural loads.
fields:
  - name: predefined_type
    type: enum
    nullable: true
    meaning: Predefined generic type for a wall that is specified in an enumeration.
    source_ref: "IfcWall attribute 1: OPTIONAL IfcWallTypeEnum; enumeration IfcWallTypeEnum"
    values:
      - value: MOVABLE
        meaning: A movable wall that is either movable, such as folding wall or a sliding wall, or can be easily removed as a removable partitioning or mounting wall.
      - value: PARAPET
        meaning: A wall-like barrier to protect human or vehicle from falling, or to prevent the spread of fires.
      - value: PARTITIONING
        meaning: A wall designed to partition spaces that can be a light-weight, layered system (e.g. using gypsum board) or solid wall made out of blocks or elements (e.g. using gypsum, light-weight concrete or calcium silicate).
      - value: PLUMBINGWALL
        meaning: A pier, or enclosure, or encasement, normally used to enclose plumbing in sanitary rooms.
      - value: SHEAR
        meaning: A wall designed to withstand shear loads.
      - value: SOLIDWALL
        meaning: A massive wall construction for the wall core being the single layer or having multiple layers attached.
      - value: STANDARD
        meaning: A standard wall, extruded vertically with a constant thickness along the wall path.
      - value: POLYGONAL
        meaning: A polygonal wall, extruded vertically, where the wall thickness varies along the wall path.
      - value: ELEMENTEDWALL
        meaning: A stud wall framed with studs and faced with sheetings, sidings, wallboard, or plasterwork.
      - value: RETAININGWALL
        meaning: A supporting wall used to protect against soil layers behind.
      - value: WAVEWALL
        meaning: Protective wall or screen to block overtopping and impact of waves across a breakwater.
      - value: USERDEFINED
        meaning: User-defined wall element.
      - value: NOTDEFINED
        meaning: Undefined wall element.
notes: SUPERTYPE OF ONEOF ( IfcWallElementedCase , IfcWallStandardCase ).
