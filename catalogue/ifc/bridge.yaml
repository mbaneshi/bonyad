meaning: A Bridge is a civil engineering work that affords passage to pedestrians, animals, vehicles, and services above obstacles or between two points at a height above ground.
fields:
  - name: predefined_type
    type: enum
    nullable: true
    meaning: PredefinedType attribute of IfcBridge (not described in the source documentation).
    source_ref: "IfcBridge attribute 1: OPTIONAL IfcBridgeTypeEnum; enumeration IfcBridgeTypeEnum"
    values:
      - value: ARCHED
        meaning: "ISO 6707: Bridge that has one or more arches as its main structure."
      - value: CABLE_STAYED
        meaning: "ISO 6707: Bridge with one or more towers and inclined cables that are connected to the top or the shaft of the tower and support the deck."
      - value: CANTILEVER
        meaning: "ISO 6707: Bridge, the main structural members of which are cantilevers."
      - value: CULVERT
        meaning: "ISO 6707: Transverse drain or waterway construction under a road, railway, or canal, or through an embankment, in the form of a large pipe or enclosed channel."
      - value: FRAMEWORK
        meaning: Framework bridge.
      - value: GIRDER
        meaning: A bridge that uses girders as the means of supporting its deck.
      - value: SUSPENSION
        meaning: "ISO 6707: Bridge, the main structural members of which are catenary cables from which the deck is suspended."
      - value: TRUSS
        meaning: "ISO 6707: Bridge with braced triangulated frame designed to act as a beam."
      - value: USERDEFINED
        meaning: User defined bridge.
      - value: NOTDEFINED
        meaning: Undefined bridge.
