    type: timestamp
    nullable: true
    meaning: The date on which an event actually occurs.
    source_ref: "IfcEventTime attribute 1: OPTIONAL IfcDateTime"
  - name: early_date
    type: timestamp
    nullable: true
    meaning: The earliest date on which an event can occur.
    source_ref: "IfcEventTime attribute 2: OPTIONAL IfcDateTime"
  - name: late_date
    type: timestamp
    nullable: true
    meaning: The latest date on which an event can occur.
