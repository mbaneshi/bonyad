meaning: The flow fitting type IfcCableFittingType defines commonly shared information for occurrences of cable fittings.
fields:
  - name: predefined_type
    type: enum
    meaning: Identifies the predefined types of cable fitting from which the type required may be set.
    source_ref: "IfcCableFittingType attribute 1: IfcCableFittingTypeEnum; enumeration IfcCableFittingTypeEnum"
    values:
      - value: CONNECTOR
        meaning: A fitting that joins two cable segments of the same connector type (though potentially different gender).
      - value: ENTRY
        meaning: A fitting that begins a cable segment at a non-electrical element such as a grounding clamp attached to a pipe.
      - value: EXIT
        meaning: A fitting that ends a cable segment at a non-electrical element such as a grounding clamp attached to a pipe or to the ground.
      - value: JUNCTION
        meaning: A fitting that joins three or more segments of arbitrary connector types for signal splitting or multiplexing.
      - value: TRANSITION
        meaning: A fitting that joins two cable segments of different connector types.
      - value: FANOUT
        meaning: A fan out is a special cable fitting that provides a safe transition from multi-fiber cable units to individual fibers.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
