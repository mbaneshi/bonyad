code: ifc.covering
name: IfcCovering
kind: entity
base: ifc.built_element
fidelity: proxy
source:
  document: buildingSMART IFC4.3 EXPRESS schema (IFC4X3_RC4) with IFC4.3.x-development documentation
  section: IfcCovering
  url: https://github.com/buildingSMART/IFC4.3.x-development/blob/2b8baa0a14d5ed1a9f99ef9443bdcb63a0cb0ab1/docs/schemas/shared/IfcSharedBldgElements/Entities/IfcCovering.md
  version: IFC4X3_RC4 (EXPRESS issue date 2021-07-22); repo commit 2b8baa0a14d5; exp sha256 9b7d0c3e187f
  accessed_on: 2026-10-23
  licence: "buildingSMART: CC BY-ND 4.0 (repo LICENSE.md); EXPRESS header allows translation with full attribution, consent needed for changes. See SOURCES.md"
meaning: A covering is an element which covers some part of another element and is fully dependent on that other element. The IfcCovering defines the occurrence of a covering type, that (if given) is expressed by the IfcCoveringType.
fields:
  - name: predefined_type
    type: enum
    nullable: true
    meaning: Predefined types to define the particular type of the covering.
    source_ref: "IfcCovering attribute 1: OPTIONAL IfcCoveringTypeEnum; enumeration IfcCoveringTypeEnum"
    values:
      - value: CEILING
        meaning: The covering is used to represent a ceiling.
      - value: FLOORING
        meaning: The covering is used to represent a flooring.
      - value: CLADDING
        meaning: The covering is used to represent a cladding.
      - value: ROOFING
        meaning: The covering is used to represent a roof covering.
      - value: MOLDING
        meaning: The covering is used to represent a molding being a strip of material to cover the transition of surfaces (often between wall cladding and ceiling).
      - value: SKIRTINGBOARD
        meaning: The covering is used to represent a skirting board being a strip of material to cover the transition between the wall cladding and the flooring.
      - value: INSULATION
        meaning: The covering is used to insulate an element for thermal or acoustic purposes.
      - value: MEMBRANE
        meaning: An impervious layer that could be used for e.g. roof covering (below tiling - that may be known as sarking etc.) or as a damp proof course membrane; also, waterproofing material on a bridge structure (typically on top …
      - value: SLEEVING
        meaning: The covering is used to isolate a distribution element from a space in which it is contained.
      - value: WRAPPING
        meaning: The covering is used for wrapping particularly of distribution elements using tape.
      - value: COPING
        meaning: A protective capping or covering of a wall or a parapet.
      - value: USERDEFINED
        meaning: User defined type of covering.
      - value: NOTDEFINED
        meaning: Undefined type of covering.
notes: "Inverse attributes not stored: CoversSpaces, CoversElements."
