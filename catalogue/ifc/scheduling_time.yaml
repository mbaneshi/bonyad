meaning: IfcSchedulingTime is the abstract supertype of entities that capture time-related information of processes.
fields:
  - name: name
    type: text
    nullable: true
    meaning: Optional name for the time definition.
    source_ref: "IfcSchedulingTime attribute 1: OPTIONAL IfcLabel"
  - name: data_origin
    type: enum
    nullable: true
    meaning: Specifies the origin of the scheduling time entity.
    source_ref: "IfcSchedulingTime attribute 2: OPTIONAL IfcDataOriginEnum; enumeration IfcDataOriginEnum"
    values:
      - value: MEASURED
        meaning: The origin of the time data is a measurement device.
      - value: PREDICTED
        meaning: The time data are a prediction.
      - value: SIMULATED
        meaning: The origin of the time data is a simulation.
      - value: USERDEFINED
        meaning: User defined.
      - value: NOTDEFINED
        meaning: The origin of the time data is undefined.
  - name: user_defined_data_origin
    type: text
    nullable: true
    meaning: Value of the data origin if DataOrigin attribute is USERDEFINED.
    source_ref: "IfcSchedulingTime attribute 3: OPTIONAL IfcLabel"
notes: SUPERTYPE OF ONEOF ( IfcEventTime , IfcLagTime , IfcResourceTime , IfcTaskTime , IfcWorkTime ).
