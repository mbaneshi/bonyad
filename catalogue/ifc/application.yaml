    type: ref
    meaning: Name of the application developer.
    source_ref: "IfcApplication attribute 1: IfcOrganization"
    ref_to: ifc.organization
  - name: version
    type: text
    meaning: The version number of this software as specified by the developer of the application.
    source_ref: "IfcApplication attribute 2: IfcLabel"
  - name: application_full_name
    type: text
    meaning: The full name of the application as specified by the application developer.
    source_ref: "IfcApplication attribute 3: IfcLabel"
  - name: application_identifier
    type: text
    meaning: Short identifying name for the application.
    source_ref: "IfcApplication attribute 4: IfcIdentifier"
