meaning: The IfcIndexedTextureMap provides the mapping of the 2-dimensional texture coordinates to the surface onto which it is mapped. It is used for mapping the texture to faces of tessellated face sets.
fields:
  - name: mapped_to
    type: ref
    meaning: Reference to the IfcTessellatedFaceSet to which it applies the texture map.
    source_ref: "IfcIndexedTextureMap attribute 1: IfcTessellatedFaceSet"
    ref_to: ifc.tessellated_face_set
  - name: tex_coords
    type: ref
    meaning: Indexable list of texture vertices.
    source_ref: "IfcIndexedTextureMap attribute 2: IfcTextureVertexList"
    ref_to: ifc.texture_vertex_list
notes: SUPERTYPE OF ONEOF ( IfcIndexedTriangleTextureMap ).
