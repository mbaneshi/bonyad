meaning: The IfcIndexedPolyCurve is a bounded curve with only linear and circular arc segments defined by a Cartesian point list and an optional list of segments, providing indices into the Cartesian point list. In the case that the list of Segments is not provided, all points in the IfcCartesianPointList are connected by straight line segments in the order they …
fields:
  - name: points
    type: ref
    meaning: A list of points, provided by a point list of either two, or three dimensions, that is used to define the poly curve.
    source_ref: "IfcIndexedPolyCurve attribute 1: IfcCartesianPointList"
    ref_to: ifc.cartesian_point_list
  - name: segments
    type: array
    nullable: true
    meaning: List of straight line and circular arc segments, each providing a list of indices into the Cartesian point list.
    source_ref: "IfcIndexedPolyCurve attribute 2: OPTIONAL LIST [1:?] OF IfcSegmentIndexSelect; elements are SELECT IfcSegmentIndexSelect of value types, stored as text (the member type tag is not kept)"
    of: text
  - name: self_intersect
    type: bool
    nullable: true
    meaning: Indication of whether the curve intersects itself or not; this is for information only.
    source_ref: "IfcIndexedPolyCurve attribute 3: OPTIONAL IfcBoolean"
