code: ifc.structural_curve_action
name: IfcStructuralCurveAction
kind: entity
base: ifc.structural_action
fidelity: proxy
source:
  document: buildingSMART IFC4.3 EXPRESS schema (IFC4X3_RC4) with IFC4.3.x-development documentation
  section: IfcStructuralCurveAction
  url: https://github.com/buildingSMART/IFC4.3.x-development/blob/2b8baa0a14d5ed1a9f99ef9443bdcb63a0cb0ab1/docs/schemas/domain/IfcStructuralAnalysisDomain/Entities/IfcStructuralCurveAction.md
  version: IFC4X3_RC4 (EXPRESS issue date 2021-07-22); repo commit 2b8baa0a14d5; exp sha256 9b7d0c3e187f
  accessed_on: 2026-10-23
  licence: "buildingSMART: CC BY-ND 4.0 (repo LICENSE.md); EXPRESS header allows translation with full attribution, consent needed for changes. See SOURCES.md"
meaning: A structural curve action defines an action which is distributed over a curve. A curve action may be connected with a curve member or curve connection, or surface member or surface connection.
fields:
  - name: projected_or_true
    type: enum
    nullable: true
    meaning: Defines whether load values are given per true length of the curve on which they act, or per length of the projection of the curve in load direction.
    source_ref: "IfcStructuralCurveAction attribute 1: OPTIONAL IfcProjectedOrTrueLengthEnum; enumeration IfcProjectedOrTrueLengthEnum"
    values:
      - value: PROJECTED_LENGTH
        meaning: Projected length.
      - value: TRUE_LENGTH
        meaning: True Length.
  - name: predefined_type
    type: enum
    meaning: Type of action according to its distribution of load values.
    source_ref: "IfcStructuralCurveAction attribute 2: IfcStructuralCurveActivityTypeEnum; enumeration IfcStructuralCurveActivityTypeEnum"
    values:
      - value: CONST
        meaning: The load has a constant value over its entire extent.
      - value: LINEAR
        meaning: The load value is linearly distributed over the load's extent.
      - value: POLYGONAL
        meaning: The load consists of several consecutive linear sections.
      - value: EQUIDISTANT
        meaning: The load consists of n consecutive sections of same length and is specified by n+1 load samples.
      - value: SINUS
        meaning: The load value is distributed as a sinus half wave.
      - value: PARABOLA
        meaning: The load value is distributed as a half wave described by a symmetric quadratic parabola.
      - value: DISCRETE
        meaning: The load is specified as a series of discrete load points.
      - value: USERDEFINED
        meaning: The load distribution is user-defined.
      - value: NOTDEFINED
        meaning: The load distribution is undefined.
notes: SUPERTYPE OF ONEOF ( IfcStructuralLinearAction ).
