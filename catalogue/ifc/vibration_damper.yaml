meaning: A vibration damper is a device used to minimize the effects of vibration in a structure by dissipating kinetic energy. The damper may be passive (elastic, frictional, inertia) or active (in a system using sensors and actuators).
fields:
  - name: predefined_type
    type: enum
    nullable: true
    meaning: PredefinedType attribute of IfcVibrationDamper (not described in the source documentation).
    source_ref: "IfcVibrationDamper attribute 1: OPTIONAL IfcVibrationDamperTypeEnum; enumeration IfcVibrationDamperTypeEnum"
    values:
      - value: BENDING_YIELD
        meaning: A displacement dependent type damper in which the resistance force generated is determined by the plastic strain amount utilizing the plastic deformation of the steel material.
      - value: SHEAR_YIELD
        meaning: A displacement dependent type damper in which the resistance force generated is determined by the plastic strain amount utilizing the plastic deformation of the steel material.
      - value: AXIAL_YIELD
        meaning: A displacement dependent type damper in which the resistance force generated is determined by the plastic strain amount utilizing the plastic deformation of the steel material.
      - value: FRICTION
        meaning: The friction type is a damper utilizing friction acting on the contact surface of a material.
      - value: VISCOUS
        meaning: The viscous type is a damper that absorbs energy by utilizing the resistance of a viscous body.
      - value: RUBBER
        meaning: The rubber mold is a damper that absorbs energy by utilizing deformation of laminated rubber.
      - value: USERDEFINED
        meaning: User-defined vibration damper type.
      - value: NOTDEFINED
        meaning: Undefined vibration damper type.
