meaning: IfcLagTime describes the time parameters that may exist within a sequence relationship between two processes.
fields:
  - name: lag_value
    type: text
    meaning: Value of the time lag selected as being either a ratio or a time measure.
    source_ref: "IfcLagTime attribute 1: IfcTimeOrRatioSelect; SELECT IfcTimeOrRatioSelect of value types, stored as text (the member type tag is not kept)"
  - name: duration_type
    type: enum
    meaning: The allowed types of task duration that specify the lag time measurement (work time or elapsed time).
    source_ref: "IfcLagTime attribute 2: IfcTaskDurationEnum; enumeration IfcTaskDurationEnum"
    values:
      - value: ELAPSEDTIME
        meaning: The time duration is based on elapsed time (24 hours per day, independent of calendar).
      - value: WORKTIME
        meaning: The time duration is based on work time (calendar-dependent).
      - value: NOTDEFINED
        meaning: The time duration is undefined.
