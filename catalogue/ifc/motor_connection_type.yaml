meaning: The energy conversion device type IfcMotorConnectionType defines commonly shared information for occurrences of motor connections.
fields:
  - name: predefined_type
    type: enum
    meaning: Identifies the predefined types of motor connection from which the type required may be set.
    source_ref: "IfcMotorConnectionType attribute 1: IfcMotorConnectionTypeEnum; enumeration IfcMotorConnectionTypeEnum"
    values:
      - value: BELTDRIVE
        meaning: An indirect connection made through the medium of a shaped, flexible continuous loop.
      - value: COUPLING
        meaning: An indirect connection made through the medium of the viscosity of a fluid.
      - value: DIRECTDRIVE
        meaning: A direct, physical connection made between the motor and the driven device.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
