meaning: IfcSurfaceStyleRefraction extends the surface style lighting, or the surface style rendering definition for properties for calculation of physically exact illuminance by adding seldom used properties. Currently this includes the refraction index (by which the light ray refracts when passing through a prism) and the dispersion factor (or Abbe constant) which …
fields:
  - name: refraction_index
    type: float
    nullable: true
    meaning: The index of refraction for all wave lengths of light.
    source_ref: "IfcSurfaceStyleRefraction attribute 1: OPTIONAL IfcReal"
  - name: dispersion_factor
    type: float
    nullable: true
    meaning: The Abbe constant given as a fixed ratio between the refractive indices of the material at different wavelengths.
    source_ref: "IfcSurfaceStyleRefraction attribute 2: OPTIONAL IfcReal"
