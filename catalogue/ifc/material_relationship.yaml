meaning: IfcMaterialRelationship defines a relationship between part and whole in material definitions (as in composite materials). The parts, expressed by the set of RelatedMaterials, are material constituents of which a single material aggregate is composed.
fields:
  - name: relating_material
    type: ref
    meaning: Reference to the relating material (the composite).
    source_ref: "IfcMaterialRelationship attribute 1: IfcMaterial"
    ref_to: ifc.material
  - name: expression
    type: text
    nullable: true
    meaning: Information about the material relationship referring for example to the amount of related materials in the composite material.
    source_ref: "IfcMaterialRelationship attribute 3: OPTIONAL IfcLabel"
