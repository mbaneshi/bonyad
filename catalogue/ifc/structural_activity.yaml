    ref_to: ifc.structural_load
  - name: global_or_local
    type: enum
    meaning: Indicates whether the load directions refer to the global coordinate system (global to the analysis model, i.e. as established by _IfcStructuralAnalysisModel.SharedPlacement_) or to the local coordinate system (local to the activity or connected item, as …
