fields:
  - name: predefined_type
    type: enum
    meaning: Identifies the predefined types of outlet from which the type required may be set.
    source_ref: "IfcOutletType attribute 1: IfcOutletTypeEnum; enumeration IfcOutletTypeEnum"
    values:
      - value: AUDIOVISUALOUTLET
        meaning: An outlet used for an audio or visual device.
      - value: COMMUNICATIONSOUTLET
        meaning: An outlet used for connecting communications equipment.
      - value: POWEROUTLET
        meaning: An outlet used for connecting electrical devices requiring power.
      - value: DATAOUTLET
        meaning: An outlet used for connecting data communications equipment.
      - value: TELEPHONEOUTLET
        meaning: An outlet used for connecting telephone communications equipment.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
