code: ifc.blob_texture
name: IfcBlobTexture
kind: object
base: ifc.surface_texture
fidelity: proxy
source:
  document: buildingSMART IFC4.3 EXPRESS schema (IFC4X3_RC4) with IFC4.3.x-development documentation
  section: IfcBlobTexture
