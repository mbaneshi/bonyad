meaning: An IfcBlobTexture provides a 2-dimensional distribution of the lighting parameters of a surface onto which it is mapped. The texture itself is given as a single binary blob, representing the content of a pixel format file.
fields:
  - name: raster_format
    type: text
    meaning: The format of the RasterCode often using a compression.
    source_ref: "IfcBlobTexture attribute 1: IfcIdentifier"
  - name: raster_code
    type: blob
    meaning: Blob, given as a single binary, to capture the texture within one popular file (compression) format.
    source_ref: "IfcBlobTexture attribute 2: IfcBinary"
