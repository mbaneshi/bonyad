code: ifc.distribution_port
name: IfcDistributionPort
kind: entity
base: ifc.port
fidelity: proxy
source:
  document: buildingSMART IFC4.3 EXPRESS schema (IFC4X3_RC4) with IFC4.3.x-development documentation
  section: IfcDistributionPort
  url: https://github.com/buildingSMART/IFC4.3.x-development/blob/2b8baa0a14d5ed1a9f99ef9443bdcb63a0cb0ab1/docs/schemas/shared/IfcSharedBldgServiceElements/Entities/IfcDistributionPort.md
  version: IFC4X3_RC4 (EXPRESS issue date 2021-07-22); repo commit 2b8baa0a14d5; exp sha256 9b7d0c3e187f
  accessed_on: 2026-10-23
  licence: "buildingSMART: CC BY-ND 4.0 (repo LICENSE.md); EXPRESS header allows translation with full attribution, consent needed for changes. See SOURCES.md"
meaning: A distribution port is an inlet or outlet of a product through which a particular substance may flow.
fields:
  - name: flow_direction
    type: enum
    nullable: true
    meaning: Enumeration that identifies if this port is a Sink (inlet), a Source (outlet) or both a SinkAndSource.
    source_ref: "IfcDistributionPort attribute 1: OPTIONAL IfcFlowDirectionEnum; enumeration IfcFlowDirectionEnum"
    values:
      - value: SOURCE
        meaning: A flow source, where a substance flows out of the connection.
      - value: SINK
        meaning: A flow sink, where a substance flows into the connection.
      - value: SOURCEANDSINK
        meaning: Both a source and sink, where a substance flows both into and out of the connection simultaneously.
      - value: NOTDEFINED
        meaning: Undefined flow direction.
  - name: predefined_type
    type: enum
    nullable: true
    meaning: PredefinedType attribute of IfcDistributionPort (not described in the source documentation).
    source_ref: "IfcDistributionPort attribute 2: OPTIONAL IfcDistributionPortTypeEnum; enumeration IfcDistributionPortTypeEnum"
    values:
      - value: CABLE
        meaning: Connection to cable segment or fitting for distribution of electricity.
      - value: CABLECARRIER
        meaning: Connection to cable carrier segment or fitting for enclosing cables.
      - value: DUCT
        meaning: Connection to duct segment or fitting for distribution of air.
      - value: PIPE
        meaning: Connection to pipe segment or fitting for distribution of solid, liquid, or gas.
      - value: WIRELESS
        meaning: Wireless connection to communication appliances for distribution of data or communication.
      - value: USERDEFINED
        meaning: User-defined port type.
      - value: NOTDEFINED
        meaning: Undefined port type.
  - name: system_type
    type: enum
    nullable: true
    meaning: Enumeration that identifies the system type.
    source_ref: "IfcDistributionPort attribute 3: OPTIONAL IfcDistributionSystemEnum; enumeration IfcDistributionSystemEnum"
    values:
      - value: AIRCONDITIONING
        meaning: Conditioned air distribution system for purposes of maintaining a temperature range within one or more spaces.
      - value: AUDIOVISUAL
        meaning: A transport of a single media source, having audio and/or video streams.
      - value: CHEMICAL
        meaning: Arbitrary chemical further qualified by property set, such as for medical or industrial use.
      - value: CHILLEDWATER
        meaning: Nonpotable chilled water, such as circulated through an evaporator.
      - value: COMMUNICATION
        meaning: Communication.
      - value: COMPRESSEDAIR
        meaning: Compressed air system.
      - value: CONDENSERWATER
        meaning: Nonpotable water, such as circulated through a condenser.
      - value: CONTROL
        meaning: A transport or network dedicated to control system usage.
      - value: CONVEYING
        meaning: Arbitrary supply of substances.
      - value: DATA
        meaning: A network having general-purpose usage.
      - value: DISPOSAL
        meaning: Arbitrary disposal of substances.
      - value: DOMESTICCOLDWATER
        meaning: Unheated potable water distribution system.
      - value: DOMESTICHOTWATER
        meaning: Heated potable water distribution system.
      - value: DRAINAGE
        meaning: Drainage collection system.
      - value: EARTHING
        meaning: A path for equipotential bonding, conducting current to the ground.
      - value: ELECTRICAL
        meaning: A circuit for delivering electrical power.
      - value: ELECTROACOUSTIC
        meaning: An amplified audio signal such as for loudspeakers.
      - value: EXHAUST
        meaning: Exhaust air collection system for removing stale or noxious air from one or more spaces.
      - value: FIREPROTECTION
        meaning: Fire protection sprinkler system.
      - value: FUEL
        meaning: Arbitrary supply of fuel.
      - value: GAS
        meaning: Gas-phase materials such as methane or natural gas.
      - value: HAZARDOUS
        meaning: Hazardous material or fluid collection system.
      - value: HEATING
        meaning: Water or steam heated from a boiler and circulated through radiators.
      - value: LIGHTING
        meaning: A circuit dedicated for lighting, such as a fixture having sockets for lamps.
      - value: LIGHTNINGPROTECTION
        meaning: A path for conducting lightning current to the ground.
      - value: MUNICIPALSOLIDWASTE
        meaning: Items consumed and discarded, commonly known as trash or garbage.
      - value: OIL
        meaning: Oil distribution system.
      - value: OPERATIONAL
        meaning: Operating supplies system.
      - value: POWERGENERATION
        meaning: A path for power generation.
      - value: RAINWATER
        meaning: Rainwater resulting from precipitation which directly falls on a parcel.
      - value: REFRIGERATION
        meaning: Refrigerant distribution system for purposes of fulfilling all or parts of a refrigeration cycle.
      - value: SECURITY
        meaning: A transport or network dedicated to security system usage.
      - value: SEWAGE
        meaning: Sewage collection system.
      - value: SIGNAL
        meaning: A raw analog signal, such as modulated data or measurements from sensors.
      - value: STORMWATER
        meaning: Stormwater resulting from precipitation which runs off or travels over the ground surface.
      - value: TELEPHONE
        meaning: A transport or network dedicated to telephone system usage.
      - value: TV
        meaning: A transport of multiple media sources such as analog cable TV, satellite TV, or over-the-air TV.
      - value: VACUUM
        meaning: Vacuum distribution system.
      - value: VENT
        meaning: Vent system for wastewater piping systems.
      - value: VENTILATION
        meaning: Ventilation air distribution system involved in either the exchange of air to the outside as well as circulation of air within a building.
      - value: WASTEWATER
        meaning: Water adversely affected in quality by anthropogenic influence, possibly originating from sewage, drainage, or other source.
      - value: WATERSUPPLY
        meaning: Arbitrary water supply.
      - value: CATENARY_SYSTEM
        meaning: A longitudinal distribution system that supports contact wires, including catenary wire droppers and stich wires.
      - value: OVERHEAD_CONTACTLINE_SYSTEM
        meaning: An overhead contact line system above the upper limit of the train using an overhead contact line and a catenary system to supply current to traction units.
      - value: RETURN_CIRCUIT
        meaning: A distribution system which forms the intended path for the traction return current and the current under fault conditions.
      - value: FIXEDTRANSMISSIONNETWORK
        meaning: Represents all wired networks that provide a data transmission channel using optical fiber cables, copper cables or both.
      - value: OPERATIONALTELEPHONYSYSTEM
        meaning: A system that allows communications between operators (e.g. switchtender, traffic regulator, operational agents, etc.) in operational centers and on the infrastructure site (e.g. railway, tunnel or road).
      - value: MOBILENETWORK
        meaning: Mobile network insures wireless communication by providing a secure platform for voice and data communication between infrastructure operators, including drivers, dispatchers, shunting team members and station …
      - value: MONITORINGSYSTEM
        meaning: Sensor-based system for building and infrastructure environmental monitoring and control.
      - value: USERDEFINED
        meaning: USERDEFINED (no description for this literal in the source documentation)
      - value: NOTDEFINED
        meaning: NOTDEFINED (no description for this literal in the source documentation)
