meaning: The flow segment type IfcPipeSegmentType defines commonly shared information for occurrences of pipe segments.
fields:
  - name: predefined_type
    type: enum
    meaning: The type of pipe segment.
    source_ref: "IfcPipeSegmentType attribute 1: IfcPipeSegmentTypeEnum; enumeration IfcPipeSegmentTypeEnum"
    values:
      - value: CULVERT
        meaning: A covered channel or large pipe that forms a watercourse below ground level, usually under a road or railway.
      - value: FLEXIBLESEGMENT
        meaning: A flexible segment is a continuous non-linear segment of pipe that can be deformed and change the direction of flow.
      - value: RIGIDSEGMENT
        meaning: A rigid segment is continuous linear segment of pipe that cannot be deformed.
      - value: GUTTER
        meaning: A gutter segment is a continuous open-channel segment of pipe.
      - value: SPOOL
        meaning: A type of rigid segment that is typically shorter and used for providing connectivity within a piping network.
      - value: USERDEFINED
        meaning: User-defined segment.
      - value: NOTDEFINED
        meaning: Undefined segment.
