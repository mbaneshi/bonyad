  - name: name
    type: text
    nullable: true
    meaning: The word or group of words by which the product representation is known.
    source_ref: "IfcProductRepresentation attribute 1: OPTIONAL IfcLabel"
  - name: description
    type: text
    nullable: true
    meaning: The word or group of words that characterize the product representation.
    source_ref: "IfcProductRepresentation attribute 2: OPTIONAL IfcText"
notes: SUPERTYPE OF ONEOF ( IfcMaterialDefinitionRepresentation , IfcProductDefinitionShape ).
