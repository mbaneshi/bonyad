meaning: IfcRoundedRectangleProfileDef defines a rectangle with equally rounded corners as the profile definition used by the swept surface geometry or the swept area solid. It is given by the X extent, the Y extent, and the radius for the rounded corners, and placed within the 2D position coordinate system, established by the Position attribute.
fields:
  - name: rounding_radius
    type: length
    meaning: Radius of the circular arcs by which all four corners of the rectangle are equally rounded.
