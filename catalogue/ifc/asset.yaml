code: ifc.asset
name: IfcAsset
kind: object
base: ifc.group
fidelity: proxy
source:
  document: buildingSMART IFC4.3 EXPRESS schema (IFC4X3_RC4) with IFC4.3.x-development documentation
  section: IfcAsset
  url: https://github.com/buildingSMART/IFC4.3.x-development/blob/2b8baa0a14d5ed1a9f99ef9443bdcb63a0cb0ab1/docs/schemas/shared/IfcSharedFacilitiesElements/Entities/IfcAsset.md
  version: IFC4X3_RC4 (EXPRESS issue date 2021-07-22); repo commit 2b8baa0a14d5; exp sha256 9b7d0c3e187f
  accessed_on: 2026-10-23
  licence: "buildingSMART: CC BY-ND 4.0 (repo LICENSE.md); EXPRESS header allows translation with full attribution, consent needed for changes. See SOURCES.md"
meaning: An asset is a uniquely identifiable grouping of elements acting as a single entity that has a financial value or that can be operated on as a single unit.
fields:
  - name: identification
    type: text
    nullable: true
    meaning: A unique identification assigned to an asset that enables its differentiation from other assets.
    source_ref: "IfcAsset attribute 1: OPTIONAL IfcIdentifier"
  - name: original_value
    type: ref
    nullable: true
    meaning: The cost value of the asset at the time of purchase.
    source_ref: "IfcAsset attribute 2: OPTIONAL IfcCostValue"
    ref_to: ifc.cost_value
  - name: current_value
    type: ref
    nullable: true
    meaning: The current cost value of the asset.
    source_ref: "IfcAsset attribute 3: OPTIONAL IfcCostValue"
    ref_to: ifc.cost_value
  - name: total_replacement_cost
    type: ref
    nullable: true
    meaning: The total cost of replacement of the asset.
    source_ref: "IfcAsset attribute 4: OPTIONAL IfcCostValue"
    ref_to: ifc.cost_value
  - name: owner
    type: ref
    nullable: true
    meaning: The name of the person or organization that 'owns' the asset.
    source_ref: "IfcAsset attribute 5: OPTIONAL IfcActorSelect; via select IfcActorSelect"
    ref_to: any
  - name: user
    type: ref
    nullable: true
    meaning: The name of the person or organization that 'uses' the asset.
    source_ref: "IfcAsset attribute 6: OPTIONAL IfcActorSelect; via select IfcActorSelect"
    ref_to: any
  - name: responsible_person
    type: ref
    nullable: true
    meaning: The person designated to be responsible for the asset.
    source_ref: "IfcAsset attribute 7: OPTIONAL IfcPerson"
    ref_to: ifc.person
  - name: incorporation_date
    type: date
    nullable: true
    meaning: The date on which an asset was incorporated into the works, installed, constructed, erected or completed.
    source_ref: "IfcAsset attribute 8: OPTIONAL IfcDate"
  - name: depreciated_value
    type: ref
    nullable: true
    meaning: The current value of an asset within the accounting rules and procedures of an organization.
    source_ref: "IfcAsset attribute 9: OPTIONAL IfcCostValue"
    ref_to: ifc.cost_value
