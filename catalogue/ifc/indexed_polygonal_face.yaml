meaning: The IfcIndexedPolygonalFace is a compact representation of a planar face being part of a face set. The vertices of the polygonal planar face are provided by 3 or more Cartesian points, defined by indices that point into an IfcCartesianPointList3D, either directly, or via the PnIndex, if provided at IfcPolygonalFaceSet.
fields:
  - name: coord_index
    type: array
    meaning: One-dimensional list with the indices for the three or more points, that define the vertices of the outer loop.
    source_ref: "IfcIndexedPolygonalFace attribute 1: LIST [3:?] OF IfcPositiveInteger"
    of: int
notes: "Inverse attributes not stored: ToFaceSet. SUPERTYPE OF ONEOF ( IfcIndexedPolygonalFaceWithVoids )."
