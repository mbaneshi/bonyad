meaning: The IfcExtrudedAreaSolid is defined by sweeping a cross section provided by a profile definition. The direction of the extrusion is given by the ExtrudedDirection attribute and the length of the extrusion is given by the Depth attribute.
fields:
  - name: extruded_direction
    type: ref
    meaning: The direction in which the surface, provided by SweptArea is to be swept.
    source_ref: "IfcExtrudedAreaSolid attribute 1: IfcDirection"
    ref_to: ifc.direction
  - name: depth
    type: length
    meaning: The distance the surface is to be swept along the ExtrudedDirection.
    source_ref: "IfcExtrudedAreaSolid attribute 2: IfcPositiveLengthMeasure"
    check: positive
notes: SUPERTYPE OF ONEOF ( IfcExtrudedAreaSolidTapered ).
