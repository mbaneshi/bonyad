code: ifc.structural_surface_member
name: IfcStructuralSurfaceMember
kind: entity
base: ifc.structural_member
fidelity: proxy
source:
  document: buildingSMART IFC4.3 EXPRESS schema (IFC4X3_RC4) with IFC4.3.x-development documentation
  section: IfcStructuralSurfaceMember
  url: https://github.com/buildingSMART/IFC4.3.x-development/blob/2b8baa0a14d5ed1a9f99ef9443bdcb63a0cb0ab1/docs/schemas/domain/IfcStructuralAnalysisDomain/Entities/IfcStructuralSurfaceMember.md
  version: IFC4X3_RC4 (EXPRESS issue date 2021-07-22); repo commit 2b8baa0a14d5; exp sha256 9b7d0c3e187f
  accessed_on: 2026-10-23
  licence: "buildingSMART: CC BY-ND 4.0 (repo LICENSE.md); EXPRESS header allows translation with full attribution, consent needed for changes. See SOURCES.md"
meaning: Instances of IfcStructuralSurfaceMember describe face members, that is, structural analysis idealizations of slabs, walls, and shells. Surface members may be planar or curved.
fields:
  - name: predefined_type
    type: enum
    meaning: Type of member with respect to its load carrying behaviour in this analysis idealization.
    source_ref: "IfcStructuralSurfaceMember attribute 1: IfcStructuralSurfaceMemberTypeEnum; enumeration IfcStructuralSurfaceMemberTypeEnum"
    values:
      - value: BENDING_ELEMENT
        meaning: A member with capacity to carry out-of-plane loads, i.e. a plate.
      - value: MEMBRANE_ELEMENT
        meaning: A member with capacity to carry in-plane loads, for example a shear wall.
      - value: SHELL
        meaning: A member with capacity to carry in-plane and out-of-plane loads, i.e. a combination of bending element and membrane element.
      - value: USERDEFINED
        meaning: A specially defined member.
      - value: NOTDEFINED
        meaning: A member without further categorization.
  - name: thickness
    type: length
    nullable: true
    meaning: Defines the typically understood thickness of the structural surface member, measured normal to its reference surface.
    source_ref: "IfcStructuralSurfaceMember attribute 2: OPTIONAL IfcPositiveLengthMeasure"
    check: positive
notes: SUPERTYPE OF ONEOF ( IfcStructuralSurfaceMemberVarying ).
