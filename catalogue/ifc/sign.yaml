code: ifc.sign
name: IfcSign
kind: entity
base: ifc.element_component
fidelity: proxy
source:
  document: buildingSMART IFC4.3 EXPRESS schema (IFC4X3_RC4) with IFC4.3.x-development documentation
  section: IfcSign
  url: https://github.com/buildingSMART/IFC4.3.x-development/blob/2b8baa0a14d5ed1a9f99ef9443bdcb63a0cb0ab1/docs/schemas/shared/IfcSharedInfrastructureElements/Entities/IfcSign.md
  version: IFC4X3_RC4 (EXPRESS issue date 2021-07-22); repo commit 2b8baa0a14d5; exp sha256 9b7d0c3e187f
  accessed_on: 2026-10-23
  licence: "buildingSMART: CC BY-ND 4.0 (repo LICENSE.md); EXPRESS header allows translation with full attribution, consent needed for changes. See SOURCES.md"
meaning: A sign is a notice on display that gives information or instructions in a written, symbolic or other form. Signs are passive with the most common form of a pictorial panel.
fields:
  - name: predefined_type
    type: enum
    nullable: true
    meaning: Identifies the predefined type of a signs.
    source_ref: "IfcSign attribute 1: OPTIONAL IfcSignTypeEnum; enumeration IfcSignTypeEnum"
    values:
      - value: MARKER
        meaning: A Sign type formed of a vertical post (possibly with some lettering or symbols) usually used to delimitate distance or the location of some equipment.
      - value: PICTORAL
        meaning: A sign type formed of a flat plate with some written or symbolic images on it.
      - value: MIRROR
        meaning: A sign type that provides information via a reflective mirror surface.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
