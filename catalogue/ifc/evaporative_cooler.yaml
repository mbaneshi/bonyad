      - value: DIRECTEVAPORATIVERANDOMMEDIAAIRCOOLER
        meaning: "Direct evaporative random media air cooler: Cools the air stream by evaporating water dircectly into the air stream using coolers with evaporative pads, usually of aspen wood or plastic fiber/foam."
      - value: DIRECTEVAPORATIVERIGIDMEDIAAIRCOOLER
        meaning: "Direct evaporative rigid media air cooler: Cools the air stream by evaporating water dircectly into the air stream using coolers with sheets of rigid, corrugated material as the wetted surface."
      - value: DIRECTEVAPORATIVESLINGERSPACKAGEDAIRCOOLER
        meaning: "Direct evaporative slingers packaged air cooler: Cools the air stream by evaporating water dircectly into the air stream using coolers with a water slinger in an evaporative cooling section and a fan section."
      - value: DIRECTEVAPORATIVEPACKAGEDROTARYAIRCOOLER
        meaning: "Direct evaporative packaged rotary air cooler: Cools the air stream by evaporating water dircectly into the air stream using coolers that wet and wash the evaporative pad by rotating it through a water bath."
      - value: DIRECTEVAPORATIVEAIRWASHER
        meaning: "Direct evaporative air washer: Cools the air stream by evaporating water dircectly into the air stream using coolers with spray-type air washer consist of a chamber or casing containing spray nozzles, and tank for …"
      - value: INDIRECTEVAPORATIVEPACKAGEAIRCOOLER
        meaning: "Indirect evaporative package air cooler: Cools the air stream by evaporating water indirectly and without adding moisture into the air stream."
      - value: INDIRECTEVAPORATIVEWETCOIL
        meaning: "Indirect evaporative wet coil: Cools the air stream by evaporating water indirectly and without adding moisture into the air stream."
      - value: INDIRECTEVAPORATIVECOOLINGTOWERORCOILCOOLER
