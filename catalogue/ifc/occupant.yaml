meaning: An occupant is a type of actor that defines the form of occupancy of a property.
fields:
  - name: predefined_type
    type: enum
    nullable: true
    meaning: Predefined occupant types from which that required may be set.
    source_ref: "IfcOccupant attribute 1: OPTIONAL IfcOccupantTypeEnum; enumeration IfcOccupantTypeEnum"
    values:
      - value: ASSIGNEE
        meaning: Actor receiving the assignment of a property agreement from an assignor.
      - value: ASSIGNOR
        meaning: Actor assigning a property agreement to an assignor.
      - value: LESSEE
        meaning: Actor receiving the lease of a property from a lessor.
      - value: LESSOR
        meaning: Actor leasing a property to a lessee.
      - value: LETTINGAGENT
        meaning: Actor participating in a property agreement on behalf of an owner, lessor or assignor.
      - value: OWNER
        meaning: Actor that owns a property.
      - value: TENANT
        meaning: Actor renting the use of a property for a period of time.
      - value: USERDEFINED
        meaning: User-defined type.
      - value: NOTDEFINED
        meaning: Undefined type.
