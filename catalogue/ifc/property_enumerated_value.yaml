meaning: A property with an enumerated value, IfcPropertyEnumeratedValue, defines a property object which has a value assigned that is chosen from an enumeration. It defines a property - value combination for which the property Name, an optional Description, the optional EnumerationValues with measure type and optionally an Unit is given.
fields:
  - name: enumeration_values
    type: array
    nullable: true
    meaning: Enumeration values, which shall be listed in the referenced IfcPropertyEnumeration, if such a reference is provided.
    source_ref: "IfcPropertyEnumeratedValue attribute 1: OPTIONAL LIST [1:?] OF IfcValue; elements are SELECT IfcValue of value types, stored as text (the member type tag is not kept)"
    of: text
  - name: enumeration_reference
    type: ref
    nullable: true
    meaning: Enumeration from which a enumeration value has been selected.
    source_ref: "IfcPropertyEnumeratedValue attribute 2: OPTIONAL IfcPropertyEnumeration"
    ref_to: ifc.property_enumeration
