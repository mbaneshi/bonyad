meaning: Unitary equipment typically combine a number of components into a single product, such as air handlers, pre-packaged rooftop air-conditioning units, heat pumps, and split systems.
fields:
  - name: predefined_type
    type: enum
    nullable: true
    meaning: PredefinedType attribute of IfcUnitaryEquipment (not described in the source documentation).
    source_ref: "IfcUnitaryEquipment attribute 1: OPTIONAL IfcUnitaryEquipmentTypeEnum; enumeration IfcUnitaryEquipmentTypeEnum"
    values:
      - value: AIRHANDLER
        meaning: A unitary air handling unit typically containing a fan, economizer, and coils.
      - value: AIRCONDITIONINGUNIT
        meaning: A unitary packaged air-conditioning unit typically used in residential or light commercial applications.
      - value: DEHUMIDIFIER
        meaning: A unitary packaged dehumidification unit.
      - value: SPLITSYSTEM
        meaning: A system which separates the compressor from the evaporator, but acts as a unitary component typically within residential or light commercial applications.
      - value: ROOFTOPUNIT
        meaning: A packaged assembly that is either field-erected or manufactured atop the roof of a large residential or commercial building and acts as a unitary component.
      - value: USERDEFINED
        meaning: User-defined unitary equipment type.
      - value: NOTDEFINED
        meaning: Undefined unitary equipment type.
