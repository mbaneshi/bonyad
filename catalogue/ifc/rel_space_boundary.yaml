code: ifc.rel_space_boundary
name: IfcRelSpaceBoundary
kind: object
base: ifc.rel_connects
fidelity: proxy
source:
  document: buildingSMART IFC4.3 EXPRESS schema (IFC4X3_RC4) with IFC4.3.x-development documentation
  section: IfcRelSpaceBoundary
  url: https://github.com/buildingSMART/IFC4.3.x-development/blob/2b8baa0a14d5ed1a9f99ef9443bdcb63a0cb0ab1/docs/schemas/core/IfcProductExtension/Entities/IfcRelSpaceBoundary.md
  version: IFC4X3_RC4 (EXPRESS issue date 2021-07-22); repo commit 2b8baa0a14d5; exp sha256 9b7d0c3e187f
  accessed_on: 2026-10-23
  licence: "buildingSMART: CC BY-ND 4.0 (repo LICENSE.md); EXPRESS header allows translation with full attribution, consent needed for changes. See SOURCES.md"
meaning: The space boundary defines the physical or virtual delimiter of a space by the relationship IfcRelSpaceBoundary to the surrounding elements.
fields:
  - name: relating_space
    type: ref
    meaning: Reference to one space that is delimited by this boundary.
    source_ref: "IfcRelSpaceBoundary attribute 1: IfcSpaceBoundarySelect; via select IfcSpaceBoundarySelect"
    ref_to: ifc.spatial_element
  - name: related_building_element
    type: ref
    meaning: Reference to the Element that defines the Space Boundaries.
    source_ref: "IfcRelSpaceBoundary attribute 2: IfcElement"
    ref_to: ifc.element
  - name: connection_geometry
    type: ref
    nullable: true
    meaning: Physical representation of the space boundary.
    source_ref: "IfcRelSpaceBoundary attribute 3: OPTIONAL IfcConnectionGeometry"
    ref_to: ifc.connection_geometry
  - name: physical_or_virtual_boundary
    type: enum
    meaning: Defines whether the Space Boundary is PHYISICAL or VIRTUAL.
    source_ref: "IfcRelSpaceBoundary attribute 4: IfcPhysicalOrVirtualEnum; enumeration IfcPhysicalOrVirtualEnum"
    values:
      - value: PHYSICAL
        meaning: The space boundary is provided physically (by a physical element).
      - value: VIRTUAL
        meaning: The space boundary is provided virtually (by a logical divider that has no physical manifestation).
      - value: NOTDEFINED
        meaning: No information available.
  - name: internal_or_external_boundary
    type: enum
    meaning: Defines whether the Space Boundary is INTERNAL, or EXTERNAL, i.e. adjacent to open space that can be a partially enclosed space, such as terrace.
    source_ref: "IfcRelSpaceBoundary attribute 5: IfcInternalOrExternalEnum; enumeration IfcInternalOrExternalEnum"
    values:
      - value: INTERNAL
        meaning: The space boundary faces a physical or virtual element where there is an internal space on the other side.
      - value: EXTERNAL
        meaning: The space boundary faces a physical or virtual element where there is an external space on the other side.
      - value: EXTERNAL_EARTH
        meaning: The space boundary faces a physical or virtual element where there is earth (or terrain) on the other side.
      - value: EXTERNAL_WATER
        meaning: The space boundary faces a physical or virtual element where there is water (water component of terrain) on the other side.
      - value: EXTERNAL_FIRE
        meaning: The space boundary faces a physical or virtual element where there is another building on the other side.
      - value: NOTDEFINED
        meaning: No information available.
notes: SUPERTYPE OF ONEOF ( IfcRelSpaceBoundary1stLevel ).
