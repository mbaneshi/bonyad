    source_ref: "IfcTriangulatedFaceSet attribute 2: OPTIONAL IfcBoolean"
  - name: pn_index
    type: array
    nullable: true
    meaning: The list of integers defining the locations in the IfcCartesianPointList3D to obtain the point coordinates for the indices withint the CoordIndex.
