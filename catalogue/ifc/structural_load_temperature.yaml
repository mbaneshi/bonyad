meaning: An instance of the entity IfcStructuralLoadTemperature shall be used to define actions which are caused by a temperature change. As shown in Figure 1, the change of temperature is given with a constant value which is applied to the complete section and values for temperature differences between outer fibres of the section.
fields:
  - name: delta_t_constant
    type: float
    nullable: true
    meaning: Temperature change which affects the complete section of the structural member, or the uniform portion of a non-uniform temperature change.
    source_ref: "IfcStructuralLoadTemperature attribute 1: OPTIONAL IfcThermodynamicTemperatureMeasure"
  - name: delta_ty
    type: float
    nullable: true
    meaning: Non-uniform temperature change, specified as the difference of the temperature change at the outer fibre of the positive y direction minus the temperature change at the outer fibre of the negative y direction of the analysis member.
    source_ref: "IfcStructuralLoadTemperature attribute 2: OPTIONAL IfcThermodynamicTemperatureMeasure"
  - name: delta_tz
    type: float
    nullable: true
    meaning: Non-uniform temperature change, specified as the difference of the temperature change at the outer fibre of the positive z direction minus the temperature change at the outer fibre of the negative z direction of the analysis member.
    source_ref: "IfcStructuralLoadTemperature attribute 3: OPTIONAL IfcThermodynamicTemperatureMeasure"
