    source_ref: gpkgext_relations.related_primary_column TEXT
    default: id
  - name: relation_name
    type: text
    meaning: Name (profile) of the relationship.
    source_ref: gpkgext_relations.relation_name TEXT
  - name: mapping_table_name
    type: text
