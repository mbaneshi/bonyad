code: gis.gpkg_tile_matrix
name: gpkg_tile_matrix
kind: child
parent: gis.gpkg_contents
fidelity: proxy
source:
  document: OGC GeoPackage Encoding Standard, OGC 12-128r19
  section: Tiles > Tile Matrix (table 'Tile Matrix Metadata Table Definition') + Annex C DDL
  url: https://github.com/opengeospatial/geopackage/blob/fe83fdd5949a3faba09117e6e1dcc003fdb5a900/spec/core/2b_tiles.adoc
  version: 1.4.0 (repository commit fe83fdd)
  accessed_on: 2026-10-23
  licence: OGC License Agreement (opengeospatial/geopackage LICENSE.md)
meaning: "Describes one zoom level of a tile pyramid: matrix size in tiles, tile size in pixels and pixel size in CRS units."
fields:
  - name: table_name
    type: ref
    meaning: Tile Pyramid User Data Table Name.
    source_ref: gpkg_tile_matrix.table_name TEXT (primary key) -> gpkg_contents.table_name
    ref_to: gis.gpkg_contents
  - name: zoom_level
    type: int
    meaning: 0 <= zoom_level <= max_level for table_name.
    source_ref: gpkg_tile_matrix.zoom_level INTEGER (primary key)
    check: non_negative
  - name: matrix_width
    type: int
    meaning: Number of columns (>= 1) in tile matrix at this zoom level.
    source_ref: gpkg_tile_matrix.matrix_width INTEGER
    check: positive
  - name: matrix_height
    type: int
    meaning: Number of rows (>= 1) in tile matrix at this zoom level.
    source_ref: gpkg_tile_matrix.matrix_height INTEGER
    check: positive
  - name: tile_width
    type: int
    meaning: Tile width in pixels (>= 1)for this zoom level.
    source_ref: gpkg_tile_matrix.tile_width INTEGER
    check: positive
    unit: pixel
  - name: tile_height
    type: int
    meaning: Tile height in pixels (>= 1) for this zoom level.
    source_ref: gpkg_tile_matrix.tile_height INTEGER
    check: positive
    unit: pixel
  - name: pixel_x_size
    type: float
    meaning: In t_table_name srid units or default meters for srid 0 (>0).
    source_ref: gpkg_tile_matrix.pixel_x_size DOUBLE
    check: positive
  - name: pixel_y_size
    type: float
    meaning: In t_table_name srid units or default meters for srid 0 (>0).
    source_ref: gpkg_tile_matrix.pixel_y_size DOUBLE
    check: positive
notes: Columns, SQL types, nullability and foreign keys DERIVED by tools/harvest/gis/src/derive/gpkg.ts from the spec DDL; field meanings are the spec's own column descriptions (lightly cleaned). Entity meaning, enum values and checks are HAND-AUTHORED (reviewed). Parent is gpkg_contents because that is the foreign key the DDL declares (fk_tmm_table_name); a tile matrix row also pairs with the same-named gpkg_tile_matrix_set row.
