    source_ref: gpkg_data_column_constraints.value TEXT
    nullable: true
  - name: min
    type: float
    meaning: Minimum value for 'range' or NULL for 'enum' or 'glob' constraint_type.
    source_ref: gpkg_data_column_constraints.min NUMERIC
    nullable: true
  - name: min_is_inclusive
    type: bool
    meaning: 0 (false) if min value is exclusive, or 1 (true) if min value is inclusive.
    source_ref: gpkg_data_column_constraints.min_is_inclusive BOOLEAN
    nullable: true
  - name: max
    type: float
    meaning: Maximum value for 'range' or NULL for 'enum' or 'glob' constraint_type.
    source_ref: gpkg_data_column_constraints.max NUMERIC
    nullable: true
  - name: max_is_inclusive
    type: bool
    meaning: 0 (false) if max value is exclusive, or 1 (true) if max value is inclusive.
    source_ref: gpkg_data_column_constraints.max_is_inclusive BOOLEAN
    nullable: true
  - name: description
    type: text
    meaning: For ranges and globs, describes the constraint; for enums, describes the enum value.
    source_ref: gpkg_data_column_constraints.description TEXT
    nullable: true
notes: Columns, SQL types, nullability and foreign keys DERIVED by tools/harvest/gis/src/derive/gpkg.ts from the spec DDL; field meanings are the spec's own column descriptions (lightly cleaned). Entity meaning, enum values and checks are HAND-AUTHORED (reviewed). Rows are jointly unique on (constraint_name, constraint_type, value); no single-column key.
