meaning: "Schema extension: human-readable name, title, description, MIME type and value constraint for a column of a content table."
fields:
  - name: table_name
    type: text
    meaning: Name of a table specified in gpkg_contents.table_name or gpkg_extensions.table_name.
    source_ref: gpkg_data_columns.table_name TEXT (primary key)
  - name: column_name
    type: text
    meaning: Name of the table column.
    source_ref: gpkg_data_columns.column_name TEXT (primary key)
  - name: name
    type: text
    meaning: A human-readable identifier (e.g. short name) for the column_name content.
    source_ref: gpkg_data_columns.name TEXT
    nullable: true
  - name: title
    type: text
    meaning: A human-readable formal title for the column_name content.
    source_ref: gpkg_data_columns.title TEXT
    nullable: true
  - name: description
    type: text
    meaning: A human-readable description for the column_name content.
    source_ref: gpkg_data_columns.description TEXT
    nullable: true
  - name: mime_type
    type: text
    meaning: MIME type of column_name if BLOB type, or NULL for other types.
    source_ref: gpkg_data_columns.mime_type TEXT
    nullable: true
notes: Columns, SQL types, nullability and foreign keys DERIVED by tools/harvest/gis/src/derive/gpkg.ts from the spec DDL; field meanings are the spec's own column descriptions (lightly cleaned). Entity meaning, enum values and checks are HAND-AUTHORED (reviewed). constraint_name references gpkg_data_column_constraints.constraint_name, which is not unique alone (several enum rows share a name), so it stays text rather than ref.
