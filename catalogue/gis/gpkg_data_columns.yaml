code: gis.gpkg_data_columns
name: gpkg_data_columns
kind: symbol
fidelity: proxy
source:
  document: OGC GeoPackage Encoding Standard, OGC 12-128r19
  section: Schema extension (gpkg_schema), table 'Data Columns Table Definition' + its Table Definition SQL
  url: https://github.com/opengeospatial/geopackage/blob/fe83fdd5949a3faba09117e6e1dcc003fdb5a900/spec/core/annexes/extension_schema.adoc
