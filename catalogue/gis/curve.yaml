notes: "Geometry model is HAND-AUTHORED: its hierarchy, parts-as-child decomposition and field set were authored from the cited clauses, not generated. Child rows carry no position field: the generated position column is the order (rules 5 and 9 of FORMAT.md). Subtypes in GeoPackage: LineString, CircularString, CompoundCurve (geometrytypes annex). SFA defines only LineString as a Curve subclass; the others come from ISO SQL/MM Part 3 (GeoPackage extension geometry types, GDAL)."
