code: gis.gpkg_metadata_reference
name: gpkg_metadata_reference
kind: symbol
fidelity: proxy
source:
  document: OGC GeoPackage Encoding Standard, OGC 12-128r19
  section: Metadata extension (gpkg_metadata_reference), table 'Metadata Reference Table Definition' + its Table Definition SQL
  url: https://github.com/opengeospatial/geopackage/blob/fe83fdd5949a3faba09117e6e1dcc003fdb5a900/spec/core/annexes/extension_metadata.adoc
  version: 1.4.0 (repository commit fe83fdd)
  accessed_on: 2026-10-23
  licence: OGC License Agreement (opengeospatial/geopackage LICENSE.md)
meaning: "Metadata extension: links a gpkg_metadata document to the whole file, a table, a column, a row or a row/column cell, optionally with a hierarchical parent."
fields:
  - name: reference_scope
    type: enum
    meaning: Lowercase scope of the target this metadata reference applies to.
    source_ref: gpkg_metadata_reference.reference_scope TEXT
    values:
      - value: geopackage
        meaning: The whole GeoPackage (table_name is NULL)
      - value: table
        meaning: A whole table
      - value: column
        meaning: A column of a table
      - value: row
        meaning: A row of a table
      - value: row/col
        meaning: "A single cell: a column within a row"
  - name: table_name
    type: text
    meaning: Name of the table to which this metadata reference applies, or NULL for reference_scope of 'geopackage'.
    source_ref: gpkg_metadata_reference.table_name TEXT
    nullable: true
  - name: column_name
    type: text
    meaning: For reference_scope of 'column' or 'row/col', name of the column to which this metadata reference applies (NULL otherwise).
    source_ref: gpkg_metadata_reference.column_name TEXT
    nullable: true
  - name: row_id_value
    type: int
    meaning: For reference_scope of 'row' or 'row/col', the rowid of a row record in the table referenced by table_name (NULL otherwise).
    source_ref: gpkg_metadata_reference.row_id_value INTEGER
    nullable: true
  - name: timestamp
    type: timestamp
    meaning: Timestamp value in ISO 8601 format as defined by the strftime function '%Y-%m-%dT%H:%M:%fZ' format string applied to the current time.
    source_ref: gpkg_metadata_reference.timestamp DATETIME
  - name: md_file_id
    type: ref
    meaning: gpkg_metadata table id column value for the metadata to which this gpkg_metadata_reference applies.
    source_ref: gpkg_metadata_reference.md_file_id INTEGER -> gpkg_metadata.id
    ref_to: gis.gpkg_metadata
  - name: md_parent_id
    type: ref
    meaning: gpkg_metadata table id column value for the hierarchical parent gpkg_metadata for the gpkg_metadata to which this gpkg_metadata_reference applies, or NULL if md_file_id forms the root of a metadata hierarchy.
    source_ref: gpkg_metadata_reference.md_parent_id INTEGER -> gpkg_metadata.id
    nullable: true
    ref_to: gis.gpkg_metadata
notes: Columns, SQL types, nullability and foreign keys DERIVED by tools/harvest/gis/src/derive/gpkg.ts from the spec DDL; field meanings are the spec's own column descriptions (lightly cleaned). Entity meaning, enum values and checks are HAND-AUTHORED (reviewed). No primary key in the DDL. table_name and column_name are free text naming user tables (not foreign keys).
