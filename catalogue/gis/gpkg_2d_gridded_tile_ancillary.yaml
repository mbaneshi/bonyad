notes: Columns, SQL types, nullability and foreign keys DERIVED by tools/harvest/gis/src/derive/gpkg.ts from the spec DDL; field meanings are the spec's own column descriptions (lightly cleaned). Entity meaning, enum values and checks are HAND-AUTHORED (reviewed). tpudt_id is the id of a row in the tile pyramid user data table named by tpudt_name, so it cannot be a typed ref; (tpudt_name, tpudt_id) are jointly unique.
