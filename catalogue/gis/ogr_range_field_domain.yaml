code: gis.ogr_range_field_domain
name: OGRRangeFieldDomain
kind: entity
base: gis.ogr_field_domain
fidelity: proxy
source:
  document: GDAL/OGR source (ogr_feature.h)
  section: class OGRRangeFieldDomain
