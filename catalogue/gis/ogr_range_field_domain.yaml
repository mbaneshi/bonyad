meaning: A domain that constrains numeric or date values to a range with optionally inclusive bounds.
fields:
  - name: min_value
    type: text
    nullable: true
    meaning: Lower bound as text (the header stores it in a union typed by the field type); absent when unbounded.
    source_ref: OGRRangeFieldDomain::m_sMin
  - name: min_is_inclusive
    type: bool
    default: true
    meaning: Whether the lower bound itself is allowed.
    source_ref: OGRRangeFieldDomain::m_bMinIsInclusive
  - name: max_value
    type: text
    nullable: true
    meaning: Upper bound as text; absent when unbounded.
    source_ref: OGRRangeFieldDomain::m_sMax
  - name: max_is_inclusive
    type: bool
    default: true
    meaning: Whether the upper bound itself is allowed.
    source_ref: OGRRangeFieldDomain::m_bMaxIsInclusive
notes: Structure follows the members of the cited GDAL class; enumeration values are DERIVED from the header by tools/harvest/gis/src/derive/gdal.ts. Entity and field prose is HAND-AUTHORED. Runtime-only state (reference counts, sealed/ignored flags, caches) is not data and is not modelled. Bounds are text because the source union (OGRField) is typed by the owning field_type and the catalogue format has no variant column.
