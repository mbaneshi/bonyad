code: gis.ogr_feature
name: OGRFeature
kind: entity
fidelity: proxy
source:
  document: GDAL/OGR source (ogr_feature.h) and documentation
  section: class OGRFeature; vector_data_model.rst 'Feature / Feature Definition'
  url: https://github.com/OSGeo/gdal/blob/c8b4c45fca87d3e6fbf80e7a7898b8a661ad0edc/ogr/ogr_feature.h
  version: GDAL 3.13.3 (commit c8b4c45)
  accessed_on: 2026-10-23
  licence: MIT (GDAL/OGR)
meaning: "One vector feature: an identity within a layer plus its geometries and attribute values, interpreted through a feature definition. Attribute values live in the layer's own columns, not here."
fields:
  - name: definition
    type: ref
    ref_to: gis.ogr_feature_defn
    meaning: The feature class definition that gives meaning to the feature's fields.
    source_ref: OGRFeature::poDefn
  - name: fid
    type: bigint
    nullable: true
    meaning: Feature id, unique within its layer (64-bit); null stands for OGRNullFID (-1), a feature not yet written.
    source_ref: OGRFeature::nFID; OGRNullFID -1
  - name: style_string
    type: text
    nullable: true
    meaning: OGR feature style string (pen, brush, symbol, label tools) for this feature.
    source_ref: OGRFeature::m_pszStyleString
  - name: native_data
    type: text
    nullable: true
    meaning: Format-specific serialisation of the feature as read from the source (for example GeoJSON), kept for round trips.
    source_ref: OGRFeature::m_pszNativeData
  - name: native_media_type
    type: text
    nullable: true
    meaning: Media type of native_data, for example application/vnd.geo+json.
    source_ref: OGRFeature::m_pszNativeMediaType
notes: Structure follows the members of the cited GDAL class; enumeration values are DERIVED from the header by tools/harvest/gis/src/derive/gdal.ts. Entity and field prose is HAND-AUTHORED. Runtime-only state (reference counts, sealed/ignored flags, caches) is not data and is not modelled.
