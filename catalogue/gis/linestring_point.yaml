meaning: One ordered vertex of a LineString.
fields:
  - name: x
    type: float
    meaning: X coordinate (easting or longitude) in the units of the geometry's CRS; not converted to radians because the unit belongs to the CRS axis, not to the geometry.
    source_ref: SFA 6.1.4 Point.X()
  - name: y
    type: float
    meaning: Y coordinate (northing or latitude) in the units of the geometry's CRS.
    source_ref: SFA 6.1.4 Point.Y()
  - name: z
    type: float
    nullable: true
    meaning: Z coordinate (typically altitude or elevation); present only when the owning geometry has_z is true.
    source_ref: SFA 6.1.4 Point.Z(), NIL if absent
  - name: m
    type: float
    nullable: true
    meaning: M coordinate (a measurement); present only when the owning geometry has_m is true.
    source_ref: SFA 6.1.4 Point.M(), NIL if absent
notes: "Geometry model is HAND-AUTHORED: its hierarchy, parts-as-child decomposition and field set were authored from the cited clauses, not generated. Child rows carry no position field: the generated position column is the order (rules 5 and 9 of FORMAT.md). Z/M columns follow the owning LineString's has_z/has_m."
