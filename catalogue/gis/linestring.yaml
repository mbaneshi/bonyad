notes: "Geometry model is HAND-AUTHORED: its hierarchy, parts-as-child decomposition and field set were authored from the cited clauses, not generated. Child rows carry no position field: the generated position column is the order (rules 5 and 9 of FORMAT.md). Vertices live in the child gis.linestring_point. A Line is a LineString with exactly 2 points; a LinearRing is a LineString that is closed and simple (both SFA 6.1.7.1) and is used as polygon rings - not separate stored types here."
