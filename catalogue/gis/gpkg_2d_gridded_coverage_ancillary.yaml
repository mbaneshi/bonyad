code: gis.gpkg_2d_gridded_coverage_ancillary
name: gpkg_2d_gridded_coverage_ancillary
kind: symbol
fidelity: proxy
source:
  document: OGC GeoPackage Encoding Standard, OGC 12-128r19
  section: OGC GeoPackage Extension for Tiled Gridded Coverage Data, table 'Coverage Ancillary Table Definition' + Annex C SQL
  url: https://github.com/opengeospatial/geopackage/blob/fe83fdd5949a3faba09117e6e1dcc003fdb5a900/spec/2d-gridded-coverage/clause_7_normative_text.adoc
