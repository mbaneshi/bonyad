meaning: "Tiled Gridded Coverage extension: per tile matrix set encoding of grid cell values (data type, scale, offset, null value, units, quantity)."
fields:
  - name: coverage_ancillary_id
    type: int
    meaning: Autoincrement primary key. (Source column name is id; renamed to avoid clashing with a generated surrogate key.)
    source_ref: gpkg_2d_gridded_coverage_ancillary.id INTEGER (primary key)
  - name: tile_matrix_set_name
    type: ref
    meaning: Foreign key to table_name in gpkg_tile_matrix_set.
    source_ref: gpkg_2d_gridded_coverage_ancillary.tile_matrix_set_name TEXT -> gpkg_tile_matrix_set.table_name
    ref_to: gis.gpkg_tile_matrix_set
  - name: datatype
    type: enum
    meaning: Data type of the grid cell values.
    source_ref: gpkg_2d_gridded_coverage_ancillary.datatype TEXT
    default: integer
    values:
      - value: integer
        meaning: Cell values stored as integers; scale and offset apply
      - value: float
        meaning: Cell values stored as floating point; scale and offset do not apply
  - name: scale
    type: float
    meaning: Scale as a multiple relative to the unit of measure.
    source_ref: gpkg_2d_gridded_coverage_ancillary.scale REAL
    default: 1
  - name: offset
    type: float
    meaning: The offset to the 0 value.
    source_ref: gpkg_2d_gridded_coverage_ancillary.offset REAL
    default: 0
  - name: precision
    type: float
    meaning: The smallest value that has meaning for this dataset.
    source_ref: gpkg_2d_gridded_coverage_ancillary.precision REAL
    nullable: true
    default: 1
  - name: data_null
    type: float
    meaning: The value that indicates NULL.
    source_ref: gpkg_2d_gridded_coverage_ancillary.data_null REAL
    nullable: true
  - name: grid_cell_encoding
    type: text
    meaning: Specifies how a value is assigned to a grid cell (pixel).
    source_ref: gpkg_2d_gridded_coverage_ancillary.grid_cell_encoding TEXT
    nullable: true
    default: grid-value-is-center
  - name: uom
    type: text
    meaning: Units of Measure for values in the grid coverage.
    source_ref: gpkg_2d_gridded_coverage_ancillary.uom TEXT
    nullable: true
  - name: field_name
    type: text
    meaning: Type of Gridded Coverage Data (default is Height).
    source_ref: gpkg_2d_gridded_coverage_ancillary.field_name TEXT
    nullable: true
    default: Height
  - name: quantity_definition
    type: text
    meaning: Description of the values contained in the Gridded Coverage.
    source_ref: gpkg_2d_gridded_coverage_ancillary.quantity_definition TEXT
    nullable: true
    default: Height
