notes: "Geometry model is HAND-AUTHORED: its hierarchy, parts-as-child decomposition and field set were authored from the cited clauses, not generated. Child rows carry no position field: the generated position column is the order (rules 5 and 9 of FORMAT.md). SFA calls MultiCurve a 'non-instantiable class' included for extensibility, so it is abstract here; GeoPackage still lists MULTICURVE (code 11) as a declarable geometry type and GDAL has a concrete OGRMultiCurve (SQL/MM), so a concrete use is possible. Left abstract per SFA; confirm against SQL/MM."
