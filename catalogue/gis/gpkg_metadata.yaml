code: gis.gpkg_metadata
name: gpkg_metadata
kind: symbol
fidelity: proxy
source:
  document: OGC GeoPackage Encoding Standard, OGC 12-128r19
  section: Metadata extension (gpkg_metadata), table 'Metadata Table Definition' + 'Metadata Scopes' table + its Table Definition SQL
  url: https://github.com/opengeospatial/geopackage/blob/fe83fdd5949a3faba09117e6e1dcc003fdb5a900/spec/core/annexes/extension_metadata.adoc
  version: 1.4.0 (repository commit fe83fdd)
  accessed_on: 2026-10-23
  licence: OGC License Agreement (opengeospatial/geopackage LICENSE.md)
meaning: "Metadata extension: one metadata document (for example ISO 19115 XML) with its scope, standard URI and MIME type."
fields:
  - name: metadata_id
    type: int
    meaning: Autoincrement primary key; referenced by gpkg_metadata_reference.md_file_id and md_parent_id. (Source column name is id; renamed to avoid clashing with a generated surrogate key.)
    source_ref: gpkg_metadata.id INTEGER (primary key)
  - name: md_scope
    type: enum
    meaning: Case sensitive name of the data scope to which this metadata applies.
    source_ref: gpkg_metadata.md_scope TEXT
    default: dataset
    values:
      - value: undefined
        meaning: Metadata information scope is undefined
      - value: fieldSession
        meaning: Information applies to the field session
      - value: collectionSession
        meaning: Information applies to the collection session
      - value: series
        meaning: Information applies to the (dataset) series
      - value: dataset
        meaning: Information applies to the (geographic feature) dataset
      - value: featureType
        meaning: Information applies to a feature type (class)
      - value: feature
        meaning: Information applies to a feature (instance)
      - value: attributeType
        meaning: Information applies to the attribute class
      - value: attribute
        meaning: Information applies to the characteristic of a feature (instance)
      - value: tile
        meaning: Information applies to a tile, a spatial subset of geographic data
      - value: model
        meaning: Information applies to a copy or imitation of an existing or hypothetical object
      - value: catalog
        meaning: Metadata applies to a feature catalog
      - value: schema
        meaning: Metadata applies to an application schema
      - value: taxonomy
        meaning: Metadata applies to a taxonomy or knowledge system
      - value: software
        meaning: Information applies to a computer program or routine
      - value: service
        meaning: Information applies to a capability which a service provider entity makes available to a service user entity
      - value: collectionHardware
        meaning: Information applies to the collection hardware class
      - value: nonGeographicDataset
        meaning: Information applies to non-geographic data
      - value: dimensionGroup
        meaning: Information applies to a dimension group
      - value: style
        meaning: Information applies to a specific style
  - name: md_standard_uri
    type: text
    meaning: URI reference to the metadata structure definition authority.
    source_ref: gpkg_metadata.md_standard_uri TEXT
  - name: mime_type
    type: text
    meaning: MIME encoding of metadata.
    source_ref: gpkg_metadata.mime_type TEXT
    default: text/xml
  - name: metadata
    type: text
    meaning: metadata.
    source_ref: gpkg_metadata.metadata TEXT
    default: ""
notes: Columns, SQL types, nullability and foreign keys DERIVED by tools/harvest/gis/src/derive/gpkg.ts from the spec DDL; field meanings are the spec's own column descriptions (lightly cleaned). Entity meaning, enum values and checks are HAND-AUTHORED (reviewed).
