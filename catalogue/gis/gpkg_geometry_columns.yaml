code: gis.gpkg_geometry_columns
name: gpkg_geometry_columns
kind: symbol
fidelity: proxy
source:
  document: OGC GeoPackage Encoding Standard, OGC 12-128r19
  section: Features > Geometry Columns (table 'Geometry Columns Table Definition') + Annex C DDL; Annex 'Geometry Types (Normative)' for the enum
  url: https://github.com/opengeospatial/geopackage/blob/fe83fdd5949a3faba09117e6e1dcc003fdb5a900/spec/core/2a_features.adoc
  version: 1.4.0 (repository commit fe83fdd)
  accessed_on: 2026-10-23
  licence: OGC License Agreement (opengeospatial/geopackage LICENSE.md)
meaning: "Declares the single geometry column of each vector feature table: its geometry type, SRS and whether Z and M values are prohibited, mandatory or optional."
fields:
  - name: table_name
    type: ref
    meaning: Name of the table containing the geometry column.
    source_ref: gpkg_geometry_columns.table_name TEXT (primary key) -> gpkg_contents.table_name
    ref_to: gis.gpkg_contents
  - name: column_name
    type: text
    meaning: Name of a column in the feature table that is a Geometry Column.
    source_ref: gpkg_geometry_columns.column_name TEXT (primary key)
  - name: geometry_type_name
    type: enum
    meaning: Uppercase geometry type name from the GeoPackage geometry type tables (core codes 0-7, extension codes 8-14).
    source_ref: gpkg_geometry_columns.geometry_type_name TEXT
    values:
      - value: GEOMETRY
        meaning: Geometry type code 0 (core type)
      - value: POINT
        meaning: Geometry type code 1 (core type)
      - value: LINESTRING
        meaning: Geometry type code 2 (core type)
      - value: POLYGON
        meaning: Geometry type code 3 (core type)
      - value: MULTIPOINT
        meaning: Geometry type code 4 (core type)
      - value: MULTILINESTRING
        meaning: Geometry type code 5 (core type)
      - value: MULTIPOLYGON
        meaning: Geometry type code 6 (core type)
      - value: GEOMETRYCOLLECTION
        meaning: Geometry type code 7 (core type)
      - value: CIRCULARSTRING
        meaning: Geometry type code 8 (extension type)
      - value: COMPOUNDCURVE
        meaning: Geometry type code 9 (extension type)
      - value: CURVEPOLYGON
        meaning: Geometry type code 10 (extension type)
      - value: MULTICURVE
        meaning: Geometry type code 11 (extension type)
      - value: MULTISURFACE
        meaning: Geometry type code 12 (extension type)
      - value: CURVE
        meaning: Geometry type code 13 (extension type)
      - value: SURFACE
        meaning: Geometry type code 14 (extension type)
  - name: srs_id
    type: ref
    meaning: "Spatial Reference System ID: gpkg_spatial_ref_sys.srs_id."
    source_ref: gpkg_geometry_columns.srs_id INTEGER -> gpkg_spatial_ref_sys.srs_id
    ref_to: gis.gpkg_spatial_ref_sys
  - name: z
    type: enum
    meaning: Whether z values are prohibited (0), mandatory (1) or optional (2).
    source_ref: gpkg_geometry_columns.z TINYINT
    values:
      - value: "0"
        meaning: Z values prohibited
      - value: "1"
        meaning: Z values mandatory
      - value: "2"
        meaning: Z values optional
  - name: m
    type: enum
    meaning: Whether m values are prohibited (0), mandatory (1) or optional (2).
    source_ref: gpkg_geometry_columns.m TINYINT
    values:
      - value: "0"
        meaning: M values prohibited
      - value: "1"
        meaning: M values mandatory
      - value: "2"
        meaning: M values optional
