meaning: LandXML 1.2 `Personnel`; the XSD gives no description.
fields:
  - name: name
    type: text
    meaning: Personnel name; the XSD gives no description.
    source_ref: XSD Personnel/@name; type xs:string
    nullable: true
  - name: role
    type: text
    meaning: This is a jurisdictionally based list of roles that a surveyor can undertake within a survey for example field hand, authorising surveyor, technician.
    source_ref: XSD Personnel/@role; type surveyorRoleType
    nullable: true
  - name: reg_type
    type: text
    meaning: This is a jurisdictionally based list of classes of registration for a surveyor. This allows validation of the surveyors role in the survey for legal traceablity.
    source_ref: XSD Personnel/@regType; type registrationType
    nullable: true
  - name: reg_number
    type: text
    meaning: Personnel regNumber; the XSD gives no description.
    source_ref: XSD Personnel/@regNumber; type xs:string
    nullable: true
notes: Occurs 0..unbounded in landxml.survey_header.
