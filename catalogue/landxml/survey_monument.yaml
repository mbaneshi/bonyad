code: landxml.survey_monument
name: SurveyMonument
kind: child
parent: landxml.survey
fidelity: proxy
source:
  document: LandXML 1.2 XML Schema (LandXML-1.2.xsd)
  section: element SurveyMonument
  url: http://www.landxml.org/schema/LandXML-1.2/LandXML-1.2.xsd
  version: 1.2 (posted 2008-07-29)
  accessed_on: 2026-10-23
  licence: Not stated in the XSD. LandXML.org Open Software License v1.0 (BSD-style) covers the 1.2 SDK only; see SOURCES.md
meaning: This relates the new monument element to a survey - indicating its purpose in the survey and distrubed / replaced info as well
fields:
  - name: mnt_ref
    type: ref
    meaning: name attribute. Holds the `name` attribute of the referenced element (a name-based reference, resolved when the file is imported).
    source_ref: XSD SurveyMonument/@mntRef; type monumentNameRef
    ref_to: landxml.monument
  - name: purpose
    type: text
    meaning: This is a list of purposes that the monument was used for on this survey. The desired list may be based on local regulations.
    source_ref: XSD SurveyMonument/@purpose; type monumentPurpose
  - name: state
    type: text
    meaning: This is a list of states for a monument each jurisdiction may haqve a list defined by regulation.
    source_ref: XSD SurveyMonument/@state; type monumentState
    nullable: true
  - name: adopted_survey
    type: text
    meaning: SurveyMonument adoptedSurvey; the XSD gives no description.
    source_ref: XSD SurveyMonument/@adoptedSurvey; type xs:string
    nullable: true
  - name: disturbed_monument
    type: text
    meaning: SurveyMonument disturbedMonument; the XSD gives no description.
    source_ref: XSD SurveyMonument/@disturbedMonument; type xs:string
    nullable: true
  - name: disturbed_date
    type: date
    meaning: SurveyMonument disturbedDate; the XSD gives no description.
    source_ref: XSD SurveyMonument/@disturbedDate; type xs:date
    nullable: true
  - name: disturbed_annotation
    type: text
    meaning: SurveyMonument disturbedAnnotation; the XSD gives no description.
    source_ref: XSD SurveyMonument/@disturbedAnnotation; type xs:string
    nullable: true
  - name: replaced_monument
    type: text
    meaning: SurveyMonument replacedMonument; the XSD gives no description.
    source_ref: XSD SurveyMonument/@replacedMonument; type xs:string
    nullable: true
  - name: replaced_date
    type: date
    meaning: SurveyMonument replacedDate; the XSD gives no description.
    source_ref: XSD SurveyMonument/@replacedDate; type xs:date
    nullable: true
  - name: replaced_annotation
    type: text
    meaning: SurveyMonument replacedAnnotation; the XSD gives no description.
    source_ref: XSD SurveyMonument/@replacedAnnotation; type xs:string
    nullable: true
notes: "Occurs at most once (XSD: unbounded choice) in landxml.survey."
