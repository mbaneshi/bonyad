code: landxml.pnt_list2d
name: PntList2D
kind: child
parent: landxml.prof_surf
fidelity: proxy
source:
  document: LandXML 1.2 XML Schema (LandXML-1.2.xsd)
  section: element PntList2D
  url: http://www.landxml.org/schema/LandXML-1.2/LandXML-1.2.xsd
  version: 1.2 (posted 2008-07-29)
  accessed_on: 2026-10-23
  licence: Not stated in the XSD. LandXML.org Open Software License v1.0 (BSD-style) covers the 1.2 SDK only; see SOURCES.md
meaning: A sequential space delimited list of 2D coordinates with a minimum of 2 points (4 values). It is primarily used for ProfileSurf to hold the list of station/elevations and CrossSectSurf for offset/elevation.
fields:
  - name: values
    type: array
    meaning: A sequential space delimited list of 2D coordinates with a minimum of 2 points (4 values). Space-delimited list of doubles; consecutive values are the coordinates of successive points in the order the schema states.
    source_ref: XSD PntList2D (element text); type Point
    of: float
notes: "One row per occurrence of the repeated list element; a row boundary is meaningful (for example a gap in a profile), so occurrences are not concatenated. Occurs 1..unbounded in landxml.prof_surf; 1..unbounded in landxml.cross_sect_surf. Review: Contained by more than one type in the XSD (also landxml.cross_sect_surf); the catalogue allows one parent, so the first is used."
needs_review: true
