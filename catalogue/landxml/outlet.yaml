code: landxml.outlet
name: Outlet
kind: object
base: landxml.point_type3d_req
fidelity: proxy
source:
  document: LandXML 1.2 XML Schema (LandXML-1.2.xsd)
  section: element Outlet
  url: http://www.landxml.org/schema/LandXML-1.2/LandXML-1.2.xsd
  version: 1.2 (posted 2008-07-29)
  accessed_on: 2026-10-23
  licence: Not stated in the XSD. LandXML.org Open Software License v1.0 (BSD-style) covers the 1.2 SDK only; see SOURCES.md
meaning: Identifies a drain point from the watershed with a space delimited "northing easting elevation" value. If it drains to another known watershed, then the name of that watershed is identified by the "refWs" attribute.
fields:
  - name: container
    type: ref
    ref_to: landxml.watershed
    nullable: true
    meaning: The landxml.watershed row that contains this one in the XSD (null for a stand-alone fragment).
    source_ref: "not in the XSD: linkage added because this type is stored as an object (it derives from a base type)"
  - name: ref_ws
    type: ref
    meaning: name attribute. Holds the `name` attribute of the referenced element (a name-based reference, resolved when the file is imported).
    source_ref: XSD Outlet/@refWS; type waterShedNameRef
    nullable: true
    ref_to: landxml.watershed
notes: Occurs 0..unbounded in landxml.watershed. Stored as an object rather than an ordered child because it derives from a base type; the XSD container is the container reference.
