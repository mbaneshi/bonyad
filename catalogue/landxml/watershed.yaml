code: landxml.watershed
name: Watershed
kind: object
fidelity: proxy
source:
  document: LandXML 1.2 XML Schema (LandXML-1.2.xsd)
  section: element Watershed
  url: http://www.landxml.org/schema/LandXML-1.2/LandXML-1.2.xsd
  version: 1.2 (posted 2008-07-29)
  accessed_on: 2026-10-23
  licence: Not stated in the XSD. LandXML.org Open Software License v1.0 (BSD-style) covers the 1.2 SDK only; see SOURCES.md
meaning: The watershed region contains a 2D north/east or 3D north/east/elev list of points that define the boundary. A watershed is identified by the "name" attribute.
fields:
  - name: container
    type: ref
    ref_to: landxml.surface
    nullable: true
    meaning: The landxml.surface row that contains this one in the XSD (null for a stand-alone fragment).
    source_ref: "not in the XSD: linkage added because this type is stored as an object (it contains other types)"
  - name: name
    type: text
    meaning: Watershed name; the XSD gives no description.
    source_ref: XSD Watershed/@name; type xs:string
  - name: area
    type: float
    meaning: Watershed area; the XSD gives no description.
    source_ref: XSD Watershed/@area; type xs:double
    nullable: true
  - name: desc
    type: text
    meaning: Watershed desc; the XSD gives no description.
    source_ref: XSD Watershed/@desc; type xs:string
    nullable: true
  - name: pnt_list2d
    type: array
    meaning: A sequential space delimited list of 2D coordinates with a minimum of 2 points (4 values). Space-delimited list of doubles; consecutive values are the coordinates of successive points in the order the schema states.
    source_ref: XSD PntList2D (element); type Point
    nullable: true
    of: float
  - name: pnt_list3d
    type: array
    meaning: A sequential space delimited list of 3D coordinates with a minimum of 2 points (6 values). Space-delimited list of doubles; consecutive values are the coordinates of successive points in the order the schema states.
    source_ref: XSD PntList3D (element); type Point
    nullable: true
    of: float
notes: Occurs 1..unbounded via Watersheds in landxml.surface. Stored as an object rather than an ordered child because it contains other types; the XSD container is the container reference.
