code: landxml.administrative_area
name: AdministrativeArea
kind: child
parent: landxml.location_address
fidelity: proxy
source:
  document: LandXML 1.2 XML Schema (LandXML-1.2.xsd)
  section: element AdministrativeArea
  url: http://www.landxml.org/schema/LandXML-1.2/LandXML-1.2.xsd
  version: 1.2 (posted 2008-07-29)
  accessed_on: 2026-10-23
  licence: Not stated in the XSD. LandXML.org Open Software License v1.0 (BSD-style) covers the 1.2 SDK only; see SOURCES.md
meaning: This element stores the administrative boundaries for a survey
fields:
  - name: admin_area_type
    type: text
    meaning: This is a jurdictionally specific list of types and may include parish, town, local government, locality etc.
    source_ref: XSD AdministrativeArea/@adminAreaType; type adminAreaTypeType
  - name: admin_area_name
    type: text
    meaning: AdministrativeArea adminAreaName; the XSD gives no description.
    source_ref: XSD AdministrativeArea/@adminAreaName; type xs:string
    nullable: true
  - name: admin_area_code
    type: text
    meaning: AdministrativeArea adminAreaCode; the XSD gives no description.
    source_ref: XSD AdministrativeArea/@adminAreaCode; type xs:string
    nullable: true
  - name: pcl_ref
    type: array
    meaning: name attributes. Space-delimited list of element names (name-based references).
    source_ref: XSD AdministrativeArea/@pclRef; type parcelNameRefs
    nullable: true
    of: text
notes: "Occurs 0..unbounded in landxml.location_address; 0..unbounded in landxml.survey_header. Review: Contained by more than one type in the XSD (also landxml.survey_header); the catalogue allows one parent, so the first is used."
needs_review: true
