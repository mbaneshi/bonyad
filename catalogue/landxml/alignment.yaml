    nullable: true
    meaning: The landxml.alignments row that contains this one in the XSD (null for a stand-alone fragment).
    source_ref: "not in the XSD: linkage added because this type is stored as an object (it contains other types)"
  - name: name
    type: text
    meaning: Alignment name; the XSD gives no description.
    source_ref: XSD Alignment/@name; type xs:string
  - name: length
    type: float
    meaning: Alignment length; the XSD gives no description.
    source_ref: XSD Alignment/@length; type xs:double
