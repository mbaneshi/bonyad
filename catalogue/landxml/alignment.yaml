      - value: existing
        meaning: Enumeration literal "existing"; the XSD gives no description.
      - value: proposed
        meaning: Enumeration literal "proposed"; the XSD gives no description.
  - name: start
    type: point3
    nullable: true
    meaning: Represents a 2D or 3D Starting or beginning Point. Coordinate text "northing easting [elevation]" stored with x = easting, y = northing, z = elevation (null when absent or when only start_pnt_ref is given).
    source_ref: Alignment/Start text content (Point3dOpt)
  - name: start_name
    type: text
    meaning: Start name; the XSD gives no description.
    source_ref: XSD Start/@name; type xs:string
