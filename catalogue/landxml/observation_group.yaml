    type: ref
    ref_to: landxml.instrument_setup
    nullable: true
    meaning: The landxml.instrument_setup row that contains this one in the XSD (null for a stand-alone fragment).
    source_ref: "not in the XSD: linkage added because this type is stored as an object (it contains other types)"
  - name: id
    type: text
    meaning: ObservationGroup id; the XSD gives no description.
    source_ref: XSD ObservationGroup/@id; type xs:ID
  - name: purpose
    type: enum
    meaning: Used by many of the Survey elements.
    source_ref: XSD ObservationGroup/@purpose; type purposeType
    nullable: true
    values:
      - value: normal
        meaning: Enumeration literal "normal"; the XSD gives no description.
      - value: check
        meaning: Enumeration literal "check"; the XSD gives no description.
      - value: backsight
        meaning: Enumeration literal "backsight"; the XSD gives no description.
      - value: foresight
        meaning: Enumeration literal "foresight"; the XSD gives no description.
      - value: traverse
        meaning: Enumeration literal "traverse"; the XSD gives no description.
      - value: sideshot
        meaning: Enumeration literal "sideshot"; the XSD gives no description.
      - value: resection
        meaning: Enumeration literal "resection"; the XSD gives no description.
      - value: levelLoop
        meaning: Enumeration literal "levelLoop"; the XSD gives no description.
      - value: digitalLevel
        meaning: Enumeration literal "digitalLevel"; the XSD gives no description.
      - value: remoteElevation
        meaning: Enumeration literal "remoteElevation"; the XSD gives no description.
      - value: recipricalObservation
        meaning: Enumeration literal "recipricalObservation"; the XSD gives no description.
      - value: topo
        meaning: Enumeration literal "topo"; the XSD gives no description.
      - value: cutSheets
        meaning: Enumeration literal "cutSheets"; the XSD gives no description.
      - value: asbuilt
        meaning: Enumeration literal "asbuilt"; the XSD gives no description.
  - name: setup_id
    type: ref
    meaning: "ObservationGroup setupID; the XSD gives no description. xs:IDREF: names the xs:ID `id` of another element in the same file."
    source_ref: XSD ObservationGroup/@setupID; type xs:IDREF
    nullable: true
    ref_to: any
  - name: target_setup_id
    type: ref
    meaning: "ObservationGroup targetSetupID; the XSD gives no description. xs:IDREF: names the xs:ID `id` of another element in the same file."
    source_ref: XSD ObservationGroup/@targetSetupID; type xs:IDREF
    nullable: true
    ref_to: any
  - name: set_id
    type: text
    meaning: ObservationGroup setID; the XSD gives no description.
    source_ref: XSD ObservationGroup/@setID; type xs:anySimpleType
    nullable: true
  - name: coord_geom_refs
    type: array
    meaning: name attributes. Space-delimited list of element names (name-based references).
    source_ref: XSD ObservationGroup/@coordGeomRefs; type coordGeomNameRefs
    nullable: true
    of: text
  - name: align_ref
    type: ref
    meaning: name attribute. Holds the `name` attribute of the referenced element (a name-based reference, resolved when the file is imported).
    source_ref: XSD ObservationGroup/@alignRef; type alignmentNameRef
    nullable: true
    ref_to: landxml.alignment
  - name: align_station_name
    type: text
    meaning: ObservationGroup alignStationName; the XSD gives no description.
    source_ref: XSD ObservationGroup/@alignStationName; type xs:string
    nullable: true
  - name: align_offset
    type: length
    meaning: Represents a linear offset distance. When associated with horizontal (planametric) road or coordinate geometry, the offset is a 2D distance measured perpendicular to the road centerline or coordinate geometry used as... In the file's declared linear unit; kept unconverted.
    source_ref: XSD ObservationGroup/@alignOffset; type offsetDistance
    nullable: true
  - name: target_point
    type: point3
    nullable: true
    meaning: Represents a 2D or 3D location for the target. Coordinate text "northing easting [elevation]" stored with x = easting, y = northing, z = elevation (null when absent or when only target_point_pnt_ref is given).
    source_ref: ObservationGroup/TargetPoint text content (Point3dOpt)
  - name: target_point_name
    type: text
    meaning: TargetPoint name; the XSD gives no description.
    source_ref: XSD TargetPoint/@name; type xs:string
    nullable: true
  - name: target_point_desc
    type: text
    meaning: TargetPoint desc; the XSD gives no description.
    source_ref: XSD TargetPoint/@desc; type xs:string
    nullable: true
  - name: target_point_code
    type: text
    meaning: TargetPoint code; the XSD gives no description.
    source_ref: XSD TargetPoint/@code; type xs:string
    nullable: true
  - name: target_point_state
    type: enum
    meaning: TargetPoint state; the XSD gives no description.
    source_ref: XSD TargetPoint/@state; type stateType
    nullable: true
    values:
      - value: abandoned
        meaning: Enumeration literal "abandoned"; the XSD gives no description.
      - value: destroyed
        meaning: Enumeration literal "destroyed"; the XSD gives no description.
      - value: existing
        meaning: Enumeration literal "existing"; the XSD gives no description.
      - value: proposed
        meaning: Enumeration literal "proposed"; the XSD gives no description.
  - name: target_point_pnt_ref
    type: ref
    meaning: A reference name value referring to a PointType derived name attribute. An attribute if this type contains the value of a PointType derived element "name" attribute that exists elsewhere the instance data. Holds the `name` attribute of the referenced element (a name-based reference, resolved when the file is imported).
    source_ref: XSD TargetPoint/@pntRef; type pointNameRef
    nullable: true
    ref_to: landxml.cg_point
  - name: target_point_feature_ref
    type: ref
    meaning: name attribute. Holds the `name` attribute of the referenced element (a name-based reference, resolved when the file is imported).
    source_ref: XSD TargetPoint/@featureRef; type featureNameRef
    nullable: true
    ref_to: landxml.feature
  - name: target_point_point_geometry
    type: enum
    meaning: TargetPoint pointGeometry; the XSD gives no description.
    source_ref: XSD TargetPoint/@pointGeometry; type pointGeometryType
    nullable: true
    values:
      - value: point
        meaning: Enumeration literal "point"; the XSD gives no description.
      - value: curve
        meaning: Enumeration literal "curve"; the XSD gives no description.
  - name: target_point_dtm_attribute
    type: enum
    meaning: TargetPoint DTMAttribute; the XSD gives no description.
    source_ref: XSD TargetPoint/@DTMAttribute; type DTMAttributeType
    nullable: true
    values:
      - value: determinebyfeature
        meaning: Enumeration literal "determinebyfeature"; the XSD gives no description.
      - value: donotinclude
        meaning: Enumeration literal "donotinclude"; the XSD gives no description.
      - value: spot
        meaning: Enumeration literal "spot"; the XSD gives no description.
      - value: spotandbreak
        meaning: Enumeration literal "spotandbreak"; the XSD gives no description.
      - value: void
        meaning: Enumeration literal "void"; the XSD gives no description.
      - value: drapevoid
        meaning: Enumeration literal "drapevoid"; the XSD gives no description.
      - value: breakvoid
        meaning: Enumeration literal "breakvoid"; the XSD gives no description.
      - value: island
        meaning: Enumeration literal "island"; the XSD gives no description.
      - value: boundary
        meaning: Enumeration literal "boundary"; the XSD gives no description.
      - value: contour
        meaning: Enumeration literal "contour"; the XSD gives no description.
      - value: feature
        meaning: Enumeration literal "feature"; the XSD gives no description.
      - value: ground
        meaning: Enumeration literal "ground"; the XSD gives no description.
      - value: xsection
        meaning: Enumeration literal "xsection"; the XSD gives no description.
      - value: user
        meaning: Enumeration literal "user"; the XSD gives no description.
  - name: target_point_time_stamp
    type: timestamp
    meaning: TargetPoint timeStamp; the XSD gives no description.
    source_ref: XSD TargetPoint/@timeStamp; type xs:dateTime
    nullable: true
  - name: target_point_role
    type: enum
    meaning: TargetPoint role; the XSD gives no description.
    source_ref: XSD TargetPoint/@role; type surveyRoleType
    nullable: true
    values:
      - value: measured
        meaning: Enumeration literal "measured"; the XSD gives no description.
      - value: to stake out
        meaning: Enumeration literal "to stake out"; the XSD gives no description.
      - value: staked out
        meaning: Enumeration literal "staked out"; the XSD gives no description.
      - value: calculated
        meaning: Enumeration literal "calculated"; the XSD gives no description.
      - value: assistance point
        meaning: Enumeration literal "assistance point"; the XSD gives no description.
      - value: user entered point
        meaning: Enumeration literal "user entered point"; the XSD gives no description.
      - value: control point
        meaning: Enumeration literal "control point"; the XSD gives no description.
  - name: target_point_determined_time_stamp
    type: timestamp
    meaning: TargetPoint determinedTimeStamp; the XSD gives no description.
    source_ref: XSD TargetPoint/@determinedTimeStamp; type xs:dateTime
    nullable: true
  - name: target_point_ellipsoid_height
    type: length
    meaning: Represents the National Geodedic Survey ellipsiod height expressed in the unit height attribute value. Ellipsoid height in the unit given by Units elevationUnit; kept unconverted.
    source_ref: XSD TargetPoint/@ellipsoidHeight; type ellipsoidHeightType
    nullable: true
  - name: target_point_latitude
    type: angle
    meaning: Latitude/Longitude coordinate angular values expressed in latLongAngularUnit. Latitude (range -90 to +90) positive values for the northern hemispher, negative indicate the southern. Stored in radians. The file value is expressed in Units latLongAngularUnit (default decimal degrees) and is converted at the import boundary.
    source_ref: XSD TargetPoint/@latitude; type latLongAngle
    nullable: true
  - name: target_point_longitude
    type: angle
    meaning: Latitude/Longitude coordinate angular values expressed in latLongAngularUnit. Latitude (range -90 to +90) positive values for the northern hemispher, negative indicate the southern. Stored in radians. The file value is expressed in Units latLongAngularUnit (default decimal degrees) and is converted at the import boundary.
    source_ref: XSD TargetPoint/@longitude; type latLongAngle
    nullable: true
  - name: target_point_zone
    type: text
    meaning: TargetPoint zone; the XSD gives no description.
    source_ref: XSD TargetPoint/@zone; type xs:string
    nullable: true
