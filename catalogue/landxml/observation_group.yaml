    nullable: true
    of: text
notes: "Occurs 0..unbounded in landxml.instrument_setup; 1..unbounded in landxml.survey. Review: Contained by more than one type in the XSD (also landxml.survey); the catalogue allows one parent, so the first is used. Stored as an object rather than an ordered child because it contains other types; the XSD container is the container reference."
