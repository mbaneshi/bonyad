code: landxml.coordinate_system
name: CoordinateSystem
kind: child
parent: landxml.landxml
fidelity: proxy
source:
  document: LandXML 1.2 XML Schema (LandXML-1.2.xsd)
  section: element CoordinateSystem
  url: http://www.landxml.org/schema/LandXML-1.2/LandXML-1.2.xsd
