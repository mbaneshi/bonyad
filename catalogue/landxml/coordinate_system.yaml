notes: "Occurs at most once (XSD: unbounded choice) in landxml.landxml; at most once (XSD: unbounded choice) in landxml.survey_header. The XSD allows foreign-namespace content here (xs:any/xs:anyAttribute); not modelled. Review: Contained by more than one type in the XSD (also landxml.survey_header); the catalogue allows one parent, so the first is used."
