    meaning: Represents a 2D or 3D Starting or beginning Point. Coordinate text "northing easting [elevation]" stored with x = easting, y = northing, z = elevation (null when absent or when only start_pnt_ref is given).
    source_ref: CoordinateSystem/Start text content (Point3dOpt)
