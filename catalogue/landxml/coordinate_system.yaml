meaning: 'Simplified coordinate systems definitions to reuse work done by EPSG (European Petroleum Survey Group) EPSG Code: EPSG has reserved the integer range 0 to 32767 for use as codes for coordinate systems. Example: Represents Australian Map Grid Zone 52 name="AGD66 - AMG Zone 52" , epsgCode="20252" Example: Represents Colorado CS27 South Zone name="NAD27-Colorado South" , epsgCode="26755"'
