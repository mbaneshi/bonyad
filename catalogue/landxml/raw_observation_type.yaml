    type: angle
    meaning: Represents zenith angles with the 0 origin as straight up and measured in a clockwise direction in the specified Angular units. Stored in radians. The file value is expressed in the Units angular unit and is converted at the import boundary. The XSD defines it with 0 = straight up, measured clockwise.
