  - name: horiz_angle
    type: angle
    meaning: Represents a normalized angular value in the specified Angular units. Assume 0 degrees = east. Stored in radians. The file value is expressed in Units angularUnit (default radians) and is converted at the import boundary. The XSD defines it as measured counter-clockwise from east (0 = east).
    source_ref: XSD RawObservationType/@horizAngle; type angle
    nullable: true
