  - name: location
    type: text
    meaning: DocFileRef location; the XSD gives no description.
    source_ref: XSD DocFileRef/@location; type xs:anyURI
  - name: file_type
    type: text
    meaning: DocFileRef fileType; the XSD gives no description.
    source_ref: XSD DocFileRef/@fileType; type xs:string
