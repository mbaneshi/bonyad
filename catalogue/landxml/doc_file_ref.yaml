  - name: file_format
    type: text
    meaning: DocFileRef fileFormat; the XSD gives no description.
    source_ref: XSD DocFileRef/@fileFormat; type xs:string
    nullable: true
notes: "Occurs 0..unbounded in landxml.feature_dictionary; 0..unbounded in landxml.feature. Review: Contained by more than one type in the XSD (also landxml.feature); the catalogue allows one parent, so the first is used."
