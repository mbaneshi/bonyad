code: landxml.struct
name: Struct
kind: object
fidelity: proxy
source:
  document: LandXML 1.2 XML Schema (LandXML-1.2.xsd)
  section: element Struct
  url: http://www.landxml.org/schema/LandXML-1.2/LandXML-1.2.xsd
  version: 1.2 (posted 2008-07-29)
  accessed_on: 2026-10-23
  licence: Not stated in the XSD. LandXML.org Open Software License v1.0 (BSD-style) covers the 1.2 SDK only; see SOURCES.md
meaning: 'Each Struct within a Structs collection element must have a unique "name" attribute. The structure type is determined by the existance of one of the following elements: CircStruct or RectStruct.'
fields:
  - name: container
    type: ref
    ref_to: landxml.pipe_network
    nullable: true
    meaning: The landxml.pipe_network row that contains this one in the XSD (null for a stand-alone fragment).
    source_ref: "not in the XSD: linkage added because this type is stored as an object (it contains other types)"
  - name: name
    type: text
    meaning: Struct name; the XSD gives no description.
    source_ref: XSD Struct/@name; type xs:string
  - name: desc
    type: text
    meaning: Struct desc; the XSD gives no description.
    source_ref: XSD Struct/@desc; type xs:string
    nullable: true
  - name: elev_rim
    type: float
    meaning: Struct elevRim; the XSD gives no description.
    source_ref: XSD Struct/@elevRim; type xs:double
    nullable: true
  - name: elev_sump
    type: float
    meaning: Struct elevSump; the XSD gives no description.
    source_ref: XSD Struct/@elevSump; type xs:double
    nullable: true
  - name: o_id
    type: text
    meaning: Struct oID; the XSD gives no description.
    source_ref: XSD Struct/@oID; type xs:string
    nullable: true
  - name: state
    type: enum
    meaning: Struct state; the XSD gives no description.
    source_ref: XSD Struct/@state; type stateType
    nullable: true
    values:
      - value: abandoned
        meaning: Enumeration literal "abandoned"; the XSD gives no description.
      - value: destroyed
        meaning: Enumeration literal "destroyed"; the XSD gives no description.
      - value: existing
        meaning: Enumeration literal "existing"; the XSD gives no description.
      - value: proposed
        meaning: Enumeration literal "proposed"; the XSD gives no description.
  - name: center
    type: point3
    nullable: true
    meaning: Represents a 2D or 3D Center Point. Coordinate text "northing easting [elevation]" stored with x = easting, y = northing, z = elevation (null when absent or when only center_pnt_ref is given).
    source_ref: Struct/Center text content (Point3dOpt)
  - name: center_name
    type: text
    meaning: Center name; the XSD gives no description.
    source_ref: XSD Center/@name; type xs:string
    nullable: true
  - name: center_desc
    type: text
    meaning: Center desc; the XSD gives no description.
    source_ref: XSD Center/@desc; type xs:string
    nullable: true
  - name: center_code
    type: text
    meaning: Center code; the XSD gives no description.
    source_ref: XSD Center/@code; type xs:string
    nullable: true
  - name: center_state
    type: enum
    meaning: Center state; the XSD gives no description.
    source_ref: XSD Center/@state; type stateType
    nullable: true
    values:
      - value: abandoned
        meaning: Enumeration literal "abandoned"; the XSD gives no description.
      - value: destroyed
        meaning: Enumeration literal "destroyed"; the XSD gives no description.
      - value: existing
        meaning: Enumeration literal "existing"; the XSD gives no description.
      - value: proposed
        meaning: Enumeration literal "proposed"; the XSD gives no description.
  - name: center_pnt_ref
    type: ref
    meaning: A reference name value referring to a PointType derived name attribute. An attribute if this type contains the value of a PointType derived element "name" attribute that exists elsewhere the instance data. Holds the `name` attribute of the referenced element (a name-based reference, resolved when the file is imported).
    source_ref: XSD Center/@pntRef; type pointNameRef
    nullable: true
    ref_to: landxml.cg_point
  - name: center_feature_ref
    type: ref
    meaning: name attribute. Holds the `name` attribute of the referenced element (a name-based reference, resolved when the file is imported).
    source_ref: XSD Center/@featureRef; type featureNameRef
    nullable: true
    ref_to: landxml.feature
  - name: center_point_geometry
    type: enum
    meaning: Center pointGeometry; the XSD gives no description.
    source_ref: XSD Center/@pointGeometry; type pointGeometryType
    nullable: true
    values:
      - value: point
        meaning: Enumeration literal "point"; the XSD gives no description.
      - value: curve
        meaning: Enumeration literal "curve"; the XSD gives no description.
  - name: center_dtm_attribute
    type: enum
    meaning: Center DTMAttribute; the XSD gives no description.
    source_ref: XSD Center/@DTMAttribute; type DTMAttributeType
    nullable: true
    values:
      - value: determinebyfeature
        meaning: Enumeration literal "determinebyfeature"; the XSD gives no description.
      - value: donotinclude
        meaning: Enumeration literal "donotinclude"; the XSD gives no description.
      - value: spot
        meaning: Enumeration literal "spot"; the XSD gives no description.
      - value: spotandbreak
        meaning: Enumeration literal "spotandbreak"; the XSD gives no description.
      - value: void
        meaning: Enumeration literal "void"; the XSD gives no description.
      - value: drapevoid
        meaning: Enumeration literal "drapevoid"; the XSD gives no description.
      - value: breakvoid
        meaning: Enumeration literal "breakvoid"; the XSD gives no description.
      - value: island
        meaning: Enumeration literal "island"; the XSD gives no description.
      - value: boundary
        meaning: Enumeration literal "boundary"; the XSD gives no description.
      - value: contour
        meaning: Enumeration literal "contour"; the XSD gives no description.
      - value: feature
        meaning: Enumeration literal "feature"; the XSD gives no description.
      - value: ground
        meaning: Enumeration literal "ground"; the XSD gives no description.
      - value: xsection
        meaning: Enumeration literal "xsection"; the XSD gives no description.
      - value: user
        meaning: Enumeration literal "user"; the XSD gives no description.
  - name: center_time_stamp
    type: timestamp
    meaning: Center timeStamp; the XSD gives no description.
    source_ref: XSD Center/@timeStamp; type xs:dateTime
    nullable: true
  - name: center_role
    type: enum
    meaning: Center role; the XSD gives no description.
    source_ref: XSD Center/@role; type surveyRoleType
    nullable: true
    values:
      - value: measured
        meaning: Enumeration literal "measured"; the XSD gives no description.
      - value: to stake out
        meaning: Enumeration literal "to stake out"; the XSD gives no description.
      - value: staked out
        meaning: Enumeration literal "staked out"; the XSD gives no description.
      - value: calculated
        meaning: Enumeration literal "calculated"; the XSD gives no description.
      - value: assistance point
        meaning: Enumeration literal "assistance point"; the XSD gives no description.
      - value: user entered point
        meaning: Enumeration literal "user entered point"; the XSD gives no description.
      - value: control point
        meaning: Enumeration literal "control point"; the XSD gives no description.
  - name: center_determined_time_stamp
    type: timestamp
    meaning: Center determinedTimeStamp; the XSD gives no description.
    source_ref: XSD Center/@determinedTimeStamp; type xs:dateTime
    nullable: true
  - name: center_ellipsoid_height
    type: length
    meaning: Represents the National Geodedic Survey ellipsiod height expressed in the unit height attribute value. Ellipsoid height in the unit given by Units elevationUnit; kept unconverted.
    source_ref: XSD Center/@ellipsoidHeight; type ellipsoidHeightType
    nullable: true
  - name: center_latitude
    type: angle
    meaning: Latitude/Longitude coordinate angular values expressed in latLongAngularUnit. Latitude (range -90 to +90) positive values for the northern hemispher, negative indicate the southern. Stored in radians. The file value is expressed in Units latLongAngularUnit (default decimal degrees) and is converted at the import boundary.
    source_ref: XSD Center/@latitude; type latLongAngle
    nullable: true
  - name: center_longitude
    type: angle
    meaning: Latitude/Longitude coordinate angular values expressed in latLongAngularUnit. Latitude (range -90 to +90) positive values for the northern hemispher, negative indicate the southern. Stored in radians. The file value is expressed in Units latLongAngularUnit (default decimal degrees) and is converted at the import boundary.
    source_ref: XSD Center/@longitude; type latLongAngle
    nullable: true
  - name: center_zone
    type: text
    meaning: Center zone; the XSD gives no description.
    source_ref: XSD Center/@zone; type xs:string
    nullable: true
  - name: center_northing_std_error
    type: float
    meaning: Center northingStdError; the XSD gives no description.
    source_ref: XSD Center/@northingStdError; type xs:double
    nullable: true
  - name: center_easting_std_error
    type: float
    meaning: Center eastingStdError; the XSD gives no description.
    source_ref: XSD Center/@eastingStdError; type xs:double
    nullable: true
  - name: center_elevation_std_error
    type: float
    meaning: Center elevationStdError; the XSD gives no description.
    source_ref: XSD Center/@elevationStdError; type xs:double
    nullable: true
  - name: inlet_struct
    type: bool
    default: false
    meaning: True when the empty InletStruct element is present; the element carries no data, only its presence. Empty element InletStruct
    source_ref: XSD Struct/InletStruct (empty element)
  - name: outlet_struct
    type: bool
    default: false
    meaning: True when the empty OutletStruct element is present; the element carries no data, only its presence. Empty element OutletStruct
    source_ref: XSD Struct/OutletStruct (empty element)
  - name: connection
    type: bool
    default: false
    meaning: True when the empty Connection element is present; the element carries no data, only its presence. Empty element Connection
    source_ref: XSD Struct/Connection (empty element)
notes: Occurs 2..unbounded via Structs in landxml.pipe_network. Stored as an object rather than an ordered child because it contains other types; the XSD container is the container reference.
