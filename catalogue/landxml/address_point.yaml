code: landxml.address_point
name: AddressPoint
kind: object
base: landxml.point_type
fidelity: proxy
source:
  document: LandXML 1.2 XML Schema (LandXML-1.2.xsd)
  section: element AddressPoint
  url: http://www.landxml.org/schema/LandXML-1.2/LandXML-1.2.xsd
  version: 1.2 (posted 2008-07-29)
  accessed_on: 2026-10-23
  licence: Not stated in the XSD. LandXML.org Open Software License v1.0 (BSD-style) covers the 1.2 SDK only; see SOURCES.md
meaning: Represents a 2D or 3D Address Point. The Address Point is the geocoded point with which to reference an address
fields:
  - name: container
    type: ref
    ref_to: landxml.location_address
    nullable: true
    meaning: The landxml.location_address row that contains this one in the XSD (null for a stand-alone fragment).
    source_ref: "not in the XSD: linkage added because this type is stored as an object (it derives from a base type)"
  - name: address_point_type
    type: text
    meaning: This is a string to define the type of Geocode that the address point is for examplecentroid of parcel, Access Point etc. This will be a jurisdictionally based list.
    source_ref: XSD AddressPoint/@addressPointType; type addressPointTypeType
    nullable: true
notes: Occurs 0..unbounded in landxml.location_address. Stored as an object rather than an ordered child because it derives from a base type; the XSD container is the container reference.
