fields:
  - name: sta_start
    type: length
    meaning: Represents the actual measured distance along the geometry in numeric decimal form expressed in linear units. Also known as the internal station value where no station equations are applied. Distance along the geometry in the file's declared linear unit; kept unconverted. Not corrected for station equations.
    source_ref: XSD Classification/@staStart; type station
    nullable: true
  - name: sta_end
    type: length
    meaning: Represents the actual measured distance along the geometry in numeric decimal form expressed in linear units. Also known as the internal station value where no station equations are applied. Distance along the geometry in the file's declared linear unit; kept unconverted. Not corrected for station equations.
    source_ref: XSD Classification/@staEnd; type station
    nullable: true
  - name: functional_class
    type: enum
    meaning: Classification functionalClass; the XSD gives no description.
    source_ref: XSD Classification/@functionalClass; type functionalClassType
    nullable: true
    values:
      - value: arterial
        meaning: Enumeration literal "arterial"; the XSD gives no description.
      - value: "collector "
        meaning: Enumeration literal "collector "; the XSD gives no description.
      - value: local
        meaning: Enumeration literal "local"; the XSD gives no description.
