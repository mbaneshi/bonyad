code: landxml.ret_wall
name: RetWall
kind: object
fidelity: proxy
source:
  document: LandXML 1.2 XML Schema (LandXML-1.2.xsd)
  section: element RetWall
  url: http://www.landxml.org/schema/LandXML-1.2/LandXML-1.2.xsd
  version: 1.2 (posted 2008-07-29)
  accessed_on: 2026-10-23
  licence: Not stated in the XSD. LandXML.org Open Software License v1.0 (BSD-style) covers the 1.2 SDK only; see SOURCES.md
meaning: The retaining wall is defined by a sequential collection of points along the wall. Each point has a location (northing/easting/elevation), height of wall and offset to the wall point.
fields:
  - name: container
    type: ref
    ref_to: landxml.surface
    nullable: true
    meaning: The landxml.surface row that contains this one in the XSD (null for a stand-alone fragment).
    source_ref: "not in the XSD: linkage added because this type is stored as an object (it contains other types)"
  - name: desc
    type: text
    meaning: RetWall desc; the XSD gives no description.
    source_ref: XSD RetWall/@desc; type xs:string
    nullable: true
  - name: name
    type: text
    meaning: RetWall name; the XSD gives no description.
    source_ref: XSD RetWall/@name; type xs:string
    nullable: true
  - name: state
    type: enum
    meaning: RetWall state; the XSD gives no description.
    source_ref: XSD RetWall/@state; type stateType
    nullable: true
    values:
      - value: abandoned
        meaning: Enumeration literal "abandoned"; the XSD gives no description.
      - value: destroyed
        meaning: Enumeration literal "destroyed"; the XSD gives no description.
      - value: existing
        meaning: Enumeration literal "existing"; the XSD gives no description.
      - value: proposed
        meaning: Enumeration literal "proposed"; the XSD gives no description.
notes: Occurs 0..unbounded via SourceData/Breaklines in landxml.surface. Stored as an object rather than an ordered child because it contains other types; the XSD container is the container reference.
