fields:
  - name: station
    type: length
    meaning: Represents the actual measured distance along the geometry in numeric decimal form expressed in linear units. Also known as the internal station value where no station equations are applied. Distance along the geometry in the file's declared linear unit; kept unconverted. Not corrected for station equations.
    source_ref: XSD Volume/@station; type station
    nullable: true
  - name: leg_number
    type: int
    meaning: Volume legNumber; the XSD gives no description.
    source_ref: XSD Volume/@legNumber; type xs:int
    nullable: true
  - name: turn_percent
    type: float
    meaning: Volume turnPercent; the XSD gives no description.
    source_ref: XSD Volume/@turnPercent; type xs:double
    nullable: true
  - name: percent_trucks
    type: float
    meaning: Volume percentTrucks; the XSD gives no description.
    source_ref: XSD Volume/@percentTrucks; type xs:double
    nullable: true
notes: Occurs 0..unbounded in landxml.intersection.
