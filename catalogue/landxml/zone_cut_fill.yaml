fields:
  - name: sta_start
    type: length
    meaning: Represents the actual measured distance along the geometry in numeric decimal form expressed in linear units. Also known as the internal station value where no station equations are applied. Distance along the geometry in the file's declared linear unit; kept unconverted. Not corrected for station equations.
    source_ref: XSD ZoneCutFill/@staStart; type station
  - name: sta_end
    type: length
    meaning: Represents the actual measured distance along the geometry in numeric decimal form expressed in linear units. Also known as the internal station value where no station equations are applied. Distance along the geometry in the file's declared linear unit; kept unconverted. Not corrected for station equations.
    source_ref: XSD ZoneCutFill/@staEnd; type station
  - name: cut_slope
    type: float
    meaning: This item is the cross slope, the slope of the traveled way as measure perpendicular to the horizontal alignment, negative when the shoulder has a lower elevation than the centerline. The unit of measure for this item...
    source_ref: XSD ZoneCutFill/@cutSlope; type crossSlope
    nullable: true
    unit: percent
  - name: fill_slope
    type: float
    meaning: This item is the cross slope, the slope of the traveled way as measure perpendicular to the horizontal alignment, negative when the shoulder has a lower elevation than the centerline. The unit of measure for this item...
    source_ref: XSD ZoneCutFill/@fillSlope; type crossSlope
    nullable: true
    unit: percent
notes: Occurs 0..unbounded in landxml.zone.
