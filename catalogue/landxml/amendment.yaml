code: landxml.amendment
name: Amendment
kind: object
fidelity: proxy
source:
  document: LandXML 1.2 XML Schema (LandXML-1.2.xsd)
  section: element Amendment
  url: http://www.landxml.org/schema/LandXML-1.2/LandXML-1.2.xsd
  version: 1.2 (posted 2008-07-29)
  accessed_on: 2026-10-23
  licence: Not stated in the XSD. LandXML.org Open Software License v1.0 (BSD-style) covers the 1.2 SDK only; see SOURCES.md
meaning: Records the dealing information to allow audit trail between the survey document and the titling system
fields:
  - name: container
    type: ref
    ref_to: landxml.landxml
    nullable: true
    meaning: The landxml.landxml row that contains this one in the XSD (null for a stand-alone fragment).
    source_ref: "not in the XSD: linkage added because this type is stored as an object (it contains other types)"
  - name: dealing_number
    type: text
    meaning: Amendment dealingNumber; the XSD gives no description.
    source_ref: XSD Amendment/@dealingNumber; type xs:string
    nullable: true
  - name: amendment_date
    type: date
    meaning: Amendment amendmentDate; the XSD gives no description.
    source_ref: XSD Amendment/@amendmentDate; type xs:date
    nullable: true
  - name: comments
    type: text
    meaning: Amendment comments; the XSD gives no description.
    source_ref: XSD Amendment/@comments; type xs:string
    nullable: true
notes: Occurs 0..unbounded in landxml.landxml. Stored as an object rather than an ordered child because it contains other types; the XSD container is the container reference.
