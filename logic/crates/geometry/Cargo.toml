[package]
name = "bonyad-geometry"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Concrete 2D geometry types, validation errors and calculations. Pure: no I/O."

[lints]
workspace = true

# Pure by design: serde only. No async runtime, database or network crates.
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }

[dev-dependencies]
serde_json = "=1.0.154"
