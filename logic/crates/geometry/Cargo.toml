[package]
name = "bonyad-geometry"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Concrete 2D geometry types, validation errors and calculations. Pure: no I/O."

[lints]
workspace = true

# Pure by design: serde only. No async runtime, database or network crates.
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
# Optional: schema derives so the API's shapes are defined once. A derive macro only; no I/O.
utoipa = { version = "=6.0.0", optional = true }

[features]
openapi = ["dep:utoipa"]

[dev-dependencies]
serde_json = "=1.0.154"
