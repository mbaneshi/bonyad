[workspace]
resolver = "3"
members = ["crates/geometry", "crates/persistence", "crates/server", "crates/units", "generated/*"]

[workspace.package]
edition = "2024"
license = "LicenseRef-Undecided"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# One place for every pinned version. Exact pins; Cargo.lock is committed.
[workspace.dependencies]
bonyad-geometry = { path = "crates/geometry" }
bonyad-persistence = { path = "crates/persistence" }
bonyad-units = { path = "crates/units" }
axum = { version = "=0.8.9", features = ["macros"] }
http-body-util = "=0.1.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "uuid", "time", "macros", "migrate"] }
thiserror = "=2.0.21"
time = { version = "=0.3.55", features = ["formatting"] }
tokio = { version = "=1.54.0", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.1", features = ["trace", "request-id", "propagate-header"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
utoipa = { version = "=6.0.0", features = ["uuid"] }
uuid = { version = "=1.28.0", features = ["v7", "serde"] }
