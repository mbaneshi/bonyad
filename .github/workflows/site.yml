name: site

# The project site publishes from `dev`, independently of application releases
# (`scripts/promote` / version tags). Pull requests only build, as a check.
on:
  pull_request:
    branches: [dev]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'CONTRIBUTING.md'
      - '.github/workflows/site.yml'
  push:
    branches: [dev]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'CONTRIBUTING.md'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/configure-pages@v6.0.0
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
